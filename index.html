 حرف"],"a":3,"f":"«هو» ضمير وهو يعد من الأسماء، و«كتب» فعل ماضٍ، و«عن» حرف جر، فالترتيب اسم ثم فعل ثم حرف."},{"s":"أسئلة المعيار الرابع","n":31,"q":"فرح المعلم (أحمد) بقدوم العام الدراسي ......... وسأل الطلاب عن أماكن ذهابهم في الإجازة ......... : علامة الترقيم المناسبة:","o":["فاصلة - استفهام","فاصلة منقوطة - استفهام","فاصلة - تعجب","فاصلة - نقطة"],"a":3,"f":"الفاصلة بعد الجملة الأولى للربط بين الجملتين، وتأتي النقطة في نهاية الجملة الخبرية الثانية، فالسؤال هنا غير مباشر ولا يحتاج علامة استفهام."},{"s":"أسئلة المعيار الرابع","n":32,"q":"أي الأمثال العربية التالية يعبر عن الضعيف إذا قوي والذليل إذا عز؟","o":["ما هكذا تؤكل الكتف","إن البغاث بأرضنا يستنسر","خلا لك الجو فبيضي واصفري","بلغ السيل الزبى"],"a":1,"f":"مثل «إن البغاث بأرضنا يستنسر» يُضرب للضعيف إذا قوي والذليل إذا عز، فالبغاث طائر ضعيف يصبح كالنسر."},{"s":"أسئلة المعيار الرابع","n":33,"q":"النهار في الصيف طويل، الجو جميل في الشتاء (في العبارة السابقة على الترتيب):","o":["رأي - حقيقة","حقيقة - رأي","رأي - رأي","حقيقة - حقيقة"],"a":1,"f":"طول النهار في الصيف أمر ثابت يمكن إثباته (حقيقة)، أما جمال الجو فمتعلق بذوق كل شخص (رأي)."},{"s":"أسئلة المعيار الرابع","n":34,"q":"وثيقة رسمية تكتب فيها التوصيات:","o":["التقرير","المحضر","الرسالة الإدارية","التلخيص"],"a":0,"f":"التقرير وثيقة رسمية تعرض الوقائع والنتائج ثم تُختم بالتوصيات."},{"s":"أسئلة المعيار الرابع","n":35,"q":"بلغ عدد الطلاب (45) طالباً، أي مما يأتي هو الكتابة العربية الصحيحة للرقم السابق؟","o":["خمس وأربعون","خمساً وأربعين","خمسة وأربعون","خمسة وأربعين"],"a":3,"f":"العدد (٤٥) هنا مفعول بعد «بلغ» فيُنصب، والمعدود «طالباً» مذكر فيأتي العدد خمسة بالتاء: خمسة وأربعين."},{"s":"أسئلة المعيار الرابع","n":36,"q":"زاد عدد المدارس من ......... مدارس إلى ......... مدرسة:","o":["خمس - اثنا عشر","خمس - اثنتي عشرة","خمسة - اثنا عشر","خمس - اثنتا عشرة"],"a":1,"f":"المعدود مذكر «مدارس» جمعٌ لمفرد مؤنث فيأتي العدد «خمس» بلا تاء، وبعد حرف الجر «إلى» يُجرّ العدد: اثنتي عشرة مدرسة."},{"s":"أسئلة المعيار الرابع","n":37,"q":"طلب المعلم من الطالب ......... وانتظر ......... :","o":["إجابة - استجابته","اجابة - إستجابته","إجابة - إستجابته","اجابة - استجابته"],"a":0,"f":"«إجابة» و«استجابة» مصدران؛ الأول همزته قطع (إفعال)، والثاني همزته وصل (استفعال)، فتكتب «استجابته» بلا همزة قطع."},{"s":"أسئلة المعيار الرابع","n":38,"q":"يؤدي الطلاب - وفقهم الله - ......... اختبارات الفصل الدراسي الأول:","o":["( - )","( . )","\" \"","( ، - : )"],"a":0,"f":"الجملة الاعتراضية (وفقهم الله) تُوضع بين شرطتين أو قوسين، ولذلك اختير الخيار الذي يشمل الشرطتين."},{"s":"أسئلة المعيار الرابع","n":39,"q":"نعم ......... أنا فعلت ذلك (علامة الترقيم المناسبة هي):","o":["فاصلة","فاصلة منقوطة","نقطة","شرطة"],"a":0,"f":"بعد حرف الجواب «نعم» تُوضع فاصلة لفصله عن الجملة التي بعده."},{"s":"أسئلة المعيار الرابع","n":40,"q":"عند تنوين كلمة (رجاء) تنوين نصب تكتب:","o":["رجاءا","رجاءً","رجاءن","رجاً"],"a":1,"f":"الاسم المنتهي بهمزة قبلها ألف يُنوَّن بالنصب بفتحتين فوق الهمزة دون ألف: رجاءً."},{"s":"أسئلة المعيار الرابع","n":41,"q":"ما مرادف كلمة (يستوحشون)؟","o":["يحزنون","يثيرون","يخشون","يستأنسون"],"a":2,"f":"الاستيحاش هو الخوف من الوحدة أو الغربة، فمرادف «يستوحشون» هو «يخشون»، وضده يستأنسون."},{"s":"أسئلة المعيار الرابع","n":42,"q":"أي أنواع القراءة التالية يمكن فيها اكتشاف صعوبة النطق؟","o":["المتأنية","السريعة","الجهرية","الصامتة"],"a":2,"f":"القراءة الجهرية تُسمع فيها الكلمات منطوقة، فيتمكن المعلم من اكتشاف عيوب النطق، بخلاف الصامتة."},{"s":"أسئلة المعيار الرابع","n":43,"q":"انبهر الأستاذ من إجابة الطالب فقال ......... ما أروع هذه الإجابة ......... علامتا الترقيم المناسبتان لملء الفراغين على التوالي:","o":[": - !",": -","! - :","؟ - !"],"a":1,"f":"بعد فعل القول «قال» تُوضع نقطتان رأسيتان، وبعد جملة التعجب تُوضع علامة التعجب."},{"s":"أسئلة المعيار الرابع","n":44,"q":"أسلوب يستخدم للإخبار عن قصة خيالية أو واقعية وفقاً لترتيب أحداثها:","o":["التوضيحية","الإقناعية","السردية","الوصفية"],"a":2,"f":"الأسلوب السردي يحكي الأحداث متسلسلة سواء كانت خيالية أو واقعية، بخلاف الوصفي والتوضيحي والإقناعي."},{"s":"أسئلة المعيار الرابع","n":45,"q":"نوع الهمزة في كلمتي (ابن - انتفع):","o":["كلتاهما وصل","كلتاهما قطع","الأولى وصل والثانية قطع","الأولى قطع والثانية وصل"],"a":0,"f":"«ابن» اسم من الأسماء العشرة التي همزتها وصل، و«انتفع» فعل خماسي ماضٍ همزته وصل أيضاً، فكلتاهما وصل."},{"s":"أسئلة المعيار الرابع","n":46,"q":"صفوة الأفكار التي تقدم بالتقرير تكون في:","o":["المقدمة","التحليل","التمهيد","الختام"],"a":3,"f":"الختام هو المكان الذي يُلخص فيه التقرير صفوة الأفكار والنتائج المهمة التي توصل إليها."},{"s":"أسئلة المعيار الرابع","n":47,"q":"طفل ......... عن توافه جيله وأراح من ......... المواجع باله (ما الكلمتان المناسبتان في موضع الفراغات):","o":["تساما - دنيا","تسامى - دنیی","تساما - دنيي","تسامى - دنيا"],"a":3,"f":"«تسامى» فعل ماضٍ خماسي أصله ياء فيُكتب بالألف المقصورة، و«دنيا» اسم مؤنث يُكتب بألف قائمة بعد الياء."},{"s":"أسئلة المعيار الرابع","n":48,"q":"مررت ليلة أمس برجل بائس، فرأيته واضعاً يده على بطنه كأنما يشكو ألماً، فرثيت لحاله وسألته ما باله؟ فشكا إلي الجوع ......... نوع النص:","o":["علمي","أدبي","عملي","وظيفي"],"a":1,"f":"النص أدبي لاحتوائه على مشاعر وعاطفة (رثيت لحاله) وأسلوب قصصي، وليس نصاً علمياً يعرض حقائق."},{"s":"أسئلة المعيار الرابع","n":49,"q":"(الأخلاق مصدرها القلب، ومن القلب مخارج الحياة النفسية كلها)، الضمير في (كلها) في العبارة السابقة يعود على:","o":["الحياة","مخارج","النفسية","الأخلاق"],"a":1,"f":"الضمير في «كلها» يعود إلى أقرب مضاف إليه يصح أن يعود عليه بحسب المفتاح المعتمد، وهو «مخارج» في الخيار المعلَّم."},{"s":"أسئلة المعيار الرابع","n":50,"q":"قال الأحنف بن قيس: ......... لا وفاء لكذوب ولا راحة لحسود ......... ضع علامة الترقيم المناسبة:","o":["!",":","( )","\" \""],"a":3,"f":"كلام الأحنف المنقول بنصه يُوضع بين علامتي تنصيص، فالخيار الصحيح هو علامتا التنصيص."},{"s":"أسئلة المعيار الرابع","n":51,"q":"الخط العربي من أبرز فنوننا الجميلة التي تميزت بها ثقافتنا العربية والإسلامية، وأصبح فناً أصيلاً له قيمته بين الفنون، والخط الجميل يُنبئ عن ذوق صاحبه ويشهد على موهبته. العنوان المناسب لهذا النص:","o":["الفن الأصيل","الفنون الجميلة","أهمية الخط العربي","موهبة الخط العربي"],"a":2,"f":"النص يبين قيمة الخط العربي ومكانته، فأنسب عنوان يشمل الفكرتين هو «أهمية الخط العربي»."},{"s":"أسئلة المعيار الرابع","n":52,"q":"من أنواع الكتابة الفنية:","o":["الخاطرة","التقرير","المحضر","الرسالة الإدارية"],"a":0,"f":"الخاطرة من الكتابة الفنية (الأدبية) لأنها تعبر عن الشعور والتأمل، أما التقرير والمحضر والرسالة الإدارية فكتابة وظيفية."},{"s":"أسئلة المعيار الرابع","n":53,"q":"أي من الجمل التالية يوجد فيها خطأ كتابي:","o":["اعتذر عن تصرفك","زاد الأمر عن حده","معصوم من الخطأ","المبنى قيد الإنشاء"],"a":0,"f":"الخيار المعلَّم يبدو سليماً كتابياً (اعتذر عن تصرفك)، وإن عُدَّت عبارة «زاد عن حده» خطأ شائعاً، ولهذا يحتاج مراجعة."},{"s":"أسئلة المعيار الرابع","n":54,"q":"منذ أن خلق الله الإنسان وفرض عليه أن يأكل خبزه بعرق جبينه، وغرس في فؤاده حب الأمل؛ ليتروح نسيمه ويستهدي بضيائه، ويكون له نعم العزاء في ليالي الخيبة والإخفاق. يعود الضمير في (له) إلى:","o":["الإنسان","الأمل","العزاء","الضياء"],"a":3,"f":"⚠ الضمير في «له» أقرب أن يعود على «الإنسان» الذي يكون الأمل عزاءه، لا على «الضياء»، فالخيار المعلَّم مشكوك فيه."},{"s":"أسئلة المعيار الرابع","n":55,"q":"أي من الجمل الآتية صحيحة لغوياً:","o":["كان النشاطُ رائعٌ","كان النشاطَ رائعاً","كان النشاطُ رائعاً","كان النشاطَ رائعٌ"],"a":1,"f":"⚠ اسم كان يُرفع فتصح «كان النشاطُ رائعاً» (اسم مرفوع وخبر منصوب)، والخيار المعلَّم رفع الاسم خطأً."},{"s":"أسئلة المعيار الرابع","n":56,"q":"الكلمات التالية أسماء ما عدا:","o":["نحن","الذي","هذا","ثم"],"a":2,"f":"⚠ «نحن» ضمير و«الذي» اسم موصول و«هذا» اسم إشارة وكلها أسماء، أما «ثم» فحرف عطف، فالخيار الأصح «ثم»."},{"s":"أسئلة المعيار الرابع","n":57,"q":"الصديق ......... رضي الله عنه ......... أول الخلفاء الراشدين. علامة الترقيم المناسبة:","o":["- -","( )",".","[ ]"],"a":0,"f":"الجملة الاعتراضية (رضي الله عنه) تُوضع بين شرطتين."},{"s":"أسئلة المعيار الرابع","n":58,"q":"املأ الفراغات بعلامات الترقيم المناسبة: إن الحياة عندما تكون عملية يكون الحاضر فيها يخدم المستقبل ......... ولذلك على المرء أن يتطلع فيها إلى الأمام ......... ولا يفكر فيما مضى .........","o":["، / ، /","؛ / ، /","، / ، /","؛ / ، / !"],"a":1,"f":"الفاصلة المنقوطة بعد «المستقبل» لأن ما بعدها نتيجة لما قبلها، والفاصلة بعد «الأمام» للفصل بين الجمل، وتنتهي الجملة بنقطة."},{"s":"أسئلة المعيار الرابع","n":59,"q":"الكلمة الصحيحة إملائياً فيما يلي:","o":["مكافآة","مكافأة","مكافاءة","مكافاة"],"a":1,"f":"«مكافأة» تُكتب بهمزة على الألف لأن الهمزة مفتوحة بعد ألف ساكنة قبلها، فلا تُكرر الألف."},{"s":"أسئلة المعيار الرابع","n":60,"q":"(تسود الصحاري الجافة أجزاء كبيرة من المملكة العربية السعودية، غير أن هذه الصحاري تضم في باطنها كنوزاً من الذهب الأسود والمعادن النفيسة)، علاقة (غير أن) في الجملة السابقة هي علاقة:","o":["تعليل","استثناء","تأكيد","استدراك"],"a":3,"f":"«غير أن» أداة استدراك تأتي لتصحيح توهم نشأ من الكلام السابق (الصحراء الجافة لا تعني الفقر)."},{"s":"أسئلة المعيار الرابع","n":61,"q":"قال تعالى: {إنما المسيح عيسى ابن مريم رسول الله}، أي الخيارات الآتية تمثل ترتيب الأعلام التي تحتها خط بشكل صحيح؟","o":["لقب - اسم - كنية","اسم - لقب - كنية","كنية - اسم - لقب","لقب - اسم - اسم"],"a":0,"f":"«المسيح» لقب، و«عيسى» اسم علم، و«ابن مريم» نسبة تدل على الكنية في تصنيف المفتاح المعتمد."},{"s":"أسئلة المعيار الرابع","n":62,"q":"الجملة التي كتبت فيها الهمزات كتابة صحيحة هي:","o":["هدفك يوصلك لما تريد فأسع وراءه للقيام بالأشياء التي تهمك","لا تكن طاءشاً في اختياراتك، وضع لك أهدافاً ممتلئة في النجاح","أفضل طريقة لإزالة السلبية هو أن تحدد أهدافك وتراقب نتائجها","ركز على أهدافك بعيداً عن ارضاء الناس والاستجابة لرغباتهم"],"a":2,"f":"الجملة الثالثة وحدها خالية من الأخطاء الهمزية، أما بقية الجمل ففيها أخطاء مثل «فأسع» و«طاءشاً» و«ارضاء»."},{"s":"أسئلة المعيار الرابع","n":63,"q":"أي العبارات الآتية صحيحة نحوياً:","o":["هذان لاعبانِ الفريق","هذان لاعبا الفريق","هذان لاعبين الفريق","هذين لاعبا الفريق"],"a":1,"f":"المثنى المرفوع خبر لاسم الإشارة «هذان» يُكتب بالألف، وإذا أُضيف حُذفت نونه: هذان لاعبا الفريق."},{"s":"أسئلة المعيار الخامس","n":1,"q":"يُقصد بالاستبصار في النظرية الجشتالتية:","o":["إدراك الأشياء شبه المغلقة أو شبه الكاملة على أنها وحدة كاملة","التوصل إلى حل المشكلة فجأة بعد فترة من التأمل والانتظار","حدوث التعلم نتيجة تقارب الأشياء بعضها من بعض","حدوث التعلم نتيجة تباعد الأشياء بعضها عن بعض"],"a":1,"f":"الاستبصار في الجشطالت هو فهم عناصر المشكلة وإدراك الحل فجأة بعد تأمل، وليس مجرد الإغلاق أو التقارب."},{"s":"أسئلة المعيار الخامس","n":2,"q":"عندما يبدأ المعلم بسؤال يتطلب معلومات جديدة ولكنها مبنية على ما سبق تعلمه، فهو بذلك يتبع النظرية:","o":["السلوكية","البنائية","الاجتماعية","الإنسانية"],"a":1,"f":"البناء على المعرفة السابقة لتكوين معرفة جديدة هو جوهر النظرية البنائية."},{"s":"أسئلة المعيار الخامس","n":3,"q":"عرض معلم فيلماً يبين تجاذب وتنافر بعض الأجسام تمهيداً لدراسة الشحنات الكهربائية، ما قام به المعلم حسب نظرية التعلم ذي معنى:","o":["تثبيت","تعزيز","كفاية ذاتية","منظم متقدم"],"a":3,"f":"عرض مادة تمهيدية قبل الدرس تربط المعلومات الجديدة بالسابقة هو المنظم المتقدم عند أوزبل."},{"s":"أسئلة المعيار الخامس","n":4,"q":"لإثراء دافعية الطلاب، لجأ المعلم (سالم) لطريقة التعزيز الذاتي. تنتمي هذه الطريقة للنظرية:","o":["الاجتماعية","الإنسانية","السلوكية","المعرفية"],"a":0,"f":"التعزيز الذاتي مفهوم من نظرية التعلم الاجتماعي عند باندورا، حيث يكافئ المتعلم نفسه على إنجازه."},{"s":"أسئلة المعيار الخامس","n":5,"q":"يتأمل الطلاب تفكيرهم ويراقبون إنجازاتهم عند تطبيق المعلم استراتيجية:","o":["ما وراء المعرفة","التفكير العلمي","تدريس الأقران","الخرائط الذهنية"],"a":0,"f":"تأمل الطالب في تفكيره ومراقبة إنجازه هو ما وراء المعرفة (التفكير في التفكير)."},{"s":"أسئلة المعيار الخامس","n":6,"q":"طرح المعلم على طلابه مجموعة من المعلومات، وطلب منهم التفكير فيها قبل التساؤل عن مصداقية المحتوى الذي تطرق إليه وإبداء وجهة نظرهم فيه، يسعى المعلم بذلك إلى تنمية مهارة التفكير:","o":["الإبداعي","ما وراء المعرفة","العلمي","الناقد"],"a":3,"f":"التساؤل عن مصداقية المعلومات وإبداء الرأي فيها هو التفكير الناقد القائم على التقويم والحكم."},{"s":"أسئلة المعيار الخامس","n":7,"q":"مهارة الاستنباط إحدى مهارات التفكير:","o":["العلمي","الإبداعي","الناقد","المعرفي"],"a":2,"f":"الاستنباط من مهارات التفكير الناقد التي تشمل الاستنتاج والاستنباط والتقويم."},{"s":"أسئلة المعيار الخامس","n":8,"q":"أي من المفاهيم الآتية يصف تقبل المعلم الأفكار الجديدة، واحترام قيم التغيير، واحتواء الطالب ليكون له داعماً ومطوراً لا يقف عند الصغائر:","o":["التجديد","المداراة","المرونة","الالتزام"],"a":2,"f":"تقبل الجديد واحتواء الطالب وعدم التوقف عند الصغائر تعبير عن المرونة لدى المعلم."},{"s":"أسئلة المعيار الخامس","n":9,"q":"إذا كنت تخطط لاستثارة التفكير الإبداعي لدى الطلاب، فيجب أن تكلّف الطلاب بأنشطة وتطرح أسئلة تركز على التفكير:","o":["التباعدي","التقاربي","الاستنباطي","الاستقرائي"],"a":0,"f":"التفكير التباعدي يولّد أفكاراً وحلولاً متعددة لمشكلة مفتوحة وهو أساس الإبداع، أما التقاربي فيصل إلى إجابة واحدة صحيحة."},{"s":"أسئلة المعيار الخامس","n":10,"q":"اقتران المثير بتقديم الهدايا لحدوث استجابة مرغوبة، تُطبق على أحد مداخل التعلم وهو المدخل:","o":["الاجتماعي","الإنساني","السلوكي","المعرفي"],"a":2,"f":"ربط المثير بمكافأة لحدوث استجابة مرغوبة هو التعزيز الذي تقوم عليه النظرية السلوكية."},{"s":"أسئلة المعيار الخامس","n":11,"q":"لاحظت معلمة الصف الخامس الابتدائي أن إحدى الطالبات تتحاشى القراءة، وإذا قرأت لا تقرأ بطلاقة وتستخدم أصابعها لتتبع الكلمات، كما تخلط بين الكلمات المتشابهة الحروف، شخصت المعلمة حالة الطالبة بأنها:","o":["بطء تعلم","عوق إدراكي","تأخر دراسي","صعوبات تعلم"],"a":3,"f":"تجنب القراءة وتتبع الكلمات بالأصابع وخلط الحروف المتشابهة من أعراض الدسلكسيا، أي صعوبات التعلم."},{"s":"أسئلة المعيار الخامس","n":12,"q":"التفكير العلمي وفقاً لمراحل بياجيه يحدث في مرحلة:","o":["الحس حركية","ما قبل العمليات","المرحلة المحسوسة","المرحلة المجردة"],"a":3,"f":"التفكير العلمي القائم على الفرضيات والتجريد يظهر عند بياجيه في مرحلة العمليات المجردة (من ١١ سنة فأكثر)."},{"s":"أسئلة المعيار الخامس","n":13,"q":"أي الطرق الآتية لا تعد من صور التعجيل الدراسي للموهوبين:","o":["حذف بعض المواد الدراسية","دراسة المادة في زمن أقل من المعتاد","النقل إلى صفوف أعلى في زمن أقل","قبولهم في سن مبكرة في المرحلة الابتدائية أو الجامعية"],"a":0,"f":"التعجيل يعني اختصار المدة أو الإسراع في الصفوف، أما حذف مواد دراسية فهو حرمان من المحتوى وليس تعجيلاً."},{"s":"أسئلة المعيار الخامس","n":14,"q":"نوع من الاحتياجات الخاصة لا يحتاج المعلم معها - غالباً - إلى تغيير طريقة وأسلوب التدريس:","o":["سمعي","حركي","بصري","صعوبات تعلم"],"a":1,"f":"الإعاقة الحركية لا تؤثر غالباً في الفهم، فلا تتطلب تغيير أسلوب التدريس، بخلاف السمعية والبصرية وصعوبات التعلم."},{"s":"أسئلة المعيار الخامس","n":15,"q":"من سمات مرحلة النمو في المرحلة الابتدائية العليا من 9 إلى 12 سنة:","o":["سرعة معدل النمو الجسمي","اضطرابات الغدد الجنسية","بطء في إمكانات التعلم","سرعة النمو الاجتماعي"],"a":0,"f":"في الطفولة المتأخرة (٩ إلى ١٢) يكون النمو الجسمي سريعاً، أما اضطراب الغدد فيرتبط بالمراهقة."},{"s":"أسئلة المعيار الخامس","n":16,"q":"(عبد الرحمن) معلم يعرف أثر وأهمية المعرفة السابقة على التعلم الحالي للطالب ويستفيد منها لبناء تعلم راسخ، عند انتهاء شرحه لعملية القسمة تبين أن معظم الطلاب غير مستوعبين للشرح. من التفسيرات الممكنة لعدم استيعاب الطلاب الدرس في ضوء النظرية البنائية ما يأتي:","o":["المعلم لم يستخدم أساليب التعلم النشط","الطلاب لم يتقنوا عملية الضرب أو الجمع أو الطرح","كان يوم شرح الحصة يوم الخميس؛ حيث يفكر الطلاب بالإجازة","الطلاب متعبون؛ حيث كانت الحصة السابقة هي حصة تربية بدنية"],"a":1,"f":"تبني البنائية التعلم الجديد على السابق، فعدم إتقان الطلاب مهارات الجمع والطرح والضرب يفسر عدم استيعابهم القسمة."},{"s":"أسئلة المعيار الخامس","n":17,"q":"(فيصل) طالب يعاني من اضطرابات في التفكير الحسابي؛ فهو لا يميز بين الأعداد المتشابهة مثل (62) و (87)، إلى أي من أنواع الذاكرة قصيرة المدى تعزى هذه المشكلة؟","o":["الحركية","النفسية","الحسية","البصرية"],"a":3,"f":"عدم التمييز بين أعداد متشابهة الشكل يعود إلى ضعف الذاكرة البصرية قصيرة المدى."},{"s":"أسئلة المعيار الخامس","n":18,"q":"يتسم الطلاب الموهوبون بأنهم يُفضّلون بناء صداقات مع الطلاب:","o":["الأقل تميزاً","الأكبر سناً","الأقل سناً","المماثلين لهم بالسن"],"a":1,"f":"الموهوبون يميلون إلى مصادقة الأكبر سناً لتقارب مستواهم العقلي مع مستوى الأكبر منهم."},{"s":"أسئلة المعيار الخامس","n":19,"q":"اتفق كل من معلم الرياضيات والموجه الطلابي على نقل طالب متأخر دراسياً إلى جوار طالب متفوق دراسياً ومحبوب لديه، يُعد هذا الأسلوب العلاجي:","o":["تلقيناً","تشكيلاً","قريناً","نمذجة"],"a":3,"f":"اقتراب المتأخر دراسياً من متفوق محبوب ليقتدي به يدخل ضمن النمذجة (التعلم بالملاحظة والقدوة)."},{"s":"أسئلة المعيار الخامس","n":20,"q":"رفع المصاريف ورسوم المدرسة الأهلية للطالب الذي يحصل على تقدير ممتاز. يعتبر هذا الإجراء:","o":["عقاباً إيجابياً","تعزيزاً سلبياً","عقاباً سلبياً","تعزيزاً إيجابياً"],"a":1,"f":"⚠ رفع الرسوم إضافة عبء مالي بعد تقدير ممتاز (يقلل السلوك) فهو أقرب إلى عقاب سلبي، والخيار المعلَّم مشكوك فيه."},{"s":"أسئلة المعيار الخامس","n":21,"q":"لاحظ المعلم (إبراهيم) أن الطالب (مشاري) من الصف الأول الابتدائي يأتي كل فترة وعلى جسمه آثار كدمات، وعند سؤاله يجيب الطالب متردداً: \"وقعت يا أستاذ، وقعت يا أستاذ\". الإجراء المناسب الذي يجب على المعلم إبراهيم القيام به هو:","o":["تجاهل ذلك؛ لأنه حدث خارج الفصل","الاتصال فوراً بوالد الطفل للاستفسار","إبلاغ إدارة المدرسة والموجه الطلابي","التحقيق مع الطالب ليتعرف على سبب ذلك"],"a":2,"f":"آثار الكدمات المتكررة مع الارتباك مؤشر على احتمال إساءة، فيُبلغ المعلم الإدارة والموجه الطلابي ليتخذوا الإجراء النظامي."},{"s":"أسئلة المعيار الخامس","n":22,"q":"(سامي) طالب في الصف الأول الابتدائي؛ أصبح قادراً على إدراك أن العملية (7 - 2 = 5) هي نفسها (5 + 2 = 7)، في أي مرحلة من مراحل النمو عند بياجيه يكون سامي؟","o":["الحركية","العمليات المادية","ما قبل العمليات","العمليات المجردة"],"a":1,"f":"إدراك أن الجمع والطرح عمليتان متعاكستان (قابلية الانعكاس) يظهر في مرحلة العمليات المادية (المحسوسة) من ٧ إلى ١١ سنة."},{"s":"أسئلة المعيار الخامس","n":23,"q":"إذا ابتسم المعلم فور أداء الطالب، فإن هذا التعزيز يعتبر:","o":["أولياً","ثانوياً","معنوياً","مادياً"],"a":2,"f":"الابتسامة تعزيز معنوي (اجتماعي) لأنها لا تشبع حاجة مادية مباشرة، وليست هدية أو طعاماً."},{"s":"أسئلة المعيار الخامس","n":24,"q":"حق الطلاب المعاقين من ذوي الاحتياجات الخاصة أن يعيشوا حياتهم كما يعيشها الآخرون جميعاً إلى أقصى حد ممكن، ولكي ينجح دمج هؤلاء الطلاب ضمن منظومة التعليم العام لابد أن تتوافر مجموعة من العوامل التي تهيئ فرص النجاح وتحقيق النتائج، منها:","o":["تدريب المعلمين على برامج الدمج، وكيفية إعداد الخطط الفردية","دمج هؤلاء الطلاب في الصفوف العادية مهما كانت طبيعة إعاقتهم","دمج هؤلاء الطلاب في الصفوف العادية مهما كانت درجة إعاقتهم","العمل على الدمج التعليمي الجزئي لبعض الفصول الدراسية"],"a":3,"f":"⚠ من عوامل نجاح الدمج تدريب المعلمين على برامج الدمج والخطط الفردية (الخيار الأول)، وهو أدق من الخيار المعلَّم."},{"s":"أسئلة المعيار الخامس","n":25,"q":"مراحل التعلم عند العالم نورمان هي:","o":["الاستقبال - الاحتفاظ - الترميز - الاسترجاع","الاستقبال - الاسترجاع - الترميز - الاحتفاظ","الاستقبال - الاحتفاظ - الاسترجاع - الترميز","الاستقبال - الترميز - الاحتفاظ - الاسترجاع"],"a":3,"f":"مراحل التعلم عند نورمان هي بالترتيب: الاستقبال ثم الترميز ثم الاحتفاظ ثم الاسترجاع."},{"s":"أسئلة المعيار الخامس","n":26,"q":"واحدة مما يأتي ليست من خصائص الطفل النفسية والسلوكية في المرحلة الابتدائية الدنيا (6-9 سنوات):","o":["يغلب عليه حب التملك والأثرة","يرتفع إحساسه بالمسؤولية","يميل إلى تقليد الآخرين","يخاف من السلطة"],"a":2,"f":"⚠ ارتفاع الإحساس بالمسؤولية ليس من سمات الطفل في ٦-٩ سنوات، فهو أقرب إلى المراحل الأعلى، والخيار المعلَّم (تقليد الآخرين) من سماته."},{"s":"أسئلة المعيار الخامس","n":27,"q":"إذا لم يكن هناك فروق فردية بين الطلاب في الذكاء، فإن أكثر عامل من الممكن أن يؤثر في تعلمهم حسب نظرية التعلم ذي المعنى هو:","o":["مدة الانتباه","سهولة المادة","المعرفة السابقة","القدرة على التخزين"],"a":2,"f":"في نظرية التعلم ذي المعنى لأوزبل، أهم عامل في التعلم هو البنية المعرفية السابقة؛ فالمعلومة الجديدة ترتبط بما يعرفه المتعلم أصلاً، فإذا تساوى الذكاء حسمت المعرفة السابقة الفرق."},{"s":"أسئلة المعيار الخامس","n":28,"q":"أثناء ملاحظتك لسلوك زميلك مع طلابه لاحظت أنهم يُقدرونه ويحترمونه ويفضلون حصص مادته على غيرها، وعندما بحثت في أسباب ذلك وجدت أن أحد هذه الأسباب هو أنه يطلق على كل طالب منهم لقباً محبباً لديه. ما الذي يُشْبِعُهُ اللقب المحبب لدى الطالب؟","o":["حاجات الأمن","الحاجات السلوكية","الحاجات الاجتماعية","حاجات تقدير الذات"],"a":3,"f":"اللقب المحبب يمنح الطالب شعوراً بالاحترام والمكانة والاعتبار، وهذا يشبع حاجات تقدير الذات في هرم ماسلو، لا الحاجات الاجتماعية التي تتعلق بالانتماء والصداقة."},{"s":"أسئلة المعيار الخامس","n":29,"q":"قانون الأثر لا يكفي لتثبيت السلوك؛ بل يجب أن يشترك معه قانون:","o":["التعلم الشرطي","التعلم الإجرائي","التكرار","الاقتران"],"a":2,"f":"يرى ثورندايك أن قانون الأثر (الارتباط بنتيجة مرضية) وحده لا يكفي لتثبيت السلوك، بل يلزمه قانون التكرار (التمرين)، فالممارسة المتكررة تقوي الرابطة بين المثير والاستجابة."},{"s":"أسئلة المعيار الخامس","n":30,"q":"في تجارب بافلوف يحدث الانطفاء إذا:","o":["تكرر تقديم المثير الشرطي دون تعزيز","تكرر تقديم المثير الطبيعي عدة مرات","إذا تشابهت المثيرات","إذا اختلفت المثيرات"],"a":0,"f":"الانطفاء في التعلم الشرطي عند بافلوف يحدث حين يتكرر تقديم المثير الشرطي (الجرس) دون اقترانه بالمثير الطبيعي (الطعام)، أي دون تعزيز، فتضعف الاستجابة تدريجياً حتى تختفي."},{"s":"أسئلة المعيار الخامس","n":31,"q":"ركز العالم بياجيه في دراسة النمو على العمليات:","o":["المعرفية","المعرفية - الاجتماعية","المعرفية - الاجتماعية - الانفعالية","المعرفية - الاجتماعية - الانفعالية - اللغوية"],"a":3,"f":"⚠ اهتم بياجيه أساساً بالنمو المعرفي وكيف يبني الطفل معرفته، والخيار «المعرفية» هو الأدق؛ أما الإجابة المعتمدة التي تضم الاجتماعي والانفعالي واللغوي فتوسع غير دقيق في نظريته."},{"s":"أسئلة المعيار الخامس","n":32,"q":"أي فئات الإعاقة التالية يتصف بوجود مزاج عام مكتئب؟","o":["التوحد","متلازمة داون","الإعاقة السمعية المتوسطة","الإعاقة العقلية الشديدة"],"a":0,"f":"التوحد اضطراب نمائي من خصائصه الانسحاب الاجتماعي وصعوبة التعبير الانفعالي، وقد يصاحبه مزاج عام مكتئب، بخلاف الفئات الأخرى المذكورة التي تتصف عادة بمزاج بشوش أو غير مكتئب."},{"s":"أسئلة المعيار الخامس","n":33,"q":"أي المحكات التالية يستخدم لتمييز الطلاب الموهوبين ذوي صعوبات التعلم عن ذوي الإعاقات أو ذوي صعوبات التعلم الأخرى؟","o":["التميز النوعي","الاستبعاد","التفاوت","التباين"],"a":1,"f":"محك الاستبعاد يُستخدم للتمييز؛ فصعوبات التعلم تتحدد باستبعاد الإعاقات الحسية والعقلية والعوامل البيئية والثقافية كأسباب مباشرة، بينما التباين يقيس الفجوة بين التحصيل والقدرة."},{"s":"أسئلة المعيار الخامس","n":34,"q":"ترتيب ظهور مراحل النمو المعرفي وعمليات التمثل عند برونر هي:","o":["الرمزي - التصوري - العملي","التصوري - الرمزي - العملي","العملي - التصوري - الرمزي","العملي - الرمزي - التصوري"],"a":2,"f":"عند برونر تتدرج طرق التمثيل المعرفي: التمثيل العملي (بالفعل والحركة) ثم التصوري (بالصور) ثم الرمزي (باللغة والرموز)، أي من المحسوس إلى المجرد."},{"s":"أسئلة المعيار الخامس","n":35,"q":"المشي عند الأطفال؛ مثال على:","o":["النضج","التعلم","الممارسة","النمذجة"],"a":0,"f":"المشي سلوك ينمو بتأثير النضج البيولوجي، فيظهر في عمر محدد تقريباً عند كل الأطفال بغض النظر عن التدريب، بخلاف التعلم الذي يعتمد على الخبرة والممارسة."},{"s":"أسئلة المعيار الخامس","n":36,"q":"زيادة التمركز حول الذات وفقاً لمراحل بياجيه تكون في:","o":["الحس حركية","ما قبل العمليات","العمليات المادية","العمليات المجردة"],"a":1,"f":"التمركز حول الذات يبلغ ذروته في مرحلة ما قبل العمليات (٢–٧ سنوات) عند بياجيه، إذ يعجز الطفل عن رؤية الموقف من وجهة نظر غيره."},{"s":"أسئلة المعيار الخامس","n":37,"q":"هو إجراء يشتمل على أخذ المعززات الموجودة لدى الطالب نتيجة قيامه بسلوك غير مرغوب:","o":["المحو","تكلفة الاستجابة","الإطفاء","ضبط المثير"],"a":1,"f":"تكلفة الاستجابة إجراء لخفض السلوك غير المرغوب بسحب معزز يملكه الطالب (كنقاط أو امتياز) عند صدور السلوك؛ أما الإطفاء والمحو فهما حجب التعزيز عن السلوك دون سحب شيء موجود."},{"s":"أسئلة المعيار الخامس","n":38,"q":"أي العوامل المنزلية التالية قد يكون لها الأثر الأكبر على نظرة طالب المرحلة الابتدائية لكفاءته العلمية وربما تدعمه الدراسات في هذا المجال؟","o":["أساليب الانضباط المتبعة في المنزل","الترتيب بين الإخوة وطبيعة العلاقة بهم","معتقدات الوالدين الظاهرة حول قدرات الطالب","أنواع الألعاب في المنزل والقيمة التعليمية التي تحملها"],"a":2,"f":"تشير الدراسات (كأبحاث ايكلس) إلى أن معتقدات الوالدين الظاهرة حول قدرات ابنهما تنعكس مباشرة على تصوره لكفاءته الذاتية، أكثر من الانضباط أو ترتيب الإخوة أو الألعاب."},{"s":"أسئلة المعيار الخامس","n":39,"q":"المساهمة في الواجبات الاجتماعية في حدود الإمكانات المتاحة من مطالب مرحلة:","o":["المراهقة","النضج والرشد","وسط العمر","الشيخوخة"],"a":3,"f":"حسب مهام النمو لهافجهرست، المساهمة في الواجبات الاجتماعية في حدود الإمكانات المتاحة من مطالب مرحلة الشيخوخة، حيث تتراجع القدرات فيتكيف الفرد مع ما يستطيعه."},{"s":"أسئلة المعيار الخامس","n":40,"q":"عدم التحكم في عمليات المشي والإخراج والكلام يؤدي إلى:","o":["الخجل والشك","الخوف وعدم الثقة","الشعور بالذنب","سلوك انسحابي"],"a":0,"f":"في نظرية إريكسون، مرحلة الاستقلال مقابل الخجل والشك (٢–٣ سنوات) هي مرحلة التحكم في المشي والإخراج والكلام، وفشل الطفل في ذلك يورثه الخجل والشك في قدراته."},{"s":"أسئلة المعيار الخامس","n":41,"q":"طُلِبَ من أحد معلمي اللغة الإنجليزية تدريس فصل فيه طلاب ينتمون إلى ثقافات متعددة وأسر ذوات مستويات تعليمية متباينة، فأي الطرق الآتية يمكن للمعلم استخدامها لتعزيز عملية التعلم لديهم على أفضل وجه؟","o":["استخدام الأسئلة التي تتيح للطلاب ذوي الأداء المنخفض تقديم إجابات مختصرة بغض النظر عن صحتها","إتاحة فرص متعددة للطلاب المتميزين ليتحدثوا باللغة الإنجليزية ويكتبوا ويقرؤوا عن محتوى الدرس","وضع الطلاب ذوي المستوى المتقارب في مجموعات تعليمية صغيرة لأداء الأنشطة التي تناسبهم","اتباع طريقة تدريس ثابتة لجميع الطلاب لتقديم المفاهيم المهمة في الدرس لهم"],"a":2,"f":"تنوع الثقافات والمستويات يقتضي تمايز التعليم، ومنه تجميع الطلاب المتقاربين مستوى في مجموعات صغيرة بأنشطة تناسبهم؛ أما الطريقة الثابتة للجميع أو تجاهل صحة الإجابة فتهمل الفروق الفردية."},{"s":"أسئلة المعيار الخامس","n":42,"q":"النظرية التي تقول: إن السلوك المنحرف أو الشاذ هو سلوك متعلم هي:","o":["السلوكية","البنائية","الاجتماعية","المعرفية"],"a":0,"f":"النظرية السلوكية تفسر السلوك كله، سوياً كان أم منحرفاً، بأنه متعلم عن طريق الارتباط الشرطي والتعزيز والبيئة، ولذلك يمكن تعديله بإعادة التعلم."},{"s":"أسئلة المعيار الخامس","n":43,"q":"في أي مرحلة من مراحل بياجيه تظهر الفروق الفردية؟","o":["الحس حركية","ما قبل العمليات","العمليات المحسوسة","العمليات التشكيلية"],"a":2,"f":"تظهر الفروق الفردية بين الأطفال بوضوح في مرحلة العمليات المحسوسة (٧–١١ سنة)، حين يتفاوت اكتساب مفاهيم الحفظ والتصنيف والترتيب بين طفل وآخر."},{"s":"أسئلة المعيار الخامس","n":44,"q":"أي العبارات التالية تنطبق على المهارات الحركية الكبيرة؟","o":["يتفوق فيها الذكور على الإناث","أسهل من المهارات الحركية الصغيرة","يبدأ تعلمها متأخراً وبعد المهارات الحركية الصغيرة","يقتصر القيام بها على توظيف الأطراف السفلى"],"a":1,"f":"المهارات الحركية الكبيرة (كالجري والقفز) تعتمد على العضلات الكبيرة وتُتقن أبكر وأسهل من المهارات الحركية الدقيقة التي تتطلب توافقاً عضلياً عصبياً دقيقاً."},{"s":"أسئلة المعيار الخامس","n":45,"q":"يحدث التعليم البنائي عندما:","o":["يبتكر المتعلم معرفة جديدة في مجال التخصص","يفسر المتعلم معاني المصطلحات العلمية","يربط المعرفة الجديدة بما لديه من معرفة سابقة","يقدم تطبيقات عملية وظيفية مختلفة"],"a":2,"f":"جوهر البنائية أن المتعلم يبني معرفته بنفسه بربط المعلومة الجديدة بما لديه من معرفة سابقة، لا أن يتلقاها جاهزة ولا أن يبتكر معرفة جديدة في التخصص."},{"s":"أسئلة المعيار الخامس","n":46,"q":"معلم التوحيد يشرح مادته بالمفاهيم المجردة لأنها:","o":["لا تنشأ بصورة كاملة ولا تنتهي عند حد معين","لا تحتاج إلى خبرات سابقة","تحتاج إلى خبرات سابقة","تنشأ بصورة واضحة"],"a":0,"f":"المفاهيم المجردة (كالإيمان والتوحيد) لا تتكون كاملة دفعة واحدة ولا تقف عند حد معين، بل تنمو وتتعمق مع الخبرة، ولذلك يشرحها المعلم بتدرج."},{"s":"أسئلة المعيار الخامس","n":47,"q":"يرى جاثري أن التعلم يحدث نتيجة:","o":["التكرار والتدريب","المثير والاستجابة","المحاولة والخطأ","النظر للموقف بصورة شاملة"],"a":1,"f":"جاثري صاحب نظرية الاقتران القريب، ويرى أن التعلم يحدث من ارتباط مثير بالاستجابة التي تلازمه زمنياً، وقد يتم من محاولة واحدة، بخلاف التكرار الذي يؤكد عليه ثورندايك."},{"s":"أسئلة المعيار الخامس","n":48,"q":"إسراع الطفل نحو التلفاز عندما يُقرع جرس الباب يُعَدُّ مثالاً على:","o":["التعزيز","التمييز","التعميم","انتقال أثر التعلم"],"a":2,"f":"إسراع الطفل نحو التلفاز عند سماع جرس الباب انتقال لاستجابة تعلمها (الاستجابة لصوت جرس التلفاز) إلى مثير مشابه، وهذا هو التعميم أي الاستجابة لمثيرات متشابهة."},{"s":"أسئلة المعيار الخامس","n":49,"q":"حسب هرم ماسلو فإن (الابتكار - الاستقلال) تقع ضمن الحاجات:","o":["الفسيولوجية","الأمن","الاجتماعية","تحقيق الذات"],"a":3,"f":"الابتكار والاستقلال والإبداع من سمات الحاجة إلى تحقيق الذات، وهي قمة هرم ماسلو التي يسعى فيها الفرد لاستثمار قدراته كاملة."},{"s":"أسئلة المعيار الخامس","n":50,"q":"يخطط المعلم درسه وفق الخصائص المعرفية لطلابه، ويشجعهم على ممارسة التأمل الذاتي. هذه من أهم مبادئ نظرية:","o":["ثورنديك","كلارك هل","الجشتالت","بياجيه"],"a":3,"f":"مراعاة الخصائص المعرفية للمتعلمين وفق مرحلة نموهم وتشجيعهم على التأمل الذاتي من مبادئ نظرية بياجيه البنائية المعرفية، لا السلوكية كثورندايك وهل."},{"s":"أسئلة المعيار الخامس","n":51,"q":"أي العبارات التالية تعتبر صحيحة؟","o":["تتزايد نسب انتشار صعوبات التعلم بين الذكور أكثر من الإناث","تتزايد نسب انتشار صعوبات التعلم بين الإناث أكثر من الذكور","تعتبر النسب متساوية بين الذكور والإناث","تعتبر النسب متفاوتة باختلاف البيئة"],"a":0,"f":"تشير الدراسات إلى أن انتشار صعوبات التعلم أعلى بين الذكور منه بين الإناث، وتتراوح النسبة تقريباً من ٢:١ إلى ٤:١."},{"s":"أسئلة المعيار الخامس","n":52,"q":"الطالب (هيثم) يقرأ بشكل جيد؛ لكنه لا يستطيع معرفة ما قرأه، الطالب يعاني من صعوبة في:","o":["الفهم","المرونة","الطلاقة","الانتباه"],"a":0,"f":"الطالب يقرأ بطلاقة (نطق سليم) لكنه لا يدرك المعنى، وهذا خلل في الفهم القرائي؛ فالطلاقة تعني سرعة القراءة ودقتها وليس استيعاب المقروء."},{"s":"أسئلة المعيار الخامس","n":53,"q":"شُخِّصَ أحد الطلاب في الصف الثاني الابتدائي بأن لديه صعوبات في التعلم، إضافة إلى صعوبات القراءة، بالتالي الطالب سيعاني من:","o":["مشكلات في التكيف مع أقرانه","مشكلات في تعلم الرياضيات","ضعف في المهارات الحركية","تأخر في مستوى الذكاء"],"a":1,"f":"الدراسات تبين أن صعوبات القراءة كثيراً ما يصاحبها صعوبات في تعلم الرياضيات، لأن كلتيهما تشتركان في ضعف المعالجة اللغوية والذاكرة، بينما الذكاء لدى ذوي الصعوبات عادي أو فوق ذلك."},{"s":"أسئلة المعيار الخامس","n":54,"q":"يريد معلم الدراسات الإسلامية تعليم طلابه طريقة التيمم الصحيحة، أنسب طريقة لذلك هي:","o":["استخدام تراب حقيقي","عرض صور عن طريقة التيمم","شرح طريقة التيمم على السبورة","تكليفهم بواجب منزلي عن التيمم"],"a":0,"f":"تعليم مهارة عملية كالتيمم يتحقق بأن يمارسها الطالب فعلياً، واستخدام التراب الحقيقي يتيح التدريب المباشر؛ أما الصور والشرح النظري فتقدم المعرفة دون الأداء."},{"s":"أسئلة المعيار الخامس","n":55,"q":"المدرسة التي تتكلم عن الإدراك والأسلوب المعرفي في الفهم والعقل هي:","o":["البنائية","التحليلية","الوظيفية","الجشتالت"],"a":3,"f":"مدرسة الجشطالت (علم النفس الشكلي) تهتم بالإدراك الكلي وبالفهم والاستبصار وبنية المجال المعرفي، بينما تهتم البنائية ببناء المتعلم لمعرفته."},{"s":"أسئلة المعيار الخامس","n":56,"q":"عندما يَعْرِضُ المعلم فيديو لكي يعلم الطلاب كيفية صلاة العيد تعتبر أول عملية في التعلم بالملاحظة هي:","o":["التأمل","الإدراك","الانتباه","التذكر"],"a":2,"f":"عند باندورا أولى عمليات التعلم بالملاحظة هي الانتباه إلى النموذج، يليها الاحتفاظ (التذكر) ثم إعادة الإنتاج ثم الدافعية؛ فبدون انتباه لا يحدث تعلم."},{"s":"أسئلة المعيار الخامس","n":57,"q":"يَعُدُّ بياجيه التصنيف والترتيب وحل الأمور بشكل منطقي من مراحل النمو:","o":["الحس عقلي","ما قبل العمليات","العمليات الحسية","العمليات المجردة"],"a":2,"f":"التصنيف والترتيب والاستدلال المنطقي في الأمور المحسوسة من خصائص مرحلة العمليات الحسية (المحسوسة) عند بياجيه، بينما التفكير المجرد يظهر لاحقاً."},{"s":"أسئلة المعيار الخامس","n":58,"q":"تشتت الانتباه وضعف الذاكرة لدى طلاب الصعوبات من الخصائص:","o":["النمائية","الاجتماعية","الأكاديمية","النفسية"],"a":0,"f":"تشتت الانتباه وضعف الذاكرة والإدراك من الصعوبات النمائية (الأولية) التي تسبق الصعوبات الأكاديمية كالقراءة والحساب وتؤثر فيها."},{"s":"أسئلة المعيار الخامس","n":59,"q":"أصعب فئات التربية الخاصة في الدمج هي:","o":["التوحد","فرط الحركة","الإعاقة الفكرية","الإعاقة الحركية"],"a":0,"f":"يعد التوحد أصعب الفئات في الدمج لأنه يجمع قصوراً في التواصل والتفاعل الاجتماعي وسلوكيات نمطية تحتاج دعماً مكثفاً، فيتأثر التفاعل مع الأقران."},{"s":"أسئلة المعيار الخامس","n":60,"q":"الطالب (سعود) من الطلاب الموهوبين؛ عندما يجيب إجابة صحيحة يقول له المعلم: (أحسنت)، حسب النظرية السلوكية فإن هذا الإجراء يعتبر:","o":["تغذية راجعة","عقداً سلوكياً","تعزيزاً","تلقيناً"],"a":2,"f":"عبارة «أحسنت» بعد الإجابة الصحيحة معزز لفظي إيجابي يزيد احتمال تكرار السلوك، وهذا هو التعزيز في النظرية السلوكية."},{"s":"أسئلة المعيار الخامس","n":61,"q":"الطفولة المتوسطة تبدأ من:","o":["3 - 6 سنوات","7 - 9 سنوات","9 - 12 سنة","12 - 15 سنة"],"a":1,"f":"تقسم مراحل الطفولة في المنهج المعتمد إلى الطفولة المبكرة (٣–٦) والمتوسطة (٧–٩) والمتأخرة (٩–١٢)، فالمتوسطة تبدأ من السابعة."},{"s":"أسئلة المعيار الخامس","n":62,"q":"حصل الطالب (ياسر) على 75 في اختبار الذكاء، إذن: فهو يُصنف على أنه:","o":["ذكي","بطيء تعلم","تأخر دراسي","صعوبات تعلم"],"a":1,"f":"درجة ذكاء ٧٥ تقع بين الذكاء العادي والإعاقة العقلية (نحو ٧٠–٩٠)، وتصنف بطء التعلم، أما صعوبات التعلم فذكاؤها عادي والتأخر الدراسي له أسباب أخرى."},{"s":"أسئلة المعيار الخامس","n":63,"q":"هو حالة من الاستعداد لدى الطالب تدفعه إلى تأييد أو عدم تأييد موضوع معين:","o":["الميل","الدافع","الحافز","الاتجاه"],"a":3,"f":"الاتجاه هو استعداد أو حالة تهيؤ لدى الفرد للاستجابة سلباً أو إيجاباً نحو موضوع معين، بينما الميل انجذاب لنشاط، والدافع طاقة داخلية محركة."},{"s":"أسئلة المعيار الخامس","n":64,"q":"يُصنف ذوو صعوبات التعلم حسب درجة ذكائهم على أنهم أطفال من فئة:","o":["المعاقين عقلياً","المتأخرين دراسياً","بطيئي التعلم","العاديين"],"a":3,"f":"ذوو صعوبات التعلم يتميزون بذكاء متوسط أو فوق المتوسط، ولذلك يصنفون عاديين من حيث الذكاء، ومشكلتهم في عمليات التعلم نفسها لا في القدرة العقلية."},{"s":"أسئلة المعيار الخامس","n":65,"q":"(الانتباه - الذاكرة - الإدراك)، تعتبر صعوبات:","o":["أولية","ثانوية","أكاديمية","عقلية"],"a":0,"f":"الانتباه والذاكرة والإدراك من الصعوبات النمائية الأولية، لأنها عمليات عقلية أساسية يعتمد عليها التعلم، وتسبب الصعوبات الثانوية والأكاديمية."},{"s":"أسئلة المعيار الخامس","n":66,"q":"أي الأساليب التالية أفضل لضمان استيعاب جميع الطلاب للدرس؟","o":["التنويع في طرق التدريس المتبعة","توجيه مجموعة من الأسئلة للطلاب","البدء بعرض المفاهيم الرئيسية للموضوع","إعادة شرح الدرس في الحصة عدة مرات"],"a":0,"f":"لأن الطلاب يختلفون في أنماط تعلمهم وقدراتهم، فالتنويع في طرق التدريس يتيح لكل منهم فرصة الفهم؛ أما تكرار الشرح أو الأسئلة فتبقى فيهما طريقة واحدة."},{"s":"أسئلة المعيار الخامس","n":67,"q":"أي الأنشطة الآتية يعتقد العالم بياجيه أنها الأكثر إسهاماً في تطور الطلاب وتعلمهم؟","o":["اللعب الجماعي","مشاهدة التلفاز","قراءة القصص","الرسوم والتلوين"],"a":0,"f":"يرى بياجيه أن اللعب الجماعي والتفاعل مع الأقران يسهم في تخطي التمركز حول الذات ويدفع النمو المعرفي والاجتماعي، بخلاف المشاهدة السلبية."},{"s":"أسئلة المعيار الخامس","n":68,"q":"يأتي أحد الطلاب إلى المدرسة ممتعضاً ويرتدي ملابس متسخة دائماً، ويشعر بالجوع والتعب وقلة النوم، أي حاجات هذا الطالب أكثر تهديداً وفقاً لهرم ماسلو؟","o":["البيولوجية","الحب","الأمان","تحقيق الذات"],"a":0,"f":"الجوع وقلة النوم والملابس المتسخة تعبر عن حاجات فسيولوجية (بيولوجية) غير مشبعة، وهي قاعدة هرم ماسلو التي يجب إشباعها قبل غيرها."},{"s":"أسئلة المعيار الخامس","n":69,"q":"طالب في الصف الثالث الابتدائي يقرأ الكلمات خطأ، وأحياناً يبدل الحروف، الطالب يعاني من:","o":["صعوبات تعلم","تأخر في التعلم","ضعف النظر","لا يعاني من شيء"],"a":0,"f":"قراءة الكلمات خطأ وإبدال الحروف في الصف الثالث مؤشر لصعوبة تعلم (عسر القراءة)، فهو يتكرر مع استمرار النمو العادي للذكاء، وليس ضعف النظر."},{"s":"أسئلة المعيار الخامس","n":70,"q":"العوامل التي تؤثر على النمو الإنساني ويصعب التحكم بها:","o":["العوامل الوراثية","العوامل البيئية","العوامل الكيميائية","العوامل الاقتصادية"],"a":0,"f":"العوامل الوراثية (الجينات) تحدد كثيراً من خصائص النمو وهي محددة عند الإخصاب ويصعب التحكم فيها، بخلاف العوامل البيئية التي يمكن تعديلها."},{"s":"أسئلة المعيار الخامس","n":71,"q":"النظرية التي تُقسم مراحل التعلم والنمو المعرفي إلى أنشطة عملية وتصورية ورمزية:","o":["نظرية برونر في النمو المعرفي","نظرية بياجيه في النمو المعرفي","نظرية الذكاءات المتعددة","نظرية جانييه في النمو المعرفي"],"a":0,"f":"نظرية برونر تقسم التمثيل المعرفي إلى ثلاثة أنشطة: عملية (حركية) وتصورية (صور) ورمزية (لغة)، أما بياجيه فمراحله حسية حركية وما قبل العمليات وغيرها."},{"s":"أسئلة المعيار الخامس","n":72,"q":"(تركي) معلم لمادة لغتي للصف الأول الابتدائي؛ كان يطلب من التلاميذ ملاحظته وهو يكتب حرف الألف بخط النسخ، ثم يطلب منهم كتابة حرف الألف بخط النسخ كما شاهدوه؛ المعلم يستخدم في تدريسه طريقة التعلم بـ:","o":["المحاولة والخطأ","التكرار","النمذجة","التدريب"],"a":2,"f":"ملاحظة المعلم وهو يكتب ثم تقليد التلاميذ لما شاهدوه تعلم بالنمذجة (التعلم بالملاحظة) كما عند باندورا، لا المحاولة والخطأ."},{"s":"أسئلة المعيار الخامس","n":73,"q":"النظرية القائلة بأن المعرفة لا تُنقل إلى العقل كاملة وإنما تبنى بداخله؛ هي:","o":["الاجتماعية","البنائية","السلوكية","المعرفية"],"a":1,"f":"البنائية ترى أن المعرفة لا تنقل جاهزة من المعلم، بل يبنيها المتعلم داخل عقله بنشاطه وخبرته السابقة، وتختلف بذلك عن السلوكية التي تراها استجابة لمثيرات."},{"s":"أسئلة المعيار الخامس","n":74,"q":"عندما تلاحظ في طلابك أنهم يحبون المدرسة ويستمتعون بالتعليم، فإن ذلك يعني أن مناخ المدرسة يخاطب البعد:","o":["الاجتماعي","الوجداني","العقلي","الأدائي"],"a":1,"f":"حب الطلاب للمدرسة واستمتاعهم بالتعلم يعبر عن مشاعرهم واتجاهاتهم، أي البعد الوجداني للمناخ المدرسي."},{"s":"أسئلة المعيار الخامس","n":75,"q":"التوحد هو:","o":["اضطراب انفعالي","اضطراب نمائي","اضطراب سلوكي","مرض عقلي"],"a":1,"f":"التوحد اضطراب نمائي عصبي يظهر في الطفولة المبكرة ويؤثر في التواصل والتفاعل والسلوك، وليس مرضاً عقلياً أو اضطراباً انفعالياً."},{"s":"أسئلة المعيار الخامس","n":76,"q":"تعد صعوبات القراءة من أكثر الموضوعات انتشاراً عند طلاب صعوبات التعلم بنسبة:","o":["60%","70%","80%","90%"],"a":2,"f":"تشير الدراسات إلى أن نحو ٨٠٪ من ذوي صعوبات التعلم لديهم صعوبات في القراءة، فهي الأكثر شيوعاً بينهم."},{"s":"أسئلة المعيار الخامس","n":77,"q":"استخدام الخبرات السابقة في موقف تعليمي جديد يسمى:","o":["تعزيز التعلم","انتقال أثر التعلم","النضج المرافق للتعلم","الدافعية للتعلم"],"a":1,"f":"استخدام الخبرات والمعارف المكتسبة سابقاً في موقف جديد هو انتقال أثر التعلم، وقد يكون إيجابياً حين تفيد الخبرة السابقة في التعلم الجديد."},{"s":"أسئلة المعيار الخامس","n":78,"q":"(خالد) طالب لا ينطق الحروف جيداً ولكنه متفوق، أي من الآتي ينبغي على المعلم القيام به كإجراء أول؟","o":["تحويله للموجه الطلابي في المدرسة","تحويله لأخصائي التخاطب","الجلوس والحديث معه","إخبار والده بالمشكلة"],"a":0,"f":"النطق مشكلة لا تؤثر في تفوقه، والمعلم يبدأ بالإجراء المناسب لوظيفته المدرسية، وهو الإحالة للموجه الطلابي ليقيّم الحالة ويتخذ ما يلزم قبل تحويله للمختص."},{"s":"أسئلة المعيار الخامس","n":79,"q":"أفضل أسلوب للتعامل مع ذوي الاحتياجات الخاصة:","o":["النمذجة","دمج المهارات","التعميم","الشرح المركب"],"a":0,"f":"النمذجة (تقديم نموذج يلاحظه الطالب ويقلده) من أنجح أساليب تعليم ذوي الاحتياجات الخاصة لأنها تقلل الاعتماد على الشرح اللفظي المجرد."},{"s":"أسئلة المعيار الخامس","n":80,"q":"وفقاً لنظرية بياجيه يستطيع الطالب في سن الثامنة أن يميز أن الماء ينقل من أنبوب طويل ورفيع إلى آخر قصير وعريض يحوي نفس الكمية. يعكس هذا الأمر تمكن الطالب من مفهوم:","o":["الاحتفاظ","التصنيف","المواءمة","التمثيل"],"a":0,"f":"إدراك أن كمية الماء لا تتغير بتغير شكل الوعاء يمثل مفهوم الاحتفاظ (الحفظ) الذي يتمكن منه الطفل في مرحلة العمليات المحسوسة نحو ٧–٨ سنوات."},{"s":"أسئلة المعيار الخامس","n":81,"q":"(حسين) معلم في المرحلة الثانوية، يريد تعليم طلابه مفاهيم معينة في الدرس، الطريقة الأنسب لهم هي:","o":["أمثلة مألوفة لشرح أفكار معقدة","المحسوسات والعمليات المادية","مفاهيم مجردة وحقائق واقعية","مسائل تركز على النمط السمعي"],"a":2,"f":"في المرحلة الثانوية يصل المراهق إلى مرحلة العمليات المجردة عند بياجيه، فيناسبه التفكير بالمفاهيم المجردة والحقائق، بخلاف المحسوسات التي تناسب الأطفال."},{"s":"أسئلة المعيار الخامس","n":82,"q":"الطالبة (مريم) في الصف الثالث الابتدائي، تتحاشى القراءة الجهرية وتتبع بأصابعها وتضيف وتحذف الحروف وتشعر بالخجل الشديد أثناء مناداة اسمها من قبل معلمتها. من الممكن أن يكون لدى الطالبة:","o":["صعوبات أكاديمية","صعوبات نمائية","تخلف عقلي بسيط","تخلف عقلي متوسط"],"a":0,"f":"تجنب القراءة الجهرية والتتبع بالأصابع والحذف والإضافة مؤشرات لصعوبات تعلم أكاديمية في القراءة، والخجل نتيجة لها، وليست إعاقة عقلية."},{"s":"أسئلة المعيار الخامس","n":83,"q":"ما يميز الفرد في مرحلة العمليات الحسية عند (بياجيه):","o":["النمو اللغوي","التفكير المجرد","النمو الحس حركي","التصنيف والترتيب"],"a":3,"f":"ما يميز مرحلة العمليات الحسية (المحسوسة) عند بياجيه قدرة الطفل على التصنيف والترتيب المنطقي للأشياء المحسوسة، أما النمو الحس حركي فمرحلة سابقة."},{"s":"أسئلة المعيار الخامس","n":84,"q":"التعزيز السلبي يستخدمه المعلم دائماً في الموقف التعليمي لـ:","o":["تقوية السلوك","إضعاف السلوك","المحافظة على السلوك","إطفاء السلوك"],"a":0,"f":"التعزيز السلبي يقوي السلوك بإزالة مثير منفر عند حدوثه، فهو تعزيز وليس عقاباً، والعقاب هو ما يضعف السلوك."},{"s":"أسئلة المعيار الخامس","n":85,"q":"يُعتبر التلخيص من المهارات التعليمية المهمة، وهو يساعد الطالب على:","o":["بناء المفردات الصحيحة","الطلاقة اللفظية","إدراك المقروء","المرونة"],"a":2,"f":"التلخيص يتطلب فهم النص واستخلاص أفكاره الرئيسة، ولذلك ينمي إدراك المقروء (الفهم القرائي) أكثر من الطلاقة أو المفردات."},{"s":"أسئلة المعيار الخامس","n":86,"q":"صعوبات التعلم تعد اضطراباً:","o":["كمياً","نوعياً","مزمناً","لحظياً"],"a":1,"f":"صعوبات التعلم اضطراب نوعي يتعلق بعمليات محددة في التعلم لدى أفراد ذوي ذكاء عادي، وليس خللاً كمياً عاماً في القدرة."},{"s":"أسئلة المعيار الخامس","n":87,"q":"يعاني الطلاب ذوو صعوبات التعلم من صعوبات في الذاكرة:","o":["القصيرة أكثر من الطويلة","الطويلة أكثر من القصيرة","العاملة أكثر من الطويلة","القصيرة أقل من العاملة"],"a":0,"f":"تظهر مشكلاتهم أكثر في الذاكرة قصيرة المدى منها في طويلة المدى، لأنهم يعانون من قصور في استراتيجيات الترميز والتكرار والتنظيم."},{"s":"أسئلة المعيار الخامس","n":88,"q":"أراد معلم الرياضيات من أحد طلابه تصنيف الأشكال الهندسية بالفصل إلى (مثلث - مربع - مستطيل - دائرة)، أشار المعلم إلى السبورة فصنفها الطالب إلى دائرة، ثم أشار المعلم لباب الفصل فصنفه الطالب إلى مربع. الطالب لديه مشكلة واضحة في:","o":["الانتباه","التذكر","التفكير","الإدراك"],"a":3,"f":"عجز الطالب عن التعرف على الأشكال وتمييز الباب بأنه مستطيل لا مربع يدل على خلل في الإدراك (التمييز البصري للأشكال)."},{"s":"أسئلة المعيار الخامس","n":89,"q":"ترى إحدى نظريات التعلم المعاصر أن التعلم هو عملية عقلية تتمثل في استخدام الذاكرة والدافعية والتفكير، وأن محتوى التعلم يُقدَّر بقَدْرِ سعة وعمق معالجة المعلومات لدى المتعلم، وعلى بنية المعلومات لديه. يمثل النص السابق مضمون إحدى نظريات التعلم المعاصرة وهي النظرية:","o":["البنائية","السلوكية","الإدراكية","الجشطلتية"],"a":3,"f":"⚠ النص يصف التعلم عملية عقلية تعتمد الذاكرة ومعالجة المعلومات وبنيتها المعرفية، وهذا مضمون النظرية الإدراكية (المعرفية)، لا الجشطلتية التي تركز على الإدراك الكلي."},{"s":"أسئلة المعيار الخامس","n":90,"q":"يشير (مارسيا) في حديثه عن حالات الهوية في مرحلة المراهقة إلى حالات الهوية الأربع التي تساعد على فهم نمو المراهق. فلو كان لديك طالب يريد أن يصبح طبيباً لأن والديه يريدان أن يكون كذلك؛ بحكم خبرتك بالخصائص الشخصية للمراهق، ما حالة الهوية التي تنطبق على هذا الموقف؟","o":["المكبلة","المشتتة","المؤجلة","المنجزة"],"a":0,"f":"حالة الهوية المكبلة (المغلقة) عند مارسيا تعني التزام المراهق بخيار ما (كالطب) تحت تأثير الوالدين دون أن يمر بأزمة استكشاف ذاتية."},{"s":"أسئلة المعيار الخامس","n":91,"q":"يهتم (محمد) بأن تكون الوسيلة التعليمية مجسمة قدر الإمكان؛ ليستطيع طلاب المرحلة الابتدائية تحسسها ورؤية أبعادها. هذا الموقف يراعي:","o":["خصائص النمو","الفروق الفردية","أنماط الشخصية","الذكاءات المتعددة"],"a":0,"f":"تقديم وسيلة مجسمة محسوسة لطلاب الابتدائية يراعي خصائص نموهم، إذ يكونون في مرحلة العمليات المحسوسة ويتعلمون باللمس والمشاهدة."},{"s":"أسئلة المعيار الخامس","n":92,"q":"طلب خبير تربوي من أربعة معلمين اقتراح تطبيق صحيح لمبادئ النظرية البنائية عن تعليم كلمة (جبل) لتلاميذ الصف الأول الابتدائي ......... حدد صاحب الاقتراح الصحيح:","o":["سعود","سالم","معتز","وليد"],"a":3,"f":"الاقتراح الصحيح في النظرية البنائية هو ما يجعل التلميذ يبني معنى الكلمة بنفسه عبر خبراته وأنشطته (كمشاهدة جبل أو نموذجه واستكشافه) لا مجرد تلقينه التعريف."},{"s":"أسئلة المعيار الخامس","n":93,"q":"شُخِّصَت حالة طالب بأنه يعاني من (ديسجرافيا) هذا يعني بأن لديه:","o":["صعوبة في الرياضيات","صعوبة في القراءة","صعوبة في التهجئة","صعوبة في الكتابة"],"a":3,"f":"الديسجرافيا اضطراب في الكتابة اليدوية والتعبير الكتابي، بينما الديسلكسيا للقراءة والديسكالكوليا للحساب."},{"s":"أسئلة المعيار الخامس","n":94,"q":"لإثارة دافعية الطلاب لجأ المعلم سالم لطريقة التعزيز الذاتي، تنتمي هذه الطريقة للنظرية:","o":["السلوكية","المعرفية","الاجتماعية","الإنسانية"],"a":2,"f":"التعزيز الذاتي (مكافأة الفرد نفسه عند بلوغ معيار) مفهوم أساسي في نظرية التعلم الاجتماعي عند باندورا، التي تؤكد التنظيم الذاتي."},{"s":"أسئلة المعيار الخامس","n":95,"q":"لكل طالب أسلوبه الخاص في استقبال المعلومات وتجهيزها ومعالجتها وتخزينها في البنية المعرفية لديه. هذه الافتراضات التي تقوم عليها نظرية:","o":["سكنر","أوزبل","برونر","فيجوتسكي"],"a":1,"f":"يرى أوزبل في التعلم ذي المعنى أن لكل متعلم بنية معرفية خاصة يستقبل بها المعلومات ويعالجها ويخزنها، ويتم الربط بين الجديد والسابق."},{"s":"أسئلة المعيار الخامس","n":96,"q":"(أنس) معلم يريد تقديم معلومة مألوفة لدى طلابه، و(راشد) معلم يريد تقديم معلومة جديدة لطلابه. ما هي الطريقة حسب المنظم المتقدم التي تنفع لكليهما؟","o":["المنظم المقارن","المنظم الرأسي","المنظم الشارح","المنظم الإثرائي"],"a":1,"f":"⚠ عند أوزبل المنظم المقارن للمعلومة المألوفة والشارح للجديدة، فلا يوجد منظم واحد لكليهما بين الخيارات المعتادة؛ والخيار المعتمد (الرأسي) غير دقيق وقد يكون السؤال مشوهاً."},{"s":"أسئلة المعيار السابع","n":1,"q":"لاحظ المعلم أن العلاقات الاجتماعية بين طلاب صفه تحتاج إلى تعزيز ودعم، كما أن بعض الطلبة لا يحترم وجهات النظر المختلفة وبعضهم خجول وليس لديه القدرة على التواصل بفعالية مع الآخرين. لذا فكر في طريقة التدريس التي تساعد في التغلب على معظم تلك المشكلات. الطريقة المثلى هي:","o":["التعلم المبرمج","المناقشة","التعلم التعاوني","التعلم الذاتي"],"a":2,"f":"التعلم التعاوني يعمل في مجموعات صغيرة، فيعزز العلاقات ويعلم احترام الآراء ويدرب الخجول على التواصل، وهو أنسب لهذه المشكلات من التعلم الفردي."},{"s":"أسئلة المعيار السابع","n":2,"q":"لتنمية التعلم الذاتي لجميع الطلاب:","o":["أحفز الطلاب الأقوياء على التعلم في ضوء الأهداف التربوية","أتيح الفرصة لجميع الطلاب لوصف عملية تعلمهم وأشجعهم على ذلك","استخدم مصادر تعلم محددة ولا أشتت انتباه الطلاب","لا أشغل الطلاب في تقويم أعمال زملائهم"],"a":1,"f":"التعلم الذاتي ينمو حين يوصف الطلاب عملية تعلمهم ويفكرون فيها (التأمل ما وراء المعرفي)، ويشمل ذلك جميع الطلاب لا الأقوياء فقط."},{"s":"أسئلة المعيار السابع","n":3,"q":"معلم يدرس في المرحلة الثانوية، يريد أن يعلم طلابه مفاهيم معينة. في هذه المرحلة، تعد الطريقة الأنسب في تقديم هذه المفاهيم هي استخدام:","o":["أمثلة مألوفة لشرح أفكار معقدة","المحسوسات والعمليات المادية","مفاهيم عامة أو مجردة وحقائق واقعية","مسائل تتطلب تركيزاً على النمط السمعي"],"a":2,"f":"طلاب الثانوية في مرحلة العمليات المجردة عند بياجيه، فتناسبهم المفاهيم العامة المجردة والحقائق الواقعية، لا المحسوسات الأنسب للأطفال."},{"s":"أسئلة المعيار السابع","n":4,"q":"خطوات إجرائية منتظمة ومتسلسلة، بحيث تكون شاملة ومرنة ومراعية لطبيعة المتعلمين تسمى:","o":["استراتيجية التدريس","طريقة التدريس","الوسيلة التعليمية","أسلوب التدريس"],"a":0,"f":"الاستراتيجية خطة منظمة متسلسلة الخطوات شاملة ومرنة تراعي طبيعة المتعلمين، وهي أعم من الطريقة والأسلوب."},{"s":"أسئلة المعيار السابع","n":5,"q":"واحدة من طرق التدريس التالية تسبب مللاً للطلاب أكثر من غيرها:","o":["المشروعات","الاكتشاف","الحوار","الإلقاء"],"a":3,"f":"الإلقاء طريقة تقوم على إرسال المعلم للمعلومات والطالب مستمع سلبي، فتسبب الملل أكثر من المشروعات والاكتشاف والحوار التي تتطلب مشاركة."},{"s":"أسئلة المعيار السابع","n":6,"q":"واحدة من طرق التدريس التالية تسبب مللاً للطلاب أكثر من غيرها:","o":["التعلم التعاوني","المناقشة","المحاضرة","الاكتشاف"],"a":2,"f":"المحاضرة طريقة يتحدث فيها المعلم والطلاب يستمعون، فتقل مشاركتهم ويزيد الملل، بخلاف التعاوني والمناقشة والاكتشاف."},{"s":"أسئلة المعيار السابع","n":7,"q":"العملية العقلية التي يتم فيها الانتقال من الجزئيات إلى العموميات ومن الخاص إلى العام، تسمى:","o":["الاستقراء","الاستنباط","الاستدلال","الاستنتاج"],"a":0,"f":"الاستقراء انتقال من الجزئيات والأمثلة إلى القاعدة العامة، أما الاستنباط فعكسه من العام إلى الخاص."},{"s":"أسئلة المعيار السابع","n":8,"q":"من طرق التدريس التي تهتم بكم الأفكار دون نوعيتها:","o":["العصف الذهني","دورة التعلم","التعلم بالاكتشاف","المناقشة والحوار"],"a":0,"f":"العصف الذهني يشجع توليد أكبر عدد من الأفكار دون تقويمها أو نقدها، فيهتم بالكم قبل النوع، ويؤجل التقويم إلى مرحلة لاحقة."},{"s":"أسئلة المعيار السابع","n":9,"q":"يعرض المعلم على الطلاب قانون مندل الأول، ويوضح مفهومه حتى يدرك الطلاب القانون، ثم يعطيهم أمثلة ويبين كيفية تطبيق القانون عليها، ثم يزودهم بتمارين أخرى يستخدمون فيها القانون. هذه الطريقة مثالاً على التدريس بطريقة:","o":["الاستقراء","الاستنباط","الاستقصاء","العروض العملية"],"a":1,"f":"عرض القانون أولاً ثم تطبيقه على أمثلة وتمارين انتقال من العام (القاعدة) إلى الخاص، وهذا هو الاستنباط (القياسي)، أما الاستقراء فيبدأ بالأمثلة."},{"s":"أسئلة المعيار السابع","n":10,"q":"تتمحور الاتجاهات الحديثة في طرائق التدريس حول:","o":["دور المعلم","الاختبارات التحصيلية","الكتاب المدرسي","دور المتعلم"],"a":3,"f":"الاتجاهات الحديثة في التدريس تجعل المتعلم محور العملية التعليمية ونشاطه أساس التعلم، بدلاً من التمركز حول المعلم أو الكتاب."},{"s":"أسئلة المعيار السابع","n":11,"q":"سلوك واقعي في موقف مصطنع، ويتقمص كل فرد من المشاركين في النشاط التعليمي أحد الأدوار التي أوجد في الموقف الواقعي، ويتفاعل مع الآخرين في حدود علاقة دوره بأدوارهم، يسمى باستراتيجية:","o":["لعب الأدوار","الاستقصاء","عمليات التعلم","التفكير الناقد"],"a":0,"f":"لعب الأدوار استراتيجية يتقمص فيها المشاركون أدواراً في موقف واقعي مصطنع ويتفاعلون وفق أدوارهم، وبهذا يختلف عن الاستقصاء والتفكير الناقد."},{"s":"أسئلة المعيار السابع","n":12,"q":"له مسميات عدة كالتعلم بالملاحظة - التعلم الاجتماعي - التقليد، هو التعلم بـ:","o":["النمذجة","التلقين","الإخفاء","لا شيء مما ذكر"],"a":0,"f":"التعلم بالملاحظة والتعلم الاجتماعي والتقليد مسميات مختلفة للنمذجة عند باندورا، أي تعلم السلوك بملاحظة نموذج."},{"s":"أسئلة المعيار السابع","n":13,"q":"تُعرف النمذجة بأنها تغيير في سلوك الفرد ينتج عن:","o":["تسلسل السلوك","تحليل المهارة","ضبط المثير","ملاحظة لسلوك الآخرين"],"a":3,"f":"النمذجة تغير في سلوك الفرد ينتج عن ملاحظته لسلوك الآخرين (النماذج)، وهذا جوهر التعلم الاجتماعي عند باندورا."},{"s":"أسئلة المعيار السابع","n":14,"q":"أنسب طريقة لتنمية مهارات تقبل وجهات نظر الآخرين لدى الطلاب هي:","o":["تدريس الأقران","المناقشة","التعلم باللعب","المحاضرة"],"a":1,"f":"المناقشة تتيح تبادل الآراء والاستماع للآخرين فتنمي تقبل وجهات النظر المختلفة، بينما المحاضرة تفتقر إلى التفاعل."},{"s":"أسئلة المعيار السابع","n":15,"q":"إذا أراد المعلم أن يشرك الطلاب في حل مشكلة قائمة فعليه أن يعتمد على التعليم القائم على:","o":["المفاهيم","المشاريع","الخبرات","المعلومات"],"a":1,"f":"إشراك الطلاب في حل مشكلة قائمة يتحقق بالتعليم القائم على المشاريع، فهو يحول المشكلة إلى مشروع عملي يتعاون فيه الطلاب للوصول إلى حل."},{"s":"أسئلة المعيار السابع","n":16,"q":"لاحظ معلم أن هناك من طلاب الفصل من يمتلك السرعة في التذكر، وأن هناك من يعاني من الخجل والبعض بطيء في التعلم. على المعلم التغلب على هذه المشكلة من خلال:","o":["التعلم الفردي","الإلقاء والمحاضرة","التعلم التعاوني","المناقشة والحوار"],"a":2,"f":"التعلم التعاوني يجمع طلاباً بمستويات مختلفة، فيستفيد البطيء من السريع ويتشجع الخجول على المشاركة، وهو أنسب للتنوع في الفصل."},{"s":"أسئلة المعيار السابع","n":17,"q":"أفضل طريقة تُستخدم لتمثيل القيم الاجتماعية:","o":["المحاضرة","المناقشة","الحوارية","تمثيل الأدوار"],"a":3,"f":"تمثيل القيم الاجتماعية يتطلب أن يعيشها الطلاب في مواقف ممثلة، لذا يعد تمثيل الأدوار أنسب الطرق، لأنه يربط القيمة بالسلوك."},{"s":"أسئلة المعيار السابع","n":18,"q":"طريقة تدريس فعالة لموقف تدريسي يشمل معلومات كثيرة، وعدد طلاب كبير هي:","o":["التدريب العملي","حل المشكلات","المناقشة ومجموعات العمل","المحاضرة"],"a":3,"f":"المحاضرة أنسب حين تكون المعلومات كثيرة والعدد كبيراً، لأنها تنقل كماً كبيراً منها في وقت قصير، بينما تحتاج المناقشة وحل المشكلات إلى مجموعات صغيرة ووقت أطول."},{"s":"أسئلة المعيار السابع","n":19,"q":"من طرق التدريس التي تهتم بكم الأفكار قبل نوعيتها:","o":["المناقشة والحوار","التعلم بالاستكشاف","العصف الذهني","المحاضرة"],"a":2,"f":"العصف الذهني يهتم بكم الأفكار المطروحة قبل جودتها، ويؤجل تقويمها ونقدها إلى ما بعد انتهاء الجلسة."},{"s":"أسئلة المعيار السابع","n":20,"q":"واحدة من طرق التدريس التالية تسبب مللاً للطلاب أكثر من غيرها:","o":["المشروعات","الحوار","الإلقاء","الاكتشاف"],"a":2,"f":"الإلقاء طريقة تعتمد على تحدث المعلم وسلبية الطالب، فهي أكثر الطرق إثارة للملل مقارنة بالمشروعات والحوار والاكتشاف."},{"s":"أسئلة المعيار السابع","n":21,"q":"أي من استراتيجيات التعليم والتعلم التالية تعتمد على التفاعل وجهاً لوجه بين المعلم والطلاب؟","o":["المحاضرة","التعلم بالاكتشاف","المناقشة","التعلم التعاوني"],"a":2,"f":"المناقشة تقوم على الحوار المباشر وجهاً لوجه بين المعلم والطلاب، بخلاف المحاضرة ذات الاتجاه الواحد، أما التعاوني فيعتمد التفاعل بين الطلاب أنفسهم."},{"s":"أسئلة المعيار السابع","n":22,"q":"كلف معلم مجموعة بمناقشة إحدى المشكلات، وطلب منهم أن يقوموا بتحديد المشكلة، ثم يصوغوا أكبر عدد ممكن من الحلول دون نقدها ثم تقييم الحلول واختيار أفضلها، هذا المعلم هنا يستخدم:","o":["التعلم التعاوني","المناقلة التمهيدية","العصف الذهني","التفكير العلمي"],"a":3,"f":"⚠ تحديد المشكلة وتوليد حلول كثيرة دون نقد ثم التقييم هو أسلوب العصف الذهني في حل المشكلات، وهو الأقرب للوصف، فمرحلة توليد الحلول دون نقد سمته المميزة، وليس خطوات التفكير العلمي."},{"s":"أسئلة المعيار السابع","n":23,"q":"مجموعة الأسس والمبادئ والمنطلقات التي تستند إليها أي طريقة، أو أسلوب من طرق وأساليب التدريس، سواء أكانت هذه الأسس أكاديمية متخصصة أم تربوية مهنية، أم اجتماعية، أم نفسية:","o":["طرق التدريس","المداخل","استراتيجيات التدريس","المناهج"],"a":1,"f":"المدخل مجموعة الأسس والمبادئ والمنطلقات (الأكاديمية أو التربوية أو النفسية) التي تستند إليها الطريقة أو الأسلوب، وهو أعم من الطريقة والاستراتيجية."},{"s":"أسئلة المعيار السابع","n":24,"q":"من خلال النصوص الشرعية، دخل الأستاذ (فهد) الدرس الجديد. المدخل الذي اعتمد عليه الأستاذ (فهد) هو المدخل:","o":["المنطقي","التاريخي","الديني","الكشاف"],"a":2,"f":"الانطلاق من النصوص الشرعية (آيات وأحاديث) لبدء الدرس هو المدخل الديني، لأن مصدر المعرفة فيه الوحي."},{"s":"أسئلة المعيار السابع","n":25,"q":"تنظيم خاص في المادة الدراسية وطريقة التدريس تضع المتعلم في موقف تعليمي متكامل يثير اهتمامه ويتطلب منه أنشطة متنوعة تؤدي بمروره بخبرات، وبالتالي تحقيق أهداف التعلم المرغوبة يقصد به:","o":["تعلم محوري","تعليم وحدات دراسية","تعلم منفصل","تعلم متصل"],"a":1,"f":"تنظيم المادة والتدريس في موقف تعليمي متكامل يثير الاهتمام ويستلزم أنشطة متنوعة هو تعليم الوحدات الدراسية، حيث يدور التعلم حول وحدة متكاملة."},{"s":"أسئلة المعيار السابع","n":26,"q":"أي من المحركات التالية ليست من أدوات البحث عبر الإنترنت:","o":["قوقل","ويكيبيديا","فايرفوكس","إيدج"],"a":1,"f":"ويكيبيديا موسوعة معرفية وليست محرك بحث، وإن كان فايرفوكس وإيدج متصفحين لا محركين؛ لذلك تبقى الأوفق للسؤال بحسب الإجابة المعتمدة."},{"s":"أسئلة المعيار السابع","n":27,"q":"في نهاية حصة العلوم؛ وزّع المعلم على طلابه ورقة نشاط تتضمن النشاط التالي: القلب: تتعلق بمشاعر الطلاب تجاه الدرس العقل: تتعلق بما تعلمه الطالب في الدرس الحرارة: تتعلق بمستوى الحماس والإثارة أثناء تطبيق الدرس اليد: تتعلق بتعاون الطلاب مع بعضهم استخدم المعلم استراتيجية تعلم نشط حديثة، وهي:","o":["بيسك","فراير","4H","كاروسل"],"a":2,"f":"استراتيجية 4H تقوم على أربعة محاور: القلب للمشاعر، والعقل للمعرفة، واليد للتعاون والعمل، والحرارة للحماس، وهذا يطابق ورقة النشاط."},{"s":"أسئلة المعيار السابع","n":28,"q":"مدى نجاح المجموعة في تنفيذ المهمة التعليمية:","o":["الاعتماد الإيجابي","المعالجة الجمعية","التفاعل المعزز","مهارات تواصل"],"a":1,"f":"المعالجة الجمعية (معالجة المجموعة) هي تأمل أعضاء المجموعة في مدى نجاحهم في تحقيق المهمة وتحسين عملهم، وهي أحد عناصر التعلم التعاوني."},{"s":"أسئلة المعيار السابع","n":29,"q":"يختار المعلم موضوع الدرس، ثم يحدد الأهداف الإجرائية، ثم يصمم نصاً مكوناً من عدة فقرات بسيطة وواضحة مناسبة للعمر العقلي للطلاب، ثم يوزع المعلم الفقرات على الطلاب؛ بحيث يكون لكل طالب فقرة يقوم بتنفيذها. ما طريقة التدريس التي يقوم بها هذا المعلم؟","o":["التدريس التبادلي","التعلم التعاوني","تدريس الأقران","لعب الأدوار"],"a":1,"f":"توزيع أجزاء النص على الطلاب بحيث ينفذ كل طالب جزءاً يحقق المسؤولية الفردية والاعتماد المتبادل، وهما جوهر التعلم التعاوني، بخلاف لعب الأدوار."},{"s":"أسئلة المعيار السابع","n":30,"q":"جميع ما يلي من أدوات الحوسبة السحابية، عدا:","o":["Google drive","Dropbox","One drive","Endnote"],"a":3,"f":"درايف ودروب بوكس ووان درايف خدمات تخزين سحابية، أما Endnote فبرنامج لإدارة المراجع والاستشهادات المرجعية وليس أداة سحابية."},{"s":"أسئلة المعيار السابع","n":31,"q":"من محركات البحث التي تستخدم في التعليم:","o":["Google drive","Google play","Google Translate","Google scholar"],"a":3,"f":"Google Scholar محرك بحث أكاديمي متخصص في الأبحاث والدراسات، أما Drive فتخزين وPlay متجر تطبيقات وTranslate ترجمة."},{"s":"أسئلة المعيار السابع","n":32,"q":"يُوصف تعلم الطلاب وفق طرق التدريس المباشرة بأنه تعلم:","o":["استقبالي","استقصائي","استكشافي","استقرائي"],"a":0,"f":"التدريس المباشر يقدم فيه المعلم المعرفة جاهزة فيتلقاها الطالب، لذا يوصف التعلم بأنه استقبالي، بخلاف الاستقصاء والاستكشاف والاستقراء التي يبني فيها المتعلم المعرفة."},{"s":"أسئلة المعيار السابع","n":33,"q":"قام معلم اللغة العربية بتكليف الطلاب بحل واجبات منزلية إضافية، من خلال الاعتماد على الذات والبحث في مواقع الإنترنت الموثوقة ومكتبة المدرسة، ثم يقوم كل طالب بعرض إجابته على زملائه. هذا النوع من التعلم يسمى:","o":["التعلم المستقل","التعلم بالأقران","التعلم بالمحاكاة","التعلم الاجتماعي"],"a":0,"f":"اعتماد الطالب على نفسه في البحث والحل دون توجيه مباشر هو التعلم المستقل (الذاتي)، وعرض الإجابة لاحقاً لا يحوله إلى تعلم بالأقران."},{"s":"أسئلة المعيار السابع","n":34,"q":"تشجيع المعلم طلابه لزيادة وعيهم وحسهم بالمسؤولية داخل المدرسة وخارجها. يُعد هذا أحد مداخل التدريس:","o":["المعرفي","السلوكي","البنائي","الإنساني"],"a":3,"f":"تنمية الوعي والإحساس بالمسؤولية والقيم تهتم بالجانب الوجداني للمتعلم، وهو محور المدخل الإنساني في التدريس."},{"s":"أسئلة المعيار السابع","n":35,"q":"حين تكتشف وجود تصورات بديلة للمفاهيم لدى طلابك فإن العلاج الملائم لذلك هو:","o":["نموذج بوستر","التعلم التعاوني","الموديلات التعليمية","الرحلات المعرفية"],"a":0,"f":"نموذج بوسنر (بوستر) للتغير المفاهيمي يعالج التصورات البديلة بإحداث عدم رضا عن الفكرة الخاطئة ثم تقديم مفهوم مقبول ومعقول ومفيد."},{"s":"أسئلة المعيار السابع","n":36,"q":"طلب معلم من الطلاب تصفح الدرس سريعاً، ثم إعادة قراءته بعمق وتحديد المصطلحات والمفاهيم الواردة فيه وتعريفها بأسلوب الطالب، وضرب أمثلة لها من الحياة الواقعية، ورسم مخطط يربطها بالأفكار الواردة في الدرس. ما المدخل التدريسي الذي اتبعه المعلم في الدرس السابق؟","o":["المعرفي","السلوكي","الاجتماعي","الشخصي"],"a":0,"f":"التصفح والقراءة العميقة وتعريف المفاهيم وربطها بمخطط تعتمد على معالجة المعلومات وتنظيمها ذهنياً، وهي سمات المدخل المعرفي."},{"s":"أسئلة المعيار السابع","n":37,"q":"عندما تحاول توجيه زملائك لاختيار طريقة التدريس الأنسب، يُفترض أن توضح لهم أن اختيار الطريقة يتم أولاً في ضوء:","o":["المادة الدراسية","أهداف الدرس","مستوى الطلاب","إمكانات المدرسة"],"a":1,"f":"الأهداف هي نقطة الانطلاق في التخطيط؛ تُختار الطريقة أولاً بما يحقق أهداف الدرس، ثم تراعى المادة ومستوى الطلاب والإمكانات."},{"s":"أسئلة المعيار السابع","n":38,"q":"أراد معلم تصنيف المعلومات والبيانات لاستبانة طبقت على طلاب مدرسة عددهم 1000 طالب، ومن ثم تحليلها والوصول إلى نتائج لتفسير الافتراضات التي وضعت إن أفضل برنامج يتعامل معه هو:","o":["Word","Visio","Excel","Access"],"a":2,"f":"برنامج Excel مخصص لتنظيم البيانات الكثيرة وتصنيفها وتحليلها إحصائياً ورسمها بيانياً، بينما Word للكتابة وVisio للمخططات."},{"s":"أسئلة المعيار السابع","n":39,"q":"صمم معلم اللغة العربية نشاطاً مسرحياً، كلّف فيه الطلاب بمهام تراعي الفروق الفردية بينهم، فأحمد يكتب نص مسرحية اجتماعية، وياسر يلعب دور البطل، وناصر يختار مجموعة الممثلين الثانويين، وسعيد يدرب الممثلين على الأداء الصوتي. حدد التوزيع الذي اتبعه المعلم وفقاً لنظرية الذكاءات المتعددة:","o":["اجتماعي - بصري - منطقي - لغوي","ذاتي - منطقي - حركي - اجتماعي","منطقي - اجتماعي - ذاتي - موسيقي","لغوي - حركي - اجتماعي - موسيقي"],"a":3,"f":"كتابة النص لغوي، وأداء دور البطل حركي، واختيار الممثلين اجتماعي، وتدريب الأداء الصوتي موسيقي؛ وهذا هو الترتيب في الخيار الصحيح."},{"s":"أسئلة المعيار السابع","n":40,"q":"أعد المعلم وحدة تعليمية صغيرة عن الضوء، فقسم الموضوعات إلى أجزاء متتالية، كل جزء مكتمل بذاته، وفي الوقت نفسه يعتمد على الجزء السابق ......... يُصنف النموذج السابق بأنه:","o":["تعلم تبادلي","تعليم مبرمج","موديول تعليمي","حقيبة تعليمية"],"a":2,"f":"الموديول التعليمي وحدة مصغرة مكتملة بذاتها ومتتابعة تعتمد على سابقتها، ويدرسها المتعلم ذاتياً، وهو يختلف عن الحقيبة الأوسع وسائط ومكونات."},{"s":"أسئلة المعيار السابع","n":41,"q":"يميز المعلم (وليد) الفروق الفردية بين طلابه الناجمة عن الخصائص العقلية والجسمية ويراعيها في تعليمهم، أي من إستراتيجيات التدريس الآتية تراعي الفروق الفردية الناجمة عن الخصائص العقلية؟","o":["المحاضرة","التعلم الذاتي","المناقشة والحوار","العروض التقديمية"],"a":1,"f":"التعلم الذاتي يتيح لكل طالب أن يتعلم وفق قدرته وسرعته، فيراعي الفروق العقلية، أما المحاضرة والعروض فتقدم للجميع بنمط واحد."},{"s":"أسئلة المعيار السابع","n":42,"q":"في درس التوصيلات الكهربائية للصف السادس الابتدائي، وضع المعلم الأدوات الآتية (سلك - بطارية - مصباح - قاطع)، وطلب من الطلاب استخدامها لإضاءة المصباح، المعلم هنا يطبق التعلم:","o":["حل المشكلة","المشاريع","الاستقراء","الاكتشاف"],"a":3,"f":"تزويد الطلاب بالأدوات ليتوصلوا بأنفسهم إلى طريقة إضاءة المصباح هو تعلم بالاكتشاف الموجه، إذ يكتشف الطالب العلاقة بنفسه."},{"s":"أسئلة المعيار السابع","n":43,"q":"درّس معلم موضوعاً من خلال تكليف الطلاب برسم خارطة ذهنية لموضوع الدرس على شكل مجموعات ثنائية، كيف تحكم على عمله بكونه تعلماً نشطاً أم لا؟","o":["تعلم نشط؛ لأن المعلم حدّد كيفية بناء الطلاب للخريطة الذهنية","ليس تعلماً نشطاً؛ لأنه قسم الطلاب إلى مجموعات ثنائية، ما يقلل من التفاعل","تعلم نشط؛ لأن الطلاب عملوا على الحصول على المعلومات وبنوا الخريطة","ليس تعلماً نشطاً؛ لأن الخريطة الناتجة هي محتوى الدرس الموجود في الكتاب"],"a":2,"f":"بناء الطلاب للخريطة الذهنية بأنفسهم بعد جمع المعلومات يعني مشاركة فاعلة وبناء للمعرفة، وهذا جوهر التعلم النشط، والعمل الثنائي يعزز التفاعل."},{"s":"أسئلة المعيار السابع","n":44,"q":"أراد معلم إثارة تفكير الطلاب؛ بحيث يتعرفون على المفهوم، ثم ينتقلون بعد ذلك إلى الأمثلة، هذا الأسلوب التدريسي يسمى:","o":["الحوارية","القياسية","الاكتشاف","حل المشكلات"],"a":1,"f":"عرض المفهوم أو القاعدة أولاً ثم الانتقال إلى الأمثلة هو الأسلوب القياسي (الاستنباطي) الذي يسير من العام إلى الخاص."},{"s":"أسئلة المعيار السابع","n":45,"q":"عندما تقدم معلمة اللغة الإنجليزية الأمثلة لتدريس المفهوم المبني للمجهول، ثم تستخرج الخصائص المشتركة بينها مع التناوب بين الأمثلة المنتمية وغير المنتمية للوصول أخيراً إلى القاعدة، فإنها تكون قد استخدمت طريقة:","o":["حل المشكلات","الاستقصائية","الاستنتاجية","الاستقرائية"],"a":3,"f":"البدء بالأمثلة ثم استخراج الخصائص المشتركة وصولاً إلى القاعدة هو الطريقة الاستقرائية التي تنتقل من الجزئيات إلى الكلي."},{"s":"أسئلة المعيار السابع","n":4,"q":"لا تسهب في الفكرة واختصر قدر الإمكان. ما القاعدة غير الصحيحة التي ذكرها المعلم؟","o":["1","2","3","4"],"a":0,"f":"السؤال غير مكتمل في نصه، والخيار المحدد هو الذي يعتمده مفتاح الإجابة؛ والعبارة المقتبسة تدعو إلى الإيجاز وعدم الإسهاب في عرض الفكرة."},{"s":"أسئلة المعيار السابع","n":47,"q":"(مازن) طالب بالمرحلة المتوسطة، ومن محبي مشاهدة كرة القدم، لكن قيمة المحافظة على الصلاة لديه متدنية، فكان والده يكافئه في كل مرة يؤدي الصلاة في المسجد بالسماح له بمشاهدة كرة القدم، هذا النوع من التعزيز يسمى:","o":["التعزيز المتقطع","التحصين المتدرج","مبدأ بريماك","التعزيز المتبادل"],"a":2,"f":"مبدأ بريماك يقضي بأن النشاط المحبب (مشاهدة الكرة) يعزز السلوك الأقل تفضيلاً (الصلاة في المسجد)، وهو قاعدة الجدة."},{"s":"أسئلة المعيار السابع","n":48,"q":"قام المعلم (عبد الله) أثناء تدريسه همزة الوصل والقطع بكتابة مجموعة من الكلمات؛ بعضها يحوي همزة وصل، وبعضها الآخر يحوي همزة قطع، ثم طلب من المتعلمين تصنيف الكلمات في مجموعتين ثم توصل معهم إلى تعريف محدد لكل مجموعة، وطالبهم بعد ذلك بأمثلة من عندهم تنتمي للمجموعة الأولى وأمثلة تنتمي للمجموعة الثانية. الاستراتيجية التي استخدمها المعلم هي:","o":["حل المشكلات","التدريس المباشر","الاكتشاف","المنظم المتقدم"],"a":2,"f":"عرض أمثلة وتصنيفها ثم استخلاص التعريف مع الطلاب وطلب أمثلة جديدة هو التعلم بالاكتشاف؛ فالتدريس المباشر يعرض القاعدة جاهزة."},{"s":"أسئلة المعيار السابع","n":49,"q":"تعد هذه الاستراتيجية واحدة من أكثر طرق التعلم التعاوني تطبيقاً؛ لعدم احتياجها إلى أدوات تنفيذية:","o":["استراتيجية PQ4R","فكر - زاوج - شارك","التدريس التأملي","جدولة التعلم"],"a":1,"f":"فكر - زاوج - شارك أبسط استراتيجيات التعلم التعاوني تطبيقاً، إذ لا تحتاج إلى أدوات؛ يفكر الطالب منفرداً ثم مع زميل ثم يشارك الصف."},{"s":"أسئلة المعيار السابع","n":50,"q":"يعكس مدى فهم الطالب لمضمون الدرس من خلال تحديد نقاط الصعوبة فيه، تعريف لـ:","o":["التلخيص","التوضيح","الاكتساب","التنبؤ"],"a":1,"f":"التوضيح من مهارات التدريس التبادلي ويعني تحديد النقاط الغامضة وصعبة الفهم في النص، وهو يعكس مدى فهم الطالب للمحتوى."},{"s":"أسئلة المعيار السابع","n":51,"q":"الحقائب التعليمية تعتبر:","o":["تعلماً نشطاً","تعلماً متمايزاً","تعلماً مباشراً","تفريد التعلم"],"a":3,"f":"الحقيبة التعليمية نظام تعلم ذاتي يتقدم فيه المتعلم وفق قدراته وسرعته، لذا تُعد من أساليب تفريد التعلم."},{"s":"أسئلة المعيار السابع","n":52,"q":"كل مما يلي له علاقة بإستراتيجيات التعلم النشط، ما عدا:","o":["التعلم التعاوني","التعلم الذهني","التعلم الفردي","التدريس المباشر"],"a":3,"f":"التدريس المباشر يعتمد على إلقاء المعلم ودور الطالب فيه متلقٍّ، فهو ليس من استراتيجيات التعلم النشط بخلاف التعاوني والذهني والفردي."},{"s":"أسئلة المعيار السابع","n":53,"q":"إذا أردت أن تدرس مفهوم (الذرة)، وواجهتك مشكلة ضيق وقت التدريس، فإن أنسب طريقة في هذه الحالة:","o":["أسلوب حل المشكلات","أسلوب التعليم المصغر","الأسلوب الاستنباطي","الأسلوب الاستقرائي"],"a":2,"f":"الأسلوب الاستنباطي يعرض المفهوم مباشرة ثم يطبقه، فيوفر الوقت، أما الاستقراء وحل المشكلات فيحتاجان إلى وقت أطول."},{"s":"أسئلة المعيار السابع","n":54,"q":"أي من استراتيجيات التعليم والتعلم التالية تعتمد على التفاعل وجهاً لوجه بين المعلم والطلاب؟","o":["المحاضرة","المناقشة","التعلم بالاكتشاف","التعلم التعاوني"],"a":1,"f":"المناقشة تقوم على حوار مباشر بين المعلم والطلاب وجهاً لوجه، بينما المحاضرة أحادية الاتجاه والتعاوني تفاعله بين الطلاب أنفسهم."},{"s":"أسئلة المعيار السابع","n":55,"q":"طلب معلم من طلابه إجراء تجربة معينة في المختبر؛ محدداً لهم مشكلة التجربة والأدوات المستخدمة وخطوات الحل، تاركاً لهم جمع البيانات والوصول إلى نتيجة. يعتبر ما قام به المعلم:","o":["اكتشافاً موجهاً","اكتشافاً شبه موجه","اكتشافاً حراً","استدلالاً"],"a":0,"f":"عندما يحدد المعلم المشكلة والأدوات والخطوات ويترك الاستنتاج للطلاب فهذا اكتشاف موجه؛ ولو ترك الخطوات للطلاب لكان شبه موجه."},{"s":"أسئلة المعيار السابع","n":56,"q":"الخطوة الأولى من خطوات هربارت هي:","o":["الربط","العرض","المقدمة","التطبيق"],"a":2,"f":"خطوات هربارت الخمس: المقدمة (التمهيد)، ثم العرض، ثم الربط (الموازنة)، ثم الاستنتاج (التعميم)، ثم التطبيق؛ فالأولى هي المقدمة."},{"s":"أسئلة المعيار السابع","n":57,"q":"طريقة التدريس التي تهتم بالجانب العملي:","o":["حل المشكلات","الاستنباط","الاستقراء","المناقشة"],"a":0,"f":"حل المشكلات يضع الطالب في مواقف عملية حقيقية يبحث فيها ويطبق ويجرب، فهو الأكثر اهتماماً بالجانب العملي."},{"s":"أسئلة المعيار السابع","n":58,"q":"يعتبر أحد أساليب التعلم الذاتي:","o":["الندوات","المحاضرة","التعلم المدمج","التعلم المبرمج"],"a":3,"f":"التعلم المبرمج يسير فيه المتعلم بمفرده وفق سرعته في خطوات صغيرة، فهو من أساليب التعلم الذاتي، بخلاف الندوات والمحاضرة."},{"s":"أسئلة المعيار السابع","n":59,"q":"يتكامل التدريس الصفي مع التعلم المقدم من خلال الحاسوب في استراتيجية:","o":["التدريس الخصوصي","المحاكاة والتقليد","التدريب والمران","حل المشكلات"],"a":2,"f":"في استراتيجية التدريب والمران يقدم المعلم المفهوم صفياً ثم يتدرب الطالب عليه بالحاسوب، فيتكامل التدريس الصفي مع التعلم بالحاسوب."},{"s":"أسئلة المعيار السابع","n":60,"q":"أفضل طريقة تدريس لموقف تدريسي يشتمل على معلومات كثيرة وعدد طلاب كبير هي:","o":["الاستجواب والمحاورة","المناقشة ومجموعات العمل","حل المشكلات","المحاضرة والإلقاء"],"a":3,"f":"المحاضرة والإلقاء هي الأنسب لنقل كم كبير من المعلومات لعدد كبير من الطلاب في وقت قصير، بينما المناقشة وحل المشكلات تحتاج وقتاً وعدداً أقل."},{"s":"أسئلة المعيار السابع","n":61,"q":"أي من طرق التعليم الآتية توفر فرصة للطالب للتعلم حسب سرعته وقدرته الخاصة؟","o":["التعلم التعاوني","العصف الذهني","الحوار والمناقشة","التعلم المبرمج"],"a":3,"f":"التعلم المبرمج يتيح للمتعلم السير وفق سرعته وقدرته الخاصة مع تغذية راجعة فورية، لذلك هو من أساليب التعلم الفردي."},{"s":"أسئلة المعيار السابع","n":62,"q":"خريطة المفاهيم التي تضع المفهوم في المنتصف ثم المفاهيم الأقل تجريداً بعدها تسمى خريطة:","o":["الحلقة","السلسلة","الهرم","النجمة"],"a":3,"f":"في خريطة النجمة يوضع المفهوم الرئيس في المركز وتتفرع حوله المفاهيم الأقل تجريداً، أما السلسلة فتسلسل خطي والهرمية من الأعم إلى الأخص."},{"s":"أسئلة المعيار السابع","n":63,"q":"عندما يرغب المعلم باستخدام التقنية لمشاهدة الطلاب الواجبات المطلوبة منهم والإجابة عنها في الموقع نفسه، وإمكانية إطلاعهم على بعض المساعدات لحل هذه الواجبات؛ فأي وسائل الاتصال تعينه في ذلك:","o":["Twitter","Classroom Organizer","Blog","Class Dojo"],"a":2,"f":"المدونة (Blog) تتيح نشر الواجبات والمصادر المساعدة وتعليق الطلاب وإجاباتهم في الموقع نفسه، بخلاف تويتر الذي يقتصر على رسائل قصيرة."},{"s":"أسئلة المعيار السابع","n":64,"q":"قدم المعلم لطلابه نشاطاً يشتمل على مجموعة مثلثات مختلفة الزوايا، وطلب منهم قياس الزوايا وإيجاد مجموعها وملاحظة النتائج، ومنه توصل الطلاب إلى حقيقة مجموع زوايا المثلث 180 درجة؛ عليه، فإن طريقة التدريس المطبقة هي:","o":["الاستنباط","الاستقراء","العرض العملي","حل المشكلات"],"a":1,"f":"قياس زوايا مثلثات عدة ثم التوصل إلى أن مجموعها ١٨٠ درجة انتقال من الجزئيات إلى القاعدة العامة، وهو الاستقراء."},{"s":"أسئلة المعيار السابع","n":65,"q":"استراتيجية PQ4R تساعد في تحسين:","o":["الفهم القرائي","التعبير","التأمل الذاتي","التفكير الإبداعي"],"a":0,"f":"PQ4R استراتيجية قرائية خطواتها: المعاينة، السؤال، القراءة، التأمل، التسميع، المراجعة، وتهدف إلى تحسين الفهم القرائي."},{"s":"أسئلة المعيار السابع","n":66,"q":"هو مدخل من أقدم مداخل التعلم وأكثرها شيوعاً وخصائصه تسير من القديم إلى الجديد ومن البسيط إلى المركب:","o":["المدخل الكشفي","المدخل المنطقي","المدخل التكاملي","المدخل التاريخي"],"a":3,"f":"المدخل التاريخي من أقدم المداخل ويسير من القديم إلى الحديث ومن البسيط إلى المركب، وفق التسلسل الزمني للأحداث."},{"s":"أسئلة المعيار السابع","n":67,"q":"الاستراتيجية التي تركز على كم الأفكار قبل نوعيتها هي:","o":["المناقشة الفعالة","العصف الذهني","التعلم بالاستكشاف","التفكير الناقد"],"a":1,"f":"العصف الذهني يركز على توليد أكبر عدد من الأفكار أولاً مع تأجيل التقويم والنقد إلى مرحلة لاحقة، فالكم قبل الكيف."},{"s":"أسئلة المعيار السابع","n":68,"q":"عندما يشرح المعلم درساً يقوم على المحادثة بين شخصين \"الأب والابن\"، فإن أفضل طريقة لشرح الدرس تعتمد على استراتيجية:","o":["لعب الأدوار","حل المشكلات","الخريطة الذهنية","العصف الذهني"],"a":0,"f":"درس قائم على محادثة بين الأب والابن يناسبه لعب الأدوار، إذ يمثل الطلاب الشخصيتين ويعيشان الموقف."},{"s":"أسئلة المعيار السابع","n":69,"q":"العالم (كلباترك) من رواد استراتيجية:","o":["المشروع","التعلم التعاوني","المناقشة","التعليم المتمايز"],"a":0,"f":"وليم كلباترك من رواد استراتيجية المشروع، وهو تلميذ جون ديوي، وقد نشر مقالته «طريقة المشروع» عام ١٩١٨."},{"s":"أسئلة المعيار السابع","n":70,"q":"المعلم (ناصر) يجري تجربة لغاز الهيدروجين في المعمل بنفسه؛ ويشاهد الطلاب ما يقوم به المعلم. تسمى هذه الاستراتيجية بـ:","o":["التجريب","الاكتشاف","التدريب","العرض"],"a":3,"f":"قيام المعلم بالتجربة بنفسه ومشاهدة الطلاب لها هو العرض العملي (التوضيحي)، أما التجريب فيجريه الطلاب أنفسهم."},{"s":"أسئلة المعيار السابع","n":71,"q":"طريقة التدريس التي تتبع الأمثلة والمقارنة بينها بغرض التوصل إلى تحديد القاعدة العامة أو التعريف هي:","o":["الطريقة الهربارتية","الطريقة الاستقرائية","الطريقة الاستنتاجية","الطريقة الاستجوابية"],"a":1,"f":"الطريقة الاستقرائية تنطلق من أمثلة تتم الموازنة بينها للوصول إلى القاعدة أو التعريف العام، عكس الاستنتاجية التي تبدأ بالقاعدة."},{"s":"أسئلة المعيار السابع","n":72,"q":"خطوات إجرائية منتظمة ومتسلسلة؛ بحيث تكون شاملة ومرنة ومراعية لطبيعة المتعلمين تسمى:","o":["استراتيجية التدريس","طريقة التدريس","أسلوب التدريس","نموذج التدريس"],"a":0,"f":"الاستراتيجية خطة منظمة متسلسلة شاملة ومرنة تراعي المتعلمين، أما الطريقة فأخص منها، والأسلوب أدنى منها وهو نمط المعلم الشخصي."},{"s":"أسئلة المعيار السابع","n":73,"q":"في نشاط العلوم، طرح المعلم مجموعة من الإرشادات والإجراءات لمساعدة طلابه في الوصول إلى نتيجة النشاط. استخدم المعلم نوعاً من أنواع الاكتشاف وهو:","o":["الموجه","الحر","الذهني","البسيط"],"a":0,"f":"تقديم المعلم إرشادات وإجراءات تساعد الطلاب على الوصول إلى النتيجة هو الاكتشاف الموجه، أما الحر فيترك فيه التوجيه للطالب."},{"s":"أسئلة المعيار السابع","n":74,"q":"موقع إلكتروني رُفعت عليه الدروس مسجلة بالصوت والصورة؛ ومدعمة ببريد إلكتروني يدخله الطلاب بكلمة مرور خاصة؛ ليتمكنوا من التفاعل مع المواد والتواصل مع المعلم. يُصنف هذا الموقع الإلكتروني بأنه:","o":["تعليم غير متزامن","تعلم غير متزامن","تعليم متزامن","تعلم متزامن"],"a":0,"f":"المحتوى المسجل الذي يدخله الطالب في الوقت الذي يناسبه يمثل تعليماً غير متزامن؛ والمصطلح هنا يخص الموقع (التعليم) لا عملية التعلم."},{"s":"أسئلة المعيار السابع","n":75,"q":"نموذج تعليمي يهتم باستخدام التقنية الحديثة؛ حيث يمكن للمعلم إعداد دروسه عن طريق مقاطع الفيديو ليطلع عليها طلابه في منازلهم باستخدام أجهزتهم قبل حضور الدرس الذي يخصص للمناقشات يسمى هذا الأسلوب أسلوب التعلم:","o":["المباشر","النشط","المقلوب","الذاتي"],"a":2,"f":"في التعلم المقلوب يشاهد الطالب الفيديو في المنزل ويخصص وقت الحصة للمناقشة والتطبيق، فيُقلب ترتيب الواجب والشرح."},{"s":"أسئلة المعيار السابع","n":76,"q":"ألغى المعلم تنبيهاً لطالب بعد مشاركته الفعّالة داخل غرفة الصف؛ مما أدى إلى زيادة حالات مشاركته الصفية. ما قام به المعلم يُعَدُّ مثالاً على:","o":["التعزيز الإيجابي","التعزيز السلبي","العقاب الإيجابي","العقاب السلبي"],"a":1,"f":"إزالة منبه مكروه (التنبيه) بعد السلوك المرغوب فزاد تكراره هي التعزيز السلبي؛ وهو ليس عقاباً لأن السلوك زاد."},{"s":"أسئلة المعيار السابع","n":77,"q":"تقسيم المادة التعليمية إلى وحدات صغيرة يدرسها المتعلم دراسة ذاتية متتابعة، يعتبر ذلك تعليماً:","o":["مبرمجاً","مدمجاً","متقناً","اكتشافياً"],"a":0,"f":"تجزئة المادة إلى وحدات صغيرة متتابعة يدرسها المتعلم ذاتياً هو التعليم المبرمج الذي طوره سكنر."},{"s":"أسئلة المعيار السابع","n":78,"q":"إذا كلّف المعلم بعض الطلاب بتمثيل موقف تاريخي أو اجتماعي يدرسونه، فهو تطبيق لاستراتيجية:","o":["لعب الأدوار","النمذجة","المحاكاة","التمثيل العلمي"],"a":0,"f":"تكليف الطلاب بتمثيل موقف تاريخي أو اجتماعي يدرسونه هو لعب الأدوار، وفيه يؤدي المتعلم دور شخصية في موقف معين."},{"s":"أسئلة المعيار السابع","n":79,"q":"طلاب المعلم (راشد) مستوياتهم المعرفية والمهارية مختلفة، ولكن جميعهم يدرسون المهارات نفسها؛ لذلك فهو يختار استراتيجية تناسب مستويات الطلاب الحقيقية وهي استراتيجية:","o":["التعلم بالاكتشاف","التعلم التعاوني","الأنشطة المتدرجة","حل المشكلات"],"a":2,"f":"الأنشطة المتدرجة تقدم المهارة نفسها بمستويات صعوبة متفاوتة تناسب المستوى الحقيقي لكل طالب، وهي من أدوات التعليم المتمايز."},{"s":"أسئلة المعيار السابع","n":80,"q":"التعليم المبرمج من مداخل السلوك:","o":["الشبكي","البنائي","التقني","الحديث"],"a":2,"f":"التعليم المبرمج مبني على النظرية السلوكية (المثير والاستجابة والتعزيز)، ويندرج ضمن المدخل التقني في التدريس."},{"s":"أسئلة المعيار السابع","n":81,"q":"التوجه الحديث في طرق التعليم الذي يكون فيه تكييف المحتوى والطرق حتى تستجيب للفروق الفردية بين الطلاب هو:","o":["التعليم التبادلي","تدريس الأقران","التعليم الإلكتروني","التعليم المتمايز"],"a":3,"f":"التعليم المتمايز توجه حديث يكيّف المحتوى والعمليات والنواتج بما يلائم الفروق الفردية بين الطلاب، وهذا تعريفه."},{"s":"أسئلة المعيار السابع","n":82,"q":"في صف دراسي تتباين فيه قدرات الطلاب؛ أنسب وأفضل أسلوب لتدريس طلاب هذا الصف هو:","o":["المناقشة","المحاضرة","تفريد التعليم","التعلم التعاوني"],"a":2,"f":"تفريد التعليم يراعي تباين القدرات بجعل كل طالب يتعلم وفق قدرته وسرعته، فهو أنسب للصف المتباين، بينما المحاضرة تقدم للجميع بنمط واحد."},{"s":"أسئلة المعيار السابع","n":83,"q":"يبدأ المعلم (خالد) دروسه بتهيئة يشجع فيها طلابه على تكوين روابط بين مفاهيم الدروس، ويُجزئ المعلم (زيد) المادة التدريسية إلى وحدات متدرجة، ويركز المعلم (عمر) على الملاحظة في دروسه لتحقيق الأهداف المرغوبة. أما المعلم (محمد)، فيركز على تقويم الطلاب لأدائهم بأنفسهم بعد الانتهاء من المهمات التعليمية. المعلم الذي يطبق مبادئ المدخل الاجتماعي في تدريسه هو:","o":["زيد","عمر","خالد","محمد"],"a":1,"f":"التركيز على الملاحظة يرتبط بنظرية التعلم الاجتماعي لباندورا (التعلم بالملاحظة والنمذجة)، فصاحبها هو عمر؛ أما خالد فمعرفي وزيد سلوكي ومحمد شخصي."},{"s":"أسئلة المعيار السابع","n":84,"q":"قام معلم الدراسات الإسلامية بعرض عدة أحاديث عن الجار لطلابه، ثم طلب منهم القاعدة العامة المشتركة بين هذه الأحاديث. ما قام به المعلم هو:","o":["القياس","الاستقراء","الاكتشاف","التعلم الموجه"],"a":1,"f":"عرض أحاديث جزئية متعددة ثم استخلاص القاعدة العامة المشتركة بينها هو الاستقراء، وهو الانتقال من الجزء إلى الكل."},{"s":"أسئلة المعيار السابع","n":85,"q":"قام معلم الدراسات الإسلامية بعرض عدة أحاديث عن بر الوالدين لطلابه، ثم استنتج معهم القاعدة الكبرى للإحسان إليهما. هذا الأسلوب يمثل:","o":["القياس","الاستقراء","الاكتشاف","التعلم الموجه"],"a":1,"f":"عرض أحاديث عدة عن بر الوالدين ثم استنتاج القاعدة العامة منها هو الأسلوب الاستقرائي من الجزئي إلى الكلي."},{"s":"أسئلة المعيار السابع","n":86,"q":"كلّف المعلم طلابه بنشاط تعليمي يتطلب ضمن مراحله توليد تخمينات ذكية لتحقيق أهداف الدرس. طبق المعلم في موقفه السابق استراتيجية:","o":["حل المشكلات","التعلم الإتقاني","التعلم بالاكتشاف","الذكاءات المتعددة"],"a":0,"f":"توليد التخمينات (الفرضيات) الذكية مرحلة من مراحل حل المشكلات، إذ تتبع تحديد المشكلة ثم تجريب الفرضيات وتقويم الحل."},{"s":"أسئلة المعيار السابع","n":87,"q":"شرح المعلم الدرس وفق مراحل التدريس الآتية: (مرحلة الاكتشاف - مرحلة تقديم المفهوم - مرحلة تطبيق المفهوم). وهذه المراحل هي خطوات التدريس وفق استراتيجية:","o":["دورة التعلم","الاستقصاء","الاستنتاج","الاستقراء"],"a":0,"f":"الاكتشاف ثم تقديم المفهوم ثم تطبيقه هي المراحل الثلاث لدورة التعلم (الاستكشاف، الإبداع، التوسع) المستندة إلى نظرية بياجيه."},{"s":"أسئلة المعيار السابع","n":88,"q":"يُعتبر التعزيز:","o":["تقويماً للسلوك","مقياساً للسلوك","اكتساباً للسلوك","تشخيصاً للسلوك"],"a":2,"f":"التعزيز في النظرية السلوكية وسيلة لاكتساب السلوك وتقويته وزيادة احتمال تكراره، فهو ليس مجرد قياس أو تشخيص للسلوك."},{"s":"أسئلة المعيار السابع","n":89,"q":"تعتبر استراتيجية (المشروعات) من استراتيجيات التعلم القائمة على النظرية:","o":["السلوكية","الاجتماعية","البنائية","الجشتالتية"],"a":2,"f":"استراتيجية المشروعات تقوم على نشاط المتعلم وبنائه المعرفة بنفسه في مواقف حقيقية، وهذا من أسس النظرية البنائية."},{"s":"أسئلة المعيار السابع","n":90,"q":"أراد المعلم (حمد) تنمية التفكير لدى طلابه في مادة العلوم؛ فقسم طلابه إلى أربع مجموعات، وكلّف المجموعة الأولى بالبحث عن أفكار ومقترحات جديدة، والثانية بتقديم ملاحظات ونقد، والثالثة بتقديم الحقائق والمعلومات، والرابعة بالتعبير عن مشاعرهم. استخدم المعلم استراتيجية القبعات الست على النحو التالي:","o":["أبيض - أسود - أحمر - أصفر","أزرق - أبيض - أخضر - أحمر","أخضر - أسود - أبيض - أحمر","أصفر - أحمر - أسود - أبيض"],"a":2,"f":"الأخضر للأفكار الجديدة، والأسود للنقد والحذر، والأبيض للحقائق والمعلومات، والأحمر للمشاعر، وهذا ما يطابق الخيار الثالث."},{"s":"أسئلة المعيار السابع","n":91,"q":"طريقة من طرق التدريس، من أبرز مزاياها أنها تختصر الوقت في شرح المفهوم اللغوي وتوصيله للطلاب؛ هذه الطريقة هي:","o":["المعدلة","القياسية","الحوارية","الاستقرائية"],"a":1,"f":"الطريقة القياسية تبدأ بالقاعدة ثم تطبقها بالأمثلة، فتوفر الوقت في شرح المفهوم اللغوي، بخلاف الاستقرائية الأطول زمناً."},{"s":"أسئلة المعيار السابع","n":92,"q":"أي من مجموعات التعلم التالية يُفضّل استخدامها عند تطبيق استراتيجية (حل المشكلات)؟","o":["المجموعات الأساسية","المجموعات غير الرسمية","المجموعات المترابطة","المجموعات الممثلة"],"a":3,"f":"المجموعات الممثلة (التي يمثل أعضاؤها وجهات نظر أو أدواراً متنوعة) يُفضل استخدامها في حل المشكلات لتنوع الرؤى والمهام."},{"s":"أسئلة المعيار السابع","n":93,"q":"عندما يقوم المعلم والطلاب بطرح الأسئلة على طالب معين بهدف تنمية مهارات عديدة من أهمها بناء الأسئلة وتبادل الأفكار والقراءة، فإن هذه الاستراتيجية تُعرف بـ:","o":["العمل الجماعي","أعواد المثلجات","الكرسي الساخن","التدريس التبادلي"],"a":2,"f":"الكرسي الساخن يجلس فيه طالب في موقع الحوار وتطرح عليه الأسئلة من المعلم والزملاء، فتنمو مهارات السؤال وتبادل الأفكار."},{"s":"أسئلة المعيار السابع","n":94,"q":"في أحد المواقف التعليمية، بدأ المعلم الحديث عن ظاهرة طبيعية، ثم كلّف الطلاب بالعمل على تنظيم المعطيات ووضع التفسيرات، ثم تحديد أساليب ضبط هذه الظاهرة. إن طريقة التعليم التي يستخدمها المعلم هنا هي:","o":["طريقة النقاش","الطريقة الاستقرائية","طريقة حل المشكلة","طريقة الأسئلة الصفية"],"a":2,"f":"البدء بظاهرة ثم تنظيم المعطيات ووضع التفسيرات وتحديد أساليب الضبط تعكس خطوات حل المشكلة العلمية."},{"s":"أسئلة المعيار السابع","n":95,"q":"أي مما يأتي ليس من المداخل العامة للتدريس؟","o":["البيني","الفلسفي","التاريخي","التكنولوجي"],"a":1,"f":"المداخل العامة للتدريس تشمل البيني والتاريخي والتكنولوجي وغيرها، أما الفلسفي فليس من المداخل العامة المعتمدة."},{"s":"أسئلة المعيار السابع","n":96,"q":"معلم للصفوف الأولية أعطى طلابه في الصف علبة للألوان، فتشاجر الطلاب على هذه العلبة، فقرر سحبها منهم. الإجراء الذي قام به المعلم لتعديل سلوكهم هو:","o":["عقاب إيجابي","عقاب سلبي","تعزيز إيجابي","تعزيز سلبي"],"a":1,"f":"سحب علبة الألوان (مثير مرغوب) بعد سلوك غير مرغوب هو عقاب سلبي، لأنه إزالة شيء محبب بقصد إضعاف السلوك."},{"s":"أسئلة المعيار السابع","n":97,"q":"استراتيجية تُستخدم في تدريس الرياضيات والعلوم:","o":["دورة التعلم","التغير المفاهيمي","التمركز حول المشكلة","التعليم التعاوني"],"a":2,"f":"استراتيجية التمركز حول المشكلة تُستخدم في تدريس الرياضيات والعلوم لأنها تقوم على مواجهة الطلاب بمشكلات يبحثون لها عن حلول."},{"s":"أسئلة المعيار السابع","n":98,"q":"صمم المعلم (عبد الرحمن) تمهيداً مشوقاً لدرس الفضاء، فاختار تقنية تعليم تعرض فرضية وجود حياة كاملة على كوكب المريخ تشبه حياتنا، ما هذه التقنية؟","o":["مؤتمر مرئي","مقطع يوتيوب","شرائح تعليمية","كت
