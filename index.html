رجات مختلفة عن غيره بغض النظر عمن يصححه","لا علاقة للدرجات بالاختبارات الموضوعية"],"a":0,"f":"الاختبار الموضوعي يعطي الدرجة نفسها مهما اختلف المصحح، لأن تصحيحه لا يتأثر بالحكم الذاتي."},{"s":"أسئلة المعيار العاشر","n":6,"q":"أي من الإجراءات التالية تعكس الوظيفة التعليمية للاختبار؟","o":["إعلان نتيجة الاختبار للطلاب","التواصل مع أولياء الأمور لإخبارهم بنتيجة الاختبار","تشخيص جوانب الضعف والقوة عند الطلاب","إبلاغ إدارة المدرسة بنتيجة الاختبار"],"a":2,"f":"الوظيفة التعليمية للاختبار هي تشخيص نقاط القوة والضعف لتحسين التعلم، أما إعلان النتائج وإبلاغ الأطراف فوظائف إدارية."},{"s":"أسئلة المعيار العاشر","n":7,"q":"أي المجموعات الآتية تشتمل على اختبارات أدائية فقط؟","o":["كتابة رسالة شكر، ذكر الحدود الجغرافية للدولة، تصميم نموذج بناء","إلقاء قصيدة شعرية، تشغيل جهاز في المعمل، تطبيق الإسعافات الأولية","تعريف الجهاز الهضمي، رسم خارطة المملكة، تصوير مناظر طبيعية","تصميم خارطة مفاهيم، ترجمة قطعة أدبية، تسميع قصيدة من الشعر"],"a":1,"f":"الإلقاء وتشغيل الجهاز والإسعافات الأولية كلها أداء عملي مباشر، أما المجموعات الأخرى فتخلط بين مهارات معرفية وكتابية وأدائية."},{"s":"أسئلة المعيار العاشر","n":8,"q":"الغرض الأساسي من الاختبار الصفي الذي يُعده المعلم هو:","o":["استثارة قدرات الطلاب على تطبيق المعارف والمهارات بطرق جديدة","توفير معلومات حول القدرات العامة للطلاب ومستوى تحصيلهم الحالي","بيان الفروق بين الطلاب فيما يخص المهارات والمعارف","معرفة جوانب القوة عند الطلاب واحتياجاتهم في ضوء الأهداف التدريسية"],"a":1,"f":"الغرض الأساسي من الاختبار الصفي هو توفير معلومات عن القدرات العامة للطلاب ومستوى تحصيلهم الحالي لدعم قرارات المعلم."},{"s":"أسئلة المعيار العاشر","n":9,"q":"الطريقة الوحيدة من طرق الثبات التي يمكن أن تطابق إجراءاتها تعريف مفهوم ثبات الاختبار هي طريقة:","o":["إعادة الاختبار","معاملات الاتساق الداخلي","الصور المتكافئة","التجزئة النصفية"],"a":0,"f":"الثبات هو اتساق الدرجات عند إعادة تطبيق الاختبار نفسه على المجموعة نفسها، وهذا ما تطابقه طريقة إعادة الاختبار تماماً."},{"s":"أسئلة المعيار العاشر","n":10,"q":"الدخول في خصوصية كل فقرة اختبارية من الفقرات المكونة للاختبار، هو الهدف الأساسي لـ:","o":["ثبات الاختبار","تحليل فقرات الاختبار","صدق الاختبار","تجميع فقرات الاختبار"],"a":2,"f":"⚠ الدخول في خصوصية كل فقرة هو هدف تحليل الفقرات (صعوبة وتمييز)، ويُرجّح أن تكون الإجابة تحليل فقرات الاختبار لا الصدق."},{"s":"أسئلة المعيار العاشر","n":11,"q":"إذا كان لديّ طالب متميز في أدائه التحصيلي، فإني:","o":["أضع له برنامجاً إضافياً خاصاً","أجعله يسير مع مستوى الصف","أكلفه بمساعدتي في الأعمال الكتابية والروتينية","أطلب منه ألا يثير أسئلة أعلى من مستوى الصف حفاظاً على وقت الحصة"],"a":0,"f":"الطالب المتميز يحتاج إلى برنامج إثرائي خاص ينمي قدراته، لا إبقاءه مع مستوى الصف أو إشغاله بأعمال روتينية."},{"s":"أسئلة المعيار العاشر","n":12,"q":"أهم معايير اختيارك لاختبار تحصيلي هو الاهتمام أولاً:","o":["بصدق الاختبار وثباته وموضوعيته","سهولة وضعه وتصحيحه وقلة تكلفته","سهولة تطبيقه وفهمه","وجود معايير له"],"a":0,"f":"أهم معايير اختيار الاختبار التحصيلي هي الخصائص السيكومترية: الصدق والثبات والموضوعية، قبل السهولة والتكلفة."},{"s":"أسئلة المعيار العاشر","n":13,"q":"عندما أريد تطبيق اختبار، فإنني أراعي ما يلي:","o":["عدم السماح للطلاب بطرح أسئلة واستفسارات خلال التطبيق","ألا يكون هناك وقت محدد للتطبيق","تضمينه تعليمات دقيقة وواضحة","أن يتوافر مراقب واحد لكل 5 طلاب"],"a":2,"f":"عند تطبيق الاختبار يجب أن تكون التعليمات دقيقة وواضحة حتى يفهم الطلاب المطلوب، ويكون للاختبار وقت محدد ويسمح بالاستفسار."},{"s":"أسئلة المعيار العاشر","n":14,"q":"قدرة المتعلم على توليد أفكار جديدة ومتنوعة تعني امتلاكه لعنصر:","o":["الطلاقة","الأصالة","المرونة","التنبؤ"],"a":0,"f":"الطلاقة هي القدرة على توليد أكبر عدد من الأفكار، أما الأصالة فالجدة والتفرد، والمرونة تنوع الأفكار وتغير زوايا التفكير."},{"s":"أسئلة المعيار العاشر","n":15,"q":"تُستخدم لأغراض محددة ولغايات العلاج والتحسين في نوعية الطلاب:","o":["الامتحانات المفتوحة","الاختبارات الأدائية","قوائم الرصد","الاختبارات التشخيصية"],"a":0,"f":"⚠ العلاج والتحسين يرتبطان عادةً بالاختبارات التشخيصية التي تكشف مواطن الضعف؛ وإجابة الامتحانات المفتوحة تبدو غير دقيقة."},{"s":"أسئلة المعيار العاشر","n":16,"q":"من طرق تنمية مهارة طرح الأسئلة عند الطلاب ما يلي:","o":["استجابة المعلمين لأسئلة الطلبة بعمق واهتمام وبطريقة ودية","مساعدة المعلمين للطلبة في صياغة الأسئلة","تيقن المعلم من شعور الطلاب بأن الأسئلة تعكس رغبتهم في العلم","جميع ما ذكر"],"a":3,"f":"تنمية مهارة السؤال عند الطلاب تتحقق بجميع ما ذُكر: الاستجابة العميقة والودية والمساعدة في صياغة الأسئلة وتقدير رغبتهم في العلم."},{"s":"أسئلة المعيار العاشر","n":17,"q":"معلم لغة إنجليزية طلب من طلابه أن يعطوا مرادفات لكلمة، هذا يقيس:","o":["الأصالة","الطلاقة","المرونة","لا شيء مما سبق"],"a":1,"f":"طلب عدة مرادفات للكلمة يقيس الطلاقة، أي كمّ الاستجابات المتولدة، لا أصالتها ولا تنوع فئاتها (المرونة)."},{"s":"أسئلة المعيار العاشر","n":18,"q":"تقويم يعقبه نوع من القرارات الحاسمة التي قد تؤدي للاستمرار في العمل أو الانصراف عنه تماماً:","o":["التكويني","النهائي","التتبعي","القبلي"],"a":2,"f":"⚠ التقويم التتبعي يعقب انتهاء العمل ويرتبط بقرار الاستمرار أو التوقف؛ وقد يُرجَّح التقويم النهائي أيضاً، فالمفتاح محل نظر."},{"s":"أسئلة المعيار العاشر","n":19,"q":"تم حساب معامل الارتباط بين درجات الطلاب في اختبارين لمادتين مختلفتين فكان يساوي (0.8)، وهذا يعني:","o":["نجاح 80% من الطلاب في الاختبارين","أن هناك علاقة قوية بين المادتين","أن الاختبارين يتميزان بالصدق والثبات","أن الاختبارين يتميزان بالسهولة الشديدة"],"a":1,"f":"معامل الارتباط 0.8 قيمة مرتفعة تدل على علاقة طردية قوية بين درجات المادتين، ولا يدل على نسبة النجاح أو الصدق والثبات."},{"s":"أسئلة المعيار العاشر","n":20,"q":"تردد أحد المعلمين في اختيار أسلوب التقويم الأنسب لتقويم أداء طلابه في مهارة التحليل، فأي الأساليب التالية تكون أنسب لتقويم المهارة التي حددها:","o":["زيادة عدد فقرات الاختبار من متعدد في الاختبار","وضع الفراغ في نهاية الفقرة ليستطيع فهم السؤال","إضافة سؤال مقالي مفتوح في نهاية الاختبار","وضع فقرات الصواب والخطأ بالتناوب في ورقة الاختبار"],"a":2,"f":"مهارة التحليل من المستويات العليا، ولا يقيسها الاختيار من متعدد أو الصواب والخطأ جيداً، بل السؤال المقالي المفتوح الذي يتيح للطالب تفكيك الموضوع وتفسيره."},{"s":"أسئلة المعيار العاشر","n":21,"q":"أي الآتي ليس من طرق حساب الثبات:","o":["إعادة التطبيق","حساب المتوسطات","الصور المتكافئة","التجزئة النصفية"],"a":1,"f":"طرق حساب الثبات هي إعادة التطبيق والصور المتكافئة والتجزئة النصفية والاتساق الداخلي، أما حساب المتوسطات فمقياس للنزعة المركزية وليس طريقة للثبات."},{"s":"أسئلة المعيار العاشر","n":22,"q":"المقياس الإحصائي الذي يشير إلى معدل درجات الطلاب هو:","o":["الانحراف المعياري","الوسيط","المتوسط الحسابي","الدرجة المعيارية"],"a":2,"f":"المتوسط الحسابي (مجموع الدرجات ÷ عددها) هو مقياس النزعة المركزية الذي يعبّر عن معدل درجات الطلاب، بينما الانحراف المعياري يقيس التشتت."},{"s":"أسئلة المعيار العاشر","n":23,"q":"المقياس الإحصائي الذي يشير إلى درجة تشتت درجات الطلاب هو:","o":["المتوسط الحسابي","الدرجة المعيارية","الوسيط","الانحراف المعياري"],"a":3,"f":"الانحراف المعياري مقياس للتشتت يبيّن مدى تباعد الدرجات عن متوسطها، أما المتوسط والوسيط فمن مقاييس النزعة المركزية."},{"s":"أسئلة المعيار العاشر","n":24,"q":"أفضل معامل صعوبة لسؤال في اختبار تحصيلي هو:","o":["10%","50%","35%","90%"],"a":1,"f":"أفضل معامل صعوبة للفقرة قريب من ٥٠٪ لأنه يحقق أعلى قدر من التمييز بين الطلاب، أما ١٠٪ أو ٩٠٪ فتجعل الفقرة صعبة أو سهلة جداً فيضعف تمييزها."},{"s":"أسئلة المعيار العاشر","n":25,"q":"أشارت بعض الدراسات إلى ارتفاع ارتباط درجات خريجي الثانوية العامة في اختبار القدرات العامة بدرجاتهم على مستوى المعدل التراكمي في السنة الثانية بالجامعة، يُعرف هذا بالصدق:","o":["الظاهري","التنبؤي","التلازمي","المفاهيمي"],"a":1,"f":"الصدق التنبؤي يقيس قدرة درجات اختبار اليوم على التنبؤ بأداء لاحق (المعدل التراكمي بعد سنتين)، بخلاف التلازمي الذي يقارن بمحك متزامن في الوقت نفسه."},{"s":"أسئلة المعيار العاشر","n":26,"q":"العملية التي يقوم فيها الطالب بمراجعة أدائه بعد الانتهاء منه في ضوء الأهداف المحددة والمعايير السابقة هو نوع من أنواع التقويم هو التقويم:","o":["التكويني","الختامي","التشخيصي","الذاتي"],"a":3,"f":"التقويم الذاتي يقوم فيه الطالب بمراجعة أدائه وإصدار حكم عليه في ضوء الأهداف والمعايير المحددة مسبقاً، فهو المسؤول عن التقويم لا المعلم."},{"s":"أسئلة المعيار العاشر","n":27,"q":"الاختبار الذي يوجد فيه أقل درجة تخمين هو:","o":["الاختيار من متعدد","التكميل","الصواب والخطأ","المزاوجة"],"a":1,"f":"أسئلة التكميل تتطلب أن يكتب الطالب الإجابة بنفسه، فتقل فيها فرصة التخمين، بينما تكون نسبة التخمين مرتفعة في الصواب والخطأ (٥٠٪) والاختيار من متعدد."},{"s":"أسئلة المعيار العاشر","n":28,"q":"الحصول على المعلومات والبيانات الكمية يطلق على:","o":["القياس","التقويم","القياس والتقويم","لا شيء مما سبق"],"a":0,"f":"القياس هو عملية جمع المعلومات والبيانات بصورة كمية (رقمية)، أما التقويم فيتجاوزه إلى إصدار حكم على هذه البيانات."},{"s":"أسئلة المعيار العاشر","n":29,"q":"الشرح من أنواع الأسئلة المقالية:","o":["المحدودة","المقيدة","غير المحدودة","الإثرائية"],"a":2,"f":"الأسئلة المقالية نوعان: مقيدة (محدودة الإجابة) وغير محدودة (مفتوحة)، ويندرج الشرح تحت غير المحدودة لأنه يترك للطالب حرية التوسع في الإجابة."},{"s":"أسئلة المعيار العاشر","n":30,"q":"من عيوب الأسئلة المقالية:","o":["ارتفاع مستوى التخمين","سهولة الغش","صعوبة إعدادها","الذاتية"],"a":2,"f":"من عيوب الأسئلة المقالية صعوبة تصحيحها وذاتية المصحح وضعف الشمول، وتبقى الذاتية العيب الأبرز؛ ولو كان الخيار «صعوبة التصحيح» لكان أدق، أما التخمين والغش فيقلان فيها."},{"s":"أسئلة المعيار العاشر","n":31,"q":"تعتبر ......... من أدوات التقويم:","o":["الاختبارات","التغذية الراجعة","قوائم الرصد","و","صحيحتان"],"a":3,"f":"الاختبارات والتغذية الراجعة وقوائم الرصد كلها من أدوات التقويم، فالخياران المذكوران في الرقمين الأخيرين من القائمة هما الصحيحان معاً بحسب صيغة السؤال."},{"s":"أسئلة المعيار العاشر","n":32,"q":"الفعاليات التي تندرج تحت استراتيجية التواصل:","o":["التقويم","الأسئلة والأجوبة","التحليل","التركيب"],"a":1,"f":"استراتيجية التواصل تعتمد على التفاعل اللفظي بين المعلم والطالب كالأسئلة والأجوبة والمقابلات والمناقشات، بينما التحليل والتركيب مستويات معرفية."},{"s":"أسئلة المعيار العاشر","n":33,"q":"لتحقيق صدق المحتوى للاختبار، فإنني:","o":["أعدها وفق جدول المواصفات","آخذ المحتوى مباشرة من خبرات المعلمين","آخذ المحتوى مباشرة من خبرات التلاميذ","أربط نتائج الاختبارات مع نتائج اختبار آخر"],"a":0,"f":"صدق المحتوى يتحقق ببناء الاختبار وفق جدول المواصفات الذي يوزع الأسئلة على موضوعات المحتوى والأهداف بنسب تمثلها تمثيلاً صحيحاً."},{"s":"أسئلة المعيار العاشر","n":34,"q":"يكون الاختبار صادقاً إذا:","o":["قاس ما وُضع لقياسه","كانت درجات الطلبة مرتفعة","كانت النتائج مستقرة بتكرار المقياس","حصل الطالب على نفس الدرجة مهما اختلف المصححون"],"a":0,"f":"الاختبار الصادق هو الذي يقيس ما وُضع لقياسه فعلاً؛ أما استقرار النتائج فهو الثبات، وعدم تأثر الدرجة باختلاف المصححين هو الموضوعية."},{"s":"أسئلة المعيار العاشر","n":35,"q":"أي أنواع الصدق الآتية يناسب بدرجة كبيرة الاختبارات التحصيلية:","o":["المحتوى","المحك","التلازمي","التنبؤي"],"a":0,"f":"الاختبارات التحصيلية تقيس مدى إتقان محتوى دراسي محدد، لذا يناسبها صدق المحتوى الذي يتحقق من تمثيل الأسئلة للمقرر وأهدافه."},{"s":"أسئلة المعيار العاشر","n":36,"q":"قامت مجموعة من المعلمين بتصحيح اختبار فاختلفت الدرجة التي حصل عليها الطالب من معلم إلى آخر، أي من الإجراءات التالية يمكن أن تراجعها إذا طُلب منك ضبط هذا الاختبار؟","o":["الصدق","الثبات","الموضوعية","جميع ما ذكر"],"a":1,"f":"⚠ اختلاف الدرجة باختلاف المصحح يدل على ضعف الموضوعية لا الثبات، فالموضوعية هي استقلال العلامة عن شخص المصحح، وهي الأنسب هنا."},{"s":"أسئلة المعيار العاشر","n":37,"q":"إن أفضل وسيلة تقويم مناسبة للتعرف على الخصائص الانفعالية للطلاب هي:","o":["المقابلات","الاختبارات","الاستبانات","قوائم الشطب"],"a":0,"f":"المقابلة أنسب وسيلة للكشف عن المشاعر والاتجاهات والخصائص الانفعالية لأنها تتيح الحوار المباشر وملاحظة تعبيرات الطالب، بخلاف الاختبارات التحصيلية."},{"s":"أسئلة المعيار العاشر","n":38,"q":"صحح مجموعة من المعلمين أوراق اختبار تحصيلي لمقرر معين في أحد صفوف المرحلة المتوسطة، فظهر تباين في درجات الطلاب. ما الإجراء الذي يمكن القيام به وفقاً لهذا التباين؟","o":["إعادة التصحيح من قبل مجموعة معلمين آخرين","تقديم تغذية راجعة فورية للمعلمين لمراجعة طرق التدريس المستخدمة","استخدام هذه الدرجات كتغذية راجعة لتحسين عمليتي التعلم والتعليم","تحليل درجات الطلاب واستخلاص مؤشرات عن مستوياتهم التحصيلية"],"a":1,"f":"تباين الدرجات يُستثمر في تقديم تغذية راجعة للمعلمين لمراجعة طرق التدريس وتحسينها، فالتباين مؤشر على أثر التدريس لا على خلل في التصحيح فقط."},{"s":"أسئلة المعيار العاشر","n":39,"q":"صفة أساسية من صفات أداة التقويم الجيدة عليها تتوقف دقة نتائج الاختبار وخلوها من الخطأ، وترتبط بعدم توقف علامة الطالب على من يصحح ورقته، تلك الصفة تُعرف بـ:","o":["الموضوعية","الثبات","الصدق","الشمول"],"a":0,"f":"الموضوعية هي ألا تتوقف علامة الطالب على من يصحح ورقته، فتكون الدرجة واحدة مهما تعدد المصححون، وبها تخلو النتائج من الخطأ الذاتي."},{"s":"أسئلة المعيار العاشر","n":40,"q":"ينبغي على المعلم أن يتخذ مجموعة من القرارات قبل إعداد أي اختبار. ما العامل الأساسي الذي يجب أخذه بعين الاعتبار عند اتخاذ القرار المتعلق بمستوى صعوبة فقرات الاختبار؟","o":["الغرض من الاختبار","الوقت المتاح للاختبار","المستوى الدراسي للطلاب","قدرات الطلاب واستعداداتهم"],"a":0,"f":"مستوى صعوبة الفقرات يتحدد أساساً بالغرض من الاختبار؛ فاختبار الانتقاء أو القبول يختلف في صعوبته عن الاختبار التشخيصي أو التكويني."},{"s":"أسئلة المعيار العاشر","n":41,"q":"إذا أراد معلم تقويم امتلاك طلابه لمهارات التلاوة والتجويد للقرآن الكريم، فإن الأداة الأكثر دقة التي يمكن استخدامها هي:","o":["سلم التقدير","الاختبار الكتابي","السجل القصصي","سجل وصف التعلم"],"a":0,"f":"مهارات التلاوة والتجويد أدائية، وأدق أداة لتقويمها سلم التقدير الذي يحدد مستويات الإتقان لكل جانب أثناء ملاحظة الطالب، بينما لا يقيسها الاختبار الكتابي."},{"s":"أسئلة المعيار العاشر","n":42,"q":"أي مما يلي ليس من طرق حساب ثبات الاختبار؟","o":["التجزئة النصفية","إعادة الاختبار","الصور المتكافئة","الاتساق الداخلي (أو الصدق المرتبط بمحك)"],"a":3,"f":"الصدق المرتبط بمحك نوع من الصدق وليس طريقة للثبات؛ أما التجزئة النصفية وإعادة الاختبار والصور المتكافئة فكلها طرق ثبات."},{"s":"أسئلة المعيار العاشر","n":43,"q":"يؤكد المشرف التربوي للأستاذ (خالد) على أهمية تزويد الطلاب بتغذية راجعة حول مستوى تقدمهم في إتقان المهارات والمفاهيم أثناء تعلم الوحدة الدراسية. أي أنواع التقويم الآتية يساعد على تقديم التغذية الراجعة المطلوبة؟","o":["التشخيصي","التكويني","النهائي","القبلي"],"a":1,"f":"التقويم التكويني (البنائي) يجري أثناء التعلم ويزوّد الطالب بتغذية راجعة مستمرة عن تقدمه في إتقان المهارات والمفاهيم، بخلاف النهائي الذي يأتي بعد التعلم."},{"s":"أسئلة المعيار العاشر","n":44,"q":"العينة التي تمثل مجتمعاً ما، وتتكون من فئات ومستويات هي:","o":["عينة منتظمة","عينة طبقية","عينة عشوائية","عينة بسيطة"],"a":1,"f":"العينة الطبقية تقسم المجتمع إلى فئات أو مستويات (طبقات) ثم تسحب من كل طبقة بنسبة تمثيلها، لذا تمثل المجتمع المتنوع أفضل من العشوائية البسيطة."},{"s":"أسئلة المعيار العاشر","n":45,"q":"إذا لاحظت أن ورقتي اختبار كانتا بنفس الأجوبة، وقامت الطالبتان بإنكار الغش. أي الإجراءات التالية يمكن اتباعها؟","o":["إعطاؤهما صفراً","الطلب منهما إعادة الاختبار","إعادة تصحيحها وتحويلها لإدارة المدرسة","تحويلها للجنة الاختبار قبل التصحيح"],"a":1,"f":"عند التشابه مع إنكار الطالبتين لا يوجد دليل قاطع على الغش، فيُعدل الإجراء بإعادة الاختبار لهما للتحقق من مستواهما الحقيقي دون ظلم أو عقوبة مسبقة."},{"s":"أسئلة المعيار العاشر","n":46,"q":"تحويل الخبرة السابقة إلى تعلم بتقييم ما تعلمه الطالب وتحديد ما سيتعلمه لاحقاً، مفهوم:","o":["التساؤل الذاتي","مراجعة الذات","تقدير الذات","تحقيق الذات"],"a":1,"f":"مراجعة الذات استراتيجية تقويمية يقيّم فيها الطالب ما تعلمه ويحدد ما سيتعلمه لاحقاً، فيحوّل خبرته السابقة إلى تعلم جديد، وهي تختلف عن تقدير الذات وتحقيقها."},{"s":"أسئلة المعيار العاشر","n":47,"q":"تعتبر المقابلة من الأدوات المهمة في تقويم الطلاب وهي من استراتيجيات:","o":["التقويم المعتمد على الأداء","التواصل","مراجعة الذات","السجل القصصي"],"a":1,"f":"المقابلة أداة تعتمد على الحوار المباشر بين المعلم والطالب، لذلك تُصنف ضمن استراتيجية التواصل في التقويم."},{"s":"أسئلة المعيار العاشر","n":48,"q":"استخدم المعلم (عبد الرحمن) ثلاث مرجعيات لكتابة التقارير الفصلية لطلابه، كالتالي: المرجع الأول: تمكنه من المفاهيم الأساسية التي تضمنتها أهداف التعلم (محكي المرجع). المرجع الثاني: أعلى أو أدنى بكثير من معدل الفصل (معياري المرجع). المرجع الثالث: حقق تقدماً أعلى مما توقعه المعلم مقارنة بمستواه السابق (ذاتي المرجع). ما المرجعيات التي استخدمها المعلم بالترتيب؟","o":["معياري المرجع - محكي المرجع - ذاتي المرجع","محكي المرجع - معياري المرجع - ذاتي المرجع","ذاتي المرجع - محكي المرجع - معياري المرجع","محكي المرجع - ذاتي المرجع - معياري المرجع"],"a":1,"f":"المرجع الأول يقارن بالأهداف (محكي)، والثاني يقارن بمتوسط الفصل (معياري)، والثالث يقارن بمستوى الطالب السابق (ذاتي)، فالترتيب الصحيح محكي ثم معياري ثم ذاتي."},{"s":"أسئلة المعيار العاشر","n":49,"q":"أداة التقويم التي يُرجى من خلالها تحديد الوزن النسبي لكل مستوى، ويُترجم كل مستوى إلى مؤشرات أداء وتعطي صورة سابقة عن مستوى الأداء المطلوب هي:","o":["سلم التقدير اللفظي (الروبرك)","سلم التقدير العددي","ملف الإنجاز","قائمة الشطب"],"a":0,"f":"سلم التقدير اللفظي (الروبرك) يحدد مستويات الأداء ووزنها النسبي ويترجمها إلى مؤشرات وصفية تُعرّف الطالب مسبقاً بالأداء المطلوب."},{"s":"أسئلة المعيار العاشر","n":50,"q":"أي مما يلي ليس من وسائل تقويم الطلاب الكيفي (النوعي)؟","o":["بطاقات الملاحظة","قوائم الشطب","سلالم التقدير","الاختبارات التحصيلية القياسية"],"a":3,"f":"بطاقات الملاحظة وقوائم الشطب وسلالم التقدير أدوات وصفية نوعية، أما الاختبارات التحصيلية القياسية فتعطي درجات رقمية فهي وسيلة كمية."},{"s":"أسئلة المعيار العاشر","n":51,"q":"الخطوة الأولى في بناء الاختبار التحصيلي:","o":["كتابة مسودة الاختبار","إعداد جدول المواصفات","تحديد الغرض من الاختبار","تحديد أنواع الفقرات الاختبارية"],"a":2,"f":"تبدأ خطوات بناء الاختبار بتحديد الغرض منه لأن بقية الخطوات (جدول المواصفات ونوع الفقرات والصياغة) تُبنى عليه."},{"s":"أسئلة المعيار العاشر","n":52,"q":"أي مما يأتي ليس صحيحاً فيما يتعلق بتقويم السلوك القيمي داخل المجتمع المدرسي؟","o":["تؤسس عملية التقويم على ملاحظة السلوك القيمي بصورة كبيرة","تعتمد مؤشرات السلوك كمعايير للحكم على التحقق القيمي","ينبغي تنوع أدوات التقويم وفق مراحل تشكل القيم","يصعب تقويم السلوك القيمي كونه مسألة شخصية بحتة لا تقبل القياس"],"a":3,"f":"السلوك القيمي يمكن تقويمه بالملاحظة ومؤشرات السلوك وأدوات متنوعة، فالقول بأنه شخصي لا يقبل القياس غير صحيح."},{"s":"أسئلة المعيار العاشر","n":53,"q":"الحصول على المعلومات والبيانات الكمية يُطلق على:","o":["القياس","التقويم","المعايير","المحكات"],"a":0,"f":"القياس هو جمع البيانات والمعلومات الكمية عن السمة المقيسة، أما التقويم فهو الحكم على قيمتها في ضوء معايير."},{"s":"أسئلة المعيار العاشر","n":54,"q":"أي مما يأتي لا يُعد من خصائص الاختبارات المقننة؟","o":["تطبق فقط في ظروف وشروط معيارية، وتكون موحدة للمختبرين","تُعد من قبل فريق من المتخصصين بإشراف مراكز القياس","تقيس مجالاً محدوداً جداً ومفاهيم عفوية غير مجربة","تخضع لمعايير مشتقة قبل نشرها واستعمالها"],"a":2,"f":"الاختبارات المقننة تُبنى بعناية وتغطي مجالاً واسعاً ومفاهيم مجرّبة، فوصفها بأنها تقيس مجالاً محدوداً جداً ومفاهيم غير مجربة يناقض خصائصها."},{"s":"أسئلة المعيار العاشر","n":55,"q":"يمكن القول بأن التقويم الواقعي هو تقويم:","o":["مبدئي","بنائي مستمر","تشخيصي","ختامي نهائي فقط"],"a":1,"f":"التقويم الواقعي تقويم بنائي مستمر يتم أثناء التعلم في مواقف حقيقية ومهام أصيلة، فهو ليس مقتصراً على بداية التعلم أو نهايته."},{"s":"أسئلة المعيار العاشر","n":56,"q":"أداة مكونة من مجموعة من الفقرات تعبر عن سلوك بسيط يخضع لمقياس معين ودرجات من التقدير، تعريف لـ:","o":["قوائم الشطب","السجل القصصي","سلالم التقدير","سجلات الانعكاس"],"a":2,"f":"سلالم التقدير مجموعة فقرات تصف سلوكاً بسيطاً يُحكم عليه وفق مقياس متدرج من التقديرات، بينما قوائم الشطب تقتصر على وجود السلوك أو غيابه."},{"s":"أسئلة المعيار العاشر","n":57,"q":"عبارة تصف خاصية معرفية أو أدائية قابلة للملاحظة والقياس الكمي والنوعي باستخدام أدوات قياس متنوعة:","o":["مؤشر الأداء","معيار الأداء","مستوى الأداء","وصف الأداء"],"a":0,"f":"مؤشر الأداء عبارة تصف خاصية معرفية أو أدائية يمكن ملاحظتها وقياسها كمياً ونوعياً بأدوات متنوعة، ويُستدل به على تحقق المعيار."},{"s":"أسئلة المعيار العاشر","n":58,"q":"إذا ركز المعلم على بعض الدروس في طريقة اختباره، فإن الاختبار يفتقد عنصر:","o":["الصدق","الثبات","الموضوعية","الشمولية"],"a":3,"f":"التركيز على بعض الدروس وإهمال غيرها يعني عدم تمثيل الاختبار لكل المقرر، أي ضعف الشمولية."},{"s":"أسئلة المعيار العاشر","n":59,"q":"يفيد جدول المواصفات في تحقيق عنصر:","o":["التمييز","الثبات","الصدق (صدق المحتوى)","الموضوعية"],"a":2,"f":"جدول المواصفات يربط الأهداف بالمحتوى ويوزع الأسئلة بأوزان مناسبة، فيحقق صدق المحتوى لأنه يضمن تمثيل الاختبار للمقرر."},{"s":"أسئلة المعيار العاشر","n":60,"q":"يكون سؤال الاختيار من متعدد مناسباً إذا:","o":["كان عدد الاختيارات من ثلاث فقرات","كان عدد الاختيارات من أربع إلى خمس فقرات متجانسة","وُزعت الإجابة الصحيحة بطريقة منتظمة معروفة النمط","كان رأس السؤال إجابة لسؤال سابق"],"a":1,"f":"يُفضل في الاختيار من متعدد أن تكون البدائل من أربعة إلى خمسة متجانسة لتقليل التخمين، وألا يظهر نمط ثابت لتوزيع الإجابة الصحيحة."},{"s":"أسئلة المعيار العاشر","n":61,"q":"هناك عدة طرق لترتيب فقرات الاختبار، ما الترتيب الأفضل الذي يتعين على باني الاختبار فعله لتشجيع متدني التحصيل على الاستمرار في الإجابة؟","o":["صعوبة الفقرات (من الأسهل للأصعب)","محتوى الفقرات","نوع الفقرة أو شكلها","المستوى المعرفي للأهداف"],"a":0,"f":"ترتيب الفقرات من الأسهل إلى الأصعب يمنح متدني التحصيل نجاحاً مبكراً وثقة، فيشجعه على مواصلة الإجابة بدل الإحباط من البداية."},{"s":"أسئلة المعيار العاشر","n":62,"q":"يُكلّف أحد المعلمين طلابه بإعداد الأبحاث والمنشورات لإثراء المادة العلمية. أي من الأدوات الآتية هي الأنسب لتقويم عمل الطلاب؟","o":["سجل سير التعلم","السجل القصصي","يوميات الطالب","سلم التقدير (الروبرك)"],"a":3,"f":"الأبحاث والمنشورات منتجات أدائية تُقوّم بمعايير ومستويات واضحة، لذا يناسبها سلم التقدير اللفظي (الروبرك) الذي يصف مستويات الجودة."},{"s":"أسئلة المعيار العاشر","n":63,"q":"(عبد الرحمن) معلم رياضيات يريد التأكد من استخدام طلابه للآلة الحاسبة في البيت. الإجراء المناسب لهذا هو:","o":["المقابلة","الملاحظة المباشرة","الاستبانة وسؤال ولي الأمر","الاختبار العملي المخصص"],"a":3,"f":"المعلم يريد التحقق من مهارة استخدام الآلة الحاسبة، ويقيسها الاختبار العملي الذي يُطلب فيه من الطالب أداء المهمة فعلياً، فالمقابلة والاستبانة تعتمدان على أقوال لا أداء."},{"s":"أسئلة المعيار العاشر","n":64,"q":"أي أساليب التقويم أكثر فاعلية في التعرف على مستوى تقدم تعلم الطلبة نحو تحقيق الأهداف؟","o":["التشخيصي","المبدئي","التكويني البنائي","النهائي"],"a":2,"f":"التقويم التكويني البنائي يجري أثناء التعلم ويبيّن مدى تقدم الطلبة نحو الأهداف ويتيح تعديل التعليم، أما النهائي فيحكم على الحصيلة في النهاية."},{"s":"أسئلة المعيار العاشر","n":65,"q":"من الطرق المتبعة لقياس الجانب الوجداني للطلاب:","o":["الاختبار المقالي","الاختبار الموضوعي","المقابلة والملاحظة لسلوكياتهم","الملاحظة المنتظمة لمواقفهم"],"a":3,"f":"الجانب الوجداني (الاتجاهات والميول) يُقاس بالملاحظة المنتظمة لمواقف الطالب وسلوكه، بينما الاختبارات المقالية والموضوعية تقيس المعرفة."},{"s":"أسئلة المعيار العاشر","n":66,"q":"لجدول المواصفات بعدان هما:","o":["تقديرات ومعايير","أهداف وأنشطة","أهداف ومحتوى","احتياجات المعلم والطالب"],"a":2,"f":"جدول المواصفات ثنائي البعد: بعد يمثل الأهداف (المستويات المعرفية) وآخر يمثل محتوى المادة، وتتقاطع الخلايا لتوزيع الأسئلة."},{"s":"أسئلة المعيار العاشر","n":67,"q":"عندما قرأ المشرف أسئلة الاختبار التي أعدها المعلم وجد أنها متنوعة، وتتفاوت بين الموضوعية والمقالية القصيرة؛ إلا أنها كانت تُركّز على موضوعات دون أخرى، وهذا ما عده المشرف عيباً في الاختبار. ما النصيحة التي يجب توجيهها للمعلم؟","o":["بناء جدول المواصفات للاختبارات","زيادة عدد الأسئلة لتشمل كامل المقرر","توزيع الأسئلة بالتساوي بين الموضوعات","وضع سؤال عن كل هدف من الأهداف السلوكية"],"a":0,"f":"التركيز على موضوعات دون أخرى يعني خللاً في تمثيل المحتوى، وعلاجه بناء جدول المواصفات الذي يوزع الأسئلة على الموضوعات والأهداف بأوزان مناسبة."},{"s":"أسئلة المعيار العاشر","n":68,"q":"من أساليب تقويم المجال الوجداني:","o":["اختبارات التعرف","اختبارات المقال","اختبارات الإبداع","الأساليب الإسقاطية ومقاييس الاتجاهات"],"a":3,"f":"المجال الوجداني يُقوّم بالأساليب الإسقاطية ومقاييس الاتجاهات والميول، أما المقال والتعرف والإبداع فتقيس جوانب معرفية."},{"s":"أسئلة المعيار العاشر","n":69,"q":"المقصود بصدق الاختبار:","o":["حصوله على نفس النتيجة عند إعادة الاختبار","مراعاته للفروق الفردية بين المتعلمين","قياسه للأهداف التي صُمم من أجلها فعلياً","شموله على كل أجزاء المقرر الدراسي"],"a":2,"f":"صدق الاختبار أن يقيس فعلاً الأهداف التي صُمم لقياسها، أما إعطاء النتيجة نفسها عند الإعادة فهو الثبات."},{"s":"أسئلة المعيار العاشر","n":70,"q":"عندما يطلب المعلم من طلابه القيام بمشروع جماعي لحل مشكلة كيفية تحديد اتجاه القبلة بواسطة ساعة اليد ......... نوع التقويم الذي يستخدمه المعلم في قياس تقدم الطلاب في نهاية المشروع يُسمى التقويم:","o":["التحصيلي","النهائي","البديل (الواقعي القائم على الأداء)","البنائي"],"a":2,"f":"مشروع جماعي لحل مشكلة واقعية يندرج تحت التقويم البديل (الواقعي القائم على الأداء) الذي يقيس تطبيق الطالب للمعرفة في مهمة حقيقية."},{"s":"أسئلة المعيار العاشر","n":71,"q":"إشراك الطلاب في تحديد مستوياتهم في ضوء محكات محددة وبإصدار أحكام تتعلق بمدى تحقيقهم لهذه المحكات هو أحد خصائص التقويم:","o":["الذاتي","البديل","التعاوني","التشخيصي"],"a":0,"f":"التقويم الذاتي يشرك الطالب في تحديد مستواه وإصدار أحكام على مدى تحقيقه للمحكات المحددة، فتزداد مسؤوليته عن تعلمه."},{"s":"أسئلة المعيار العاشر","n":72,"q":"أعد المعلم (وليد) اختباراً، ورصد درجات طلابه، ثم أعاد الاختبار نفسه بعد أسبوع على الطلاب أنفسهم، ودلت النتائج أن الدرجات مختلفة كثيراً بين الاختبارين. يوصف هذا الاختبار بأنه غير:","o":["موضوعي","ثابت","صادق","مميز"],"a":1,"f":"اختلاف الدرجات كثيراً عند إعادة الاختبار نفسه على الطلاب أنفسهم يدل على عدم استقرار النتائج، أي ضعف الثبات (طريقة إعادة التطبيق)."},{"s":"أسئلة المعيار العاشر","n":73,"q":"يطلب المعلم من الطلاب إجابات فيها بيانات موجزة ومحددة. يستخدم المعلم أسئلة:","o":["سابرة","مغلقة","مفتوحة","استنباطية"],"a":1,"f":"الأسئلة المغلقة تتطلب إجابات موجزة ومحددة (نعم أو لا أو معلومة قصيرة)، بخلاف المفتوحة التي تسمح بإجابات واسعة."},{"s":"أسئلة المعيار العاشر","n":74,"q":"إذا أراد المعلم أن يكون تقويمه للطلاب من أجل التعلم وتحسينه؛ فأي مما يلي عليه أن يبتعد عنه؟","o":["تقديم تغذية راجعة فورية","تنويع إستراتيجيات التقويم","مقارنة أداء الطالب بأداء زملائه الآخرين","تدريب طلابه على معرفة أخطائهم وتصحيحها"],"a":2,"f":"التقويم من أجل التعلم يركز على تحسين تعلم كل طالب، لذلك يبتعد المعلم عن مقارنة الطالب بزملائه (معياري المرجع) لأنها تضعف الدافعية وتصنّف الطلاب."},{"s":"أسئلة المعيار العاشر","n":75,"q":"إستراتيجية التقويم التي تعتمد على التأمل والتدبر في الموضوعات التي تعلمها الطالب والمهارات التي أتقنها هي:","o":["التقويم المعتمد على الأداء","مراجعة الذات والتأمل","الملاحظة","التواصل"],"a":1,"f":"مراجعة الذات والتأمل استراتيجية يتأمل فيها الطالب ما تعلمه والمهارات التي أتقنها ويتدبرها ليقيّم تعلمه ويخطط لما بعده."},{"s":"أسئلة المعيار العاشر","n":76,"q":"أعد المعلم جدولاً يشتمل على عدد من السلوكيات، ويضع أمام كل سلوك درجة تتراوح من (1-5)؛ بحيث تعني الدرجة (1) نادراً، والدرجة (5) دائماً. ما قام به المعلم يُعد مثالاً على:","o":["سجل الإنجاز التراكمي","قائمة شطب","سلم تقدير رقمي","سلم تقدير وصفي"],"a":2,"f":"جدول سلوكات يقابل كل منها درجة من ١ إلى ٥ (نادراً إلى دائماً) هو سلم تقدير رقمي، لأن المستويات معبّر عنها بأرقام لا بأوصاف مفصلة."},{"s":"أسئلة المعيار العاشر","n":77,"q":"ما نوع الصدق المستخدم عندما يُحسب معامل الارتباط بين تقديرات المشرفين التربويين للمعلمين في مدى نجاحهم وتقدير المديرين للغرض نفسه في الوقت ذاته؟","o":["صدق المحتوى","الصدق التلازمي","الصدق التنبؤي","صدق البناء"],"a":1,"f":"الارتباط بين تقديرين للغرض نفسه في وقت واحد (المشرفين والمديرين) يمثل الصدق التلازمي، أما التنبؤي فيقارن بمحك يأتي لاحقاً."},{"s":"أسئلة المعيار العاشر","n":78,"q":"للتقويم التشخيصي أهمية كبيرة في العملية التعليمية؛ لأنه يساعد على تحديد:","o":["المشاكل والصعوبات التي قد تعيق التعلم الجديد","عيوب طريقة التدريس المتبعة","الوسائل المناسبة للاستخدام","نقاط ضعف المقرر الدراسي"],"a":0,"f":"التقويم التشخيصي يُجرى قبل التعلم لكشف المشكلات والصعوبات ونقاط الضعف السابقة التي قد تعيق التعلم الجديد لدى الطلاب."},{"s":"أسئلة المعيار العاشر","n":79,"q":"يرغب معلم الأحياء التأكد من أن كل طالب يُجهّز المجهر تجهيزاً صحيحاً. ما أنسب طريقة لتقويم الطلاب في هذا الموقف؟","o":["سجل وصف سير التعلم","السجل القصصي","إحصاء السلوك","قوائم الرصد (قوائم الشطب لخطوات العمل)"],"a":3,"f":"تجهيز المجهر يتم عبر خطوات متتابعة يُسجَّل لكل منها تحقق أو عدم تحقق، وهذا ما تقدمه قوائم الرصد (الشطب) لخطوات العمل."},{"s":"أسئلة المعيار العاشر","n":80,"q":"أي العبارات التالية تعتبر صحيحة؟","o":["يُستخدم التقويم لمعرفة أخطاء الطلاب وعقابهم","التقويم عملية تشخيصية وعلاجية وبنائية شاملة ومستمرة","أفضل أنواع التقويم الذي يقيس اتجاهات وميول الطلاب فقط","التقويم يكون في نهاية العملية التعليمية فقط"],"a":1,"f":"التقويم عملية شاملة ومستمرة تشخص وتعالج وتبني التعلم، وليس للعقاب ولا لنهاية العملية فقط ولا لقياس الاتجاهات وحدها."},{"s":"أسئلة المعيار العاشر","n":81,"q":"في تقارير التقويم، يستخدم المعلم رسماً بيانياً يظهر نسبة درجات كل طالب إلى متوسط درجات طلاب الفصل، فأي أساليب القياس استخدمها المعلم؟","o":["ذاتية","أدائية","معيارية المرجع","محكية المرجع"],"a":2,"f":"مقارنة درجة كل طالب بمتوسط درجات الفصل هي قياس معياري المرجع، لأن المرجع هو أداء المجموعة وليس مستوى إتقان محدد مسبقاً."},{"s":"أسئلة المعيار العاشر","n":82,"q":"كلّف أحد المعلمين طلابه بكتابة تقرير، يكتب فيه بشكل حر عن الموضوعات أو القضايا التي يرونها، وبالطريقة التي يريدها الطالب مكتوبة أو مرسومة وجمعها في ملف موثق. الأداة المناسبة لإنجاز هذه المهمة هي:","o":["قائمة الرصد","ملف الإنجاز (البورتفوليو)","السجل القصصي","صحائف الطلاب"],"a":3,"f":"كتابة الطالب بحرية عما يراه من موضوعات بطريقته (كتابة أو رسماً) وجمعها في ملف هي صحائف الطلاب أو اليوميات، أما ملف الإنجاز فيضم نماذج مختارة من أعماله."},{"s":"أسئلة المعيار العاشر","n":83,"q":"يُسمى التقويم الذي يهتم بتقدم نمو التعلم للطالب خطوة بخطوة:","o":["التشكيل (البنائي)","الصفي الإجمالي","الختامي","التشخيصي القبلي"],"a":0,"f":"التقويم التكويني (البنائي) يتابع نمو تعلم الطالب خطوة بخطوة أثناء التدريس لتقديم التغذية الراجعة والتصحيح أولاً بأول."},{"s":"أسئلة المعيار العاشر","n":84,"q":"جميع ما يلي من خصائص التقويم المعتمد على الأداء، ما عدا:","o":["تقويم متكامل يركز على نواتج التعلم الحقيقية","يقوم الطالب نفسه ذاتياً","يزود المعلم بالتغذية الراجعة","تقويم غير مباشر للأداء يقتصر على الورقة والقلم"],"a":3,"f":"التقويم المعتمد على الأداء مباشر ويقيس نواتج حقيقية، فوصفه بأنه غير مباشر ويقتصر على الورقة والقلم يتعارض مع طبيعته."},{"s":"أسئلة المعيار العاشر","n":85,"q":"من أساليب التقويم الذاتي جميع ما يلي ما عدا:","o":["سجلات الانعكاس","التساؤل الذاتي","الملاحظة الخارجية المباشرة من المعلم","الاستبانات الذاتية"],"a":2,"f":"التقويم الذاتي يقوم به الطالب بنفسه عبر سجلات الانعكاس والتساؤل الذاتي والاستبانات الذاتية، أما ملاحظة المعلم الخارجية فتقويم خارجي."},{"s":"أسئلة المعيار العاشر","n":86,"q":"مقياس يكون للتصنيف وتعيين الفئات دون ترتيب (مثل: جنس الفرد، حالته الاجتماعية، وظيفته)، هو المقياس:","o":["الاسمي","الرتبي","الفئوي","النسبي"],"a":0,"f":"المقياس الاسمي يصنّف الأفراد في فئات دون ترتيب أو مسافات كالجنس والحالة الاجتماعية والوظيفة، وهو أدنى مستويات القياس."},{"s":"أسئلة المعيار العاشر","n":87,"q":"أداة التقويم التي تعتمد على تقديرات لفظية نوعية متدرجة (ممتاز - جيد - ضعيف) تُسمى:","o":["قوائم الرصد","سلالم التقدير اللفظية","السجل القصصي","وصف سير التعلم"],"a":1,"f":"سلالم التقدير اللفظية تستخدم تقديرات وصفية متدرجة مثل ممتاز وجيد وضعيف، بخلاف قوائم الرصد التي تسجل وجود السلوك أو غيابه فقط."},{"s":"أسئلة المعيار العاشر","n":88,"q":"في نهاية العام الدراسي، يريد معلم التعبير أن يُقوّم التطور الشامل والتقدم الذي أحرزه الطلاب في كتابة المقالات والقصص على مدار العام، إذن عليه استخدام:","o":["الاختبار التحريري النهائي","قوائم الشطب","ملف الإنجاز (Portfolio)","اختبار الأداء اللحظي"],"a":2,"f":"ملف الإنجاز (البورتفوليو) يجمع أعمال الطالب عبر العام فيُظهر تطوره وتقدمه الشامل في الكتابة، بخلاف الاختبار النهائي الذي يقيس لحظة واحدة."},{"s":"أسئلة المعيار العاشر","n":89,"q":"التقويم التكويني يتم تنفيذه:","o":["في بداية عملية التدريس","خلال وأثناء عملية التدريس ومسارها","في نهاية عملية التدريس","بعد نهاية العام الدراسي بأكمله"],"a":1,"f":"التقويم التكويني يجري أثناء عملية التدريس وخلال مسارها لتوجيه التعلم وتعديله، أما التشخيصي ففي البداية والختامي في النهاية."},{"s":"أسئلة المعيار العاشر","n":90,"q":"المعايير التي يتم في ضوئها الحكم على المواقف أو السلوك تسمى:","o":["المهارات","الأفكار","القيم والمحكات","التعميمات"],"a":2,"f":"المعايير التي يُحكم بها على المواقف والسلوك هي القيم والمحكات، فهي المرجع الذي يُقاس به السلوك ويُصدر الحكم."},{"s":"أسئلة المعيار العاشر","n":91,"q":"عندما يُصنّف المعلم الطلاب من الأعلى للأدنى ويقارن بينهم، يعتبر تقويماً:","o":["محكياً","ذاتياً","موضوعياً","معياري المرجع"],"a":3,"f":"ترتيب الطلاب من الأعلى إلى الأدنى ومقارنة بعضهم ببعض هو التقويم معياري المرجع، لأن المرجع أداء المجموعة لا مستوى إتقان محدد."},{"s":"أسئلة المعيار العاشر","n":92,"q":"اختبارات الإبداع من أساليب تقويم المجال:","o":["المعرفي","الأدائي الحركي","الوجداني","العقلي"],"a":1,"f":"اختبارات الإبداع تقيس نواتج تتجسد في أداء ومنتج، وقد صُنفت هنا ضمن المجال الأدائي الحركي بحسب مفتاح الإجابة، وإن كان الإبداع يُنسب غالباً إلى المجال المعرفي."},{"s":"أسئلة المعيار العاشر","n":93,"q":"شرح المعلم لطلابه طريقة إعداد تقارير أدائهم، مستنداً إلى تحديد مستوى كل طالب بناءً على مقارنته بأداء زملائه في نفس الصف. فأي أنواع المراجع سوف يعتمد في إعداد التقارير؟","o":["ذاتي المرجع","محكي المرجع","قياسي المرجع","معياري المرجع"],"a":3,"f":"تحديد مستوى الطالب بمقارنته بأداء زملائه في الصف هو معياري المرجع، أما المحكي فيقارن بمستوى إتقان للأهداف، والذاتي بمستواه السابق."},{"s":"أسئلة المعيار العاشر","n":94,"q":"شارك المعلم (أحمد) زميله في إعداد اختبار سهل لقياس تحصيل الطلاب خلال نهاية الفصل الدراسي. ما الصفات التي قد يحتويها هذا الاختبار الصفي غير المقنن؟","o":["رسمي / مقنن / موضوعي","رسمي / غير مقنن / موضوعي","غير رسمي / مقنن / مقالي","غير رسمي / غير مقنن / مقالي"],"a":1,"f":"اختبار المعلم الصفي غير المقنن لتحصيل الطلاب يُعد رسمياً (يعتمد في الدرجات) وغير مقنن، ويغلب عليه الطابع الموضوعي كما يدل مفتاح الإجابة."},{"s":"أسئلة المعيار العاشر","n":95,"q":"أفضل أداة يتم فيها تقييم أداء الطالب إذا كتب قصة أو مقالاً بالمعايير التفصيلية هي:","o":["سير التعلم","سلم التقدير اللفظي (Rubric)","سلم التقدير العددي","قوائم الرصد"],"a":1,"f":"تقويم قصة أو مقال بمعايير تفصيلية لمستويات الجودة تناسبه الروبرك (سلم التقدير اللفظي) لأنها تصف مستويات الأداء لكل معيار."},{"s":"أسئلة المعيار العاشر","n":96,"q":"صمم معلم خطة تقويم، تحقق عدة أهداف من بينها الكشف عن الصعوبات التي تواجه الطلاب في أثناء التعلم، وتقديم تغذية راجعة مستمرة، ووضع حلول ملائمة لتذليل تلك الصعوبات. ما نوع التقويم المتبع في هذه الخطة؟","o":["تشخيصي مستمر بنائي","بنائي (تكويني)","ختامي","معياري"],"a":0,"f":"الكشف عن الصعوبات أثناء التعلم مع تغذية راجعة مستمرة وحلول علاجية يجمع بين التشخيصي والبنائي المستمر، فهو أشمل من البنائي وحده."},{"s":"أسئلة المعيار العاشر","n":97,"q":"اكتشف المعلم (عبد الرحمن) أثناء تدريسه مهارة الضرب، أن بعض طلابه يخلطون بين إشارتي الضرب والجمع، وأنه بحاجة إلى تعديل استراتيجية التدريس التي استخدمها سابقاً. ما قام به المعلم هنا هو تقويم:","o":["مبدئي","تكويني","تشخيصي لصعوبة التعلم","تقريري"],"a":2,"f":"اكتشاف المعلم لخلط الطلاب بين إشارتي الضرب والجمع أثناء التدريس تشخيص لصعوبة تعلم محددة تستدعي تعديل الاستراتيجية."},{"s":"أسئلة المعيار العاشر","n":98,"q":"(سامي) معلم رياضيات للصف الثاني الابتدائي، خطط لوضع اختبار لطلابه، وكان هدفه معرفة مدى تحصيل طلابه في مهارتي الجمع والطرح. وضع سامي سؤالين عن القسمة للتمهيد للدرس الجديد. ما ملاحظتك على ما قام به المعلم سامي؟","o":["سليم؛ للتمهيد للدرس الجديد","خاطئ؛ لأن الاختبار غير ثابت","سليم؛ لشمولية الأسئلة لمحتوى المقرر","خاطئ؛ لأن الاختبار غير صادق (يقيس ما لم يُدرس ولم يوضع لقياسه)"],"a":3,"f":"الاختبار هدفه قياس الجمع والطرح، ووجود أسئلة قسمة لم تُدرَّس يجعله يقيس ما لم يوضع لقياسه، أي ضعف الصدق."},{"s":"أسئلة المعيار العاشر","n":99,"q":"أعد المعلم (بدر) الاختبار النهائي وفقاً للنموذج الآتي الذي أقرته إدارة المدرسة: تتميز الأسئلة بسهولة الإعداد، وتقيس القدرة على تنظيم الأفكار وترتيبها (المقالية). تغطي مدى واسعاً من الموضوعات، ولها نسبة تخمين عالية تقيس الصواب والخطأ (صح وخطأ). تتميز بقدرتها على ربط المفاهيم وقياس الحقائق (المزاوجة). تتميز بأنها أقل نسبة تخمين بين الموضوعي وتقيس القدرات العقلية العليا (الاختيار من متعدد). ما أنواع الأسئلة التي تضمنها التوصيف على التوالي؟","o":["مقالي، اختيار من متعدد، صح وخطأ، مزاوجة","مقالي، صح وخطأ، مزاوجة، اختيار من متعدد","اختيار من متعدد، صح وخطأ، مزاوجة، مقالي","اختبار من متعدد، مزاوجة، مقالي، صح وخطأ"],"a":1,"f":"الوصف يطابق على التوالي: المقالي (تنظيم الأفكار)، الصواب والخطأ (تخمين عالٍ وشمول)، المزاوجة (ربط المفاهيم)، الاختيار من متعدد (أقل تخميناً بين الموضوعي)."},{"s":"أسئلة المعيار العاشر","n":100,"q":"إلى أي مستوى مقياسي تنتمي درجات المقررات الدراسية المختلفة (من 0 إلى 100) التي يعطيها المعلمون؟","o":["الفئوي (مجال متساوي مع وجود صفر غير مطلق)","النسبي","الرتبي","الاسمي"],"a":0,"f":"درجات المقررات من صفر إلى ١٠٠ مقياس فئوي (فتري) لتساوي المسافات بين الدرجات، والصفر فيه غير مطلق إذ لا يعني انعدام المعرفة."},{"s":"أسئلة المعيار العاشر","n":101,"q":"أي مما يأتي يُعد أعلى مستوى من مستويات القياس الإحصائي؟","o":["النسبي (لوجود الصفر المطلق الحقيقي)","الفئوي","الرتبي","الاسمي"],"a":0,"f":"المقياس النسبي أعلى مستويات القياس لأنه يجمع خصائص الاسمي والرتبي والفئوي ويتميز بوجود صفر مطلق حقيقي."},{"s":"أسئلة المعيار العاشر","n":102,"q":"يحرص معلم اللغة العربية على طرح أسئلة وتلقي الإجابة عنها مباشرة من المتعلم، وذلك بهدف رصد مدى تقدم تعلم طلابه باستمرار. إنه بذلك يستخدم إستراتيجية:","o":["الملاحظة","التواصل","التقويم الواقعي","التقويم المعتمد على الأداء"],"a":1,"f":"طرح الأسئلة وتلقي الإجابة المباشرة من المتعلم لرصد تقدمه باستمرار أسلوب يندرج تحت استراتيجية التواصل في التقويم."},{"s":"أسئلة المعيار العاشر","n":103,"q":"عندما يطلب المعلم من طلابه صياغة عبارات وتدوين ما شاهدوه وقرأوه في دفاترهم كأفكار وتأملات، فإنه يفضل استخدام أداة:","o":["سجل القصة","سير التعلم","قوائم الرصد","سلالم التقدير"],"a":1,"f":"سجل سير التعلم يدوّن فيه الطالب عبارات وأفكاراً وتأملات حول ما شاهده وقرأه، فيعبّر عن تعلمه بأسلوبه."},{"s":"أسئلة المعيار العاشر","n":104,"q":"اختبار دولي يستهدف طلاب الصف الرابع الابتدائي ويقيس قدراتهم القرائية والاستيعابية ويُقام كل 5 سنوات:","o":["TALIS","PISA","PIRLS","TIMSS"],"a":2,"f":"اختبار PIRLS دولي لقياس القدرة القرائية والاستيعابية لطلاب الصف الرابع، ويُجرى كل خمس سنوات، بينما TIMSS للرياضيات والعلوم وPISA لسن الخامسة عشرة."}];
const BN = BUILTIN.length;
/* questions the viewer imported themselves: kept only in this browser, appended after the built-in bank */
const IKEY = "rm_import_v1";
let IMP = { sets: [] };
try { const d = JSON.parse(localStorage.getItem(IKEY) || "null"); if (d && Array.isArray(d.sets)) IMP = d } catch (e) {}
const ISIG = IMP.sets.map(s => s.id).join(",");
const Q = BUILTIN.concat(...IMP.sets.map(st => st.items.map((it, j) => ({ s: "أسئلتي – " + st.name, n: j + 1, q: it.q, o: it.o, a: it.a, f: it.f || "", mine: st.id }))));
const L = ["أ","ب","ج","د","هـ"];
const KEY = "rm_app_v2";
const N = Q.length;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ":" + String(m).padStart(2,"0") : String(m).padStart(2,"0")) + ":" + String(x).padStart(2,"0") };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

/* ---------- approximate domain tagging from question text ---------- */
const DOMAINS = [
  ["القياس والتقويم", /تقويم|اختبار|معامل|الصدق|الثبات|مشتت|معياري|المنوال|الوسيط|الانحراف|المئين|النزعة|التوزيع|سلالم|قوائم الرصد|درجات/],
  ["الكمي والرياضيات", /(?=.*[0-9٠-٩])(?=.*(كم|مساحة|نسبة|ريال|٪|%|العدد|الأعداد|طول|سرعة|يوم))/],
  ["اللغة العربية والفهم القرائي", /لغوي|النص|نص:|الجملة|الجمل|الترقيم|الضبط|الضمير|الكلمة|كلمة|حقيقة|رأي|إعراب|القراءة|الكتابة|العبارة|مرادف|التؤدة|«/],
  ["التقنية والتعليم الرقمي", /رقمي|الرقمية|إلكتروني|الإنترنت|برنامج|البرامج|الواقع المعزز|الحاسب|كلاس|منصة|التقنية|تكنولوجيا|فيديو|بوابة|PowerPoint|PDF/],
  ["علم النفس والنمو", /بياجيه|برونر|فيجوتسكي|بافلوف|سكنر|باندورا|مارسيا|ماسلو|جاردنر|المراهق|الطفولة|الطفل|النمو|الهوية|التعزيز|تعزيز|الإطفاء|الشرطي|التمثل|المواءمة|الذكاء|ذكاء|الدافعية|دافعية|الموهوب|موهوب|بطيء|صعوبات|المتأخر|نظرية|الانتباه/],
  ["الأخلاقيات والإدارة الصفية", /سلوك|الانضباط|ولي الأمر|ولي أمر|المدير|الوكيل|أخلاق|الأمانة|المرشد|الموجه|الإدارة|الشراكة|الأسرة|المجتمع|الجدول|النظامي|الزملاء|زميل|المشرف|وزارة|القدوة|قدوة/],
  ["طرق التدريس والتخطيط", /تدريس|استراتيجي|التعلم|المنهج|منهج|الأهداف|هدف|بلوم|خريطة|التفكير|الأقران|المنظم|الدرس|نشاط|الأنشطة|الخبرة|الخبرات|البحث|بحث/]
];
Q.forEach(q => { const d = DOMAINS.find(([, re]) => re.test(q.q)); q.d = d ? d[0] : "تربوي عام" });
const DOM_NAMES = [...DOMAINS.map(d => d[0]), "تربوي عام"];
const SECTS = [...new Set(Q.map(q => q.s))];

/* ---------- state ---------- */
const fresh = () => ({ v: 2, savedAt: 0, name: "", theme: "system", oneTap: false, side: true,
  fav: [], flag: [], p: { A: [], i: 0, sect: "all", t: {} },
  mode: "prac", sim: null, hist: [], myReports: [] });
let S = fresh();
try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && d.v === 2) S = Object.assign(fresh(), d) } catch (e) {}
// Answers are stored by question position. Re-map them when the built-in bank or the imported sets changed size.
function remapState(T, map, newN) {
  const ra = arr => { const a = new Array(newN).fill(null); (arr || []).forEach((v, k) => { const m = map(k); if (m !== null && m >= 0 && m < newN) a[m] = v }); return a };
  const rs = arr => (arr || []).map(map).filter(m => m !== null && m >= 0 && m < newN);
  T.p.A = ra(T.p.A);
  const t = {}; Object.keys(T.p.t || {}).forEach(k => { const m = map(+k); if (m !== null && m < newN) t[m] = T.p.t[k] }); T.p.t = t;
  const pi = map(T.p.i || 0); T.p.i = pi === null ? 0 : pi;
  T.fav = rs(T.fav); T.flag = rs(T.flag);
  if (T.sim) { T.sim.qs = rs(T.sim.qs); T.sim.A = ra(T.sim.A); T.sim.flag = rs(T.sim.flag); if (!T.sim.qs.length) { T.sim = null; T.mode = "prac" } else T.sim.i = Math.min(T.sim.i || 0, T.sim.qs.length - 1) }
}
function alignState(T) {
  if (T.bn === undefined) { T.bn = BN; T.isig = ISIG; return }       // saved before imports existed
  if (T.bn === BN && T.isig === ISIG) return;
  const keepMine = ISIG === T.isig || ISIG.startsWith(T.isig ? T.isig + "," : "");
  remapState(T, k => k < T.bn ? (k < BN ? k : null) : (keepMine ? k - T.bn + BN : null), N);
  T.bn = BN; T.isig = ISIG;
}
alignState(S);
if (!Array.isArray(S.p.A) || S.p.A.length !== N) { const a = new Array(N).fill(null); (S.p.A || []).forEach((v, k) => { if (k < N) a[k] = v }); S.p.A = a }
let FAV = new Set(S.fav), FLAG = new Set(S.flag);
const R = new Set();            // practice: answer revealed without answering (this visit)
let sel = null;                 // pending choice before confirming
let view = "q";                 // q | stats | result | reports
let filt = "all", query = "";
let dirty = false;

function persist(sync) {
  S.fav = [...FAV]; S.flag = [...FLAG]; S.savedAt = Date.now(); S.bn = BN; S.isig = ISIG;
  try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {}
  showSaved();
  if (sync) queueSync();
}

/* ---------- context helpers ---------- */
const sim = () => S.mode === "sim" && S.sim ? S.sim : null;
function ctx() {
  const s = sim();
  if (s) return { sim: true, done: s.done, list: s.qs, A: s.A, flag: new Set(s.flag), cur: s.qs[s.i] ?? s.qs[0] };
  const list = []; for (let k = 0; k < N; k++) if (S.p.sect === "all" || Q[k].s === S.p.sect) list.push(k);
  if (!list.includes(S.p.i)) S.p.i = list[0];
  return { sim: false, done: false, list, A: S.p.A, flag: FLAG, cur: S.p.i };
}
function stateOf(c, k) {
  const a = c.A[k];
  if (a === null || a === undefined) return "u";
  if (c.sim && !c.done) return "d";
  return a === Q[k].a ? "g" : "r";
}
function setCur(c, k) { sel = null; if (c.sim) S.sim.i = S.sim.qs.indexOf(k); else S.p.i = k; persist(false) }
function toggleFlag(c, k) {
  if (c.sim) { const f = new Set(S.sim.flag); f.has(k) ? f.delete(k) : f.add(k); S.sim.flag = [...f] }
  else FLAG.has(k) ? FLAG.delete(k) : FLAG.add(k);
  persist(true);
}

/* ---------- theme ---------- */
const hostTheme = document.documentElement.getAttribute("data-theme");
const THEMES = { light: "نهاري", dark: "ليلي", system: "حسب الجهاز" };
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === "light" || S.theme === "dark") r.setAttribute("data-theme", S.theme);
  else if (hostTheme) r.setAttribute("data-theme", hostTheme); else r.removeAttribute("data-theme");
  $("themeLbl").textContent = THEMES[S.theme];
}
$("bTheme").onclick = () => { S.theme = { system: "light", light: "dark", dark: "system" }[S.theme]; applyTheme(); persist(false); toast("المظهر: " + THEMES[S.theme]) };

/* ---------- layout toggles ---------- */
const narrow = () => window.matchMedia("(max-width:900px)").matches;

function renderStats() {

    if (a === Q[k].a) { ok++; dom[d][0]++; src[s][0]++ } else { wr++; wrongDom[d] = (wrongDom[d] || 0) + 1 }
  }

const TEMPLATE = "1) ما الهدف الرئيس من التقويم التكويني؟\nأ) إصدار حكم نهائي على مستوى الطالب\nب) تحسين التعلم أثناء حدوثه\nج) ترتيب الطلاب حسب درجاتهم\nد) توزيع الدرجات في نهاية الفصل\nالإجابة: ب\nالشرح: يُستخدم التقويم التكويني أثناء التعلم لتقديم تغذية راجعة تحسّنه.\n\n2) أي مما يأتي من أدوات التقويم؟\n( أ ) الملاحظة\n( ب ) سلم التقدير\n( ج ) الحوار\n( د ) العصف الذهني\nالإجابة الصحيحة: ( ب )";
const LETTERS = { "أ": 0, "ا": 0, "إ": 0, "ب": 1, "ج": 2, "د": 3, "ه": 4, "هـ": 4, a: 0, b: 1, c: 2, d: 3, e: 4 };
const letterIdx = s => { s = String(s == null ? "" : s).trim().toLowerCase(); if (/^[1-5]$/.test(s)) return +s - 1; return s in LETTERS ? LETTERS[s] : null };
const toLatin = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
function parseQuestions(text) {
  text = text.replace(/^﻿/, "");
  let raw = [];
  if (/^\s*[\[{]/.test(text)) {
    let data; try { data = JSON.parse(text) } catch (e) { return { items: [], skipped: [{ n: "—", why: "ملف JSON غير صالح" }] } }
    if (!Array.isArray(data)) data = data.questions || [];
    raw = data.map((r, k) => ({ n: r.n || k + 1, q: r.q || r.question, o: r.o || r.options, a: typeof r.a === "number" ? r.a : letterIdx(r.a != null ? r.a : r.answer), f: r.f || r.explanation || "" }));
  } else {
    const L1 = "هـ|[أاإبجدهabcdeABCDE]";
    const reQ = new RegExp("^(?:س\\s*)?\\(?\\s*([0-9]+)\\s*[\\)\\.\\-–:]\\s*(.+)$");
    const reO = new RegExp("^(?:\\(\\s*(" + L1 + ")\\s*\\)|(" + L1 + ")\\s*[\\)\\.\\-–:])\\s*(.*)$");
    const reA = new RegExp("^(?:الإجابة الصحيحة|الاجابة الصحيحة|الإجابة|الاجابة|الجواب|الحل)\\s*[:：\\-–]?\\s*\\(?\\s*(" + L1 + "|[1-5])(?![\\u0621-\\u064A])");
    const reF = /^(?:الشرح|التعليل|التفسير|السبب)\s*[:：\-–]\s*(.+)$/;
    const rePair = /([0-9]+)\s*[\)\.\-–:=]\s*\(?\s*(هـ|[أاإبجده])\s*\)?(?![ء-ي])/g;
    const reMulti = /\(\s*(?:هـ|[أاإبجده])\s*\)/g;
    let cur = null, sec = 0, lastSec = 0, keyMode = false; const keys = [];
    const push = () => { if (cur) raw.push(cur); cur = null };
    const addOpt = s => cur.o.push(s.replace(/\s*[.،]\s*$/, "").trim());
    for (const line of text.replace(/\r/g, "").split("\n")) {
      if (/^\s*#/.test(line)) { push(); sec++; keyMode = /إجاب|اجاب|مفتاح/.test(line); continue }
      const l = line.replace(/\*\*|__/g, "").replace(/^\s*[-*•]\s+/, "").trim();
      if (!l) continue;
      const ll = toLatin(l);
      if (/^(?:مفتاح الإجابات|الإجابات|الاجابات|إجابات)/.test(l)) { push(); keyMode = true }
      const pairs = [...ll.matchAll(rePair)];
      if (pairs.length >= 2 || (keyMode && pairs.length)) { push(); pairs.forEach(m => keys.push({ sec: lastSec, n: +m[1], a: letterIdx(m[2]) })); continue }
      let m;
      if (cur && (m = l.match(reA))) { cur.a = letterIdx(m[1]); continue }
      if (cur && (m = l.match(reF))) { cur.f = m[1].trim(); continue }
      if (cur && (l.match(reMulti) || []).length >= 2) { l.split(/(?=\(\s*(?:هـ|[أاإبجده])\s*\))/).forEach(p => { const mm = p.trim().match(reO); if (mm) addOpt(mm[3]) }); continue }
      if (cur && (m = l.match(reO)) && m[3]) { addOpt(m[3]); continue }
      if ((m = ll.match(reQ))) { push(); keyMode = false; cur = { sec, n: +m[1], q: l.slice(l.length - m[2].length).trim(), o: [], a: null, f: "" }; lastSec = sec; continue }
      if (cur) { if (cur.f) cur.f += " " + l; else if (cur.o.length) cur.o[cur.o.length - 1] += " " + l; else cur.q += " " + l }
    }
    push();
    raw.forEach(r => { if (r.a === null) { const k = keys.find(k => k.sec === r.sec && k.n === r.n) || keys.find(k => k.n === r.n && !raw.some(x => x !== r && x.n === r.n)); if (k) r.a = k.a } });
  }
  const items = [], skipped = [];
  raw.forEach(r => {
    const o = (r.o || []).map(x => String(x).trim()).filter(Boolean);
    const q = String(r.q || "").replace(/\s*\.{3,}\s*/g, " ......... ").trim();
    if (!q) skipped.push({ n: r.n, why: "نص السؤال فارغ" });
    else if (o.length < 2 || o.length > 5) skipped.push({ n: r.n, why: "عدد الخيارات " + o.length + " (المطلوب من 2 إلى 5)" });
    else if (r.a === null || r.a === undefined || r.a < 0 || r.a >= o.length) skipped.push({ n: r.n, why: "لم أجد الإجابة الصحيحة" });
    else items.push({ q, o, a: r.a, f: String(r.f || "").trim() });
  });
  return { items, skipped };
}
function saveImports() { try { localStorage.setItem(IKEY, JSON.stringify(IMP)); return true } catch (e) { return false } }
function importsModal() {
  const total = IMP.sets.reduce((n, s) => n + s.items.length, 0);
  modal('<h3>أسئلتي المستوردة</h3>' +
    '<p class="note">استورد ملف أسئلة من جهازك (txt أو md أو json). تبقى هذه الأسئلة على هذا الجهاز فقط ولا تُنشر، وتظهر في قسم باسم الملف، وتعمل معها كل خصائص التطبيق.</p>' +
    '<div class="mact" style="margin-top:8px"><button class="btn pri" id="iPick">اختيار ملف للاستيراد</button><button class="btn" id="iTpl">عرض القالب</button><input type="file" id="iFile" accept=".txt,.md,.json,text/plain,text/markdown,application/json" hidden></div>' +
    '<div class="sets">' + (IMP.sets.length ? IMP.sets.map((s, i) => '<div class="set"><b>' + esc(s.name) + '</b><span class="note">عدد الأسئلة: ' + s.items.length + ' · ' + new Date(s.at).toLocaleDateString("ar-SA-u-nu-latn") + '</span><button class="btn" data-del="' + i + '">حذف</button><span data-cf="' + i + '" hidden>حذف الأسئلة وإجاباتها؟ <button class="btn danger" data-yes="' + i + '">نعم</button> <button class="btn" data-no="' + i + '">لا</button></span></div>').join("") : '<p class="note">لم تستورد أي أسئلة بعد.</p>') + "</div>" +
    (total ? '<p class="note">مجموع الأسئلة المستوردة: ' + total + "</p>" : "") +
    '<div class="mact"><button class="btn" id="iX">إغلاق</button></div>',
    b => {
      b.querySelector("#iX").onclick = closeModal;
      b.querySelector("#iTpl").onclick = templateModal;
      b.querySelector("#iPick").onclick = () => b.querySelector("#iFile").click();
      b.querySelector("#iFile").onchange = e => { const f = e.target.files[0]; if (f) readImport(f) };
      b.querySelectorAll("[data-del]").forEach(x => x.onclick = () => { b.querySelector('[data-cf="' + x.dataset.del + '"]').hidden = false; x.hidden = true });
      b.querySelectorAll("[data-no]").forEach(x => x.onclick = () => { b.querySelector('[data-cf="' + x.dataset.no + '"]').hidden = true; b.querySelector('[data-del="' + x.dataset.no + '"]').hidden = false });
      b.querySelectorAll("[data-yes]").forEach(x => x.onclick = () => deleteSet(+x.dataset.yes));
    });
}
function templateModal() {
  modal('<h3>قالب ملف الأسئلة</h3><p class="note">اكتب أسئلتك في ملف نصي (مثل المفكرة) بهذا الشكل واحفظه بامتداد txt. يكفي سطر الإجابة لكل سؤال، والشرح اختياري. يقبل التطبيق الحروف أ ب ج د هـ، مع الأقواس أو بدونها.</p><div class="tpl" id="tplTxt">' + esc(TEMPLATE) + '</div>' +
    '<p class="note">يمكن أيضًا وضع مفتاح الإجابات في آخر الملف بدل سطر الإجابة، مثل: 1-ب 2-أ 3-د</p>' +
    '<div class="mact"><button class="btn pri" id="tCopy">نسخ القالب</button><button class="btn" id="tBack">رجوع</button></div>',
    b => {
      b.querySelector("#tBack").onclick = importsModal;
      b.querySelector("#tCopy").onclick = () => {
        navigator.clipboard.writeText(TEMPLATE).then(() => toast("تم نسخ القالب"), () => { const r = document.createRange(); r.selectNodeContents(b.querySelector("#tplTxt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("حدّد النص، اضغط Ctrl+C للنسخ") });
      };
    });
}
function readImport(file) {
  if (file.size > 3 * 1024 * 1024) { toast("الملف كبير جدًا. الحد الأقصى 3 ميجابايت"); return }
  const rd = new FileReader();
  rd.onload = () => {
    const { items, skipped } = parseQuestions(String(rd.result || ""));
    const name0 = file.name.replace(/\.[^.]+$/, "").slice(0, 40) || "أسئلتي";
    const ex = items[0];
    modal('<h3>معاينة الاستيراد</h3>' +
      (items.length ? "<p>عدد الأسئلة الجاهزة للإضافة: <b>" + items.length + "</b></p>" : "<p><b>لم أتعرف على أي سؤال مكتمل في هذا الملف.</b> تأكد أنه يتبع القالب.</p>") +
      (skipped.length ? "<p>أسئلة لم تُضف: <b>" + skipped.length + "</b></p><ul class=\"skip\">" + skipped.slice(0, 8).map(s => "<li>السؤال " + esc(s.n) + ": " + esc(s.why) + "</li>").join("") + (skipped.length > 8 ? "<li>…</li>" : "") + "</ul>" : "") +
      (ex ? '<div class="tpl">' + esc(ex.q) + "\n" + ex.o.map((o, i) => (i === ex.a ? "✓ " : "   ") + L[i] + ") " + o).join("\n") + (ex.f ? "\nالشرح: " + esc(ex.f) : "") + "</div>" : "") +
      (items.length ? '<div class="fld"><label for="iName">اسم القسم</label><input id="iName" maxlength="40" value="' + esc(name0) + '"></div>' : "") +
      '<div class="mact">' + (items.length ? '<button class="btn pri" id="iAdd">إضافة الأسئلة (' + items.length + ")</button>" : "") + '<button class="btn" id="iTpl2">عرض القالب</button><button class="btn" id="iBack">رجوع</button></div>',
      b => {
        b.querySelector("#iBack").onclick = importsModal;
        b.querySelector("#iTpl2").onclick = templateModal;
        const add = b.querySelector("#iAdd");
        if (add) add.onclick = () => {
          const name = (b.querySelector("#iName").value.trim() || name0).slice(0, 40);
          IMP.sets.push({ id: Date.now().toString(36), name, at: Date.now(), items });
          if (!saveImports()) { IMP.sets.pop(); toast("تعذّر الحفظ: مساحة التخزين في المتصفح ممتلئة"); return }
          persist(false);
          try { sessionStorage.setItem("rm_after_import", name) } catch (e) {}
          location.reload();
        };
      });
  };
  rd.onerror = () => toast("تعذّرت قراءة الملف");
  rd.readAsText(file, "utf-8");
}
function deleteSet(i) {
  let start = BN; for (let j = 0; j < i; j++) start += IMP.sets[j].items.length;
  const len = IMP.sets[i].items.length;
  IMP.sets.splice(i, 1);
  const newSig = IMP.sets.map(s => s.id).join(",");
  remapState(S, k => k < start ? k : k < start + len ? null : k - len, N - len);
  S.fav = S.fav.filter(x => x < N - len); S.isig = newSig; S.bn = BN; S.savedAt = Date.now();
  saveImports();
  try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {}
  location.reload();
}
$("qImp").onclick = () => { if (narrow()) { drawer = false; applySide() } importsModal() };
try { const done = sessionStorage.getItem("rm_after_import"); if (done) { sessionStorage.removeItem("rm_after_import"); setTimeout(() => { const s = "أسئلتي – " + done; if (SECTS.includes(s)) { S.p.sect = s; $("sect").value = s; filt = "all"; go(Q.findIndex(q => q.s === s)) } toast("تمت إضافة القسم «" + done + "»") }, 50) } } catch (e) {}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!$("mod").hidden) closeModal(); else if (drawer) { drawer = false; applySide() } return }
  if (!$("mod").hidden || view !== "q" || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const c = ctx(), k = c.cur, q = Q[k];
  const open = c.sim ? !c.done : (c.A[k] === null && !R.has(k));
  const n = parseInt(e.key, 10);
  if (open && n >= 1 && n <= q.o.length) { e.preventDefault(); choose(n - 1) }
  else if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const cur = sel !== null ? sel : (c.sim && c.A[k] !== null ? c.A[k] : -1); const nx = e.key === "ArrowDown" ? Math.min(q.o.length - 1, cur + 1) : Math.max(0, cur - 1); if (c.sim) { choose(nx); return } sel = nx; render(); const b = $("mn").querySelector('.op[data-i="' + sel + '"]'); b && b.focus() }
  else if (e.key === "Enter" && open && sel !== null) { e.preventDefault(); confirmAnswer() }
  else if (e.key === "ArrowLeft") { const p = c.list.indexOf(k); if (p < c.list.length - 1) go(c.list[p + 1]) }
  else if (e.key === "ArrowRight") { const p = c.list.indexOf(k); if (p > 0) go(c.list[p - 1]) }
});

/* ---------- user, cloud sync ---------- */
let db = null, user = null, uid = null, uname = "", syncT = null, lastSync = "";
function userUI() {
  $("uName").textContent = S.name || uname || "ضيف";
}
function queueSync() {
  if (!db || !uid) return;
  clearTimeout(syncT);
  syncT = setTimeout(async () => {
    const body = { v: 2, savedAt: S.savedAt, bn: BN, isig: ISIG, fav: S.fav, flag: S.flag, p: S.p, mode: S.mode, sim: S.sim, hist: S.hist, name: S.name, oneTap: S.oneTap, theme: S.theme };
    const js = JSON.stringify(body); if (js === lastSync) return;
    try { await db.doc("data/users/" + uid + "/progress").set(body); lastSync = js } catch (e) {}
  }, 2500);
}
async function boot() {
  if (!window.claude || !window.claude.use) return;
  claude.use("sample").then(s => { if (s) { sample = s; aiOK = true; if (view === "q") render() } });
  user = await claude.use("user");
  if (user) {
    const me = await user.me();
    uid = me.id; uname = me.name || "";
    if (me.name) { $("uAv").src = me.avatarUrl; $("uAv").hidden = false }
    userUI();
  }
  db = await claude.use("db");
  if (db && uid) {
    try {
      const snap = await db.doc("data/users/" + uid + "/progress").get();
      const d = snap.exists ? snap.data() : null;
      if (d && d.v === 2 && (d.savedAt || 0) > (S.savedAt || 0)) {
        S = Object.assign(fresh(), JSON.parse(JSON.stringify(d)), { side: S.side, myReports: S.myReports });
        alignState(S);
        if (!Array.isArray(S.p.A) || S.p.A.length !== N) { const a = new Array(N).fill(null); (S.p.A || []).forEach((v, k) => { if (k < N) a[k] = v }); S.p.A = a }
        FAV = new Set(S.fav); FLAG = new Set(S.flag);
        try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {}
        applyTheme(); userUI(); fillSects(); render(); toast("تم استرجاع تقدمك من حسابك");
      } else if (S.savedAt) queueSync();
    } catch (e) {}
    if (S.myReports.length) sendReport();
  }
  if (db && user && await user.isOwner()) {
    $("bReports").hidden = false;
    db.collection("reports").onSnapshot(snap => {
      allReports = snap.docs.map(d => d.data() || {});
      $("repN").textContent = allReports.reduce((n, r) => n + (r.items || []).length, 0);
      if (view === "reports") render();
    }, () => {});
  }
}

/* ---------- start ---------- */
function fillSects() {
  $("sect").innerHTML = '<option value="all">كل الأقسام (' + N + ")</option>" + SECTS.map(s => '<option value="' + esc(s) + '">' + esc(s) + " (" + Q.filter(q => q.s === s).length + ")</option>").join("");
  if (S.p.sect !== "all" && !SECTS.includes(S.p.sect)) S.p.sect = "all";
  $("sect").value = S.p.sect;
}
fillSects(); applyTheme(); applySide(); userUI();
if (S.sim && S.sim.done && S.mode === "sim") view = "result";
render();
boot();
</script>
<script>
if ("serviceWorker" in navigator) {
  const hadSW = !!navigator.serviceWorker.controller; let swReloaded = false;
  // a newer version took over: save progress and reload once so the viewer sees it
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSW && !swReloaded) { swReloaded = true; try { persist(false) } catch (e) {} location.reload() } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}) });
  }).catch(() => {}));
}
let installEvt = null;
addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); installEvt = e;
  if (document.getElementById("bInstall")) return;
  const b = document.createElement("button");
  b.className = "ib"; b.id = "bInstall"; b.title = "تثبيت التطبيق على جهازك";
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg><span class="lbl">تثبيت التطبيق</span>';
  b.onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; b.remove() };
  const tb = document.querySelector(".tb"); tb.insertBefore(b, document.getElementById("bSet"));
});
addEventListener("appinstalled", () => { const b = document.getElementById("bInstall"); b && b.remove() });
</script></body></html>
