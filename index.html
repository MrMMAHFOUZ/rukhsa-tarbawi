اب إلكتروني"],"a":1,"f":"عرض فرضية الحياة على المريخ يتطلب مشهداً مرئياً مثيراً وهو أنسب في مقطع يوتيوب، بينما المؤتمر المرئي للتواصل الحي والشرائح للنص."},{"s":"أسئلة المعيار السابع","n":99,"q":"دعوة الطلاب للتفكير في المحتوى المقروء؛ كي يقوموا بالتعبير عنه كتابياً، تُسمى هذه الاستراتيجية بـ:","o":["SPAWN","KWL","تدريس الأقران","التدريس التبادلي"],"a":1,"f":"⚠ دعوة الطلاب للتفكير في المقروء والتعبير عنه كتابياً تنطبق على استراتيجية SPAWN وهي للكتابة، أما KWL فتنظم المعرفة السابقة والمكتسبة."},{"s":"أسئلة المعيار الثامن","n":1,"q":"مجموعة من التدابير المحددة التي تتخذ من أجل بلوغ هدف معين:","o":["التمهيد","التخطيط","التنفيذ","التصميم"],"a":1,"f":"التخطيط هو مجموعة تدابير محددة تتخذ مسبقاً لبلوغ هدف معين، أما التنفيذ فهو تطبيق هذه الخطة."},{"s":"أسئلة المعيار الثامن","n":2,"q":"الطريقة والإجراءات التي يقوم بها المعلم ليصل الطلاب إلى الأهداف المرجوة التي كان يسعى إلى تحقيقها:","o":["التقويم","التنفيذ","التخطيط","التغذية الراجعة"],"a":1,"f":"التنفيذ هو ما يمارسه المعلم من طرق وإجراءات صفية لتحقيق الأهداف المخطط لها، بينما التخطيط إعداد مسبق."},{"s":"أسئلة المعيار الثامن","n":3,"q":"يلتحق مجموعة من المعلمين بورشة تدريبية، تتناول معارف ومهارات في مجال تحليل المحتوى وترتيب الخبرات والأنشطة التعليمية وتوزيعها زمنياً. ما العنوان المتوقع لهذه الورشة؟","o":["التخطيط اليومي","التخطيط للوحدة","التخطيط السنوي","التخطيط الأسبوعي"],"a":1,"f":"تحليل المحتوى وترتيب الخبرات والأنشطة وتوزيعها زمنياً هو التخطيط للوحدة الدراسية، أما اليومي فيخص الدرس الواحد."},{"s":"أسئلة المعيار الثامن","n":4,"q":"عندما تطلب من طلابك أن يبدوا آراءهم في قصيدة معطاة لهم، فإن ذلك يقيس قدراتهم على:","o":["التركيب","التقويم","التحليل","التطبيق"],"a":1,"f":"إبداء الرأي وإصدار الحكم على قصيدة مستوى التقويم في تصنيف بلوم، وهو أعلى المستويات المعرفية في التصنيف القديم."},{"s":"أسئلة المعيار الثامن","n":5,"q":"كتب أحد المعلمين اختباراً، جاء فيه (عرّف الوضوء - عدد فروضه). هذا النوع من الأسئلة يقيس أهدافاً تعليمية من مستوى:","o":["التطبيق","التحليل","التركيب","التذكر"],"a":3,"f":"أفعال التعريف والعد (عرّف، عدد) تقيس استدعاء المعلومات، وهو مستوى التذكر في تصنيف بلوم."},{"s":"أسئلة المعيار الثامن","n":6,"q":"أي الأهداف التالية يمكن قياسها؟","o":["أن يلم الطالب بكتابة مواضع همزة القطع","أن يدرك الطالب مواضع كتابة همزة الوصل","أن يفرق الطالب بين همزة الوصل والقطع","أن يفهم الطالب الفرق بين همزة الوصل وهمزة القطع"],"a":2,"f":"الفعل «يفرق» سلوك قابل للملاحظة والقياس، أما يلم ويدرك ويفهم فأفعال داخلية غير قابلة للقياس المباشر."},{"s":"أسئلة المعيار الثامن","n":7,"q":"أن يكتب الطالب جملة ويشكلها بالحركات بطريقة صحيحة:","o":["لا يمكن ملاحظة الهدف السلوكي","يوجد أكثر من فعل سلوكي","الفعل غير قابل للقياس","يركز الفعل على الأداء"],"a":1,"f":"الهدف السلوكي ينبغي أن يتضمن فعلاً واحداً، وهنا فعلان (يكتب ويشكل)، لذلك الخيار الصحيح أن فيه أكثر من فعل سلوكي."},{"s":"أسئلة المعيار الثامن","n":8,"q":"الهدف السلوكي الآتي: \"يوضح المعلم مفهوم التفاعل الكيميائي\"، يُعد:","o":["غير مناسب، لأنه غير قابل للملاحظة","غير مناسب، لأنه لا يصف تعلم الطلاب","مناسباً لكونه قابلاً للقياس","مناسباً لكونه محدداً"],"a":1,"f":"الهدف السلوكي يصف أداء الطالب لا المعلم؛ وهنا الفاعل المعلم (يوضح)، فالهدف غير مناسب لأنه لا يصف تعلم الطلاب."},{"s":"أسئلة المعيار الثامن","n":9,"q":"الهدف السلوكي الذي يمكن قياسه:","o":["أن يفسر الطالب الرموز على الخريطة","أن يدرك الطالب الرموز على الخريطة","أن يفهم الطالب الرموز على الخريطة","أن يلم الطالب بالرموز على الخريطة"],"a":0,"f":"«يفسر» فعل إجرائي يمكن ملاحظته وقياسه، بينما يدرك ويفهم ويلم أفعال غامضة لا تقاس مباشرة."},{"s":"أسئلة المعيار الثامن","n":10,"q":"أي من الأهداف السلوكية التالية يُعد صحيحاً:","o":["أن تفهم الطالبة مقصد الشاعر من النص","أن تدرك الطالبة معنى النص الشعري","أن تقرأ الطالبة النص قراءة صحيحة","أن تقرأ المعلمة النص قراءة صحيحة"],"a":2,"f":"الهدف السلوكي الصحيح يصف سلوكاً ظاهراً قابلاً للقياس للمتعلمة، وهنا «تقرأ الطالبة قراءة صحيحة»، أما تفهم وتدرك فأفعال غير قابلة للقياس، وقراءة المعلمة تصف المعلم."},{"s":"أسئلة المعيار الثامن","n":11,"q":"أن يصنف المتعلم المواد (العناصر) إلى فلزات ولافلزات بعد معرفته للخواص العامة لكل منها، يُصنف ضمن هدف:","o":["التقويم","التطبيق","التحليل","الفهم"],"a":2,"f":"تصنيف العناصر إلى فلزات ولافلزات بحسب الخواص تقسيم للكل إلى أجزاء وإدراك العلاقات، وهو مستوى التحليل في تصنيف بلوم."},{"s":"أسئلة المعيار الثامن","n":12,"q":"عندما تلاحظ أن طلابك يحبون المدرسة ويستمتعون بالتعلم، فإن ذلك يعني أن مناخ المدرسة يخاطب البعد:","o":["الاجتماعي","الوجداني","المعرفي","النفس حركي"],"a":1,"f":"حب المدرسة والاستمتاع بالتعلم يتعلق بالمشاعر والاتجاهات، وهو البعد الوجداني، لا المعرفي ولا الحركي."},{"s":"أسئلة المعيار الثامن","n":13,"q":"أن يُقبل الطالب على حل المسألة الرياضية، هذا هدف:","o":["نفس حركي","وجداني","معرفي","سلوكي"],"a":1,"f":"الإقبال على حل المسألة ميل واتجاه نحو النشاط، وهو هدف وجداني (الاستقبال والاهتمام) وليس معرفياً."},{"s":"أسئلة المعيار الثامن","n":14,"q":"أي التصنيفات الآتية يتناول المستويات العليا للأهداف النفس حركية؟","o":["الممارسة - الإتقان - الإبداع","الاستقبال - الاستجابة - التقمص","التقدير - التنظيم - التجسيد","الملاحظة - التقليد - الإبداع"],"a":0,"f":"المستويات العليا للمجال النفس حركي (سمبسون) تتجه نحو الممارسة والإتقان والإبداع، أما الملاحظة والتقليد فمستويات دنيا."},{"s":"أسئلة المعيار الثامن","n":15,"q":"هو منهج غير رسمي وغير مخطط له، يكتسبه الطالب داخل المدرسة وخارجها بدون تخطيط أو توجيه، يؤثر في سلوك الطالب من خلال ما يعيشه، ويُسهم في تنمية الاتجاهات والقيم التي تتفق أو تتعارض مع المنهج المدرسي:","o":["المنهج الرسمي","المنهج المحوري","المنهج الخفي","المنهج الظاهري"],"a":2,"f":"المنهج الخفي هو ما يكتسبه الطالب من قيم واتجاهات من البيئة المدرسية دون تخطيط رسمي، وقد يوافق المنهج الرسمي أو يخالفه."},{"s":"أسئلة المعيار الثامن","n":16,"q":"صياغة الخبرات التعليمية للمادة الواحدة مع الرجوع إلى المواد الأخرى، بحيث تكون خبرات متشابهة في الهدف والطريقة، يُطلق على هذا المفهوم المنحنى:","o":["المستمر","التكاملي","الرأسي","التتابعي"],"a":1,"f":"التكامل (الأفقي) يربط خبرات المادة الواحدة بالمواد الأخرى في الهدف والطريقة، أما الرأسي أو التتابعي فيتعلق بترتيب الخبرات عبر الصفوف."},{"s":"أسئلة المعيار الثامن","n":17,"q":"المنهج الذي يمثل مجموعة المواقف التعليمية التي يُستعان في تصميمها وتنفيذها وتقويم أثرها من أجل تحقيق أهداف محددة وقياسها ممثلة في الحاسوب التعليمي والكتب المبرمجة والحقائب التعليمية وسائر أنواع التعلم الذاتي:","o":["التكنولوجي","المواد المنفصلة","المواد المترابطة","المجالات العلمية"],"a":0,"f":"المنهج التكنولوجي يعتمد على الحاسوب التعليمي والكتب المبرمجة والحقائب وأنماط التعلم الذاتي في تصميم المواقف وتقويمها."},{"s":"أسئلة المعيار الثامن","n":18,"q":"تنظيم المنهج الذي يستثمر الطاقة والنشاط الفائضين لدى المتعلم هو:","o":["منهج المواد الدراسية المنفصلة","منهج النشاط","المنهج المحوري","منهج الوحدات الدراسية"],"a":1,"f":"منهج النشاط يقوم على ميول الطالب ونشاطه الذاتي ويستثمر طاقته الزائدة في أنشطة هادفة بدل المحتوى الجامد."},{"s":"أسئلة المعيار الثامن","n":19,"q":"أي من عناصر المنهج أكثر أهمية وتتأثر فيه بقية العناصر:","o":["الأهداف","المحتوى","التقويم","طريقة التدريس"],"a":0,"f":"الأهداف هي أهم عناصر المنهج، وتتحدد في ضوئها بقية العناصر: المحتوى وطرق التدريس والأنشطة والتقويم."},{"s":"أسئلة المعيار الثامن","n":20,"q":"المنهج الذي يسعى إلى إيجاد الصلة بين المواد الدراسية أو بين بعض الموضوعات:","o":["منهج المواد المنفصلة","منهج المواد المترابطة","منهج النشاط","منهج المحوري"],"a":1,"f":"منهج المواد المترابطة يسعى إلى إيجاد الصلة بين مادتين أو موضوعات، مع بقاء كل مادة مستقلة، أما المنفصلة فلا ربط فيها."},{"s":"أسئلة المعيار الثامن","n":21,"q":"أي من مداخل التدريس الآتية يخدمها المنهج المحوري؟","o":["المعرفي","السلوكي","الفردي","الاجتماعي"],"a":3,"f":"المنهج المحوري يدور حول مشكلات المجتمع واحتياجاته، فيخدم المدخل الاجتماعي في التدريس."},{"s":"أسئلة المعيار الثامن","n":22,"q":"المنهج الذي يكون اتجاه التنظيم فيه سيكولوجياً؟","o":["منهج النشاط","المنهج المحوري","المنهج الحلزوني","المنهج المترابط"],"a":0,"f":"منهج النشاط ينظم المحتوى بحسب ميول المتعلم وحاجاته (التنظيم السيكولوجي)، لا بحسب منطق المادة الدراسية."},{"s":"أسئلة المعيار الثامن","n":23,"q":"قسم (جون ديوي) منهج النشاط إلى قسمين قائمين على:","o":["استعداد المعلم وطرق التدريس","أهداف التعليم ومحتوى المقرر","ميول الطلاب والمواقف التعليمية","البيئة الصفية والمجتمع المدرسي"],"a":2,"f":"قسّم جون ديوي منهج النشاط بحسب ميول الطلاب إلى نشاط قائم على الميول، ومواقف تعليمية يختارها المعلم لتحقيق الأهداف."},{"s":"أسئلة المعيار الثامن","n":24,"q":"مواد دراسية منفصلة، كل مادة تُدرس وحدها مثل التاريخ والجغرافيا:","o":["منهج المجالات الواسعة","منهج المواد الدراسية المرتبطة","المنهج المتكامل","منهج المواد المنفصلة"],"a":3,"f":"منهج المواد المنفصلة هو أقدم أنواع المناهج، وفيه تُقدَّم كل مادة (كالتاريخ والجغرافيا) مستقلة عن غيرها دون ربط بينها، بخلاف المنهج المترابط أو المتكامل الذي يدمج المواد."},{"s":"أسئلة المعيار الثامن","n":25,"q":"من أفضل الوسائل التعليمية في توصيل المعلومات للطالب:","o":["الخرائط","الرسوم البيانية","الراديو","الأفلام الناطقة المتحركة"],"a":3,"f":"الأفلام الناطقة المتحركة تجمع الصوت والصورة والحركة، فتقدّم خبرة أقرب إلى الواقع وتخاطب أكثر من حاسة، لذا هي أغنى في إيصال المعلومة من الخرائط والرسوم الثابتة أو الراديو السمعي فقط."},{"s":"أسئلة المعيار الثامن","n":26,"q":"النشاط الذي يقوم به المعلم داخل الفصل وخارجه مع طلابه يسمى:","o":["الأنشطة التعليمية","الأنشطة المنهجية","الأنشطة الصفية","الأنشطة غير الصفية"],"a":0,"f":"الأنشطة التعليمية هي كل ما يقوم به المعلم مع طلابه داخل الفصل وخارجه لتحقيق الأهداف، أما الصفية وغير الصفية فكل منهما يخص مكاناً محدداً فقط."},{"s":"أسئلة المعيار الثامن","n":27,"q":"يتم من خلالها ترجمة الأهداف السلوكية إلى مواقف تعليمية:","o":["الأنشطة الاستهلالية","الأنشطة التنموية","الأنشطة الختامية","الأنشطة التعليمية"],"a":1,"f":"الأنشطة التنموية هي التي تترجم الأهداف السلوكية إلى مواقف تعليمية يمارسها المتعلم فتنمّي لديه المعرفة والمهارة، بينما الاستهلالية للتهيئة والختامية لإنهاء الدرس."},{"s":"أسئلة المعيار الثامن","n":28,"q":"أي الوسائل الآتية أنسب في التواصل مع أولياء أمور الطلاب بشأن غياب أبنائهم:","o":["تويتر","رسائل SMS","البريد الإلكتروني","الفيس بوك"],"a":1,"f":"رسائل SMS أنسب لإبلاغ ولي الأمر بالغياب لأنها فورية ومباشرة وتصل لكل الأسر على الجوال دون حاجة لحساب أو متابعة، بعكس تويتر وفيسبوك العامّين وقد لا يُفتح البريد سريعاً."},{"s":"أسئلة المعيار الثامن","n":29,"q":"مجموعة القواعد والمعايير التي توجه الأفراد نحو منافع التقنيات الحديثة والحماية من أخطارها، تُعرف بـ:","o":["الرقابة الرقمية","المواطنة الرقمية","الضبط الرقمي","التوجيه الرقمي"],"a":1,"f":"المواطنة الرقمية هي مجموعة القواعد والمعايير والأعراف التي توجّه الاستخدام الأمثل والمسؤول للتقنية، للاستفادة من منافعها والوقاية من مخاطرها."},{"s":"أسئلة المعيار الثامن","n":30,"q":"صنف (إدجار ديل) الوسائل التعليمية على أساس الخبرات التي تهيئها الوسائل في كتابه (الطرق السمعية والبصرية) في شكل مخروط يُسمى مخروط الخبرة، الخبرات الموجودة في أعلى قمة الهرم هي:","o":["محسوسة","مباشرة","مجردة","ممثلة"],"a":2,"f":"في مخروط الخبرة لإدجار ديل تتدرج الخبرات من المباشرة الحسية في القاعدة إلى المجردة (الرموز اللفظية والبصرية) في القمة، لأنها الأبعد عن الواقع."},{"s":"أسئلة المعيار الثامن","n":31,"q":"يسعى الهدف الآتي: (اكتساب الطلاب المعرفة العلمية المناسبة) إلى تنمية وتعليم الطلاب:","o":["الحقائق والمفاهيم","عمليات التعلم","الاتجاهات والقيم","الميول العلمية"],"a":0,"f":"المعرفة العلمية تشمل الحقائق والمفاهيم والمبادئ والقوانين، فاكتسابها هدف معرفي يندرج تحت الحقائق والمفاهيم، لا الاتجاهات والقيم (وجدانية) ولا عمليات التعلم."},{"s":"أسئلة المعيار الثامن","n":32,"q":"في درس عن تأسيس المملكة العربية السعودية، كلف المعلم طلابه بنشاط يتضمن دمج ملفات متنوعة لإنتاج وثيقة وتوضيحها. الأداة التقنية الأكثر مناسبة لعمل ذلك:","o":["المدونة التعليمية","التخزين السحابي","برنامج الملاحظات","الخرائط الذهنية الإلكترونية"],"a":1,"f":"التخزين السحابي يتيح للطلاب رفع ملفات متنوعة (نصوص وصور وفيديو) ودمجها ومشاركتها لإنتاج وثيقة واحدة، أما المدونة والملاحظات والخرائط الذهنية فلا تؤدي وظيفة دمج الملفات."},{"s":"أسئلة المعيار الثامن","n":33,"q":"إذا ضم المعلم في مقرر أنشطة استكشاف، تساعد الطلاب على إعادة تنظيم ومعالجة المعلومات المخزونة والوصول إلى نتائج جديدة، فسيحقق أهداف:","o":["التقويم","الإبداع","التطبيق","التحليل"],"a":1,"f":"أنشطة الاستكشاف التي تُعيد تنظيم المعلومات المخزّنة وتعالجها للوصول إلى نتائج جديدة تحقق هدف الإبداع، لأن الإنتاج الجديد هو جوهر التفكير الإبداعي."},{"s":"أسئلة المعيار الثامن","n":34,"q":"عند إعداد المعلم للأنشطة غير الصفية ينبغي مراعاة أن تكون:","o":["مطبقة داخل المدرسة","موحدة للطلاب جميعهم","مقتصرة على محتويات الكتاب المدرسي","اختيارية بما يتناسب مع إمكانيات المتعلمين"],"a":3,"f":"الأنشطة غير الصفية اختيارية تقوم على ميول الطلاب، فينبغي أن تناسب إمكانياتهم وقدراتهم ولا تُفرض موحدة، كما أنها لا تقتصر على المدرسة أو الكتاب المدرسي."},{"s":"أسئلة المعيار الثامن","n":35,"q":"صياغة الخبرات التعليمية في المادة الواحدة مع الرجوع إلى المواد الأخرى، بحيث تكون خبرات متشابهة في الهدف والطريقة، يُعرف بالمنحنى:","o":["المستمر","التكاملي","الرأسي","التتابعي"],"a":1,"f":"المنحنى التكاملي (التكامل الأفقي) يربط خبرات المادة الواحدة بغيرها من المواد في الهدف والطريقة، بخلاف الرأسي أو التتابعي الذي يرتب الخبرات عبر الصفوف."},{"s":"أسئلة المعيار الثامن","n":36,"q":"وردت القصة الآتية في درس القراءة للصف الثالث الابتدائي: \"مريم وفاطمة جارتان، وفي أحد الأيام مرضت فاطمة، فزارتها مريم وقالت لها: لا بأس عليك يا أختي\". ما الهدف التعليمي الذي يمكن أن يشتق من المحتوى السابق؟","o":["أن تبين الطالبة مكانة الجار عند جاره","أن تعدد الطالبة ثلاثة من آداب زيارة المريض","أن تستنتج الطالبة حكم زيارة الجار إذا مرض","أن تذكر الطالبة حديثاً شريفاً ينهى عن أذية الجار"],"a":0,"f":"القصة تُبرز علاقة الجارتين وزيارة الجارة لجارتها المريضة، فالهدف المشتق منها بيان مكانة الجار وحقه عند جاره، أما آداب زيارة المريض والحديث الشريف فلم يردا في النص."},{"s":"أسئلة المعيار الثامن","n":37,"q":"يخطط المعلم للتحضير لوحدة تعليمية جديدة. أي من الأسئلة الآتية يضمن للمعلم فعالية هذه الدروس لتعطي نتائج أفضل من خلال التفكير؟","o":["ما الطريقة الأكثر عدلاً لتقويم الطلاب؟","ما أنشطة الوحدة المناسبة لإتمامها بشكل فردي؟","ما الطرق التي تدعم بها الوحدة أهداف منهج وزارة التعليم؟","ما الخلفية المعرفية والخبرة التي يمتلكها الطلاب من الوحدة؟"],"a":3,"f":"معرفة الخلفية المعرفية والخبرات السابقة للطلاب هي أساس التخطيط الفعّال، لأن التعلم الجديد يُبنى على السابق، فتُحدَّد الأنشطة والأساليب بما يناسب مستوى الطلاب."},{"s":"أسئلة المعيار الثامن","n":38,"q":"إذا كنت تخطط لاستثارة التفكير الإبداعي لدى الطلاب، فيجب أن تكلّف الطلاب بأنشطة وتطرح أسئلة تركز على التفكير:","o":["التباعدي","التقاربي","الاستنباطي","الاستقرائي"],"a":0,"f":"التفكير التباعدي يولّد أفكاراً وحلولاً متعددة لمشكلة مفتوحة وهو أساس الإبداع، أما التقاربي فيصل إلى إجابة واحدة صحيحة."},{"s":"أسئلة المعيار الثامن","n":39,"q":"تتميز الأهداف التعليمية العامة بأنها:","o":["تُصاغ في ضوء فلسفة المجتمع وعاداته وتقاليده","تعبر بدقة عن التغيير المطلوب حدوثه في سلوك التعلم","تتضمن أفعالاً سلوكية قابلة للملاحظة والقياس والتقويم","يجري تحقيقها وتقويمها خلال حصة دراسية واحدة كحد أدنى"],"a":0,"f":"الأهداف العامة تُشتق من فلسفة المجتمع وقيمه وعاداته وتتسم بالشمول وبعد المدى، أما دقة التعبير وقابلية القياس وتحقيقها في حصة فهي من خصائص الأهداف السلوكية."},{"s":"أسئلة المعيار الثامن","n":40,"q":"استراتيجية (لماذا؟ وماذا؟ وكيف؟) تُنسب للعالم:","o":["هيرمان","كلوب","مكارثي","ماكافي"],"a":2,"f":"استراتيجية «لماذا؟ ماذا؟ كيف؟» ترتبط بنموذج برنيس مكارثي (4MAT) في أنماط التعلم، إذ تربط أسئلة الدرس بالأنماط الأربعة للمتعلمين."},{"s":"أسئلة المعيار الثامن","n":41,"q":"التفكير الاستقرائي من مداخل:","o":["الاجتماعي","الذاتي","ضبط السلوك","معالجة المعلومات"],"a":3,"f":"التفكير الاستقرائي (من الجزئيات إلى القاعدة العامة) يُصنَّف ضمن مدخل معالجة المعلومات لأنه يعتمد على تحليل المعطيات واستخلاص العلاقات منها."},{"s":"أسئلة المعيار الثامن","n":42,"q":"تتمثل أهمية التخطيط للتدريس في كل مما يلي، ما عدا أنه:","o":["يجعل عملية التدريس متسقة الأدوار وفق خطوات خالية من الارتجالية","يساعد في اختيار أهم الأنشطة التي تتلاءم مع مستويات الطلاب","يسمح للمعلم بتحديد الأهداف التي يرغب في تحقيقها","يوضح أنماط الاتصال بين المعلم وطلاب الصف"],"a":3,"f":"التخطيط يحقق الاتساق وتجنب الارتجال ويحدد الأهداف ويختار الأنشطة المناسبة، أما أنماط الاتصال بين المعلم والطلاب فتتحدد أثناء التنفيذ داخل الصف لا بالتخطيط، فهو المستثنى."},{"s":"أسئلة المعيار الثامن","n":43,"q":"الفعل الذي يدل على مستوى التركيب:","o":["يعرف","يقارن","يوضح","يقترح"],"a":3,"f":"يقترح فعل يدل على التركيب (ابتكار شيء جديد من عناصر متعددة)، أما يعرف فتذكر، ويوضح فهم، ويقارن تحليل."},{"s":"أسئلة المعيار الثامن","n":44,"q":"(سلمان) معلم واع ومهتم بقضايا مجتمعه. وعند التخطيط لدرس حقوق وواجبات، فكر في نشاط مناسب لطرح قضية ضعف روابط الصلة بين أبناء الحي الواحد، ما أنسب نشاط سيكلف به الطلاب؟","o":["تكليف الطلاب بكتابة مقال عن أسباب ضعف روابط الجيرة واقتراح سبل لعلاجها","تنظيم مسابقة أحب جاري، ويفوز أفضل صديقين بالحي عن الجيرة الحسنة وآثارها","جمع قصص ونوادر من تراث المجتمع السعودي","شرح حديث ما زال جبريل يوصيني بالجار"],"a":0,"f":"كتابة مقال عن أسباب ضعف الجيرة واقتراح علاجها نشاط يعالج القضية فعلاً ويحلل المشكلة ويقترح حلولاً، فهو أنسب من المسابقة أو جمع النوادر أو شرح الحديث التي لا تعالجها."},{"s":"أسئلة المعيار الثامن","n":45,"q":"جميع ما يلي من معوقات تعليم مهارات التفكير لدى الطلاب، ما عدا:","o":["اعتقاد البعض أن المعلم هو مصدر المعرفة الوحيد","ضعف بعض المعلمين في إدارة الصف","اقتصار التقويم على قياس مهارات عقلية دنيا","كثرة استخدام البرامج التعليمية المفيدة"],"a":3,"f":"استخدام البرامج التعليمية المفيدة يدعم تعليم التفكير ولا يعوقه، أما اعتبار المعلم مصدر المعرفة الوحيد وضعف إدارة الصف وقصر التقويم على المهارات الدنيا فمعوقات."},{"s":"أسئلة المعيار الثامن","n":46,"q":"القدرة على التفسير وإعادة الترتيب والتنظيم للأفكار:","o":["الفهم والاستيعاب","التطبيق","التحليل","التفسير"],"a":0,"f":"القدرة على تفسير الأفكار وإعادة ترتيبها وتنظيمها بأسلوب المتعلم تمثل مستوى الفهم والاستيعاب في تصنيف بلوم."},{"s":"أسئلة المعيار الثامن","n":47,"q":"كتب معلم العلوم اختباراً، جاء فيه (عرّف الانصهار)؛ هذا النوع من الأسئلة يقيس أهدافاً تعليمية من مستوى:","o":["التذكر","التطبيق","التحليل","التركيب"],"a":0,"f":"التعريف يتطلب استرجاع المعلومة المحفوظة كما هي، وهذا مستوى التذكر، وهو أدنى مستويات المجال المعرفي في تصنيف بلوم."},{"s":"أسئلة المعيار الثامن","n":48,"q":"أي الأسئلة التالية يشجع على التفكير الإبداعي لدى الطالب؟","o":["ما مكونات الماء؟","عدد أنواع الطاقة المتجددة؟","كيف نحافظ على سلامة البيئة؟","متى ولد النبي صلى الله عليه وسلم؟"],"a":2,"f":"السؤال المفتوح «كيف نحافظ على سلامة البيئة؟» يتيح إجابات متعددة جديدة فيحفّز الإبداع، أما بقية الأسئلة فتطلب معلومة محفوظة بإجابة واحدة محددة."},{"s":"أسئلة المعيار الثامن","n":49,"q":"أن يستخدم الطالب قانون فيثاغورس في حل المسألة، هو هدف من مستوى:","o":["التطبيق","التركيب","التحليل","التقويم"],"a":0,"f":"استخدام قانون معروف في حل مسألة جديدة هو التطبيق، أي توظيف المعرفة السابقة في موقف مختلف."},{"s":"أسئلة المعيار الثامن","n":50,"q":"الموازنة بين السلبيات والإيجابيات تفكير:","o":["ناقد","ابتكاري","أساسي","علمي"],"a":1,"f":"الموازنة بين السلبيات والإيجابيات (كأسلوب PMI) تفكير ابتكاري وفق الإجابة المعتمدة؛ وقد تُنسب أحياناً إلى التفكير الناقد لأنها تتضمن حكماً."},{"s":"أسئلة المعيار الثامن","n":51,"q":"عند كتابة الأهداف السلوكية يجب كتابة:","o":["سلوك المعلم","سلوك المتعلم","طريقة التعلم","الهدف النهائي للتعلم"],"a":1,"f":"الهدف السلوكي يصف ما سيؤديه المتعلم بعد التعلم (أن + فعل سلوكي + المتعلم)، فيُكتب سلوك المتعلم لا المعلم، ويُركَّز على الناتج لا طريقة التعلم."},{"s":"أسئلة المعيار الثامن","n":52,"q":"أي العبارات الآتية تعتبر صحيحة:","o":["تصميم التدريس هو عمل جماعي، تصميم التعليم هو عمل فردي","تصميم التدريس يرتبط بالحصة، تصميم التعليم يرتبط بالمادة التعليمية","تصميم التدريس هو نظام شامل، تصميم التعليم هو نظام جزئي","لا يوجد فرق بين تصميم التعليم وتصميم التدريس"],"a":1,"f":"تصميم التدريس أضيق نطاقاً ويرتبط بالحصة والموقف الصفي، أما تصميم التعليم فأوسع ويرتبط بالمادة والمقرر التعليمي."},{"s":"أسئلة المعيار الثامن","n":53,"q":"يُعد الكشف عن الخبرات السابقة للمتعلم من مهام المعلم عند تقديم مفهوم جديد، فأي مما يلي يمكن استخدامه لذلك؟","o":["القراءة الجهرية","الأسئلة المفتوحة","التقييم المستمر","الأنشطة التعاونية"],"a":1,"f":"الأسئلة المفتوحة تتيح للطلاب التعبير بحرية عمّا يعرفونه عن المفهوم، فتكشف خبراتهم السابقة وتصوراتهم قبل البدء بالتدريس."},{"s":"أسئلة المعيار الثامن","n":54,"q":"أي مما يلي يعبر عن الهدف السلوكي؟","o":["عبارة عامة تصف ما ينبغي اكتسابه من دراسة الموضوع","عبارة محددة تصف ما يجب أن يكتسبه المتعلم بعد ممارسة نشاط معين","عبارة تصف ما يجب اكتسابه من وحدة تعليمية معينة","عبارة تصف ما يجب اكتسابه من مادة دراسية محددة"],"a":1,"f":"الهدف السلوكي عبارة محددة تصف ما سيستطيع المتعلم فعله بعد نشاط تعليمي معين، أما العبارات العامة عن الوحدة أو المادة فأهداف عامة أو خاصة أوسع."},{"s":"أسئلة المعيار الثامن","n":55,"q":"إذا أراد المعلم استخدام تقنيات التعليم لتوسيع نطاق فهم الطلاب لعملية الاستقصاء العلمي؛ فأي من الأنشطة الطلابية الآتية أكثر فعالية في تحقيق هذا الهدف:","o":["استخدام برمجيات المحاكاة لتصميم وإجراء النشاط العلمي","استخدام برنامج الرسام المطور","استخدام الإنترنت للبحث عن الاكتشافات العلمية الحديثة","البحث عن عرض عملي في الإنترنت لعرض نشاط مشابه لنشاط الكتاب"],"a":0,"f":"برمجيات المحاكاة تتيح للطالب تصميم التجربة وتنفيذها وملاحظة النتائج بنفسه، فتعمّق فهمه لخطوات الاستقصاء العلمي، بعكس البحث عن معلومات أو عروض جاهزة."},{"s":"أسئلة المعيار الثامن","n":56,"q":"فن توظيف الإمكانيات المتاحة من أجل تحقيق الأهداف التعليمية، والتي تتمثل في مجموعة إجراءات التدريس التي يختار المعلم تنفيذها أثناء الدرس بهدف حل مشكلة معينة أو لإنجاز هدف معين:","o":["الإستراتيجية التدريسية","المداخل التدريسية","نظريات التعلم","الطريقة التدريسية"],"a":0,"f":"الاستراتيجية التدريسية مجموعة إجراءات يختارها المعلم أثناء الدرس لتحقيق هدف أو حل مشكلة، وهي أعم من الطريقة التي تمثل جزءاً منها."},{"s":"أسئلة المعيار الثامن","n":57,"q":"طلاب في الصف الثالث الابتدائي انتهوا من دراسة وحدة دراسية مرتبطة بالمجتمع، أي من أسئلة التعلم الآتية المتعلقة بالوحدة من شأنها أن تنمي مهارات التفكير الإبداعي للطلاب؟","o":["ما الشيء المهم الذي تعلمته عن مجتمعك خلال دراستك لهذه الوحدة؟","ما الأشياء التي يمكنك القيام بها للحفاظ على مدينتك نظيفة وجميلة؟","ماذا تفعل الشرطة للحفاظ على سلامة وأمن الناس؟","لماذا يستخدم الناس المكتبة العامة في المدينة؟"],"a":1,"f":"سؤال «ما الأشياء التي يمكنك فعلها للحفاظ على مدينتك؟» مفتوح يتطلب توليد أفكار متعددة جديدة، فينمي الإبداع، أما البقية فأسئلة استرجاع وفهم بإجابة محددة."},{"s":"أسئلة المعيار الثامن","n":58,"q":"كتب المعلم على السبورة: (يمكن تعليم الإبداع، اكتشف دقة هذه العبارة). أي من المهارات الآتية ينميها المثال السابق؟","o":["شرح الأفكار","البرهنة والتدليل","استخلاص النتائج","اكتشاف المتناقضات"],"a":1,"f":"طلب التحقق من صحة العبارة يتطلب البحث عن أدلة وحجج تؤيدها، وهذه مهارة البرهنة والتدليل."},{"s":"أسئلة المعيار الثامن","n":59,"q":"(أن يكتشف الطالب الخطأ في الحل)، هذا الهدف وفق تصنيف بلوم للأهداف يقع في مستوى:","o":["التذكر","الفهم والاستيعاب","التركيب","التقويم"],"a":1,"f":"الإجابة المعتمدة الفهم والاستيعاب، لكن اكتشاف الخطأ يتضمن حكماً على صحة الحل وهو أقرب إلى التقويم، فالمسألة محل نظر."},{"s":"أسئلة المعيار الثامن","n":60,"q":"من أهداف تهيئة الدرس:","o":["توفير الوقت والجهد","مراعاة الفروق الفردية","تركيز انتباه الطلاب","تقوية العلاقة بين الطلاب"],"a":2,"f":"الهدف الأساسي من التهيئة جذب الانتباه وتركيز اهتمام الطلاب على الدرس وتهيئتهم له، أما توفير الوقت ومراعاة الفروق فليسا هدفها المباشر."},{"s":"أسئلة المعيار الثامن","n":61,"q":"هي قدرة الفرد على استدعاء أكبر عدد ممكن من الجمل ذات المعنى:","o":["الطلاقة اللفظية","طلاقة التداعي","الطلاقة التعبيرية","الطلاقة الفكرية"],"a":2,"f":"الطلاقة التعبيرية هي القدرة على توليد أكبر عدد من الجمل ذات المعنى، أما اللفظية فتخص الكلمات، والتداعي يخص الكلمات المرتبطة بمعنى معين، والفكرية تخص الأفكار."},{"s":"أسئلة المعيار الثامن","n":62,"q":"(أن يحب الطالب مدرسته)، ما نوع الهدف السلوكي السابق؟","o":["وجداني","عقلي","معرفي","أدائي"],"a":0,"f":"الحب والميل والاتجاه تعبر عن المشاعر والانفعالات، فهي أهداف في المجال الوجداني."},{"s":"أسئلة المعيار الثامن","n":63,"q":"إعطاء الطالب سؤالاً، وجعله يطرح أكبر عدد من الأفكار يسمى بـ:","o":["الأصالة","المرونة","الطلاقة","الاستنتاج"],"a":2,"f":"الطلاقة هي القدرة على توليد أكبر عدد ممكن من الأفكار في زمن محدد، أما المرونة فتنوع الأفكار، والأصالة تفرّدها."},{"s":"أسئلة المعيار الثامن","n":64,"q":"من مهارات التفكير فوق المعرفي:","o":["التمييز بين المصادر الصحيحة","الاستنتاج والاستقراء","المقارنة والتباين","المراقبة والتقييم"],"a":3,"f":"التفكير فوق المعرفي هو التفكير في التفكير، ومن مهاراته التخطيط والمراقبة والتقييم، أما الاستنتاج والمقارنة فمهارات تفكير أساسية أو معرفية."},{"s":"أسئلة المعيار الثامن","n":65,"q":"تستخدم المعلمة (حصة) أسلوب العصف الذهني في تعليم طالباتها باستمرار، وتحفزهن على الانطلاق بالتفكير والتحرر من أي قيود، كما تشجعهن على عدم التردد في توليد أفكار غريبة. ما نوع التفكير الذي يُتوقع أن يُسهم في تطوير طالباتها؟","o":["الناقد","الإبداعي","التأملي","فوق المعرفي"],"a":1,"f":"العصف الذهني بتحرير التفكير من القيود وتوليد أفكار غريبة وكثيرة ينمي التفكير الإبداعي القائم على الطلاقة والأصالة."},{"s":"أسئلة المعيار الثامن","n":66,"q":"إذا أراد المعلم أن يبني هدفاً سلوكياً جيداً؛ فإن أهم الشروط التي يجب مراعاتها أن يتناول الهدف:","o":["ناتج التعلم","موضوع التعلم","عملية التعلم","نشاط التعلم"],"a":0,"f":"أهم شروط الهدف السلوكي أن يصف ناتج التعلم، أي ما سيستطيع المتعلم أداءه بعد التعلم، لا الموضوع أو النشاط أو العملية."},{"s":"أسئلة المعيار الثامن","n":67,"q":"أن يكتب التلميذ تقريراً يتضمن الأفكار الرئيسية للدرس، هذا الهدف بمستوى:","o":["التحليل","التطبيق","التركيب","التقويم"],"a":2,"f":"كتابة تقرير يجمع الأفكار الرئيسية وينظّمها في عمل جديد يعبّر عن مستوى التركيب في تصنيف بلوم."},{"s":"أسئلة المعيار الثامن","n":68,"q":"أي التصنيفات الآتية يتناول المستويات العليا للأهداف النفس حركية؟","o":["الاستقبال - الاستجابة - التقمص","الملاحظة - التقليد - التجريب","الممارسة - الإتقان - الإبداع","التقدير - التنظيم - التجسيد"],"a":2,"f":"في تصنيف المجال النفس حركي تأتي الممارسة والإتقان والإبداع في المستويات العليا، بينما الملاحظة والتقليد والتجريب من المستويات الدنيا."},{"s":"أسئلة المعيار الثامن","n":69,"q":"أن يكتب الطالب جملة ويشكلها بالحركات بطريقة صحيحة. أي مما يأتي يُعد خطأ في الهدف السلوكي؟","o":["لا يمكن ملاحظة الهدف السلوكي","يوجد أكثر من فعل سلوكي","الفعل غير قابل للقياس","يركز الفعل على الأداء"],"a":1,"f":"الهدف يشترط فعلاً سلوكياً واحداً، وهنا ورد فعلان (يكتب ويشكّل)، فهذا هو الخطأ، أما الفعلان فيمكن ملاحظتهما وقياسهما."},{"s":"أسئلة المعيار الثامن","n":70,"q":"أي الأهداف التالية يمكن قياسها؟","o":["أن يلم الطالب بكتابة تنوين الفتح","أن يدرك الطالب كتابة تنوين الضم","أن يفرق الطالب بين تنوين الفتح والكسر","أن يفهم الطالب الفرق بين تنوين الفتح والضم"],"a":2,"f":"الفعل «يفرّق» سلوك ظاهر يمكن ملاحظته وقياسه، أما يلم ويدرك ويفهم فأفعال غير إجرائية يصعب قياسها مباشرة."},{"s":"أسئلة المعيار الثامن","n":71,"q":"أي مما يلي ليس من عناصر تحليل محتوى الدرس؟","o":["المفاهيم والأفكار","الوسائل التعليمية","القيم والاتجاهات","الأنشطة التعليمية"],"a":1,"f":"تحليل المحتوى يشمل المفاهيم والأفكار والقيم والاتجاهات والمهارات والحقائق، أما الوسائل التعليمية فمن عناصر تنفيذ الدرس لا من عناصر المحتوى."},{"s":"أسئلة المعيار الثامن","n":72,"q":"وفقاً لتصنيف الأهداف الوجدانية؛ فإن الاهتمام بالقيمة ومواصلة البحث عنها يندرج تحت مستوى:","o":["تفضيل القيمة","تجسيد القيمة","قبول القيمة","الالتزام بالقيمة"],"a":0,"f":"في تصنيف كراثول الوجداني، مستوى «تفضيل القيمة» يتضمن الاهتمام بالقيمة ومواصلة البحث عنها، وهو أعلى من قبولها وأقل من الالتزام بها."},{"s":"أسئلة المعيار الثامن","n":73,"q":"أي من الأهداف السلوكية التالية يُعد صحيحاً:","o":["أن تفهم الطالبة مقصد الشاعر من النص","أن تدرك الطالبة معنى النص الشعري","أن تقرأ الطالبة النص قراءة صحيحة","أن تقرأ المعلمة النص قراءة صحيحة"],"a":2,"f":"الهدف السلوكي الصحيح يصف سلوكاً ظاهراً قابلاً للقياس للمتعلمة، وهنا «تقرأ الطالبة قراءة صحيحة»، أما تفهم وتدرك فأفعال غير قابلة للقياس، وقراءة المعلمة تصف المعلم."},{"s":"أسئلة المعيار الثامن","n":74,"q":"بعد انتهاء الأستاذ (علي) من درسه، طلب منه المشرف التربوي أن يذكر إيجابيات درسه. في هذا الموقف استخدم المشرف قبعة التفكير:","o":["الصفراء","الحمراء","البيضاء","الزرقاء"],"a":0,"f":"القبعة الصفراء في قبعات التفكير الست لدي بونو ترمز للتفاؤل والإيجابيات، فطلب ذكر الإيجابيات يناسبها."},{"s":"أسئلة المعيار الثامن","n":75,"q":"عندما يستخدم المعلم استراتيجية تدريسية توجه الطلاب إلى التمييز بين الحقائق والآراء في النص المقدم لهم، فإنه يهدف إلى تنمية مهارات:","o":["الاكتشاف","التفكير الناقد","التفكير الذهني","التفكير الإبداعي"],"a":1,"f":"التمييز بين الحقائق والآراء وتقويم النص مهارة أساسية في التفكير الناقد."},{"s":"أسئلة المعيار الثامن","n":76,"q":"من الأفعال التي تُستخدم في صياغة الأهداف المهارية:","o":["يُثمّن","يقدر","يرسم","يعدد"],"a":2,"f":"الفعل «يرسم» يدل على أداء حركي مهاري ظاهر، أما يثمّن ويقدّر فوجدانية، ويعدد معرفي."},{"s":"أسئلة المعيار الثامن","n":77,"q":"توظيف الطالب لخطوات حل المشكلة في معالجة تحديات الحياة اليومية تعني قدرته على:","o":["التفكير الاستقرائي","التفكير التباعدي","التفكير الاكتشافي","التفكير النمطي"],"a":2,"f":"توظيف خطوات حل المشكلة لمعالجة مواقف الحياة يُعد تفكيراً اكتشافياً، لأن المتعلم يكتشف الحل بنفسه عبر خطوات منظمة."},{"s":"أسئلة المعيار الثامن","n":78,"q":"عندما يطلب المعلم من طلابه أن يوازنوا بين الاقتصاد الإسلامي والرأسمالي في ثلاث نقاط رئيسية فهو يقيس مهارة:","o":["التركيب","التقويم","الملاحظة","التفسير"],"a":3,"f":"الموازنة وبيان أوجه الشبه والاختلاف بين الاقتصادين تحتاج إلى تفسير وتحليل للمفاهيم، وهي مهارة التفسير حسب الإجابة المعتمدة."},{"s":"أسئلة المعيار الثامن","n":79,"q":"عندما يخطط المعلم لدرس وفق ميول طلابه، فإن ذلك يعتبر تعليماً:","o":["متمايزاً","تعاونياً","مقلوباً","افتراضياً"],"a":0,"f":"التدريس المتمايز يراعي الفروق بين الطلاب في الميول والقدرات والاستعداد، فيُصمَّم الدرس وفق ميولهم."},{"s":"أسئلة المعيار الثامن","n":80,"q":"عندما يطلب المعلم من الطلاب القيام برسم بياني للمعلومات المعطاة لهم، فإن ذلك يقيس قدرتهم على:","o":["التذكر","التقويم","التحليل","التطبيق"],"a":3,"f":"رسم بيانات معطاة في شكل بياني توظيف لمهارة معروفة في موقف محدد، وهذا مستوى التطبيق."},{"s":"أسئلة المعيار الثامن","n":81,"q":"المجال الذي يهتم بتعلم المهارة وإلقائها هو:","o":["المعرفي","الأدائي","الوجداني","الإدراكي"],"a":1,"f":"المجال الأدائي (النفس حركي) يهتم بالمهارات الحركية وتعلمها وأداءها، بخلاف المعرفي والوجداني."},{"s":"أسئلة المعيار الثامن","n":82,"q":"جميع الأفعال التالية تعبر عن مستوى التقييم، ما عدا:","o":["يصف","يساهم","يقترح","يفرق"],"a":0,"f":"يصف فعل يدل على مستوى الفهم أو التذكر لا على التقييم، أما يساهم ويقترح ويفرق فمرتبطة بالحكم والتقييم في الإجابة المعتمدة."},{"s":"أسئلة المعيار الثامن","n":83,"q":"أي مما يلي يُعد السؤال الأدنى لمستويات بلوم للمعرفة؟","o":["اذكر أسماء الخلفاء الراشدين بالترتيب","قارن بين الخلية النباتية والخلية الحيوانية","اربط بين الكلمات التالية لتكوين جملة مفيدة","فسر حدوث الفصول الأربعة"],"a":0,"f":"ذكر أسماء الخلفاء الراشدين استرجاع للمحفوظ، أي مستوى التذكر، وهو أدنى المستويات، بينما المقارنة والربط والتفسير أعلى منه."},{"s":"أسئلة المعيار الثامن","n":84,"q":"الشعور بالمسؤولية في التعلم التعاوني، هذا الهدف يُصنف:","o":["معرفي","إدراكي","انفعالي","حس حركي"],"a":2,"f":"الشعور بالمسؤولية ميل ومشاعر واتجاه، فهو هدف وجداني (انفعالي) لا معرفي ولا حس حركي."},{"s":"أسئلة المعيار الثامن","n":85,"q":"استخدمت المعلمة (شهد) استراتيجية عبارة عن التعلم الترفيهي مع التعلم التعاوني، وخلقت جواً من المتعة والإثارة في بيئتها الصفية. طبقت (شهد) نموذج:","o":["فورمات","كيجين","فراير","لوحة الخيارات (إكس أو)"],"a":1,"f":"نموذج كيجان (Kagan) للتعلم التعاوني يتضمن هياكل تعاونية مرحة تخلق جواً من المتعة والإثارة، ومنها التعلم الترفيهي."},{"s":"أسئلة المعيار الثامن","n":86,"q":"قام معلم اللغة العربية في الصف الثالث الابتدائي بكتابة بعض الجمل على السبورة، ثم قام بتلوين (ال) القمرية باللون الأحمر، و(ال) الشمسية باللون الأخضر. فعل المعلم ذلك يدل على أنه يريد:","o":["التصنيف","التمييز","التركيز","جذب الانتباه"],"a":1,"f":"تلوين اللام القمرية بلون والشمسية بآخر يساعد الطلاب على التمييز بين النوعين، وهو الغرض من هذا الإجراء."},{"s":"أسئلة المعيار الثامن","n":87,"q":"يعد هذا التخطيط من أهم واجبات المعلم في التدريس:","o":["التخطيط للدرس","التخطيط للوحدة","التخطيط للمقرر","التخطيط للسنة كاملة"],"a":0,"f":"التخطيط للدرس اليومي هو أهم واجبات المعلم لأنه الأكثر ارتباطاً بالتنفيذ المباشر داخل الصف ويترجم خطط الوحدة والمقرر إلى ممارسة."},{"s":"أسئلة المعيار الثامن","n":88,"q":"طلب المشرف التربوي من معلم حديث التعيين اختيار أنسب أدوات التقويم لقياس كل هدف من الأهداف التالية وتضمينها في خطته التدريسية: أن يتحقق الطالب تجريبياً من أثر الضوء على نمو النبات. أن يسمي الطالب مقر جامعة الدول العربية. أن يمثل الطالب على الراء المرققة. أن يقارن الطالب بين الرواية والقصة. فأي الخيارات الآتية يمثل الترتيب الأنسب لقياس الأهداف؟","o":["شفهي - موضوعي - شفهي - مقالي","أدائي - مقالي - شفهي - موضوعي","مقالي - أدائي - موضوعي - شفهي","أدائي - موضوعي - شفهي - مقالي"],"a":3,"f":"التحقق التجريبي يقاس بأداة أدائية، وتسمية المقر معلومة تقاس بسؤال موضوعي، والتمثيل على الراء يقاس شفهياً، والمقارنة تقاس بسؤال مقالي."},{"s":"أسئلة المعيار الثامن","n":89,"q":"تنوعت أساليب المعلمين في تنمية قدرة الطلاب على تدبر قصص القرآن. (محمد) أعطى الطلاب عدداً من الفوائد، وبعد تلاوة الآيات طلب منهم وجه الدلالة عليها. (أحمد) بعد تلاوة الآيات طلب من الطلاب استخراج الفوائد في نقاش جماعي. (إبراهيم) بعد تلاوة الآيات طلب من كل طالب أن يستخرج فائدة من الفوائد. الأكثر فاعلية في تحقيق الهدف هو:","o":["محمد","أحمد","إبراهيم","الجميع متساوون"],"a":0,"f":"أسلوب محمد يعطي الفوائد ثم يطلب وجه الدلالة، وهو يدرب الطالب على الاستدلال والربط بين الآية والفائدة، فهو الأكثر تحقيقاً لهدف التدبر حسب الإجابة المعتمدة."},{"s":"أسئلة المعيار الثامن","n":90,"q":"(حصة) معلمة لمادة العلوم، وجهت السؤال التالي لطالباتها: ماذا يحدث لو انقطعت الكهرباء عن مدينة الرياض لمدة عام كامل؟ أرادت المعلمة من هذا السؤال أن تستثير تفكير طالباتها:","o":["التقاربي","التقويمي","التباعدي","الإجرائي"],"a":2,"f":"السؤال الافتراضي المفتوح «ماذا يحدث لو...» يتطلب إجابات متعددة وتوقعات، وهذا التفكير التباعدي، بعكس التقاربي ذي الإجابة الواحدة."},{"s":"أسئلة المعيار الثامن","n":91,"q":"قام المشرف التربوي بزيارة المعلم، ووجد الطلاب منهمكين في تنفيذ نشاط، فسأل بعض الطلاب أسئلة محددة؛ فاكتشف أن النشاط لا يحقق الهدف. فما الأسئلة التي اكتشف بها المشرف التربوي ضعف النشاط المقدم للطلاب؟","o":["كم - هل - لماذا - متى","أين - ماذا - كيف - متى؟","ماذا - لماذا - هل - متى","لماذا - ماذا - كيف - متى؟"],"a":2,"f":"الأسئلة (ماذا، لماذا، هل، متى) تكشف مدى وعي الطلاب بهدف النشاط ومبرراته وما تعلموه، فيتضح أن النشاط لا يحقق الهدف."},{"s":"أسئلة المعيار الثامن","n":92,"q":"أي المهارات الآتية ينبغي أن يستخدمها المعلم عند طرح الأسئلة لإشراك الطلاب وتعزيز تعلمهم؟","o":["توجيه الأسئلة في مستوى التذكر والحفظ لضمان مشاركة جميع الطلاب","ارتجال الأسئلة لضمان الإجابة عن استفسارات الطلاب كافة","التركيز على الأسئلة الشفهية ذات الإجابات المحددة","اشتقاق الأسئلة مسبقاً من الأهداف ونواتج التعلم"],"a":3,"f":"الأسئلة الجيدة تُخطط مسبقاً وتُشتق من الأهداف ونواتج التعلم لتقيس تحققها، لا ارتجالاً ولا بالتركيز على التذكر فقط."},{"s":"أسئلة المعيار الثامن","n":93,"q":"أي من الأهداف الآتية يُعد في مستوى \"التحليل\" وفق تصنيف (بلوم) للأهداف في المجال المعرفي؟","o":["أن يبين سبب هزيمة المسلمين في معركة أحد","أن يكتب مقالة مكونة من 100 كلمة عن احترام النظام","أن يحدد علاقة الثقافة السائدة في المجتمع بسلوك الأفراد تجاه الأجانب","أن يقترح حلولاً عملية للتغلب على ملوحة المياه في آبار المناطق الساحلية"],"a":2,"f":"تحديد العلاقة بين الثقافة وسلوك الأفراد يتطلب تحليل العناصر والعلاقات، وهو مستوى التحليل، أما كتابة مقالة فتركيب، واقتراح الحلول تركيب."},{"s":"أسئلة المعيار التاسع","n":1,"q":"المعلم المتميز في إدارته لصفه هو الذي يقوم بكل ما يلي ما عدا:","o":["ربط الدرس بواقع حياة الطلاب","يتجنب عبارات تحمل توقعات سلبية عن الطلاب","إثارة التنافس من خلال مقارنة أداء الطالب بغيره","يتجاهل الطلاب الذين يريدون لفت انتباهه بطريقة غير مقبولة"],"a":3,"f":"المعلم المتميز لا يتجاهل السلوك الذي يريد لفت انتباهه بطريقة غير مقبولة، بل يوجهه ويعالجه بأسلوب تربوي، فهذا هو الاستثناء."},{"s":"أسئلة المعيار التاسع","n":2,"q":"يأتي الطالب (يوسف) متأخراً عن موعد بدء الدوام في معظم الأيام، ناقشه رائد الفصل ونبهه أكثر من مرة دون نتيجة، أي الإجراءات الآتية يلزم إتباعها الآن:","o":["عقاب الطالب أمام أقرانه لردعه","تجاهل سلوكه إلى أن يتوقف تلقائياً","الاستمرار بالحديث إلى الطالب","التواصل مع والده لمناقشة المشكلة"],"a":3,"f":"بعد فشل الحوار المتكرر مع الطالب، الخطوة التالية التواصل مع ولي الأمر لمناقشة المشكلة وإشراكه في الحل، دون عقاب علني أو تجاهل."},{"s":"أسئلة المعيار التاسع","n":3,"q":"من المهم أن تُتاح الأنشطة الصفية واللاصفية للطلبة:","o":["بجميع مستوياتهم","المتأخرين دراسياً","المتميزين دراسياً","الأكثر تعاوناً وانضباطاً"],"a":0,"f":"الأنشطة الصفية واللاصفية حق لجميع الطلاب بمختلف مستوياتهم لتحقيق النمو المتكامل، فلا تقتصر على فئة معينة."},{"s":"أسئلة المعيار التاسع","n":4,"q":"من الأساليب التربوية البديلة للعقاب عند صدور سلوك غير مرغوب فيه من إحدى الطلبة لأول مرة:","o":["طرده من الفصل حتى يتعظ زملاؤه","معاقبته أمام زملائه حتى يرجع عن ذلك","التجاهل المقصود حتى لا يتكرر هذا السلوك","إحالته إلى إدارة المدرسة حتى يتم اتخاذ الإجراء المناسب"],"a":2,"f":"التجاهل المقصود من الأساليب التربوية البديلة للعقاب عند صدور سلوك غير مرغوب لأول مرة، لأنه يطفئ السلوك بقطع التعزيز، بعكس الطرد والعقاب العلني."},{"s":"أسئلة المعيار التاسع","n":5,"q":"هي جميع الخطوات والإجراءات اللازمة لبناء بيئة صفية ملائمة لعمليتي التعليم والتعلم والحفاظ على هذه البيئة:","o":["الاتصال التعليمي","الإدارة الصفية","ضبط الصف","إدارة البيئة التعليمية"],"a":1,"f":"الإدارة الصفية هي مجمل الإجراءات اللازمة لتهيئة بيئة صفية ملائمة للتعليم والتعلم والمحافظة عليها، وهي أشمل من ضبط الصف."},{"s":"أسئلة المعيار التاسع","n":6,"q":"ترتكز الإدارة الصفية المتميزة على مجموعة من الأسس والافتراضات والذي ليس منها:","o":["الاعتماد على الممارسات الناتجة عن البحث العلمي لا الارتجال","التركيز على المنحنى الوقائي في الإدارة الصفية","خلق وبناء علاقات إيجابية بين المعلم والطلاب، والطلاب فيما بينهم","الإدارة الصفية تعني الانضباط الصفي والذي يمثل غاية إدارة الصف"],"a":3,"f":"الإدارة الصفية أوسع من الانضباط، فالانضباط وسيلة لا غاية، وبالتالي ليس من أسسها أن تعني الانضباط فقط، أما البقية فمن أسسها."},{"s":"أسئلة المعيار التاسع","n":7,"q":"أي الممارسات أكثر فاعلية في تعريف الطلبة بالقواعد التعريفية الصفية:","o":["مشاركتهم المبكرة والفعّالة في وضعها وصياغتها","إعلانها عبر تثبيتها على لوحة الغرفة الصفية","تضمينها في كتيب خاص بتعليمات الانضباط","التذكير بها في الطابور الصباحي عبر الإذاعة المدرسية"],"a":0,"f":"إشراك الطلاب في وضع القواعد وصياغتها يزيد فهمهم لها وشعورهم بالملكية والالتزام، فهو أفعل من مجرد إعلانها أو التذكير بها."},{"s":"أسئلة المعيار التاسع","n":8,"q":"لضبط إدارة الصف كدخول الطلبة وخروجهم من الفصل ومشاركتهم أثناء الدرس، ينصح المعلم:","o":["بتعويد الطلاب على عدم دخول الفصل وبعده أو المشاركة بدون إذنه","يمنح الطلبة الحرية في الدخول والخروج والمشاركة في الفصل بهدوء","يترك الأمور تسير على طبيعتها ووقت حدوثها يتعامل معها","بوضع مبادئ وقواعد يناقشها مع الطلاب ويلزمهم باتباعها"],"a":3,"f":"وضع قواعد ومبادئ واضحة يناقشها المعلم مع الطلاب ثم يلتزم الجميع بها هو الأسلوب الذي يحقق النظام والمشاركة المنضبطة."},{"s":"أسئلة المعيار التاسع","n":9,"q":"إن معرفة الطالب بنقاط القوة والضعف في تعلمه تساعده على تنمية مستواه التحصيلي، ويمكن للمعلم تحقيق ذلك من خلال استعمال:","o":["التعلم النشط","التغذية الراجعة","التعلم التعاوني","الاختبارات المقننة"],"a":1,"f":"التغذية الراجعة تعرّف الطالب بنقاط قوته وضعفه وتوجه تعلمه، فترفع تحصيله."},{"s":"أسئلة المعيار التاسع","n":10,"q":"قدم معلم التعليقات الآتية كتغذية راجعة لعدد من الطلاب أثناء عملهم على مشاريع بحثية، فأيها أكثر تحقيقاً لمتطلبات التغذية الراجعة البناءة؟","o":["عناصر البحث مكتملة ولكن طريقة التوثيق تحتاج إلى مراجعة، راجع كتاب التوثيق العلمي","اطلع على كتاب في التوثيق، أخطاء كثيرة يتضمنها البحث فضلاً عن صياغة المشكلة","لم يغط البحث الفكرة الأساسية، إلا أن أسلوب الكتابة كان متميزاً","عملك يعتريه بعض أوجه النقص، يبدو أنك تكاسلت عن العمل"],"a":0,"f":"التغذية الراجعة البناءة تحدد الإيجابيات والجوانب المحتاجة للتحسين مع توجيه محدد للتطوير دون أحكام شخصية سلبية، وهو ما يحققه التعليق الأول."},{"s":"أسئلة المعيار التاسع","n":11,"q":"من خصائص التغذية الراجعة الفاعلة جميع ما يلي ما عدا:","o":["موجهة","فورية","متقطعة","كتابية"],"a":2,"f":"التغذية الراجعة الفاعلة موجهة وفورية ومستمرة، والتقطع يضعف أثرها، فهو الصفة المستثناة."},{"s":"أسئلة المعيار التاسع","n":12,"q":"اعتاد المعلم (صالح) على تقديم التغذية الراجعة للطلاب بعد أدائهم للمهمة التعليمية متضمنة الجوانب التي تحتاج إلى تحسين وما ينبغي للطالب عمله لتطوير أدائه ......... المؤشر الرئيسي لقياس فاعلية التغذية الراجعة هو:","o":["التقويم البنائي المساعد على تحسين عملية التعلم","الدعم المناسب للطلاب لرفع مستوى أدائهم","العلاقات الإيجابية لدى الطلاب حول الثقة في النفس وتقدير الذات","التعديل الذاتي الذي يقوم به الطالب للوصول للأهداف"],"a":3,"f":"مؤشر فاعلية التغذية الراجعة قيام الطالب بتعديل أدائه ذاتياً لبلوغ الأهداف بعد تلقيها، وهو الدليل العملي على الاستفادة منها."},{"s":"أسئلة المعيار التاسع","n":13,"q":"يتم توظيف أسلوب النظم في تخطيط المناهج وتطويرها كالتالي:","o":["مدخلات - عمليات - مخرجات - تغذية راجعة","مدخلات - مخرجات - عمليات - تغذية راجعة","عمليات - مدخلات - مخرجات - تغذية راجعة","تغذية راجعة - مدخلات - عمليات - مخرجات"],"a":0,"f":"أسلوب النظم يسير بالترتيب: مدخلات ثم عمليات ثم مخرجات، مع تغذية راجعة تعيد التطوير."},{"s":"أسئلة المعيار التاسع","n":14,"q":"طالب سخر واستهزأ بإجابة زميله، ما التصرف المناسب من المعلم؟","o":["يُعاقب الطالب","يدعه يعتذر لزميله","يُحول السؤال للطالب","أخذه خارج الفصل وتوضيح ما فعل"],"a":1,"f":"الأنسب تربوياً أن يعتذر الطالب لزميله، فيتعلم احترام الآخرين ويُصلح خطأه، دون عقاب مباشر أو إخراجه من الفصل."},{"s":"أسئلة المعيار التاسع","n":15,"q":"شرح معلم العلوم موضوعاً عن الدورة الدموية، ووجه طلابه لإعداد مشروعات عملية، فقام الطالب (أحمد) بإعداد مشروع متميز، شجع المعلم الطالب على توضيح أفكاره أمام زملائه. أي من الآتي يهدف إليه المعلم من هذا الإجراء:","o":["إشراك الطلاب في تقويم جودة عمل زميلهم","مساعدة الطلاب على تطبيق المفاهيم في مواقف جديدة","إتاحة الفرصة للطلاب للفخر بأنفسهم وإنجازاتهم","مساعدة الطلاب على تذكر المعلومات المهمة عن موضوع الدرس"],"a":2,"f":"تشجيع الطالب المتميز على عرض مشروعه أمام زملائه يعزز ثقته ويمنحه فرصة للفخر بإنجازه حسب الإجابة المعتمدة."},{"s":"أسئلة المعيار التاسع","n":16,"q":"معلم يعاني من تأخر بعض الطلاب عن موعد الحصة. ماذا يفعل لحل هذه المشكلة؟","o":["يمنع المتأخرين من دخول الحصة","يقدم في بداية كل حصة اختباراً قصيراً","يجبر المتأخرين على كتابة ما فاتهم من الدرس","يسمح بدخول المتأخرين مع تسجيل مخالفة سلوكية"],"a":3,"f":"السماح بدخول المتأخرين مع تسجيل مخالفة سلوكية يحافظ على حقهم في التعلم ويعالج التأخر بإجراء منظم رادع دون حرمان من الدرس."},{"s":"أسئلة المعيار التاسع","n":17,"q":"أقيمت فعاليات اجتماعية عامة في الحي الذي تقع فيه المدرسة، وكان هناك وجهات نظر مختلفة بين المعلمين حول المشاركة في هذه الفعاليات. أي مما يلي يصف المشاركة في هذه الفعاليات:","o":["تضعف شخصية المعلم عند طلابه","تخرج من الإطار المهني ومتطلبات عمل المعلم","تكسب المعلم مهارات مهنية تسهم في دعم تعلم الطلاب","تكسب المعلم خبرات تدعم تعلم طلابه وتفاعلهم مع المجتمع"],"a":3,"f":"مشاركة المعلم في فعاليات الحي تكسبه خبرات تدعم تعلم طلابه وتعزز تفاعلهم مع المجتمع، فهي ضمن الدور المهني الموسع للمعلم."},{"s":"أسئلة المعيار التاسع","n":18,"q":"تشكو معلمة الجغرافيا المستجدة لزميلاتها في المدرسة من صعوبة فهم طالباتها للفكرة المجردة بالدرس. أي الآتي هو الحل الأمثل للمعلمة لتجاوز ذلك؟","o":["تدل المعلمة الطالبات على المراجع المتخصصة في المادة","توجه الطالبات للبحث عن معلومات في مصادرها الأصلية","تجعل معلمة ذات خبرة بالمدرسة تشرح الفكرة المجردة للطالبات","تدخل التقنية الحديثة كالبرمجيات وغيرها لتسهيل المعلومات وتوضيحها"],"a":3,"f":"الأفكار المجردة يسهل فهمها بالبرمجيات والتقنية التي تحول المجرد إلى محسوس مرئي، وهو أنسب من الإحالة إلى المراجع أو شرح زميلة."},{"s":"أسئلة المعيار التاسع","n":19,"q":"إذا ابتسم المعلم فور أداء الطالب فإن التعزيز:","o":["أولي","ثانوي","معنوي","مادي"],"a":2,"f":"الابتسامة تعزيز معنوي (اجتماعي) لا يتضمن شيئاً مادياً، بخلاف المادي كالهدية والأولي كالطعام."},{"s":"أسئلة المعيار التاسع","n":20,"q":"يحرص معلم الأحياء على تكليف الطلاب بجمع عينات عن نباتات البيئة، ويتعاون معهم على تنفيذ تجارب علمية إثرائية داخل المعمل، إن استراتيجية إثارة الدافعية التي يستخدمها المعلم هي:","o":["ربط أهداف الدرس بالاحتياجات النفسية والذهنية","ربط المفاهيم العلمية بتطبيقاتها العملية والحياتية","تنويع البيئة التعليمية داخل الصف","العملية والحياتية"],"a":1,"f":"جمع عينات من البيئة وإجراء تجارب إثرائية يربط المفاهيم العلمية بتطبيقاتها العملية والحياتية، وهذا ما يثير دافعية الطلاب."},{"s":"أسئلة المعيار التاسع","n":21,"q":"طرح المعلم على طلابه مشكلة تلوث مياه البحر، وأراد منهم جميعاً أن يشاركوا في حل هذه المشكلة. أي الأسئلة الآتية هو الأنسب لإيجاد حلول مبتكرة لهذه المشكلة؟","o":["اذكر الحلول التي ذكرها الأقدمون لحل هذه المشكلة","أقدم جميع الأفكار الممكنة لعلاج المشكلة","اقترح فكرة واحدة جيدة لعلاج المشكلة","ما الحل الصحيح لعلاج المشكلة"],"a":1,"f":"طلب أكبر عدد ممكن من الأفكار يثير الطلاقة ويشجع الحلول المبتكرة، أما السؤال عن حل واحد أو صحيح أو من الأقدمين فيقيّد الإبداع."},{"s":"أسئلة المعيار التاسع","n":22,"q":"أعد معلم علم الأرض رحلة علمية للتعرف على الصخور في محيط المدينة، فعرض عليه أحد أولياء الأمور مشاركته وذلك لكونه متخصصاً في هذا المجال ويمكن أن يقدم بعض المعلومات التي قد تساعد الطلاب. أي الإجراءات التالية هو الأنسب:","o":["يوكل له أمر الرحلة بصفته متخصصاً","يعطيه دوراً في الرحلة لاستثمار خبرته","يعتذر منه كي لا يتدخل أولياء الأمور في الأنشطة الخاصة بالطلاب","يتجاهله حتى لا يتفوق ولي الأمر، فيظهر ذلك للطلاب"],"a":1,"f":"إتاحة دور لولي الأمر المتخصص يستثمر خبرته ويعزز الشراكة مع الأسرة، دون إسناد الرحلة كلها إليه أو تجاهله."},{"s":"أسئلة المعيار التاسع","n":23,"q":"علم المعلم بأن المشرف التربوي سوف يقوم بالزيارة الإشرافية الأولى له، فأي الإجراءات التالية ينبغي عليه اتخاذها لضمان مساهمة الإشراف في تطوره المهني:","o":["الاستعانة بالمشرف لاستنباط أكبر عدد من الأفكار حول الطرق البديلة والملائمة لتقديم محتوى المادة","تزويد المشرف بالبحوث التي تبرز استخدام الطرق التدريسية التي يستخدمها في التدريس","مناقشة المشرف في النقاط التي يشعر المعلم بحاجته لتطويرها وطلب رأيه فيها وتقويمها له","الطلب من المشرف أن يطلع على الطرق التي يقدمها زملاؤه الذين أجادوا في تقويمات مشابهة"],"a":2,"f":"الإشراف التطويري يتطلب أن يحدد المعلم نقاط احتياجه ويناقشها مع المشرف ويطلب رأيه وتقويمه، فيستفيد من الزيارة في نموه المهني."},{"s":"أسئلة المعيار التاسع","n":24,"q":"أي من الممارسات الآتية صحيحة ويمكن للمعلم القيام بها في مرحلة ختم وإنهاء الدرس؟","o":["تحديد أجزاء الدرس التي ستدخل في الاختبار","تأجيل أسئلة الطلبة ليبدأ بها الدرس القادم","اختيار الطلبة غير المنتبهين لتلخيص الدرس","تلخيص الأفكار الرئيسة والمهمة في الدرس"],"a":3,"f":"تلخيص الأفكار الرئيسة والمهمة هو الممارسة الصحيحة عند ختم الدرس، لأنه يثبّت التعلم ويربط أجزاءه."},{"s":"أسئلة المعيار التاسع","n":25,"q":"أثناء اطلاع المعلم (خالد) على أحد الأبحاث الحديثة، وجد إحدى النظريات تصنف المعالجة إلى معالجة سطحية وعميقة، إذا أراد المعلم توجيه زملائه لتعزيز المعالجة العميقة فإن الإجراء المناسب مع الطلاب هو:","o":["تقديم معززات إيجابية متنوعة","توظيف الوسائل التعليمية المثيرة للاهتمام","تقديم حقائق إضافية تثري الموضوع الدراسي","تشجيع الطلاب على طرح أسئلة متنوعة حول المعنى والمضمون"],"a":3,"f":"المعالجة العميقة تتحقق بالتركيز على المعنى وفهم المضمون، فتشجيع الطلاب على طرح أسئلة حول المعنى والمضمون يعززها، أما المعززات والحقائق الإضافية فتخدم المعالجة السطحية."},{"s":"أسئلة المعيار التاسع","n":26,"q":"كان (أحمد) معلماً مميزاً في إلقاء الدروس بقواعد النحو، مع الثقة العالية في حديثه الذي يحافظ فيه على نبرة صوت واحدة مرتفعة، ويُكثر من الاستناد إلى الأدلة العلمية لدعم فكرته. ما وجه القصور في مهارات أحمد في حديثه:","o":["الحفاظ على نبرة صوت واحدة مرتفعة تؤدي للرتابة وتشتت انتباه الطلاب","تزيد تعاون الطلاب والتزامهم","تثير الغيرة في نفوس بقية المجموعات","تقضي على مسببات الإزعاج في الفصل"],"a":0,"f":"الثبات على نبرة صوت واحدة مرتفعة يسبب الرتابة والملل ويشتت الانتباه، فمهارة الصوت تتطلب التنويع بحسب المعنى."},{"s":"أسئلة المعيار التاسع","n":27,"q":"شكا المعلم (فيصل) للمشرف التربوي ضعف انتباه أحد الطلاب وقلة تركيزه أثناء الدرس وعدم قدرته على مجاراة زملائه في حل الأنشطة الصفية، فأرشده المشرف إلى:","o":["تضمين معيار الانضباط والتركيز في قائمة الانضباط الصفي","عرض مشهد تمثيلي عن أهمية الانتباه والتركيز أثناء عملية التعلم","تدعيم الشرح بنبرات صوتية متنوعة، ولغة جسد، وإشارات مناسبة","منح الطالب فرصة لتحريك جسده، وتغيير وضع جلوسه بصفة دورية"],"a":2,"f":"ضعف الانتباه يُعالج بتنويع مثيرات الشرح (نبرة الصوت ولغة الجسد والإشارات) لجذب الحواس وتجديد التركيز، بينما قوائم الانضباط والتمثيل لا تعالج سبب التشتت مباشرة."},{"s":"أسئلة المعيار التاسع","n":28,"q":"يحدث السلوك غير المقبول نتيجة لعدة أخطاء منها:","o":["الدلال الزائد","النشاط الزائد","الرفقة السيئة","جميع ما سبق صحيح"],"a":3,"f":"السلوك غير المقبول له أسباب متعددة تشمل التدليل الزائد والنشاط الزائد ورفقة السوء، ولذلك فجميع الخيارات صحيحة معاً."},{"s":"أسئلة المعيار التاسع","n":29,"q":"أفضل طريقة لقياس السلوك:","o":["المقابلة السلوكية","قوائم الرصد الشطب","قياس ناتج السلوك","الملاحظة المباشرة"],"a":2,"f":"⚠ قياس ناتج السلوك (كعدد الواجبات المنجزة أو الأوراق المسلّمة) يعطي دليلاً ملموساً ودائماً يمكن مراجعته، لذا يُعد أدق طريقة للقياس في هذا السياق مقارنةً بالملاحظة التي تتأثر بالمُلاحِظ."},{"s":"أسئلة المعيار التاسع","n":30,"q":"إجراء يعمل على تقليل أو إيقاف السلوك غير المرغوب فيه من خلال إزالة المعززات الإيجابية في مدة زمنية محددة مباشرة بعد حدوث ذلك السلوك، هذا نموذج من أساليب تعديل السلوك يسمى:","o":["عقاب","إقصاء","العقد السلوكي","الاقتصاد الرمزي"],"a":1,"f":"الإقصاء (العزل) هو سحب المعزز الإيجابي لمدة زمنية محددة عقب السلوك غير المرغوب مباشرة؛ أما العقاب فلا يشترط هذا الأسلوب."},{"s":"أسئلة المعيار التاسع","n":31,"q":"هو أحد أساليب تعديل السلوك التي تستخدم لتكوين عادات سلوكية جديدة، أو إضافة سلوكيات جديدة إلى خبرة الفرد السلوكية التي يحتاجها لإتمام عملية التكيف:","o":["التشكيل","الإقصاء","العقد السلوكي","الاقتصاد الرمزي"],"a":0,"f":"التشكيل أسلوب لبناء سلوك جديد عبر تعزيز التقريبات المتتابعة نحو السلوك المستهدف خطوة بخطوة، أما الإقصاء فهدفه خفض السلوك لا بناؤه."},{"s":"أسئلة المعيار التاسع","n":32,"q":"أداء الفرد لسلوك غير مرغوب منه سيكلفه شيئاً معيناً ويحرمه أو يُفقده بعض المميزات الموجودة لديه، هنا يتم تعديل السلوك عن طريق:","o":["ضبط المثير","التسلسل","تكلفة الاستجابة","لا شيء مما سبق"],"a":2,"f":"تكلفة الاستجابة أسلوب يفقد فيه الفرد جزءاً من معززاته أو امتيازاته نتيجة سلوكه غير المرغوب، فيقلّ تكرار هذا السلوك."},{"s":"أسئلة المعيار التاسع","n":33,"q":"من أمثلة التصحيح الزائد:","o":["إزالة الضرر الذي تسبب فيه","إزالة الضرر الذي تسبب فيه مع تكليفه بأعمال أخرى","تنبيه الطالب فقط يكفي","لا شيء صحيح مما سبق"],"a":1,"f":"التصحيح الزائد يعني إزالة الضرر الذي سببه الطالب مع تكليفه بعمل إضافي (تحسين البيئة أكثر مما كانت عليه)، فهو أشمل من التصحيح البسيط."},{"s":"أسئلة المعيار التاسع","n":34,"q":"من أمثلة التصحيح البسيط:","o":["إزالة الضرر الذي تسبب فيه","إزالة الضرر الذي تسبب فيه مع تكليفه بأعمال أخرى","نكتفي بتنبيهه فقط","لا شيء صحيح مما سبق"],"a":0,"f":"التصحيح البسيط يقتصر على أن يزيل الطالب الضرر الذي تسبب فيه وإعادة الحال لما كانت عليه دون تكليف إضافي، وهذا ما يميزه عن التصحيح الزائد."},{"s":"أسئلة المعيار التاسع","n":35,"q":"يُقصد بمبدأ بريماك:","o":["استخدام سلوك محبب لدى الطالب كمعزز لسلوك آخر","إسناد بعض الأعمال للطالب وإشغاله بها","تكليف الطالب بأعمال غير محببة له","لا شيء مما سبق صحيح"],"a":0,"f":"مبدأ بريماك هو استخدام نشاط أو سلوك محبب لدى الطالب (عالي الاحتمال) كمعزز لأداء سلوك أقل تفضيلاً، مثل «ذاكر أولاً ثم العب»."},{"s":"أسئلة المعيار التاسع","n":36,"q":"وضح المعلم (خالد) لطلاب الصف الرابع الابتدائي أن الكتابة على الدفتر مقبولة والكتابة على الجدران غير مقبولة، بذلك عدّل سلوك طلابه عن طريق:","o":["الإقصاء","الإطفاء","النقد السلوكي","التمييز"],"a":3,"f":"التمييز هو تعليم الطالب أن السلوك يُقبل في موقف (الدفتر) ويُرفض في موقف آخر (الجدران)، فيتعزز في الأول ولا يتعزز في الثاني."},{"s":"أسئلة المعيار التاسع","n":37,"q":"خالد كثير الكلام في الفصل والمعلم يتعمد دائماً تجاهله، بذلك يستخدم المعلم في تعديل سلوكه أسلوب:","o":["التغذية","الإطفاء","التعميم","لا شيء"],"a":1,"f":"الإطفاء هو إيقاف السلوك بسحب التعزيز الذي يحافظ عليه، ومنه تجاهل الانتباه المتعمّد لسلوك الطالب المزعج الذي يطلب به الاهتمام."},{"s":"أسئلة المعيار التاسع","n":38,"q":"(خالد) طالب خجول، لاحظ المرشد الطلابي ذلك فحاول معالجة الأمر، وطلب منه أن يلقي كلمة في الطابور الصباحي، بذلك استخدم المرشد الطلابي أسلوب:","o":["العقد السلوكي","النمذجة","الإقصاء","الغمر والإغراق"],"a":3,"f":"الغمر (الإغراق) أسلوب علاجي يُعرَّض فيه الفرد للموقف المخيف مباشرة وبكثافة، كتكليف الخجول بإلقاء كلمة أمام الجميع، بخلاف النمذجة القائمة على المحاكاة."},{"s":"أسئلة المعيار التاسع","n":39,"q":"يُقصد بالإدارة الصفية القيام بعدد من الأعمال منها:","o":["توفير مناخ عاطفي واجتماعي","تنظيم بيئة الصف","حفظ النظام","جميع ما سبق"],"a":3,"f":"الإدارة الصفية مفهوم شامل يتضمن توفير المناخ العاطفي والاجتماعي وتنظيم بيئة الصف وحفظ النظام، فكل الخيارات صحيحة."},{"s":"أسئلة المعيار التاسع","n":40,"q":"أراد معلم الدراسات الإسلامية الجديد أن يجعل الحصة ذات طبيعة تفاعلية؛ فأثار حماس الطلاب من خلال المناقشات الحية، إلا أنه فقد السيطرة على ضبط الصف وأصبح كل طالب يصرخ بالإجابة. كيف يمكن للمعلم تجنب هذه المشكلة مستقبلاً مع المحافظة على حماس الطلاب؟","o":["يكون أكثر حزماً في تعامله مع الطلاب","يحدد اسم الطالب قبل أن يطرح السؤال","يطلب أن تكون الإجابات مكتوبة لا منطوقة","يقلل من الأنشطة التفاعلية داخل غرفة الصف"],"a":1,"f":"تحديد المعلم اسم الطالب قبل طرح السؤال ينظّم المشاركة ويمنع الإجابات الجماعية العشوائية مع بقاء الحماس، بخلاف الحزم أو تقليل التفاعل."},{"s":"أسئلة المعيار التاسع","n":41,"q":"لاحظ المعلم أن الطالب (هيثم) يتردد بالمشاركة أثناء الأنشطة الصفية. ما الإجراء المناسب الذي على المعلم أن يقوم به تجاه الطالب؟","o":["التركيز عليه في الأسئلة لكسر التردد","الطلب من زملائه مساعدته في الإجابة","توجيه أسئلة للطالب تتناسب مع قدراته","عدم إحراجه أمام الطلاب بتوجيه أسئلة إليه"],"a":2,"f":"الطالب المتردد يُشجَّع بأسئلة تناسب قدراته فيحقق النجاح وتزداد ثقته تدريجياً، أما الضغط عليه أو تجاهله فلا يعالج التردد."},{"s":"أسئلة المعيار التاسع","n":42,"q":"عندما تريد نشر اسم طالب والإشادة به في موقع المدرسة الإلكتروني تعزيزاً له، فإن أول خطوة تقوم بها هي:","o":["أخذ موافقة الموجه الطلابي","أخذ موافقة مدير المدرسة","أخذ موافقة ولي الأمر","لا تحتاج موافقة أحد"],"a":2,"f":"نشر اسم الطالب أو صورته في موقع المدرسة يمس خصوصيته، فتكون أول خطوة هي موافقة ولي أمره قبل أي إجراء آخر."},{"s":"أسئلة المعيار التاسع","n":43,"q":"مجمل العمليات التي يبذلها المعلم والطلاب في الصف وهدفها توفير الإمكانات والمناخ النفسي المناسب للقيام بعمليتي التعليم والتعلم واستمرارها من أجل بلوغ الأهداف المخطط لها هي:","o":["الأساليب الصفية","الإدارة الصفية","الأنشطة الصفية","التقنيات الصفية"],"a":1,"f":"الإدارة الصفية هي مجمل العمليات التي يبذلها المعلم والطلاب لتهيئة الإمكانات والمناخ النفسي المناسب لاستمرار التعليم وتحقيق الأهداف."},{"s":"أسئلة المعيار التاسع","n":44,"q":"قرع جرس بدء الدوام الساعة السابعة صباحاً، كان هناك 18 طالباً من أصل 24 طالباً ......... نادى المعلم بصوت مرتفع: \"يا طلاب اجلسوا\"، وبعد جهد كبير نجح المعلم في جعل معظم الطلاب يجلسون ......... من أجل معالجة المشكلة السابقة لابد في البداية من:","o":["تفعيل قانون العقوبات في المدرسة","تحضير درس أكثر متعة وجاذبية للطلاب","وضع نظام مكافآت لتشجيع السلوك الجيد","مناقشة الطلاب في السلوكيات المتوقعة منهم"],"a":3,"f":"التأخر الجماعي مشكلة تعالج أولاً بتوضيح السلوكيات المتوقعة ومناقشتها مع الطلاب لبناء قواعد واضحة، فالوقاية والاتفاق يسبقان العقاب والتعزيز."},{"s":"أسئلة المعيار التاسع","n":45,"q":"صنف إدجار ديل الوسائل التعليمية على أساس الخبرات التي تهيئها الوسائل في كتابه (الطرق السمعية والبصرية) في شكل مخروط يسمى مخروط الخبرة. الخبرات الموجودة في أعلى قمة الهرم هي:","o":["مجردة","مباشرة","معدلة","واقعية"],"a":0,"f":"في مخروط الخبرة لإدجار ديل تقع الخبرات المجردة (الرموز اللفظية) في القمة، وتتدرج نزولاً حتى الخبرات المباشرة الهادفة في القاعدة."},{"s":"أسئلة المعيار التاسع","n":46,"q":"من سمات الشخصية لجذب انتباه المستمعين:","o":["المحافظة على وتيرة صوت واحدة","التواصل البصري مع المستمعين","محاولة الخروج عن الموضوع","استخدام الكلمات الغريبة"],"a":1,"f":"التواصل البصري مع المستمعين من سمات المتحدث الجاذب للانتباه؛ أما رتابة الصوت والخروج عن الموضوع والكلمات الغريبة فتنفّر المستمع."},{"s":"أسئلة المعيار التاسع","n":47,"q":"(البرمجيات الافتراضية) يمكن للمعلم استخدامها على أنها أحد أدوات الخبرات:","o":["غير المباشرة","المحسوسة","المجردة","المباشرة"],"a":0,"f":"البرمجيات الافتراضية والمحاكاة تقدم تجربة بديلة عن الواقع وليست الواقع نفسه، فتُصنَّف ضمن الخبرات غير المباشرة في مخروط ديل."},{"s":"أسئلة المعيار التاسع","n":48,"q":"بدأ المعلم الحصة بذكر موقف يتكرر كثيراً في إحدى الألعاب الإلكترونية الشائعة بين الطلاب وجعله مدخلاً للدرس، وقد نجح المعلم بذلك في:","o":["استثارة اهتمام الطلاب","الاستفادة من تقنيات التعليم","تقريب الموضوع الجديد لأذهان الطلاب","محاولة التحذير من الألعاب الإلكترونية"],"a":0,"f":"ربط مدخل الدرس بموقف من لعبة يحبها الطلاب هدفه جذب اهتمامهم وإثارة دافعيتهم في بداية الحصة (التهيئة)، لا التحذير من الألعاب."},{"s":"أسئلة المعيار التاسع","n":49,"q":"يشعر الطالب (أحمد) بالخجل من زملائه. أي من الآتي يُعد خطأ في معالجة هذه المشكلة:","o":["تعزيز ما يصدر عن الطالب من إجابات","إعادة رأي الطالب الصحيح وتكرار اسمه","تجنب توجيه الأسئلة للطالب منعاً للإحراج","الاقتراب من الطالب أثناء الإجابة وهز الرأس عند الحديث"],"a":2,"f":"تجنب توجيه الأسئلة للطالب الخجول يزيد عزلته ويرسخ خجله، والصواب تشجيعه تدريجياً وتعزيز إجاباته وإشراكه بلطف."},{"s":"أسئلة المعيار التاسع","n":50,"q":"(مريم) معلمة في المرحلة المتوسطة، تريد إنشاء بيئة تعليمية منتجة لطالباتها. أي مما يلي يجب أن تركز عليه مريم أولاً؟","o":["مساعدة طالباتها على اتخاذ قرارات بشأن وظائفهن وخططهن الأكاديمية المستقبلية","تنمية الشعور بالثقة بين الطالبة والمعلمة","التواصل مع المسؤولين والإداريين للتعرف على احتياجات الطالبات","تقييم قدرة الطالبات على تطبيق التفكير الملموس ومهارات حل المشكلات"],"a":1,"f":"الثقة بين المعلمة والطالبات هي الأساس الذي تُبنى عليه البيئة المنتجة، فتتقدم على التخطيط الأكاديمي أو تقييم المهارات."},{"s":"أسئلة المعيار التاسع","n":51,"q":"من الطرق التي تمكن المعلم من معرفة سبب إساءة تصرف الطالب في الصف:","o":["السجلات القصصية","ملخصات عن حضور الطلاب","حالات الانضباط","درجات الطلاب"],"a":2,"f":"سجلات حالات الانضباط توثق السلوكيات ومواقفها وتكرارها فتكشف أسباب سوء التصرف، أما الدرجات والحضور فمؤشرات عامة لا تفسر السلوك."},{"s":"أسئلة المعيار التاسع","n":52,"q":"جميع ما يلي أساليب غير تربوية في ضبط الصف، ما عدا:","o":["التهديد","التوبيخ","الانضباط الذاتي","السيطرة"],"a":2,"f":"التهديد والتوبيخ والسيطرة أساليب قسرية غير تربوية، أما الانضباط الذاتي فهو الهدف التربوي المنشود لأن الطالب يضبط سلوكه من داخله."},{"s":"أسئلة المعيار التاسع","n":53,"q":"أي العبارات الآتية تصف طالباً نمطه المفضل في التعلم (حسي)؟","o":["يدرك الأنماط والعلاقات","يهتم بالرسوم البيانية والخرائط","يميل لحل المسائل الرياضية","يستمتع بتركيب المجسمات"],"a":3,"f":"الطالب الحسي (الحركي) يتعلم باللمس والعمل اليدوي، ومنه الاستمتاع بتركيب المجسمات؛ أما الرسوم والخرائط فللبصري والمسائل الرياضية للمنطقي."},{"s":"أسئلة المعيار التاسع","n":54,"q":"قام الطالب (بدر) بسلوك غير مرغوب فيه أثناء الحصة الدراسية، ما الإجراء المناسب الذي يجب أن يقوم به المعلم؟","o":["يخرج الطالب من الحصة ويكمل الدرس","ينقل الموقف لمدير المدرسة لمعالجة المشكلة","يحاور الطالب في أسباب سلوكه أمام الطلاب","يتوقف قليلاً ليشعر الطالب بسلوكه غير المرغوب فيه، ثم يحاوره منفرداً"],"a":3,"f":"الأسلوب التربوي أن يلفت المعلم نظر الطالب بتوقف قصير دون إحراج ثم يحاوره على انفراد، حفاظاً على كرامته وعلى سير الدرس."},{"s":"أسئلة المعيار التاسع","n":55,"q":"ظهرت لدى المعلم مشكلة أثناء تشجيع الطلاب وتحفيزهم، تمثلت في منافسة شديدة بين طالبين يخشى أن تكون آثارها سلبية. ما العلاج المناسب لهذه المشكلة؟","o":["توجيه نصيحة مباشرة لهما","خفض مستوى تشجيعهما","تكليفهما بعمل مشترك","نقل أحدهما لصف آخر"],"a":2,"f":"تكليف المتنافسين بعمل مشترك يحوّل التنافس السلبي إلى تعاون وهدف مشترك، وهو أنسب من النصح المباشر أو خفض التشجيع أو النقل."},{"s":"أسئلة المعيار التاسع","n":56,"q":"بحسب قواعد السلوك والمواظبة لطلاب المرحلتين المتوسطة والثانوية، ما الإجراء الذي لا يُعد ضمن الإجراءات المعتمدة حيال اعتداء أحد الطلاب على زميله بالضرب والإيذاء؟","o":["إشعار ولي الأمر","نقل الطالب لفصل آخر","تعهد خطي يكتبه الطالب","عقاب الطالب أمام زملائه بما يوازي خطأه"],"a":3,"f":"قواعد السلوك والمواظبة لا تجيز العقاب أمام الزملاء لأنه يمس الكرامة؛ المعتمد هو إشعار ولي الأمر والتعهد الخطي ونقل الطالب لفصل آخر."},{"s":"أسئلة المعيار التاسع","n":57,"q":"بعد أن بدأ المعلم (ماجد) بعرض مفهوم جديد في الحصة، تشتت انتباه عدد من الطلاب نتيجة انشغالهم بالحديث الجانبي، أي الممارسات الآتية أكثر ملاءمة للتعامل مع الموقف؟","o":["يتوقف عن عرض المفهوم، ولفت انتباه جميع الطلاب لأقرانهم غير المنتبهين","يقف وينظر نحو الطلاب غير المنتبهين ثم يطلب من أحدهم تفسيراً لسلوكه","يتوقف ويطلب من الطلاب غير المنتبهين أن يقفوا في زاوية الصف","يتوقف عن الكلام ويبدأ بعملية مسح بصري للطلاب حتى يتوقفوا عن الحديث"],"a":3,"f":"التوقف الصامت مع المسح البصري أسلوب غير لفظي هادئ يلفت انتباه المتحدثين دون إحراج أو مقاطعة، بخلاف العقاب أو المساءلة العلنية."},{"s":"أسئلة المعيار التاسع","n":58,"q":"أي مما يأتي من الأنشطة الأكثر فعالية لتعزيز قيم طلاب المرحلة المتوسطة للوقاية من المخدرات؟","o":["عرض أشرطة الفيديو التي تصور النتائج والعقوبات القانونية المترتبة على الإدمان","تدريب الطلاب على مهارات الرفض","تكليف الطلاب بإجراء أبحاث عن أضرار المخدرات","عرض أفلام وثائقية عن الأضرار الاجتماعية والصحية للمخدرات"],"a":2,"f":"⚠ تكليف الطلاب بالبحث عن أضرار المخدرات يجعلهم يبنون القناعة بأنفسهم ويعزز القيم، وهو الأنسب حسب المفتاح المعتمد، رغم أن مهارات الرفض مهمة أيضاً."},{"s":"أسئلة المعيار التاسع","n":59,"q":"حتى تكون توقعات طلابك عالية ينبغي أن تراعي:","o":["معلومات عن الطلاب من معلمين آخرين","الحالة الاجتماعية والاقتصادية للطالب","قدرات الطلاب ومهاراتهم الحالية","أهداف التعلم المقصودة ونواتجه"],"a":2,"f":"التوقعات العالية الواقعية تُبنى على قدرات الطلاب ومهاراتهم الحالية، فلا تكون مبنية على أحكام الآخرين أو ظروف الطالب الاجتماعية."},{"s":"أسئلة المعيار التاسع","n":60,"q":"لاحظ المعلم ظهور علامات ضعف الانتباه والعزوف عن المشاركة في أنشطة الدرس لدى بعض طلابه. ما الطريقة المناسبة للتعامل مع هذه المشكلة؟","o":["استخدام طرق التدريس المتمركزة حول المعلم","إنهاء الدرس بشكل فوري وإعطاء فترة استراحة للطلاب","إجراء تغيير في أماكن الطلاب، بخاصة الذين ظهر عليهم ضعف الانتباه","التنقل بين الطلاب واستخدام الإيماءات وحركة الإبهام للأعلى وللأسفل"],"a":3,"f":"التنقل بين الطلاب واستخدام الإيماءات والإشارات يعيد انتباههم دون مقاطعة الدرس، وهو أنسب من التمركز حول المعلم أو إنهاء الدرس."},{"s":"أسئلة المعيار التاسع","n":61,"q":"الأنشطة اللاصفية من أدوات:","o":["التقويم القبلي","التقويم البنائي","التقويم الشخصي","التقويم الختامي"],"a":1,"f":"الأنشطة اللاصفية تُستخدم أثناء التعلم لمتابعة نمو الطالب وتحسين أدائه، فهي من أدوات التقويم البنائي (التكويني)."},{"s":"أسئلة المعيار التاسع","n":62,"q":"أول مرحلة من مراحل تطوير المناهج:","o":["تطوير الأساليب التدريسية","تقويم واقع المناهج","الاطلاع على مناهج مماثلة في دول متقدمة","إعداد الوسائل التعليمية وكتب الأنشطة"],"a":1,"f":"تطوير المناهج يبدأ بتقويم الواقع الحالي لتحديد جوانب القوة والضعف والحاجات، ثم تأتي بقية المراحل كالاطلاع وإعداد الوسائل."},{"s":"أسئلة المعيار التاسع","n":63,"q":"في ترتيب مكونات الفصل، من الأفضل:","o":["إعادة ترتيب كل حصة بما يتناسب مع طبيعة المادة","تنظيمه بشكل يسمح بالحركة والتفاعل بين الطلاب","ترتيبه بطريقة تحد من حركة الطلاب لضبطهم","ترك الطلاب يُنظمون أنفسهم كما يشاؤون"],"a":1,"f":"ترتيب الفصل الأمثل يسمح بحرية الحركة والتفاعل بين الطلاب لدعم التعلم النشط، بخلاف ترتيب يقيد الحركة بغرض الضبط."},{"s":"أسئلة المعيار التاسع","n":64,"q":"وضع المعلم (عبد الرحمن) ثلاثة أنشطة في الصف، وانتهى الوقت وتبقى له النشاط الثالث. ما التصرف المناسب الذي يقوم به المعلم؟","o":["ينتقل للنشاط الثالث مباشرة","يجعل النشاط واجباً منزلياً","يؤجل النشاط ويوضع ضمن الخطط المستقبلية","لا يهتم للنشاط لكونه غير موجود في الخطة الدراسية"],"a":1,"f":"الأنسب جعل النشاط المتبقي واجباً منزلياً ليتحقق هدفه دون الإخلال بوقت الحصة أو الاستعجال، دون إهماله أو تأجيله لمدة طويلة."},{"s":"أسئلة المعيار التاسع","n":65,"q":"لاحظ المعلم أن الطالب (أحمد) يتعدى على أقرانه ويزعجهم؛ مما يؤدي إلى إعاقة تعلم الطلاب، وإثارة الخلافات بينهم، فكيف يتصرف المعلم في هذا الموقف؟","o":["يعيد تنظيم جلوس جميع طلاب الفصل","يغير مكان الطالب ويجعله في مؤخرة الفصل","يجتمع مع الطالب ويناقشه في أسباب سلوكه وآثاره السلبية","يستدعي ولي أمر الطالب ويناقشه في سلوك ابنه وتوجيهه إلى الأفضل"],"a":2,"f":"الأفضل البدء بمناقشة الطالب نفسه في أسباب سلوكه وآثاره لمعالجة الجذر تربوياً، قبل اللجوء لإجراءات أخرى كنقله أو استدعاء ولي الأمر."},{"s":"أسئلة المعيار التاسع","n":66,"q":"لدى المعلم خالد طالب يحب المرح كثيراً، فهو يتفاعل مع المواقف حسب مفهومه. التوجيه المناسب لهذا الطالب أن:","o":["يتعلم السيطرة على دوافعه","يقرأ منفرداً في زاوية الصف","يعمل في المهام التي تتضمن التفاعل مع الآخرين","يعمل باستقلال في المهام الموجهة نحو التفاصيل"],"a":0,"f":"الطالب المرح المندفع في تفاعله يحتاج إلى تعلم ضبط دوافعه وانفعالاته، وهذا التوجيه الأنسب لنمط الشخصية الاندفاعية حسب المفتاح المعتمد."},{"s":"أسئلة المعيار التاسع","n":67,"q":"العملية التي يقوم بها المعلم لمنع سلوك خاطئ في غرفة الصف هي:","o":["استخدام الثواب والعقاب","استخدام المعززات","ضبط الصف","إدارة الصف"],"a":3,"f":"⚠ ما يقوم به المعلم لمنع السلوك الخاطئ يسمى ضبط الصف في كثير من المراجع، بينما الإدارة أشمل وتتضمن التخطيط والتنظيم؛ ويحتمل أن يكون ضبط الصف أدق."},{"s":"أسئلة المعيار التاسع","n":68,"q":"الاستعداد النفسي والبدني للأداء، هو المقصود بـ:","o":["الاستقبال","التهيئة","الاستجابة الموجهة","التكييف"],"a":1,"f":"التهيئة (الاستعداد) في تصنيف المجال النفسحركي تعني الاستعداد العقلي والجسدي والانفعالي للأداء قبل البدء به."},{"s":"أسئلة المعيار التاسع","n":69,"q":"من الجوانب الأخلاقية التي ينبغي مراعاتها في عملية التعليم، أن التعليم بعدالة دون أي تحيز. أي المواقف الآتية يُعد مخالفاً لهذا المبدأ الأخلاقي في التعليم:","o":["يراعي المعلم الفروق الفردية بين الطلاب على اختلافهم","يساعد المعلم طالباً من ثقافة مختلفة على الاندماج مع زملائه","يركز المعلم على بعض الطلاب المميزين أثناء الحصة التدريسية","يساعد المعلم طالباً يعاني من مشكلة بصرية على الجلوس في الأمام"],"a":2,"f":"التركيز على المميزين وحدهم تحيز يخالف العدالة، أما مراعاة الفروق ومساعدة المختلف ثقافياً أو بصرياً فهو إنصاف وتكافؤ فرص."},{"s":"أسئلة المعيار التاسع","n":70,"q":"من المهم أن تتاح الأنشطة الصفية وغير الصفية للطلبة:","o":["بجميع مستوياتهم","المعاقين فكرياً","المتأخرين دراسياً","الأكثر تعاوناً وانضباطاً"],"a":0,"f":"العدالة التربوية تقتضي إتاحة الأنشطة الصفية وغير الصفية لجميع الطلاب بمختلف مستوياتهم دون استثناء أو اشتراط الانضباط."},{"s":"أسئلة المعيار التاسع","n":71,"q":"كل مما يأتي من المواد المستخدمة للطلاب ذوي التعلم الحركي، ما عدا:","o":["المجسمات","عمل جدول البيانات","الصناعات اليدوية","الزيارات الميدانية"],"a":1,"f":"عمل جدول البيانات نشاط تحليلي كتابي رقمي، أما المجسمات والصناعات اليدوية والزيارات الميدانية فتناسب المتعلم الحركي الذي يتعلم بالممارسة."},{"s":"أسئلة المعيار التاسع","n":72,"q":"عندما يقدم المعلم التغذية الراجعة لطلابه ويوجههم لتفعيلها، فإنه يساعدهم على:","o":["تقديم التعزيز المناسب","التحقق من نتائج التقويم","التطور والتقدم في الأداء","القدرة على إصدار الأحكام"],"a":2,"f":"التغذية الراجعة المفعّلة تعرّف الطالب بمواطن القوة والخطأ فيطور أداءه ويتقدم، وهذا هو غايتها الأساسية."},{"s":"أسئلة المعيار التاسع","n":73,"q":"من أكثر التحديات التي تواجه المعلم في الإدارة الصفية:","o":["تنظيم الفصل ليناسب أهداف الدرس","تحديد تفاعل الطلاب مع الدرس","تحديد الأنظمة والقوانين","اختيار ردة الفعل المناسبة"],"a":3,"f":"التحدي الأكبر للمعلم في الإدارة الصفية هو اختيار ردة الفعل المناسبة للمواقف المفاجئة، لأنها تحتاج إلى حكمة وسرعة قرار."},{"s":"أسئلة المعيار التاسع","n":74,"q":"أي الممارسات الآتية لها الإسهام الأكبر في استمتاع الطلاب وتشجيعهم على القراءة، ومساعدتهم في تطوير اتجاهات إيجابية نحوها؟","o":["وضع لائحة للنجوم لتعزيز كل طالب عندما يقرأ","التأكد من أن الطفل يقرأ في كل مرة قصة جديدة","تخصيص فترة يومية لقراءة القصص بشكل جماعي","السماح للطلاب أن يختاروا القصص بأنفسهم من المكتبة"],"a":3,"f":"السماح للطلاب باختيار قصصهم بأنفسهم يعزز الدافعية الذاتية وحب القراءة واتجاهاتهم الإيجابية، بخلاف التعزيز الخارجي بالنجوم."},{"s":"أسئلة المعيار التاسع","n":75,"q":"من مهارات الإدارة الصفية:","o":["انشغال المعلم في الشرح والكتابة على السبورة","إدارة الفصل بطريقة سلطوية لا يُسمح فيها للتلاميذ بالكلام","انتباه المعلم لما يجري وإشعار التلميذ أن ما يحدث تحت بصره","تحويل منازعات التلاميذ إلى إدارة المدرسة لاتخاذ اللازم"],"a":2,"f":"من مهارات الإدارة الصفية الحضور الذهني (التواجد) بأن ينتبه المعلم لما يجري ويشعر الطلاب بأنه يراقب الموقف، وهي مهارة «التواجد» لكونتن."},{"s":"أسئلة المعيار التاسع","n":76,"q":"طلبت منك إدارة المدرسة أن تقدم محاضرة عن أنواع المخدرات؛ لكي يعرف الطلاب أشكالها، لكنك لا تستطيع أن تحصل على عينة منها، أنسب طريقة للقيام بذلك:","o":["عرض صور لها","عرض فيلم وثائقي عنها","عرض وصف لها بطريقة لفظية","إسماع الطلاب وصفاً تسجيلياً لها"],"a":1,"f":"الفيلم الوثائقي يقدّم صوراً حية متحركة وأقرب للواقع من الصور الثابتة أو الوصف اللفظي، فهو أنسب بديل عند تعذر العينة الحقيقية."},{"s":"أسئلة المعيار التاسع","n":77,"q":"الإهمال نوع من أنواع الإساءة للأطفال ويتضمن ذلك الجوانب الآتية، ما عدا:","o":["تجاهل الطفل ونبذه","الحرمان من الأمومة","الألفاظ الجارحة والمهددة","انعدام الحاجات الأساسية"],"a":2,"f":"الألفاظ الجارحة والمهددة تدخل في الإساءة اللفظية والنفسية، أما الإهمال فيشمل التجاهل والنبذ والحرمان وغياب الحاجات الأساسية."},{"s":"أسئلة المعيار التاسع","n":78,"q":"واحدة من البدائل التالية غير مناسبة لتحقيق مشاركة جميع التلاميذ:","o":["التمهيد للدرس لجذب انتباه التلاميذ","تنظيم التلاميذ في مجموعات عمل للطالب","أخذ آراء التلاميذ وأفكارهم بعين الاعتبار","استخدام أسلوب المحاضرة والعروض العملية"],"a":3,"f":"المحاضرة والعروض تجعل المتعلم متلقياً سلبياً فلا تحقق مشاركة الجميع، بخلاف التمهيد والمجموعات وأخذ آراء الطلاب."},{"s":"أسئلة المعيار التاسع","n":79,"q":"أي من التالي يُعد من الشروط المهمة لبناء علاقات إيجابية بين المعلم وطلابه وتشجيع الاحترام المتبادل؟","o":["عدم السماح بارتكاب الأخطاء داخل الفصل","الاهتمام بإنجازات الطلاب الحالية دون الماضية","التجاوب بانتظام مع المواقف السلبية والإيجابية","الشدّة؛ خصوصاً مع الطلاب المراهقين الأكبر سناً"],"a":2,"f":"التجاوب المنتظم مع المواقف الإيجابية والسلبية يُشعر الطلاب بأن المعلم يهتم ويتابع، فيبني علاقة إيجابية واحتراماً متبادلاً."},{"s":"أسئلة المعيار التاسع","n":80,"q":"البيئة التعليمية التي يجب على المعلم تهيئتها لطلابه هي:","o":["الآمنة التي يتمكن فيها الطلاب من التفاعل والتعبير عن الذات لضمان تحقيق عملية التعلم","التي تعتمد على الثواب والعقاب لضمان مشاركة الطلاب","التي تعتمد على استخدام أسلوب حل المشكلات","التلقين لضمان معرفة موضوع التعلم"],"a":0,"f":"البيئة التعليمية المطلوبة هي الآمنة التي تتيح التفاعل والتعبير عن الذات، فهي شرط لتحقق التعلم، بخلاف التلقين أو الاعتماد على الثواب والعقاب."},{"s":"أسئلة المعيار التاسع","n":81,"q":"(راكان) و(زكريا) طالبان يتشاجران دائماً في غرفة الصف؛ يريد المعلم أن يقسمهما في مجموعات تعلم؛ وهناك فروق فردية في أداء الطلاب ومستوياتهم التحصيلية. ما التصرف المناسب الذي يقوم به المعلم؟","o":["يضع راكان وزكريا في مجموعة واحدة","يضع راكان وزكريا في مجموعتين متجانستين","يضع راكان وزكريا في مجموعتين مختلفتين غير متجانستين","يضع راكان وزكريا في مجموعتين مختلفتين في مجموعات متجانسة"],"a":2,"f":"الفصل بين المتشاجرين في مجموعتين مختلفتين غير متجانستين في المستوى يمنع الشجار ويتيح التعلم التعاوني بين مستويات متنوعة."},{"s":"أسئلة المعيار التاسع","n":82,"q":"أثناء شرحك لأحد الدروس، بدأت تشعر بأن الطلاب قاموا يتصرفون بطريقة قد تفقدك القدرة على ضبط الصف؛ فما الأسلوب المناسب الذي ستتبعه في هذه الحالة؟","o":["خصم عدد من الدرجات لكي يرتدع الطلاب جميعاً","توجيه الطلاب إلى أنشطة صفية متعلقة بالدرس","إشعار الطلاب بأنك لن تعيد شرح درس اليوم","التوقف عن الشرح وإشعار إدارة المدرسة"],"a":1,"f":"توجيه الطلاب إلى أنشطة صفية مرتبطة بالدرس يحوّل طاقتهم إلى تعلم هادف ويستعيد ضبط الصف دون عقاب جماعي أو تعطيل للدرس."},{"s":"أسئلة المعيار التاسع","n":83,"q":"من الأساليب العملية الناجحة في توزيع طلبة الصف على برامج النشاط أن يتم توزيعهم وفقاً:","o":["لخلفياتهم الاجتماعية","لمستوياتهم الدراسية","لميولهم ورغباتهم","للمرحلة العمرية"],"a":2,"f":"توزيع الطلاب على برامج النشاط وفق ميولهم ورغباتهم يزيد دافعيتهم وإقبالهم ومشاركتهم الفعلية."},{"s":"أسئلة المعيار التاسع","n":84,"q":"لاحظ معلم اللغة العربية شعور بعض الطلاب بالملل وقلة الحماس وانتظار انتهاء الحصة، فشعر المعلم بأهمية استثارة دافعيتهم. أي من الآتي لا يُعد من أساليب إثارة دافعية الطلاب؟","o":["ربط الدرس بواقع حياة الطلاب","التعزيز الإيجابي واللفظي للطلاب","مقارنة أداء الطالب بالطلاب الآخرين","توظيف التقنيات الحديثة في الدرس"],"a":2,"f":"مقارنة الطالب بزملائه تضعف دافعيته وتولّد الإحباط والتنافس السلبي، أما ربط الدرس بالواقع والتعزيز والتقنية فتثير الدافعية."},{"s":"أسئلة المعيار التاسع","n":85,"q":"كل الآتي عوامل لتشجيع الطلاب على المشاركة في الأنشطة الصفية وغير الصفية؛ ما عدا:","o":["وضوح أهداف النشاط وتنوعها","تقديم الأنشطة أثناء الدوام الرسمي","تلبية النشاط لميول الطلاب وحاجاتهم","ارتباط النشاط بالحياة اليومية للطالب"],"a":1,"f":"وضوح الأهداف وتلبية الميول والارتباط بالحياة عوامل جذب مباشرة، أما توقيت النشاط ضمن الدوام فهو تنظيم إداري وليس عاملاً محفزاً في ذاته."},{"s":"أسئلة المعيار التاسع","n":86,"q":"قام المعلم (ثامر) باستخدام صورة لنبات الصبار لعرض أجزائها وشرحها. أي نوع من الخبرة استخدمها المعلم حسب مخروط (ديل)؟","o":["مباشرة","غير مباشرة","مجردة","شبه رمزية"],"a":1,"f":"الصورة تمثّل الشيء الواقعي وليست الشيء نفسه، فهي خبرة غير مباشرة في مخروط ديل، بخلاف الخبرة المباشرة بلمس النبات الحقيقي."},{"s":"أسئلة المعيار التاسع","n":87,"q":"المعلم (1): ناقش مع الطلاب نقص السوق السعودي من الأيدي العاملة. المعلم (2): ناقش مع طلابه موضوعاً عن العمالة السائبة. المعلم (3): ناقش مع طلابه موضوعاً عن أفضل الدول لاستقدام العمالة المناسبة لثقافة المجتمع السعودي. المعلم (4): ناقش مع طلابه العنف الذي تتعرض له العمالة في المنازل. أي من هذه النقاشات ساعدت الطلاب على الاحترام وتقبل آراء الطرف الآخر:","o":["1","2","3","4"],"a":3,"f":"مناقشة العنف الذي تتعرض له العمالة تنمّي التعاطف واحترام الطرف الآخر وتقبّله، أما بقية المواضيع فتتناول الجانب الاقتصادي أو التنظيمي."},{"s":"أسئلة المعيار التاسع","n":88,"q":"قسم المعلم طلابه إلى الأقسام التالية: سمعي - بصري - حسي. اعتمد المعلم في تقسيم طلابه على:","o":["الذكاءات المتعددة","أنماط الشخصية","نظريات التعلم","أنماط التعلم"],"a":3,"f":"تقسيم الطلاب إلى سمعي وبصري وحسي (حركي) هو تصنيف حسب أنماط التعلم (VAK)، وليس أنماط الشخصية أو الذكاءات."},{"s":"أسئلة المعيار التاسع","n":89,"q":"من صفات البيئة الصفية الداعمة للتعلم الاجتماعي الانفعالي:","o":["تحدي القيود","العمل بروح الفريق","المساواة بين الطلاب","التنافسية بين الطلاب"],"a":1,"f":"العمل بروح الفريق يعزز التعاون والتواصل والعلاقات، وهي ركائز التعلم الاجتماعي الانفعالي، بينما التنافسية تضعفها."},{"s":"أسئلة المعيار التاسع","n":90,"q":"أي الأفعال الآتية يقوم بها المعلم لكي يضمن إيجاد بيئة إيجابية في أحد صفوف المرحلة الابتدائية التي يُدرّسها:","o":["تقديم دروس سهلة لجميع الطلاب","وضع أهداف تعليمية موحدة لجميع الطلاب","إلقاء التحية على الطلاب عند دخول الفصل","منح الطلاب حرية تكوين المجموعات أثناء الأنشطة الاجتماعية"],"a":2,"f":"إلقاء التحية عند دخول الفصل سلوك بسيط يبني الود والاحترام ويهيئ بيئة إيجابية، أما توحيد الأهداف وتسهيل الدروس فلا يراعيان الفروق."},{"s":"أسئلة المعيار التاسع","n":91,"q":"لاحظ المعلم (عبد الرحمن) أن بعض طلابه دافعيتهم نحو التعلم ضعيفة. أراد المعلم حل هذه المشكلة ورفع دافعية طلابه وتأسيس توقعات عالية لتعلمهم. بماذا تنصح المعلم أن يفعل؟","o":["يضع مع الطلاب معايير انضباط واضحة","يُظهر القدوة الحسنة في سلوكه أمام طلابه","ينظم الوقت بفاعلية للحفاظ على وقت الحصة","يوفر مناخاً صفياً يدعم ثقافة التعلم الذاتي"],"a":3,"f":"ضعف الدافعية يُعالج بتوفير مناخ صفي يدعم ثقافة التعلم الذاتي ويرفع التوقعات، فتنمو الدافعية الداخلية للتعلم."},{"s":"أسئلة المعيار التاسع","n":92,"q":"عندما يريد أحد المعلمين استخدام التعلم القائم على اللعب فإنه يستخدم:","o":["Class Dojo","Kahoot","Nearpod","Desmos"],"a":1,"f":"Kahoot منصة اختبارات تنافسية تقوم على اللعب (Gamification)، بينما ClassDojo لإدارة السلوك وNearpod للعروض التفاعلية وDesmos للرياضيات."},{"s":"أسئلة المعيار التاسع","n":93,"q":"قام معلم الدراسات الإسلامية بشرح درس (صفة الوضوء)، ثم طبقها مع طلابه بعد الانتهاء من الشرح. حسب مخروط الخبرة فإن ما قام به المعلم يعتبر خبرة:","o":["ممثلة","معدلة","واقعية","مركبة"],"a":2,"f":"تطبيق الوضوء عملياً مع الطلاب ممارسة للموقف الحقيقي نفسه، فهو خبرة واقعية (هادفة مباشرة) في مخروط الخبرة."},{"s":"أسئلة المعيار التاسع","n":94,"q":"عندما يقوم المعلم بنشاط يُدرج فيه أهدافه السلوكية إلى مواقف تعليمية تحقق للطالب نمواً في معارفه وقدراته؛ فإن ما قام به المعلم يعتبر نشاطاً:","o":["تشخيصياً","استهلالياً","إثرائياً","تنموياً"],"a":3,"f":"النشاط التنموي تحوّل فيه الأهداف السلوكية إلى مواقف تعليمية تنمي معارف الطالب وقدراته، بخلاف التشخيصي والاستهلالي والإثرائي."},{"s":"أسئلة المعيار التاسع","n":95,"q":"بمناسبة اليوم العالمي للغة العربية، تقدمت المعلمات بمبادرات لتعزيز احترام الثقافة العربية المتنوعة لدى الطالبات. حدد أفضل مبادرة مما يأتي تحقق ما سبق:","o":["اصطحاب الطالبات لزيارة معرض الكتاب العربي","تنظيم معرض للفنون التشكيلية وأنواع الخط العربي","تقديم محاضرة عن عادات الزواج في الدول العربية","عقد مسابقة لغوية، وأفضل شرح لقصيدة (بلاد العُرب أوطاني)"],"a":1,"f":"معرض الفنون التشكيلية والخط العربي يُبرز تنوع الثقافة العربية وجمالياتها فيعزز احترامها، وهو أشمل من مبادرات تقتصر على جانب واحد."},{"s":"أسئلة المعيار التاسع","n":96,"q":"يتفهم المعلم مشاعر الطلاب ويستمع إلى آرائهم واقتراحاتهم؛ ولكنه ليس ملزماً بتنفيذ هذه المقترحات. يُمثل هذا النمط المعلم:","o":["المنصت","المستبد","المثالي","المتردد"],"a":0,"f":"المعلم المنصت يتفهم مشاعر الطلاب ويستمع لآرائهم دون التزام بتنفيذها، وهو غير المستبد الذي لا يستمع ولا المتردد الذي يتبع كل رأي."},{"s":"أسئلة المعيار التاسع","n":97,"q":"تُعرّف التغذية الراجعة بأنها:","o":["عملية إصدار حكم أو تقدير على قيمة الأفراد أو الموضوعات","إعطاء تقدير كمي لصفة أو لخاصية معينة عن طريق مقارنتها بوحدة متفق عليها","سلوك لفظي يأتي بعد سلوك لفظي أو غير لفظي تعبيراً عن مدى الموافقة أو الرفض لهذا السلوك","عملية تزويد المتعلم بمعلومات حول استجاباته لتصحيحها أو تثبيتها"],"a":3,"f":"التغذية الراجعة هي تزويد المتعلم بمعلومات عن استجاباته بهدف تصحيحها أو تثبيتها، أما بقية الخيارات فتعرّف التقويم والقياس والتعزيز."},{"s":"أسئلة المعيار التاسع","n":98,"q":"ما الإجراء الذي يساعد الطلاب على معالجة المعلومات ذهنياً بعمق قبل الإجابة عن السؤال الذي يطرحه المعلم؟","o":["صمت المعلم بعد طرح السؤال (فترة الانتظار)","نبرة صوت المعلم عند طرح السؤال","وضوح التعليمات المتفق عليها مسبقاً","رفع دافعية الطلاب الداخلية نحو التعلم"],"a":0,"f":"فترة الانتظار (الصمت بعد السؤال) تمنح الطلاب وقتاً للتفكير العميق ومعالجة المعلومة قبل الإجابة، فتحسن جودة الإجابات."},{"s":"أسئلة المعيار التاسع","n":99,"q":"كثيراً ما يبدي الطلاب في التعبير عن آرائهم وإجاباتهم، رغم أنهم يعرفون الإجابة. أي الإجراءات الآتية تساعد الطلاب أكثر على التعبير؟","o":["تعزيز الآراء المتفق عليها","توفير الفرصة للطلاب للتفكير","إعطاء الفرصة للطلاب للحديث","احترام الآراء التي يقدمها الطلاب"],"a":3,"f":"احترام آراء الطلاب يمنحهم الأمان النفسي للتعبير عن إجاباتهم دون خوف من السخرية أو الخطأ، وهذا أكثر ما يعالج التردد رغم معرفتهم بالإجابة."},{"s":"أسئلة المعيار التاسع","n":100,"q":"لوضع إجراءات صفية تحقق العدالة والاحترام بين الطلاب: المعلم (ثامر): يؤمن بحرية الإنسان ولا يفضل وضع قواعد سلوكية. المعلم (بندر): يضع قواعد لضبط السلوك ويشرح للطلاب فوائدها. المعلم (سلمان): يطلب من كل طالب أن يضع قواعد سلوكية تناسب ظروفه. المعلم (زياد): يحرص على صداقة الطلاب ويضع قواعد سلوكية تراعي مشاعرهم. أي المعلمين قام بالإجراء المناسب لتحقيق الهدف؟","o":["ثامر","بندر","سلمان","زياد"],"a":1,"f":"المعلم بندر يضع قواعد واضحة ويشرح فوائدها فتتحقق العدالة والاحترام بالمشاركة والفهم، بخلاف التساهل أو الفردية أو المجاملة."},{"s":"أسئلة المعيار التاسع","n":101,"q":"يبرر الطالب (صالح) اعتداءه المتكرر على زملائه عند أحد المعلمين بأنه نوع من المزاح المقبول. وفقاً لنظرية (باندورا) للانفصال الأخلاقي، فإن الطالب يستخدم إحدى آليات الدفاع وهي:","o":["تقليل العواقب","تعميم المسؤولية","إلقاء اللوم على المعلم","حيلة التهذيب اللفظي (إعادة التسمية الملطفة)"],"a":3,"f":"وصف الاعتداء بأنه «مزاح» تسمية ملطفة للسلوك السيئ، وهي آلية التهذيب اللفظي ضمن آليات الانفصال الأخلاقي لدى باندورا."},{"s":"أسئلة المعيار التاسع","n":102,"q":"المعلم الذي يضع التعلم داخل إطار العلاقات الإنسانية:","o":["يحبس العلاقة داخل الصف","يتعامل مع الطلاب بعيداً عن عواطفهم","يستخدم طرق تدريس تناسب الطلاب","يتعاطف مع طلابه ويدعمهم كأفراد متميزين"],"a":3,"f":"المعلم الذي يؤمن بالعلاقات الإنسانية يتعاطف مع طلابه ويدعمهم بوصفهم أفراداً متميزين، ولا يتجاهل عواطفهم."},{"s":"أسئلة المعيار التاسع","n":103,"q":"\"كل حلم يبدأ بخطوة، وهذه الخطوة هي اللقاح\" ......... عبر التسجيل في تطبيق صحتي. هذه الرسالة تبين الجهود التي تقوم بها وزارة الصحة للتوعية بضرورة أخذ اللقاح عبر الرسائل النصية للمواطنين، يُعرف هذا النمط من الاتصال بالاتصال:","o":["الأفقي","التصاعدي","التنازلي","المحايد"],"a":2,"f":"الاتصال التنازلي هو الذي يتجه من جهة أعلى (وزارة الصحة) إلى الفئات الأدنى (المواطنين)، كالتعليمات والتوعية."},{"s":"أسئلة المعيار العاشر","n":1,"q":"أظهرت نتائج الطلاب لدى أحد المعلمين في الاختبار الوطني أن مستوى الطلاب كان ضعيفاً في المادة، الإجراء المناسب الذي يجب أن يتخذه المعلم هو:","o":["إبلاغ أولياء الأمور بضرورة الاهتمام بأبنائهم وتشجيعهم","تحليل نتائج الاختبار وتحديد مواطن الضعف وعمل خطة لمعالجتها","تكليف الطلاب بالاستعداد للاختبارات الوطنية في المستقبل استعداداً أفضل","تجاهل الأمر؛ لأن درجات الاختبار لا علاقة لها بمستويات الطلاب"],"a":1,"f":"الإجراء المهني الصحيح هو تحليل النتائج لتحديد مواطن الضعف ثم وضع خطة علاجية، فالنتائج تغذية راجعة لتحسين التعلم."},{"s":"أسئلة المعيار العاشر","n":2,"q":"عملية يتحدد بها أداء المتعلمين بالنسبة للمهارات والمعارف والسمات المختلفة بأداة ملائمة أو مقياس مناسب، يُقصد به:","o":["التقييم","التقويم","القياس","لا شيء مما سبق"],"a":1,"f":"التقويم عملية شاملة تحدد مستوى أداء المتعلمين بأداة مناسبة وتصدر حكماً عليه، أما القياس فتقدير كمي فقط."},{"s":"أسئلة المعيار العاشر","n":3,"q":"يعبر عن القياس بقيمة:","o":["رقمية","كمية","(أ و ب) معاً","لا شيء مما سبق"],"a":1,"f":"القياس تقدير كمي لخاصية ما بوحدة محددة، ويعبر عنه بقيمة كمية؛ ويعد الخيار المعتمد أدق من «رقمية» في المفاهيم."},{"s":"أسئلة المعيار العاشر","n":4,"q":"تصنيف الأشياء ووصفها في مجموعات متميزة ذات خصائص مشتركة وإعطاء كل مجموعة اسماً أو رمزاً خاصاً بها يُسمى مقياساً:","o":["رتبياً","فاصلاً","نسبياً","اسمياً"],"a":3,"f":"المقياس الاسمي يصنّف الأشياء في فئات متميزة ويعطي كل فئة اسماً أو رمزاً دون ترتيب أو مسافات، كتصنيف الجنس."},{"s":"أسئلة المعيار العاشر","n":5,"q":"يمكن القول بأن الاختبار يُعد موضوعياً إذا:","o":["أعطى نفس الدرجة بغض النظر عمن يصححه","أعطى نفس الدرجة مع الأخذ بعين الاعتبار عمن يصححه","أعطى د
