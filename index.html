":"ترى المعلمة أن رسالتها لا تقتصر على نقل المعرفة، بل تمتد إلى بناء شخصية الطالبة دينيًا وخلقيًا ووطنيًا. هذه النظرة تعكس فهمها لمهنة التعليم بوصفها:","o":["وظيفة إدارية محددة المهام","رسالة تربوية شاملة","مهنة تقنية تعتمد على المهارة فقط","عملًا تطوعيًا غير ملزم"],"a":1,"f":"ينظر ميثاق أخلاقيات مهنة التعليم إلى التعليم بوصفه رسالة تستهدف بناء الإنسان في جوانبه كلها، لا مجرد نقل معلومات."},{"s":"أسئلة أصلية – المعيار الأول","n":2,"q":"طلب ولي أمر من المعلم أن يطلعه على درجات زميل لابنه ليقارن بينهما. التصرف المهني الصحيح:","o":["يطلعه عليها ما دام الطلب لغرض تربوي","يحيله إلى زميل الابن ليسأله بنفسه","يعطيه متوسط درجات الفصل مع درجة الزميل","يعتذر لأن معلومات كل طالب سرية ولا تُعطى إلا لولي أمره"],"a":3,"f":"حفظ خصوصية الطلاب وسرية معلوماتهم من أخلاقيات المهنة، فلا تُعطى درجات طالب لغير ولي أمره."},{"s":"أسئلة أصلية – المعيار الأول","n":3,"q":"عرض أحد أولياء الأمور على المعلم هدية ثمينة قبل إعلان النتائج بأيام. الأنسب أن:","o":["يقبلها تقديرًا لمشاعر ولي الأمر","يقبلها ويوزعها على الطلاب","يعتذر عن قبولها بلطف تجنبًا لأي شبهة تمس نزاهته","يقبلها بشرط ألا تؤثر في الدرجات"],"a":2,"f":"قبول هدية ثمينة قبيل التقويم يثير الشبهة ويمس نزاهة المعلم؛ والاعتذار بلطف يحفظ العلاقة والنزاهة معًا."},{"s":"أسئلة أصلية – المعيار الأول","n":4,"q":"معلم يعطي دروسًا خصوصية بمقابل لطلاب فصله نفسه، ويلمّح لهم بأنها تساعدهم في اختباره. هذا السلوك يتعارض أساسًا مع:","o":["مبدأ عدم استغلال المعلم موقعه لتحقيق منفعة شخصية","حرية المعلم في وقته الخاص","مبدأ التنمية المهنية المستمرة","حق الطالب في التعلم الذاتي"],"a":0,"f":"استغلال سلطة التدريس والتقويم لتحقيق منفعة مادية من الطلاب أنفسهم يخالف النزاهة والعدل المطلوبين من المعلم."},{"s":"أسئلة أصلية – المعيار الأول","n":5,"q":"في درس عن التعايش سأل طالب: هل يجوز التعامل بالحسنى مع غير المسلمين؟ أفضل استجابة من المعلم:","o":["يتجنب السؤال لأنه خارج المقرر","يوضح بالأدلة الشرعية أن الإسلام يدعو إلى البر والعدل مع المسالمين","يطلب من الطالب أن يسأل أهله","يقول إن المسألة رأي شخصي لكل فرد"],"a":1,"f":"الوسطية تقتضي بيان منهج الإسلام في العدل والبر مع غير المسلمين المسالمين بالدليل، بعيدًا عن الغلو أو التمييع."},{"s":"أسئلة أصلية – المعيار الأول","n":6,"q":"أي الممارسات الآتية من صور الغلو الذي يتنافى مع الوسطية؟","o":["الحث على أداء الصلاة في وقتها","احترام آراء العلماء المعتبرين","تكفير المخالف في مسائل اجتهادية","الاعتدال في العبادة دون إفراط أو تفريط"],"a":2,"f":"الحكم على المخالف في المسائل الاجتهادية بالكفر من صور الغلو، والوسطية تقوم على الاعتدال وقبول الخلاف المعتبر."},{"s":"أسئلة أصلية – المعيار الأول","n":7,"q":"لاحظت معلمة أن إحدى طالباتها تتداول في مجموعة الفصل مقاطع تحمل أفكارًا متطرفة. الإجراء الأنسب أولًا:","o":["تحذفها من المجموعة دون نقاش","تنبهها أمام زميلاتها لتكون عبرة","تتجاهل الأمر لأنه خارج وقت الدوام","تحاورها بهدوء لفهم مصدر الأفكار، ثم تُشرك الموجهة الطلابية وفق الإجراءات"],"a":3,"f":"المعالجة التربوية تبدأ بالحوار الهادئ لفهم المشكلة، ثم إشراك الجهة المختصة في المدرسة وفق الأنظمة، حماية للطالبة وزميلاتها."},{"s":"أسئلة أصلية – المعيار الأول","n":8,"q":"من أبرز أدوار المعلم في تعزيز الأمن الفكري لدى الطلاب:","o":["تنمية التفكير الناقد ليميزوا المعلومة الموثوقة من المضللة","منعهم من استخدام الإنترنت نهائيًا","الاكتفاء بما ورد في الكتاب المدرسي","تجنب مناقشة القضايا المعاصرة في الفصل"],"a":0,"f":"الأمن الفكري يتحقق ببناء وعي الطالب وقدرته على التمحيص، لا بالمنع أو بتجاهل القضايا."},{"s":"أسئلة أصلية – المعيار الأول","n":9,"q":"أرادت معلمة تعزيز الاعتزاز بالهوية الوطنية لدى طالباتها بنشاط يترك أثرًا عمليًا. أي الأنشطة أنسب؟","o":["توزيع أعلام صغيرة في اليوم الوطني","عرض صور لمعالم المملكة على السبورة","تكليف الطالبات بمشروع بحثي عن منجز وطني في منطقتهن وعرضه في المدرسة","كتابة عبارة وطنية على غلاف الدفتر"],"a":2,"f":"النشاط الذي تشارك فيه الطالبة بالبحث والإنتاج والعرض يرسخ الانتماء أعمق من المظاهر الرمزية وحدها."},{"s":"أسئلة أصلية – المعيار الأول","n":10,"q":"من مظاهر تعزيز الهوية الوطنية في الممارسة الصفية اليومية:","o":["الإكثار من الألفاظ الأجنبية في الشرح لمواكبة العصر","ربط موضوعات الدرس بتاريخ المملكة ومنجزاتها وقيم المجتمع","تخصيص الحديث عن الثقافات الأجنبية فقط","ترك الحديث عن الوطن لمعلم الدراسات الاجتماعية"],"a":1,"f":"ربط المحتوى بتاريخ الوطن ومنجزاته وقيمه في كل المواد يجعل الهوية الوطنية حاضرة في التعلم اليومي، وهي مسؤولية جميع المعلمين."},{"s":"أسئلة أصلية – المعيار الأول","n":11,"q":"يحرص معلم العلوم على استخدام لغة عربية سليمة في شرحه وفي كتابته على السبورة. هذا السلوك يعكس:","o":["الاعتزاز باللغة العربية بوصفها مكونًا أساسيًا للهوية","التزامًا يخص معلم اللغة العربية وحده","اهتمامًا بالشكل على حساب المضمون","تقليلًا من أهمية اللغات الأخرى"],"a":0,"f":"اللغة العربية من أهم مكونات الهوية، والحرص على سلامتها مسؤولية كل معلم في كل مادة."},{"s":"أسئلة أصلية – المعيار الأول","n":12,"q":"معلم يمنح ابن زميله في العمل درجات أعلى من مستواه الحقيقي مجاملةً لزميله. هذا السلوك يخالف بالدرجة الأولى قيمة:","o":["التعاون","الإيثار","الرحمة","العدل"],"a":3,"f":"إعطاء الطالب ما لا يستحق مجاملةً ظلمٌ لزملائه وإخلال بالعدل في التقويم."},{"s":"أسئلة أصلية – المعيار الأول","n":13,"q":"نشر معلم على حسابه في وسائل التواصل صورًا لطلابه داخل الفصل دون إذن أولياء أمورهم. هذا التصرف:","o":["مقبول لأنه يبرز جهده التعليمي","مخالف لأنه يمس خصوصية الطلاب","مقبول إذا كانت الصور جماعية","مخالف فقط إذا ظهرت أسماء الطلاب"],"a":1,"f":"صور الطلاب من خصوصياتهم، ونشرها دون إذن أولياء الأمور يخالف أخلاقيات المهنة وقد يعرّض الطلاب للضرر."},{"s":"أسئلة أصلية – المعيار الأول","n":14,"q":"دخل شخص دون تصريح إلى حساب معلم في منصة تعليمية وعدّل درجات الطلاب. هذا الفعل يُصنّف وفق الأنظمة في المملكة بأنه:","o":["مخالفة إدارية بسيطة","خطأ تقني لا عقوبة عليه","جريمة معلوماتية","سلوك غير لائق فقط"],"a":2,"f":"الدخول غير المشروع إلى الحسابات والأنظمة الإلكترونية وتعديل بياناتها من الجرائم المعلوماتية التي يعاقب عليها النظام."},{"s":"أسئلة أصلية – المعيار الأول","n":15,"q":"يرى معلم أن شهادته الجامعية تكفيه طوال حياته المهنية، ولا حاجة إلى برامج التطوير. هذا الاتجاه يتعارض مع مبدأ:","o":["أن التنمية المهنية المستمرة واجب على المعلم","الولاء للمؤسسة التعليمية","الاعتزاز بالهوية الوطنية","احترام التسلسل الإداري"],"a":0,"f":"تطور المعرفة وطرق التدريس يجعل النمو المهني المستمر واجبًا أساسيًا على المعلم لا خيارًا."},{"s":"أسئلة أصلية – المعيار الأول","n":16,"q":"أكثر الطرق تأثيرًا في غرس قيمة احترام الوقت لدى الطلاب:","o":["تعليق لوحة عن أهمية الوقت","خصم درجات المتأخرين","إلقاء محاضرة عن فضل الوقت","التزام المعلم نفسه بالحضور في الموعد وبدء الحصة وإنهائها في وقتها"],"a":3,"f":"القدوة العملية أقوى أثرًا من الوعظ أو العقاب؛ فالطلاب يتعلمون من سلوك المعلم أكثر من كلامه."},{"s":"أسئلة أصلية – المعيار الأول","n":17,"q":"اختلف معلمان حول توزيع الحصص، فبدأ أحدهما ينتقد الآخر أمام الطلاب. التصرف الذي يتفق مع أخلاقيات المهنة:","o":["أن يرد عليه أمام الطلاب ليوضح وجهة نظره","أن يشكوه إلى أولياء الأمور","أن يؤجل النقاش ويعالج الخلاف بعيدًا عن الطلاب وعبر القنوات الرسمية","أن يقاطعه نهائيًا"],"a":2,"f":"الخلافات المهنية تُعالج بهدوء بعيدًا عن الطلاب وعبر القنوات النظامية، حفاظًا على مكانة المعلمين وعلى بيئة التعلم."},{"s":"أسئلة أصلية – المعيار الأول","n":18,"q":"أي الممارسات تعكس احترام المعلم لدور الأسرة شريكًا في التربية؟","o":["التواصل الدوري مع أولياء الأمور لإطلاعهم على تقدم أبنائهم والتشاور معهم","التواصل معهم فقط عند حدوث مشكلة","تجنب التواصل حتى لا يتدخلوا في عمله","الاكتفاء بإرسال الشهادة في نهاية الفصل"],"a":0,"f":"الشراكة الحقيقية تقوم على تواصل منتظم وتشاور مستمر، لا على تواصل عند المشكلات فقط."},{"s":"أسئلة أصلية – المعيار الأول","n":19,"q":"في فصل يضم طلابًا من جنسيات مختلفة، سخر بعض الطلاب من لهجة زميل وافد. أنسب تصرف للمعلم:","o":["يتجاهل الموقف لأنه مزاح","يوقف السخرية فورًا، ثم يدير حوارًا عن احترام الآخرين وتنوع اللهجات","يطلب من الطالب الوافد تغيير لهجته","يعاقب الطلاب الساخرين دون توضيح السبب"],"a":1,"f":"إيقاف الإساءة ثم معالجتها بالحوار يرسخ قيمة احترام الآخر ويحمي كرامة الطالب."},{"s":"أسئلة أصلية – المعيار الأول","n":20,"q":"اكتشف المعلم بعد تسليم النتائج خطأً في جمع درجات أحد الطلاب لصالح الطالب. التصرف الصحيح:","o":["يترك الدرجة كما هي حتى لا يغضب الطالب","يخفض درجته في الاختبار القادم ليعوض الفرق","يستشير الطالب في التصحيح","يصحح الخطأ وفق الإجراءات النظامية ويوضح ذلك للطالب وولي أمره"],"a":3,"f":"الأمانة تقتضي أن تعكس الدرجة المستوى الحقيقي، ويكون التصحيح بالإجراء النظامي الواضح لا بالتعويض الخفي."},{"s":"أسئلة أصلية – المعيار الأول","n":21,"q":"أسرّت طالبة لمعلمتها بمشكلة أسرية تؤثر في دراستها. أي التصرفات يتفق مع أخلاقيات المهنة؟","o":["تحفظ سرها وتنسق مع الموجهة الطلابية لمساعدتها دون إفشاء ما لا يلزم","تخبر زميلاتها المعلمات ليراعين ظروفها","تتصل بأسرتها فورًا لتعاتبهم","تتجاهل الأمر لأنه شأن عائلي"],"a":0,"f":"حفظ أسرار الطالبة واجب، مع إشراك المختص بالقدر اللازم لمساعدتها."},{"s":"أسئلة أصلية – المعيار الأول","n":22,"q":"الغاية الأساسية من ميثاق أخلاقيات مهنة التعليم أن يكون:","o":["لائحة عقوبات للمعلمين المخالفين","دليلًا لتوزيع الحوافز المالية","مرجعًا أخلاقيًا يحتكم إليه المعلم في سلوكه المهني","خطة دراسية للمقررات"],"a":2,"f":"الميثاق إطار أخلاقي يوجّه سلوك المعلم ويذكّره بقيم مهنته، وليس لائحة عقوبات أو خطة دراسية."},{"s":"أسئلة أصلية – المعيار الأول","n":23,"q":"من صور الوسطية في أداء المعلم لمهامه:","o":["التساهل في تطبيق الأنظمة كسبًا لمحبة الطلاب","الشدة المفرطة في الضبط حتى يخافه الطلاب","الانشغال بالعمل على حساب أسرته وصحته","الجمع بين الحزم في تطبيق الأنظمة والرفق في التعامل"],"a":3,"f":"الوسطية توازن بين طرفين مذمومين: التساهل والشدة، فيجمع المعلم بين الحزم والرفق."},{"s":"أسئلة أصلية – المعيار الأول","n":24,"q":"أي العبارات الآتية تعبر عن المواطنة المسؤولة التي يغرسها المعلم في طلابه؟","o":["الاكتفاء بالمطالبة بالحقوق","الالتزام بالواجبات والمحافظة على الممتلكات العامة إلى جانب معرفة الحقوق","الاحتفال باليوم الوطني فقط","حفظ النشيد الوطني دون فهم معانيه"],"a":1,"f":"المواطنة المسؤولة توازن بين معرفة الحقوق والقيام بالواجبات والمحافظة على المصلحة العامة."},{"s":"أسئلة أصلية – المعيار الأول","n":25,"q":"كلّف المعلم طلابه بإعداد عروض تقديمية، فنسخ أحدهم عرضًا كاملًا من الإنترنت ونسبه لنفسه. أنسب معالجة تربوية:","o":["يمنحه الدرجة كاملة لأنه بحث وجمع","يرفض العرض ويعطيه صفرًا دون نقاش","يوضح له مفهوم الأمانة العلمية وحقوق الملكية الفكرية، ويطلب منه إعادة العمل مع توثيق المصادر","يعرض عمله أمام زملائه مثالًا على الغش"],"a":2,"f":"المعالجة التربوية تعلّم الطالب قيمة الأمانة العلمية وتمنحه فرصة للتصحيح دون تشهير."},{"s":"أسئلة أصلية – المعيار الأول","n":26,"q":"بعد كل وحدة دراسية يراجع المعلم ما نجح وما لم ينجح في تدريسه، ويعدّل خطته بناءً على ذلك. هذه الممارسة تمثل:","o":["التأمل في الممارسة المهنية","التقويم الختامي للطلاب","الإشراف التربوي","التخطيط طويل المدى فقط"],"a":0,"f":"مراجعة المعلم أداءه وتعديل ممارساته بناءً على ما يلاحظه هي جوهر التأمل المهني."},{"s":"أسئلة أصلية – المعيار الأول","n":27,"q":"طالب لديه ضعف سمعي في فصل عادي. أي مما يأتي يحقق العدل والإنصاف معه؟","o":["معاملته تمامًا مثل زملائه دون أي تعديل","إعفاؤه من المشاركة الصفية","إجلاسه في آخر الفصل حتى لا يعطل الدرس","إجلاسه في مكان مناسب واستخدام وسائل بصرية مساندة"],"a":3,"f":"العدل لا يعني التطابق، بل إعطاء كل طالب ما يحتاجه ليتعلم؛ والتكييف المناسب يحقق تكافؤ الفرص."},{"s":"أسئلة أصلية – المعيار الأول","n":28,"q":"يقضي معلم جزءًا من حصصه في متابعة تجارته الخاصة عبر الجوال. هذا السلوك يتعارض مع:","o":["حق المعلم في الراحة","الأمانة في أداء العمل واستثمار وقت التعلم","حرية المعلم الشخصية","مبدأ التعلم الذاتي"],"a":1,"f":"وقت الحصة حق للطلاب، وصرفه في شؤون خاصة إخلال بأمانة العمل."},{"s":"أسئلة أصلية – المعيار الأول","n":29,"q":"اختلف معلم مع قرار تنظيمي صادر من إدارة التعليم. التصرف المهني الأنسب:","o":["تنفيذ القرار مع إبداء رأيه ومقترحاته عبر القنوات الرسمية","رفض تنفيذ القرار حتى يُعدّل","انتقاد القرار علنًا في وسائل التواصل","حث زملائه على عدم الالتزام به"],"a":0,"f":"الالتزام بالأنظمة لا يمنع إبداء الرأي، لكن ذلك يكون عبر القنوات الرسمية لا بالرفض أو التشهير."},{"s":"أسئلة أصلية – المعيار الأول","n":30,"q":"معلم رياضيات يريد غرس قيمة الإتقان لدى طلابه من خلال مادته. أنسب أسلوب:","o":["إلقاء موعظة عن الإتقان في بداية كل حصة","مطالبة الطلاب بحفظ حديث عن الإتقان","ربط الإتقان بممارسة عملية كمراجعة الحلول والتحقق منها وتقدير العمل المنظم","ترك القيم لمعلم الدراسات الإسلامية"],"a":2,"f":"دمج القيمة في ممارسات المادة نفسها وتعزيزها عمليًا أبلغ أثرًا من الوعظ المنفصل، والقيم مسؤولية كل المعلمين."},{"s":"أسئلة أصلية – المعيار الأول","n":31,"q":"نظّم المعلم مع طلابه حملة تطوعية لتنظيف حديقة الحي. هذا النشاط ينمي بالدرجة الأولى:","o":["المهارات الحركية","روح المسؤولية المجتمعية والانتماء","التحصيل الأكاديمي","المنافسة الفردية"],"a":1,"f":"العمل التطوعي في الحي يربط الطالب بمجتمعه وينمي شعوره بالمسؤولية والانتماء."},{"s":"أسئلة أصلية – المعيار الأول","n":32,"q":"أخطأ طالب في الإجابة فضحك زملاؤه. تصرف المعلم الذي يعكس الرحمة والحكمة:","o":["يضحك معهم لتلطيف الموقف","يطلب من الطالب الجلوس وعدم المشاركة مرة أخرى","يعاقب الطالب لأنه لم يذاكر","يوقف الضحك، ويشكر الطالب على محاولته، ثم يقوده إلى الإجابة الصحيحة"],"a":3,"f":"حماية مشاعر الطالب وتشجيعه على المحاولة يبني بيئة صفية آمنة يتعلم فيها الجميع من الخطأ."},{"s":"أسئلة أصلية – المعيار الأول","n":33,"q":"من مظاهر التزام المعلم بقيم المجتمع في مظهره:","o":["الحرص على مظهر لائق يتوافق مع قيم المجتمع وأنظمة المدرسة","ارتداء ملابس رياضية في الفصل بحجة الراحة","إهمال المظهر بحجة البساطة","المبالغة في المظهر لجذب انتباه الطلاب"],"a":0,"f":"المعلم قدوة في مظهره كما في سلوكه، والاعتدال واللياقة وموافقة قيم المجتمع هي المطلوبة."},{"s":"أسئلة أصلية – المعيار الأول","n":34,"q":"أي الإجراءات يساعد المعلم على الموضوعية والعدل عند تصحيح الأسئلة المقالية؟","o":["تصحيح أوراق الطلاب المتميزين أولًا","الاعتماد على انطباعه العام عن الطالب","استخدام سلم تقدير واضح وتصحيح السؤال نفسه لجميع الطلاب قبل الانتقال إلى التالي","منح درجات إضافية لحسن الخط"],"a":2,"f":"سلم التقدير وتصحيح السؤال الواحد للجميع يقللان أثر الانطباعات الشخصية ويحققان العدل."},{"s":"أسئلة أصلية – المعيار الأول","n":35,"q":"وعد المعلم طلابه بنشاط تحفيزي إن حققوا هدفًا معينًا، فحققوه. الأنسب أن:","o":["يؤجل النشاط إلى أجل غير مسمى","يستبدله بواجب إضافي","يتجاهل الأمر لانشغاله","يفي بوعده لأن الطلاب يتعلمون الوفاء من قدوتهم"],"a":3,"f":"الوفاء بالوعد قيمة إسلامية، والتزام المعلم بها يعلّمها للطلاب عمليًا ويحفظ ثقتهم به."},{"s":"أسئلة أصلية – المعيار الأول","n":36,"q":"تحول نقاش الطلاب حول مباراة إلى تعصب وتراشق بين مشجعي ناديين. الأنسب أن يقوم المعلم بـ:","o":["إعلان تشجيعه لأحد الناديين","توجيه النقاش نحو الروح الرياضية واحترام الآخر ونبذ التعصب","منع الحديث عن الرياضة نهائيًا","ترك الطلاب يتناقشون حتى ينتهوا"],"a":1,"f":"استثمار الموقف لغرس قيم الاعتدال واحترام المخالف أنفع من المنع أو الانحياز."},{"s":"أسئلة أصلية – المعيار الأول","n":37,"q":"عرض معلم العلوم إسهامات علماء من حضارات مختلفة في الطب، مع إبراز إسهامات علماء المسلمين. هذا يحقق:","o":["الانفتاح الواعي على الآخر مع الاعتزاز بالهوية","التقليل من شأن الحضارة الإسلامية","الخروج عن أهداف المادة","الدعوة إلى تقليد الآخرين"],"a":0,"f":"الجمع بين تقدير إسهامات الآخرين وإبراز إسهامات المسلمين يحقق انفتاحًا واعيًا لا يذيب الهوية."},{"s":"أسئلة أصلية – المعيار الأول","n":38,"q":"علم المعلم أن أحد طلابه يتعرض للتنمر الإلكتروني من زملائه. الإجراء الأنسب:","o":["ينصح الطالب بحذف حساباته فقط","يتجاهل الأمر لأنه خارج المدرسة","يبلغ إدارة المدرسة والموجه الطلابي لاتخاذ الإجراءات وفق قواعد السلوك","يواجه المتنمرين أمام الفصل"],"a":2,"f":"التنمر يمس سلامة الطالب حتى خارج المدرسة، ومعالجته تكون عبر الجهات المختصة وفق قواعد السلوك لا بالتجاهل أو التشهير."},{"s":"أسئلة أصلية – المعيار الأول","n":39,"q":"من حقوق الطالب التي يحرص عليها المعلم وفق أخلاقيات المهنة:","o":["أن يحصل على درجات مرتفعة دائمًا","أن يُعامل بكرامة واحترام في بيئة آمنة","أن يختار المعلم الذي يدرسه","أن يُعفى من الواجبات المنزلية"],"a":1,"f":"احترام كرامة الطالب وتوفير بيئة آمنة له حق أساسي تؤكده أخلاقيات المهنة."},{"s":"أسئلة أصلية – المعيار الأول","n":40,"q":"أي المواقف يجسد مفهوم المعلم بوصفه عضوًا فاعلًا في مجتمعه؟","o":["يقصر دوره على ما داخل الفصل","يتجنب المشاركة في المناسبات المجتمعية","يكتفي بنشر آرائه في وسائل التواصل","يشارك بخبرته في مبادرات توعوية لأهالي الحي بالتعاون مع المدرسة"],"a":3,"f":"المعلم صاحب رسالة تمتد خارج الفصل، ومشاركته بخبرته في خدمة مجتمعه من صور هذه الرسالة."},{"s":"أسئلة المعيار الأول","n":1,"q":"من الصفات العقائدية للمعلم:","o":["الصدق في القول والعمل","الإيمان الراسخ بالعقيدة الإسلامية","خلو الجسم من الأمراض المزمنة أو الخطيرة","التوسع بمعرفة واسعة في مجال المادة الدراسية"],"a":1,"f":"الصفات العقائدية تتعلق بالإيمان والالتزام الديني، ولذلك يُعد الإيمان الراسخ بالعقيدة الإسلامية منها، أما الصدق فخلق، والصحة جسمية، والتوسع المعرفي عقلي."},{"s":"أسئلة المعيار الأول","n":2,"q":"التواضع والصبر والأمانة من ضمن صفات المعلم ......... التي يجب أن يتحلى بها:","o":["العقائدية","الجسمية","الأخلاقية","العقلية والنفسية"],"a":2,"f":"التواضع والصبر والأمانة سمات سلوكية وقيمية تندرج ضمن الصفات الأخلاقية للمعلم، وليست جسمية ولا عقلية ولا عقائدية."},{"s":"أسئلة المعيار الأول","n":3,"q":"من الصفات العقلية والنفسية للمعلم:","o":["البعد عن الرياء","الإيمان الراسخ بالعقيدة الإسلامية","الرحمة والرفق","تمتع المعلم بقدر مرتفع من فهم الذات والرضا عنها"],"a":3,"f":"فهم الذات والرضا عنها من الصفات النفسية؛ أما البعد عن الرياء والرحمة فأخلاقيتان، والإيمان بالعقيدة صفة عقائدية."},{"s":"أسئلة المعيار الأول","n":4,"q":"دور المعلم كـ ......... يكون مساعدًا للطلاب في عملية التعلم والتعليم:","o":["ناقل معرفة","راعي النمو الشامل للطلاب","خبير وماهر في مهنة التدريس والتعليم","مسؤول الانضباط وحفظ النظام"],"a":0,"f":"عندما يعمل المعلم ميسّراً لعملية التعلم والتعليم وناقلاً للمعرفة يكون دوره «ناقل معرفة»، وهو الدور المرتبط بمساعدة الطلاب على التعلم."},{"s":"أسئلة المعيار الأول","n":5,"q":"من ضمن أدوار المعلم في رعاية النمو الشامل للطلاب:","o":["مساعدة الطلاب في عملية التعلم والتعليم","وضع الخطط الهادفة للأنشطة الصفية واللاصفية التي تساعد في توظيف المعرفة","توظيف المعرفة في المجالات الحياتية المتنوعة","توظيف اللوائح المتعلقة بتقويم الطلاب في المجالات المعرفية والوجدانية"],"a":1,"f":"رعاية النمو الشامل تتجسد في التخطيط لأنشطة صفية ولاصفية هادفة تنمّي جوانب الطالب المختلفة، أما بقية الخيارات فتتصل بأدوار أخرى كناقل المعرفة."},{"s":"أسئلة المعيار الأول","n":6,"q":"كل موقف تعليمي ينبغي أن يبنى فوق موقف سابق له بحيث:","o":["يماثله في المحتوى","يتجاوزه في المستوى","يخالفه في الطريقة","يوافقه في الأهداف"],"a":1,"f":"مبدأ التدرج والتراكم في التعلم يقتضي أن يتجاوز كل موقف تعليمي سابقه في المستوى لتحقيق النمو المستمر، لا أن يكرره أو يماثله."},{"s":"أسئلة المعيار الأول","n":7,"q":"يخصص المعلم في بداية العام الدراسي الأسبوع الأول لعرض أهداف المقرر على طلابه ثم يناقشها معهم وينقحها ويطلب من كل طالب إضافة ما يراه من أهداف خاصة لتناولها في حينها؛ يهدف المعلم من هذه الممارسة إلى:","o":["تدريب الطلاب على المشاركة","مراعاة الفروق الفردية بين الطلاب","تحقيق التفاعل الإيجابي بين الطلاب","رفع مستوى دافعية الطلاب وتحملهم مسؤولية تعلمهم"],"a":3,"f":"إشراك الطلاب في مناقشة الأهداف وإضافة أهدافهم الخاصة يجعلهم شركاء في التعلم، فترتفع دافعيتهم ويتحملون مسؤولية تعلمهم."},{"s":"أسئلة المعيار الأول","n":8,"q":"في نهاية كل حصة يطلب المعلم من الطلاب كتابة سطرين عن أهم ما تعلموا فيها، ورأيهم فيما تعلموه وأبرز الصعوبات التي واجهوها. ماذا يُعد ما قام به المعلم؟","o":["مساعدتهم على تحمل المسؤولية","استرجاعاً لمعلوماتهم السابقة","تطويراً للتأمل الذاتي لديهم","نوعاً من الاستقصاء"],"a":2,"f":"كتابة ما تعلّمه الطالب ورأيه وصعوباته ممارسة تأملية تنمّي التأمل الذاتي وتقويم الطالب لتعلمه، وليست استرجاعاً أو استقصاءً."},{"s":"أسئلة المعيار الأول","n":9,"q":"من واجبات المعلم نحو المتعلمين:","o":["اتسامه بالنزاهة، والأمانة، والصراحة، والعفة","يعد النمو المهني واجباً أساسياً والتثقيف الذاتي منهجاً في حياته","ألا يتدخل بين زميل ومتعلم إلا إذا طلب منه ذلك","تبني علاقة روحية بينه وبين متعلميه بعيدة عن المنفعة الشخصية"],"a":3,"f":"من واجبات المعلم نحو المتعلمين بناء علاقة تربوية روحية خالصة بعيدة عن المنفعة الشخصية؛ أما النزاهة فسمة خلقية والنمو المهني واجب نحو المهنة."},{"s":"أسئلة المعيار الأول","n":10,"q":"......... في الوظائف التعليمية تقدم وصفاً متدرجاً تصاعدياً في الفهم والمعرفة وتمكن من الممارسة وتوسع نطاق المسؤولية والتأثير:","o":["الرتب المهنية","المسارات المهنية","المستويات المهنية","الدرجات المهنية"],"a":1,"f":"المسارات المهنية هي التي تقدم وصفاً متدرجاً تصاعدياً في الفهم والمعرفة والممارسة وتوسع المسؤولية والتأثير، بحسب لائحة الوظائف التعليمية."},{"s":"أسئلة المعيار الأول","n":11,"q":"اهتمام المعلم بتعليم القيم والمعايير السلوكية السليمة في جميع نواحي العملية التربوية، يشير هذا إلى تركيزه على النمو:","o":["العقلي","الانفعالي","الاجتماعي","الحسي"],"a":2,"f":"غرس القيم والمعايير السلوكية في التعامل مع الآخرين يتعلق بالنمو الاجتماعي الذي يهتم بالسلوك داخل المجتمع وعلاقات الفرد."},{"s":"أسئلة المعيار الأول","n":12,"q":"من اختصاصات اللجنة العليا لسياسة التعليم:","o":["إعداد المعلمين","توظيف المعلمين","بناء المقررات الدراسية","تدريب المعلمين أثناء الخدمة"],"a":2,"f":"اللجنة العليا لسياسة التعليم تتولى رسم السياسات العامة ومنها المناهج وبناء المقررات، أما إعداد المعلمين وتوظيفهم وتدريبهم فمن مهام جهات تنفيذية أخرى."},{"s":"أسئلة المعيار الأول","n":13,"q":"لاحظت قائدة المدرسة إحدى المعلمات تقوم بلبس ملابس تحمل بعض الشعارات والأعلام الأجنبية وعندما قامت بتنبيهها بمخالفتها أصرت المعلمة على أن هذا اللبس حرية شخصية. وفقاً للنظام، تصرف المعلمة يتنافى مع:","o":["وثيقة سياسات التعليم","اللائحة التعليمية","ميثاق أخلاقيات مهنة التعليم","لائحة الموارد البشرية"],"a":2,"f":"ارتداء ملابس بشعارات وأعلام أجنبية يخالف ما يقتضيه ميثاق أخلاقيات مهنة التعليم من التزام بالهوية والقدوة والمظهر اللائق، ولا تبرره الحرية الشخصية."},{"s":"أسئلة المعيار الأول","n":14,"q":"أي مما يأتي ليس من أهداف ميثاق أخلاقيات مهنة التعليم:","o":["توعية المعلم بأهمية المهنة ودورها في بناء مستقبل وطنه","وضع معايير ضابطة لتقويم أداء المعلم","تحفيز المعلم لتمثل أخلاقيات مهنته","الإسهام في تعزيز مكانة المعلم"],"a":1,"f":"الميثاق يهدف إلى التوعية والتحفيز وتعزيز مكانة المعلم، وليس وثيقة لتقويم الأداء بمعايير ضابطة؛ فالتقويم مجاله المعايير المهنية ولوائح الأداء."},{"s":"أسئلة المعيار الأول","n":15,"q":"يُقصد بسياسة التعليم في المملكة العربية السعودية:","o":["مجموع الخطط الدراسية لمراحل التعليم المختلفة","قواعد تنظيم السلوك ولائحة تقويم الطالب","النظم واللوائح، والاستراتيجيات التي تصدر عن وزارة التربية والتعليم","ما يصدر عن وزير التربية والتعليم من توجيه"],"a":0,"f":"سياسة التعليم هي الخطة الشاملة التي تحدد الأسس والمبادئ العامة للتعليم وترسم خططه ومراحله، وهذا أقرب لما ورد في الخيار المحدد من اللوائح وحدها."},{"s":"أسئلة المعيار الأول","n":16,"q":"إذا اتبع المعلم صفات حميدة وسلوكيات مرغوبة وهو مسؤول أمام الله وولاة أمره، فإن هذه تعتبر:","o":["سلوكيات","أخلاقيات","واجبات","حقوق"],"a":1,"f":"الصفات الحميدة والسلوكيات المرغوبة التي يُسأل عنها المعلم أمام الله وولاة الأمر تسمى أخلاقيات المهنة، وهي أشمل من مجرد السلوكيات."},{"s":"أسئلة المعيار الأول","n":17,"q":"أحد القيم الإسلامية الوسطية التي يجب على المهنيين الالتزام بها في ممارسة مهنهم:","o":["الإخلاص","التسامح","العدل","الإحسان"],"a":2,"f":"العدل من القيم الإسلامية الوسطية التي تقوم عليها الممارسة المهنية، بحسب القيم الواردة في الإطار المهني للمعلم."},{"s":"أسئلة المعيار الأول","n":18,"q":"الدخول إلى موقع إلكتروني لتغيير تصاميمه أو إتلافه يُعد:","o":["جريمة معلوماتية","جريمة أخلاقية","مخالفة حقوقية","مخالفة قضائية"],"a":0,"f":"الدخول غير المشروع إلى موقع إلكتروني لتغيير تصميمه أو إتلافه يُصنف جريمة معلوماتية بحسب نظام مكافحة الجرائم المعلوماتية."},{"s":"أسئلة المعيار الأول","n":19,"q":"الإسهام في تعزيز مكانة المعلم العلمية والاجتماعية، العبارة السابقة تمثل أحد:","o":["الحقوق الوظيفية وفقاً للخدمة المدنية","متطلبات الممارسة المهنية","أهداف سياسة التعليم بالمملكة","أهداف ميثاق أخلاقيات مهنة التعليم"],"a":3,"f":"تعزيز مكانة المعلم العلمية والاجتماعية نص ورد ضمن أهداف ميثاق أخلاقيات مهنة التعليم، وليس من الحقوق الوظيفية."},{"s":"أسئلة المعيار الأول","n":20,"q":"أي من الآتي يعبر عن التزام المعلم بالقيم الإسلامية الوسطية؟","o":["يصمم أنشطة ومواقف تعليمية تعزز قيم الوسطية والتسامح والاعتدال في التعامل لدى المتعلمين","يوظف خبرات ومواقف وأنشطة تعليمية تدعم الاعتزاز بالهوية الوطنية السعودية","يعبر من خلال أفكاره وأنشطته عن ولائه وانتمائه للوطن","يُظهر مرونة وانفتاحاً على الثقافات الأخرى"],"a":0,"f":"الالتزام بالقيم الوسطية يظهر في تصميم أنشطة تعزز الوسطية والتسامح والاعتدال لدى المتعلمين، أما الهوية والانتماء والانفتاح فقيم أخرى."},{"s":"أسئلة المعيار الأول","n":21,"q":"واحدة مما يلي ليست من الخصائص السلوكية للمعلم الفعّال:","o":["الاتزان والمودة في تعامله مع طلابه","تقليد معلم آخر أكثر خبرة في التدريس","تفهم احتياجات الطلاب ومشكلاتهم","التعاون مع الطلاب ومبادلتهم المعلومات"],"a":1,"f":"الفعّال يبني أسلوبه الخاص عن وعي وتأمل، وليس التقليد خاصية فعالة؛ بينما الاتزان وتفهم الطلاب والتعاون من خصائصه السلوكية."},{"s":"أسئلة المعيار الأول","n":22,"q":"مجموعة الضوابط التي ينبغي أن يلتزم بها العاملون في العملية التعليمية وتكون بمثابة المرجع الذي يحتكم إليه في تقويم ممارساتهم السلوكية والمهنية:","o":["ميثاق أخلاقيات مهنة التعليم","المعايير المهنية للمعلمين","أسس منظومة التعليم","لائحة الوظائف التعليمية"],"a":0,"f":"ميثاق أخلاقيات مهنة التعليم هو مجموعة الضوابط السلوكية والمهنية المرجعية التي يُحتكم إليها في تقويم ممارسات العاملين في التعليم."},{"s":"أسئلة المعيار الأول","n":23,"q":"أي مما يأتي يُعبر عن مدى ارتباط الفرد بمجتمعه ويُحفّزه على المطالبة بحقوقه والالتزام بواجباته؟","o":["القيم الوطنية","القيم الوظيفية","النظم الاجتماعية","اللوائح الوظيفية"],"a":0,"f":"القيم الوطنية تعبر عن ارتباط الفرد بمجتمعه ودافعه للمطالبة بحقوقه وأداء واجباته، بخلاف القيم الوظيفية المرتبطة بالعمل."},{"s":"أسئلة المعيار الأول","n":24,"q":"المعلم المكلف كلياً بالندب يُقوم أداؤه الوظيفي من قبل:","o":["مدير المدرسة الأساسية","مدير المدرسة المكلف بها","المشرف التربوي المباشر","شؤون المعلمين بإدارة التعليم"],"a":1,"f":"المعلم المكلف بالندب الكلي يتبع المدرسة المنتدب إليها فعلياً، فيقوّم أداءه مدير المدرسة المكلف بها لا مدرسته الأصلية."},{"s":"أسئلة المعيار الأول","n":25,"q":"عندما يستشهد معلم بأمثلة إيجابية من ثقافة أخرى، فإنه:","o":["يرسخ القيم المهنية","يعزز ثقافة احترام الآخرين","يخفض دافعية التعلم","يضعف من تعزيز الهوية الوطنية"],"a":1,"f":"الاستشهاد بأمثلة إيجابية من ثقافات أخرى يغرس تقبل الآخرين واحترام تنوعهم، فيعزز ثقافة احترام الآخرين دون أن يضعف الهوية الوطنية."},{"s":"أسئلة المعيار الأول","n":26,"q":"يهدف المعلم (عبد الرحمن) إلى تشجيع طلابه على التحدث باللغة العربية الفصحى. أي الممارسات الآتية أكثر ملاءمة في تحقيق هذا الهدف؟","o":["يُكثر من ترديد الأناشيد باللغة العربية الفصحى ويحرص على حفظ الطلاب لها","يقدم الهدايا التشجيعية للطلاب الذين يتحدثون باللغة العربية الفصحى لتحفيزهم","يتحدث المعلم باللغة العربية الفصحى فيقتدي به الطلاب","يطلب من الطلاب عند التحدث أن يتحدثوا باللغة العربية الفصحى"],"a":2,"f":"التعلم بالقدوة أقوى أثراً؛ فتحدث المعلم نفسه بالفصحى يجعل الطلاب يقلدونه، بينما الأناشيد والهدايا والأمر المباشر أقل تأثيراً."},{"s":"أسئلة المعيار الأول","n":27,"q":"المعلم (سلطان) يريد توعية طلابه عن أضرار مشروبات الطاقة، من الأساليب الأكثر فاعلية في ذلك:","o":["استضافة أحد المشاهير في برنامج مدرسي للتوعية","توزيع منشورات توعوية للطلاب في المدرسة بمخاطرها","إعداد ورشة عمل يشارك بها الطلاب للتوعية بمضارها","إعداد فقرة توعوية في الإذاعة المدرسية"],"a":2,"f":"ورشة العمل التي يشارك فيها الطلاب تحقق التعلم النشط والمشاركة الفعلية فتكون أعمق أثراً، بخلاف المنشورات والإذاعة التي تعتمد على التلقي السلبي."},{"s":"أسئلة المعيار الأول","n":28,"q":"أي من العبارات الآتية تعتبر صحيحة؟","o":["يُعفى المعلم المكلف بالندب الكلي من الإشرافات اليومية وحصص الانتظار","يُعفى المعلم المكلف بالندب الكلي من أنشطة الإشراف اليومية والريادة","لا يُعفى المعلم المكلف بالندب الكلي من أنشطة الإشراف اليومية وحصص الانتظار","يُعفى المعلم المكلف بالندب الكلي من جميع أنشطة الإشراف"],"a":2,"f":"المعلم المنتدب ندباً كلياً لا يُعفى من الإشراف اليومي وحصص الانتظار بحسب ما نصت عليه ضوابط الندب، فتكون العبارة الصحيحة هي النافية للإعفاء."},{"s":"أسئلة المعيار الأول","n":29,"q":"أي من الممارسات التالية يقوم بها المعلم ليغرس بسلوكه قيم الوسطية والاعتدال في نفوس الطلاب؟","o":["يعلق لوحات في ممرات المدرسة تحث على التكاتف ونبذ الفرقة","يُذكر الطلاب دائماً بمبدأ الثواب والعقاب في الدنيا والآخرة","يتعامل باحترام مع عمال المدرسة المسلمين وغير المسلمين","يعطي في دروسه أمثلة وشواهد من ثقافات أخرى"],"a":2,"f":"غرس الوسطية بالسلوك يتحقق بالقدوة العملية، كاحترام جميع العاملين مسلمين وغير مسلمين، أما اللوحات والتذكير والأمثلة فأساليب لفظية أو غير مباشرة."},{"s":"أسئلة المعيار الأول","n":30,"q":"أي الإستراتيجيات الآتية يُعد استعمالها من قبل المعلم أكثر فعالية لمساعدة الطلاب على فهم التنوع الثقافي وتعزيز احترام ثقافة الآخرين؟","o":["وضع ملصقات على جدران الغرفة الصفية للثقافات المختلفة","بيان أيام العطل والأعياد الرسمية في الثقافات المختلفة","تكليف الطلاب بنشاط عملي حول الثقافات المختلفة","تشجيع الطلاب على تعلم اللغات المختلفة"],"a":2,"f":"النشاط العملي يتيح للطلاب الاستكشاف والتفاعل المباشر مع الثقافات المختلفة فيفهمون التنوع ويحترمونه، أما الملصقات والتقويم فتعريف سطحي."},{"s":"أسئلة المعيار الأول","n":31,"q":"التفاعل الواعي مع التطورات الحضارية العالمية في ميادين العلوم والثقافة والآداب هو من الأسس الفلسفية للتربية، وهو مرتبط بأساس:","o":["البحث وحفظ الحقوق","التضامن الإسلامي","الأصالة والمعاصرة","اللغة والفكر"],"a":2,"f":"التفاعل الواعي مع التطورات الحضارية العالمية يعبر عن أساس الأصالة والمعاصرة، أي التمسك بالثوابت مع الانفتاح على العصر."},{"s":"أسئلة المعيار الأول","n":32,"q":"لتنمية الوطنية لدى الطلاب:","o":["غرس حب مفهوم الوطن والمواطنة","تعليق الأعلام بالفصول","عمل برامج ثقافية","زيارة مصانع وطنية"],"a":0,"f":"تنمية الوطنية تقوم أساساً على غرس مفهوم الوطن والمواطنة وحبهما في الطلاب، أما الأعلام والبرامج والزيارات فوسائل داعمة."},{"s":"أسئلة المعيار الأول","n":33,"q":"أي من الإجراءات التالية تمثل المعلم القدوة؟","o":["استخدام أساليب تربوية في التعليم","مراعاة الظروف النفسية للطلاب","حسن التعامل مع الطلاب والمعلمين","التطبيق العملي للمواقف المختلفة"],"a":3,"f":"القدوة هي التطبيق العملي لما يدعو إليه المعلم في المواقف المختلفة، فيرى الطلاب القيم مجسدة في سلوكه."},{"s":"أسئلة المعيار الأول","n":34,"q":"قامت معلمات إحدى المدارس بمبادرات لتعزيز احترام الثقافة العربية المتنوعة لدى الطالبات. أي مما يأتي لا تحقق تلك المبادرة؟","o":["عقد مسابقة لغوية لإلقاء القصائد العربية المشهورة","تقديم محاضرة عن عادات الزواج في الدول العربية","استضافة عدد من أولياء أمور الطالبات للحديث عن بلدانهن","تنظيم معرض لأنواع الخط العربي وتطوره عبر العصور في البلدان العربية"],"a":0,"f":"المسابقة اللغوية لإلقاء القصائد تنمّي مهارة لغوية وأدبية ولا تتناول تنوع الثقافة العربية وعاداتها، بخلاف بقية المبادرات."},{"s":"أسئلة المعيار الأول","n":35,"q":"تغيب معلم عن المدرسة 3 أيام، ولم يخبر الإدارة بذلك، تواصلت إدارة المدرسة لأخذ إفادته عن غيابه فقام بالرد (متأخراً) بتقرير طبي لغيابه ولكن إدارة المدرسة لم تقبل عذره. ما المدة التي تأخرها المعلم؟","o":["7 أيام","10 أيام","30 يوماً","15 يوماً"],"a":0,"f":"وفق نظام الخدمة المدنية يُقبل عذر الغياب إذا قُدّم خلال المدة النظامية، وتأخر المعلم هنا سبعة أيام بحسب الإجابة المعتمدة."},{"s":"أسئلة المعيار الأول","n":36,"q":"أثناء الحصة الأخيرة؛ أتى إليك ولي أمر أحد طلابك يريد الاستئذان لابنه للخروج، ولاحظت أن ولي الأمر كان غاضباً، كما أنه لا يبدو بحالة جيدة. ماذا ينبغي عليك فعله في هذه الحالة؟","o":["السماح للابن بالخروج مع والده","تحويل ولي الأمر إلى إدارة المدرسة","أخذ إذن الطالب بالخروج من عدمه","الطلب من ولي الأمر الانتظار حتى نهاية الحصة ثم أخذ ابنه"],"a":1,"f":"عند حضور ولي أمر غاضب وبحال غير طبيعية يُحال إلى إدارة المدرسة لاتخاذ الإجراء النظامي حفاظاً على سلامة الطالب، ولا يتصرف المعلم منفرداً."},{"s":"أسئلة المعيار الأول","n":37,"q":"أثناء إشرافك في الفسحة حدث نقاش بينك وبين أحد الزملاء المعلمين؛ فأساء إليك في كلامه أمام طلابك:","o":["رد الإساءة بالمثل؛ لحفظ هيبتك كمعلم","التوجه فوراً لإدارة المدرسة وإبلاغهم بما حدث","ضبط النفس والتعامل مع الموقف حسب الأنظمة","تجاهل الأمر والتغاضي لأجل المصلحة التعليمية"],"a":2,"f":"الواجب ضبط النفس وإدارة الموقف بما تقتضيه الأنظمة، حفاظاً على القدوة أمام الطلاب، دون رد بالمثل ولا تجاهل ولا انفعال."},{"s":"أسئلة المعيار الأول","n":38,"q":"تلقى المعلم (عبد السلام) اتصالاً هاتفياً من أخصائي نفسي من عيادة خارج المدرسة يطلب فيها معلومات عن أحد الطلاب في الصف الأول المتوسط. ما الخطوة الأولى التي يجب على المعلم اتباعها؟","o":["التحدث مع إدارة المدرسة بشأن ذلك واتباع التعليمات","تصوير سجلات الأداء الأكاديمي للطالب في ذلك العام وإرسالها","استشارة المعلمين القدامى لإعداد سجل غير رسمي للطالب وإرساله","إبلاغ الطالب والرجوع إليه بالموافقة لإرسال المعلومات المطلوبة"],"a":0,"f":"المعلومات عن الطالب سرية، فالخطوة الأولى الرجوع إلى إدارة المدرسة واتباع تعليماتها، فهي الجهة المخولة بالإفصاح."},{"s":"أسئلة المعيار الأول","n":39,"q":"لاحظ أحد المعلمين بأن جدلاً فكرياً وعقائدياً يشيع بين زملائه في المدرسة؛ حيث يُظهر بعضهم معتقدات وممارسات دينية تبدو متشددة، في حين يُظهر آخرون توجهات معاكسة، وهو ما أثار مشكلات مستمرة بينهم، وخاصة حول الصورة التي يجب أن تقدم للطلاب عن الإسلام، ماذا يجب على هذا المعلم فعله؟","o":["يقف مع الملتزمين بمعتقداتهم؛ فالوصم بالتشدد أصبح سلاحاً يُشهر في وجه من يلتزم بدينه","يسهم في تقديم أنشطة تعزز الفكر الوسطي المعتدل دون تفريط في المبادئ الأساسية","يتجنب الدخول في الجدل؛ إذ لا جدوى من ذلك إلا كسب عداء الطرفين","يبدي فكراً منفتحاً متساهلاً يسهم في تقبل العالم لنا"],"a":1,"f":"المعلم المسؤول يسهم في أنشطة تعزز الفكر الوسطي المعتدل دون تفريط في الثوابت، فلا ينحاز لأحد الطرفين ولا يتساهل."},{"s":"أسئلة المعيار الثاني","n":1,"q":"التخطيط في التنمية المهنية يكون:","o":["خطة طويلة الأجل","خطة استراتيجية","خطة قصيرة الأجل","خطة متوسطة الأجل"],"a":1,"f":"التخطيط للتنمية المهنية يكون استراتيجياً بعيد النظر يربط التطوير بأهداف عامة وخطط مستمرة، وليس قصير الأجل فقط."},{"s":"أسئلة المعيار الثاني","n":2,"q":"......... أي توفير مناخ الاستقرار الوظيفي وتحسين ظروف العمل، والتوطين داخل المدارس لفترات طويلة:","o":["المساندة المهنية","التربية المهنية","التدريب المهني","التطوير المهني"],"a":0,"f":"المساندة المهنية تعني توفير الاستقرار الوظيفي وتحسين ظروف العمل والتوطين في المدارس لفترات طويلة، بخلاف التدريب والتطوير."},{"s":"أسئلة المعيار الثاني","n":3,"q":"......... تتحدد من خلالها نقاط القوة والضعف لدى المعلم والمخاطر والتهديدات والفرص المتاحة:","o":["ملف الإنجاز المهني","أداة نافذة جوهاري","ملف الإنجاز الإلكتروني","أداة سوات SWOT"],"a":3,"f":"أداة سوات SWOT تحدد نقاط القوة والضعف والفرص والتهديدات، أما نافذة جوهاري فتحلل مناطق المعرفة بالذات."},{"s":"أسئلة المعيار الثاني","n":4,"q":"تمثل هذه المنطقة ما يعرفه المعلم عن نفسه، وما يعرفه زملاؤه عنه:","o":["المنطقة العامة","المنطقة العمياء","المنطقة الخاصة","المخاطر والتهديدات"],"a":0,"f":"في نافذة جوهاري، ما يعرفه المعلم عن نفسه ويعرفه الآخرون عنه هو المنطقة العامة (المفتوحة)."},{"s":"أسئلة المعيار الثاني","n":5,"q":"......... تتم قراءة نتائج البحث والنظر إليها بواقعية ومدى قابليتها للتصديق:","o":["التخطيط للعمل المستقبلي","تنظيم خطة العمل","جمع البيانات","تحليل البيانات"],"a":0,"f":"قراءة نتائج البحث بواقعية والنظر في مدى قابليتها للتصديق خطوة تفسير وتقييم، وهي أقرب إلى تحليل البيانات منها إلى التخطيط المستقبلي."},{"s":"أسئلة المعيار الثاني","n":6,"q":"يُقيم المعلم مشاريع الطلاب بصورة أولية، ويمنحهم مزيداً من الوقت لمراجعتها للتطوير والتحسين، هذه الممارسة تهدف إلى تشجيع الطلاب على:","o":["الثقة بالنفس","التأمل الذاتي","العمل الفردي","استغلال الوقت"],"a":1,"f":"منح الطلاب وقتاً لمراجعة مشاريعهم بعد التقييم الأولي يدفعهم لمراجعة أعمالهم وتقويمها بأنفسهم، أي التأمل الذاتي."},{"s":"أسئلة المعيار الثاني","n":7,"q":"معلم شارك بأنشطة مقامة بإحدى الجامعات عنوانها (المعلم الخبير)، مشاركة المعلم تعتبر:","o":["نشاطاً تطوعياً","تنمية مهنية","أنشطة لا صفية","شراكة مجتمعية"],"a":1,"f":"المشاركة في أنشطة جامعية متخصصة للمعلم الخبير تدخل في التنمية المهنية لأنها ترفع كفاءة المعلم وخبراته."},{"s":"أسئلة المعيار الثاني","n":8,"q":"البرامج التدريبية طويلة المدى تعتبر من أنواع أنشطة التطوير المهني لشاغلي الوظائف التعليمية والتي يجب ألا تقل عن:","o":["فصل دراسي","أسبوع","شهر","عشرة أيام"],"a":3,"f":"البرامج التدريبية طويلة المدى لا تقل عن عشرة أيام بحسب ما ورد في لائحة الوظائف التعليمية لأنشطة التطوير المهني."},{"s":"أسئلة المعيار الثاني","n":9,"q":"كل مما يلي يُعد من وسائل وأساليب النمو المهني للمعلم ما عدا:","o":["تبادل الزيارات","التدريس المصغر","القراءة الموجهة","المساهمة في محو الأمية"],"a":3,"f":"تبادل الزيارات والتدريس المصغر والقراءة الموجهة وسائل نمو مهني مباشرة، أما المساهمة في محو الأمية فنشاط مجتمعي تطوعي."},{"s":"أسئلة المعيار الثاني","n":10,"q":"العمليات التي تهدف إلى تغيير مهارات ومواقف وسلوك المعلمين ليكون أكثر كفاءة وفعالية بما يتوافق مع حاجات المدرسة، تسمى:","o":["الشراكة المجتمعية","التنمية المهنية للمعلمين","القيادة القائمة على التعلم","التعليم القائم على المعلم"],"a":1,"f":"العمليات التي تغير مهارات المعلمين ومواقفهم وسلوكهم لرفع كفاءتهم بحسب حاجات المدرسة هي التنمية المهنية للمعلمين."},{"s":"أسئلة المعيار الثاني","n":11,"q":"المعلم الناجح هو الذي:","o":["يستطيع ضبط الصف","يحقق أهداف المنهج المعرفية والمهارية والنفس حركية","يقدر على تنمية المهارات والمعارف","لديه فن الإلقاء"],"a":1,"f":"المعلم الناجح يحقق أهداف المنهج بمجالاتها الثلاثة المعرفية والمهارية والنفس حركية، وهو أشمل من ضبط الصف أو الإلقاء."},{"s":"أسئلة المعيار الثاني","n":12,"q":"يكون إعداد المعلم الناجح بـ:","o":["إعداده نفسياً ومعرفياً","إعداده بدنياً ومعرفياً","إعداده نفسياً واجتماعياً","إعداده مهنياً وأكاديمياً"],"a":3,"f":"إعداد المعلم الناجح يقوم على جانبين متكاملين هما الإعداد المهني التربوي والإعداد الأكاديمي في التخصص."},{"s":"أسئلة المعيار الثاني","n":13,"q":"التنمية المهنية للمعلم هي:","o":["تحسين الأداء المهني وتوسيع معرفة المعلم","الحصول على شهادة معتمدة للتدريس","الحصول على وظيفة مهنية جديدة","تطوير مهارات التدريس والتعلم والتطوير المهني المستمر"],"a":3,"f":"التنمية المهنية عملية مستمرة لتطوير مهارات التدريس والتعلم لدى المعلم، وهي أوسع من مجرد شهادة أو وظيفة جديدة."},{"s":"أسئلة المعيار الثاني","n":14,"q":"من مبررات التنمية المهنية:","o":["تحسين فرص الحصول على الوظائف","تحسين جودة التعليم وتحسين أداء المعلمين","تقليل الإجهاد الذي يتعرض له المعلمون","الحصول على مكافآت مالية وزيادة الأجور"],"a":1,"f":"مبرر التنمية المهنية الأساسي هو تحسين جودة التعليم وأداء المعلمين، لا المكاسب الشخصية كالوظائف والمكافآت."},{"s":"أسئلة المعيار الثاني","n":15,"q":"الفرق بين التنمية المهنية والتدريب المهني والمساندة المهنية:","o":["لا يوجد فرق بينهم","التنمية المهنية تتضمن كلاً من التدريب المهني والمساندة المهنية","التنمية المهنية تعني تحسين الأداء والمهارات، بينما التدريب المهني يتركز على تعليم مهارات محددة، والمساندة المهنية تركز على توفير الدعم العاطفي والنفسي","التنمية المهنية تتركز على النمو الشخصي والمهني، بينما التدريب المهني يتركز على تعليم المهارات المحددة، والمساندة المهنية تركز على توفير الدعم العاطفي والنفسي"],"a":3,"f":"التنمية المهنية تركز على النمو الشخصي والمهني، والتدريب المهني على مهارات محددة، والمساندة المهنية على الدعم النفسي والعاطفي؛ فهي مفاهيم متمايزة."},{"s":"أسئلة المعيار الثاني","n":16,"q":"التأمل المهني الذاتي هو:","o":["النظر إلى أخطاء الآخرين","النظر إلى أخطاء الذات والتفكير في كيفية التحسين","الانشغال بالعمل الإداري","البحث عن وظائف أخرى"],"a":1,"f":"التأمل المهني الذاتي هو مراجعة المعلم لأدائه وأخطائه والتفكير في سبل تحسينه، وليس رصد أخطاء الآخرين."},{"s":"أسئلة المعيار الثاني","n":17,"q":"البحث الإجرائي هو:","o":["البحث عن المعلومات عبر الإنترنت","عملية تنفيذ الخطط والبرامج التعليمية","تطبيق الأساليب العلمية في تحليل وفهم وتحسين العملية التعليمية","تدريس المفاهيم والموضوعات في المناهج الدراسية"],"a":2,"f":"البحث الإجرائي تطبيق للأساليب العلمية داخل الصف لتحليل مشكلات العملية التعليمية وفهمها وتحسينها."},{"s":"أسئلة المعيار الثاني","n":18,"q":"الهدف الرئيسي للتدريب المهني هو:","o":["تحسين جودة التعليم","تحسين جودة الحياة الشخصية","تحسين فرص الحصول على الوظائف","الحصول على مكافآت مالية وزيادة الأجور"],"a":0,"f":"الهدف الرئيسي للتدريب المهني تحسين جودة التعليم عبر رفع كفاءة المعلم، أما الوظائف والمكافآت فنتائج جانبية."},{"s":"أسئلة المعيار الثاني","n":19,"q":"أهمية التنمية المهنية للمعلم:","o":["تحسين جودة التعليم وتحقيق أفضل نتائج للطلاب","الحصول على وظيفة مرموقة ودخل مالي أفضل","تطوير مهارات التدريس والتعلم والتطوير المهني المستمر","تحسين الاستقرار الوظيفي والنفسي للمعلم"],"a":2,"f":"أهمية التنمية المهنية كما وردت في الخيار المعتمد أنها تطور مهارات التدريس والتعلم وتضمن استمرار التطوير المهني للمعلم."},{"s":"أسئلة المعيار الثاني","n":20,"q":"من فوائد البحث الإجرائي في التنمية المهنية:","o":["تطوير مهارات البحث العلمي وتحليل البيانات","تحسين جودة التعليم واتباع أفضل الممارسات","تطوير القدرة على اتخاذ القرارات الصحيحة والمسؤولة","جميع الفوائد المذكورة"],"a":3,"f":"البحث الإجرائي يجمع فوائد متعددة هي تطوير مهارات البحث وتحسين جودة التعليم وصواب القرارات، لذا الإجابة جميع الفوائد."},{"s":"أسئلة المعيار الثاني","n":21,"q":"ما هي المبادئ الأساسية للتنمية المهنية؟","o":["التفكير النقدي وتحليل الأفكار والمفاهيم","الالتزام بالتعلم المستمر والتطوير المهني","التفاعل الإيجابي مع الآخرين والعمل الجماعي","جميع المبادئ المذكورة"],"a":3,"f":"للتنمية المهنية مبادئ متكاملة تشمل التفكير النقدي والتعلم المستمر والتفاعل الإيجابي، لذلك الإجابة تشمل جميعها."},{"s":"أسئلة المعيار الثاني","n":22,"q":"يُعد التطوير المهني المستمر للمعلمين من المحاور الأساسية التي توليها وزارة التعليم أهمية كبيرة. أي مما يأتي لا يُعد من أهداف هذه العملية؟","o":["تطوير البيئة المادية للصف","تطوير قدرات ومهارات المعلمين","تحسين الأداء الأكاديمي للطلاب","الارتقاء بمستوى الكوادر التربوية"],"a":0,"f":"أهداف التطوير المهني تتعلق بالمعلم وأدائه وأثره في الطلاب، أما تطوير البيئة المادية للصف فليس هدفاً مباشراً لهذه العملية."},{"s":"أسئلة المعيار الثاني","n":23,"q":"كل مما يأتي من أهداف التنمية المهنية للمعلمين ما عدا:","o":["صقل مهارات المعلم العلمية وزيادة معارفه","تبصير المعلم بخطط تطور التعليم ودور المعلم فيها","تحقيق النمو المستمر للمعلم؛ لرفع مستوى أدائه المهني","تهيئة المعلم لتعددية الأدوار والمسؤوليات في مجال التعليم"],"a":3,"f":"الأهداف الثلاثة الأولى تخص تنمية معارف المعلم وأدائه المستمر، أما تهيئته لتعدد الأدوار فلم يُعد من أهداف التنمية المهنية في هذا السياق."},{"s":"أسئلة المعيار الثاني","n":24,"q":"كي يتمكن المعلمون من معرفة أثر خطة تطوير الأداء المهني لهم على مستوى ما يقدمونه من أداء، فإنه يجب عليهم أن:","o":["يحللوا نتائج اختبارات القدرات العامة للطلاب","يحللوا فجوة الأداء بناءً على معايير المعلمين المهنية","يشاركوا في مزيد من الورش التدريبية حول استراتيجيات التقويم","يشاركوا في مزيد من الورش التدريبية حول استراتيجيات التدريس"],"a":1,"f":"لمعرفة أثر خطة التطوير في الأداء يحلل المعلمون فجوة الأداء مقارنة بمعايير المعلمين المهنية قبل الخطة وبعدها."},{"s":"أسئلة المعيار الثاني","n":25,"q":"(أحمد) معلم يسعى دائماً لتطوير أدائه المهني ويحصل على المعارف والمعلومات من مصادر علمية موثوقة، ومنها:","o":["المجلات الأسبوعية","مواقع التواصل الاجتماعي","المجلات العلمية المحكمة","المنتديات التربوية في الإنترنت"],"a":2,"f":"المجلات العلمية المحكمة مصدر موثوق لأنها تخضع لتحكيم متخصصين، بخلاف مواقع التواصل والمنتديات غير الموثقة."},{"s":"أسئلة المعيار الثاني","n":26,"q":"يمكن من خلالها الحصول على عينات منتقاة من الأعمال والتأملات المهنية للمعلم، كما أنها تعكس نموه المهني وإسهاماته خلال فترة معينة؟","o":["الاختبارات المهنية للمعلم","الأنشطة الصفية المختلفة","اختبارات العينة للمعلم","حقيبة إنجاز المعلم"],"a":3,"f":"حقيبة الإنجاز مجموعة منتقاة من أعمال المعلم وتأملاته تعكس نموه المهني وإسهاماته خلال فترة محددة."},{"s":"أسئلة المعيار الثاني","n":27,"q":"قدرة المعلم على التخطيط وتحديد أهداف مهنية يسعى إلى تحقيقها، تُسمى:","o":["تقدير الأداء","النمو المهني","التميز المهني","تشخيص الأداء"],"a":1,"f":"قدرة المعلم على التخطيط ووضع أهداف مهنية يسعى لتحقيقها تمثل النمو المهني الذاتي."},{"s":"أسئلة المعيار الثاني","n":28,"q":"إذا طلب من المعلم التقدم إلى دورات تدريبية أثناء الخدمة، فإن الواجب عليه:","o":["عدم إعطاء الأمر أهمية","دراسة مدى مناسبة الدورة له مستقبلاً","التأكد من رغبة زملائه في التقدم إليها","معرفة العائد المالي منها"],"a":1,"f":"الواجب على المعلم دراسة مدى مناسبة الدورة لاحتياجاته وتطوره المهني، بدل تجاهلها أو ربطها بالزملاء أو العائد المالي."},{"s":"أسئلة المعيار الثاني","n":29,"q":"جميع العوامل الآتية تؤثر على الاتجاه الإيجابي للمعلم نحو مهنة التدريس؛ ما عدا:","o":["الإعداد المهني","الإعداد الثقافي","الإعداد الأكاديمي","امتلاك الكفايات التدريسية"],"a":3,"f":"الإعداد المهني والثقافي والأكاديمي تُكوّن اتجاه المعلم الإيجابي، أما امتلاك الكفايات التدريسية فنتيجة لها أكثر منه عاملاً مؤثراً."},{"s":"أسئلة المعيار الثاني","n":30,"q":"حسب نافذة (جوهاري)؛ فإن المنطقة التي لا تعرفها أنت ويعرفها الآخرون هي:","o":["العمياء","المجهولة","الخفية","المفتوحة"],"a":0,"f":"في نافذة جوهاري، ما يعرفه الآخرون عنك ولا تعرفه أنت يقع في المنطقة العمياء."},{"s":"أسئلة المعيار الثاني","n":31,"q":"من المسؤولية المهنية للمعلم:","o":["تطوير علاقاته الاجتماعية مع زملائه","عدم مناقشة زملائه في أدائهم","الإسهام في تطوير خبرات زملائه","عدم السماح لزملائه في تقويم أعمال طلابه"],"a":2,"f":"من المسؤولية المهنية للمعلم الإسهام في تطوير خبرات زملائه وتبادل الخبرة معهم، وليس الانعزال أو منع مناقشة الأداء."},{"s":"أسئلة المعيار الثاني","n":32,"q":"من حقوق المعلم المهنية:","o":["الاطلاع على تقويم الأداء","دراسة المناهج وتقويمها","المشاركة في برامج النشاط","حضور الاجتماعات المدرسية"],"a":0,"f":"الاطلاع على تقويم الأداء حق مهني للمعلم، أما دراسة المناهج وحضور الاجتماعات والمشاركة في الأنشطة فواجبات."},{"s":"أسئلة المعيار الثاني","n":33,"q":"مشاركة المعلم المستمرة في الأنشطة غير الصفية تدل على أن المعلم:","o":["يملك اتجاهاً إيجابياً نحو مهنة التدريس","يحافظ على تراث المجتمع","يحرص على التطوير المهني","يتقبل الأفكار الجديدة"],"a":0,"f":"المشاركة المستمرة في الأنشطة غير الصفية دلالة على اتجاه إيجابي نحو مهنة التدريس وحب لها."},{"s":"أسئلة المعيار الثاني","n":34,"q":"كل ما يلي من المهارات المهنية المعرفية التي يجب على المعلم أن يسعى لتطويرها؛ ما عدا:","o":["فهم الأسس النفسية لتعلم الطلاب","فهم العلاقات بين أفراد المجتمع","معرفة أساليب البحث العلمي","معرفة الطرق المختلفة للتدريس"],"a":1,"f":"فهم العلاقات بين أفراد المجتمع مهارة اجتماعية، أما أسس تعلم الطلاب وأساليب البحث وطرق التدريس فمهارات مهنية معرفية."},{"s":"أسئلة المعيار الثاني","n":35,"q":"عندما تلاحظ أن زميلك الآخر يخالف الأنظمة المهنية؛ ما هو التصرف المناسب لهذا الموقف؟","o":["تناقشه أمام الزملاء المعلمين","تبتعد عنه وتتجاهل الموقف","تحذر الطلاب من أفكاره","تخبر مدير المدرسة"],"a":3,"f":"عند ملاحظة مخالفة زميل للأنظمة المهنية يبلغ المعلم مدير المدرسة بالطريق النظامي، دون التشهير أو التجاهل."},{"s":"أسئلة المعيار الثاني","n":36,"q":"من العوامل التي تتحكم في تطوير الأداء المهني للمعلم:","o":["الالتزام بالسياسات واللوائح التعليمية","حسن التصرف في المواقف الصعبة","تنمية اتجاه ذاتي للتعلم مدى الحياة","كيفية التعامل مع الزملاء وأولياء الأمور"],"a":2,"f":"تنمية اتجاه ذاتي للتعلم مدى الحياة هي العامل المتحكم الأساسي في تطوير الأداء المهني لأنها تدفع المعلم للتجدد المستمر."},{"s":"أسئلة المعيار الثاني","n":37,"q":"آراء طلابك والتغذية الراجعة من زملائك المعلمين كلاهما من وسائل معرفة وتحديد:","o":["الأهداف التربوية","العلاقات الإيجابية","الصلاحيات التربوية","الاحتياجات التدريبية"],"a":3,"f":"آراء الطلاب وتغذية الزملاء الراجعة مصدران لكشف جوانب القصور، فهما من وسائل تحديد الاحتياجات التدريبية."},{"s":"أسئلة المعيار الثاني","n":38,"q":"عندما يبحث المعلم عن الاستفادة من المصادر المجتمعية المختلفة أثناء التأمل الذاتي الهادف إلى تطوير الأداء المهني، فإنه يكون ضمن أحد محاور أداة سوات (SWOT) للتأمل الذاتي وهو:","o":["التهديدات","الفرص","نقاط القوة","نقاط الضعف"],"a":1,"f":"الاستفادة من الموارد والمصادر المجتمعية المتاحة تندرج ضمن محور الفرص في أداة SWOT لأنها عوامل خارجية داعمة."},{"s":"أسئلة المعيار الثاني","n":39,"q":"تعزيز التعاون بين المعلمين بمبادرة المعلمين الأقدم والأكثر خبرة بدعوة المعلمين حديثي التعيين لحضور الحصص الدراسية معهم، يُعد طريقة جيدة لـ:","o":["ورش العمل التخصصية","تعزيز تعلم الطلاب","الشراكة المجتمعية","التطوير المهني"],"a":3,"f":"دعوة الخبراء للمبتدئين لحضور حصصهم من أساليب التعلم بالزيارات الصفية، وهي طريقة جيدة للتطوير المهني."},{"s":"أسئلة المعيار الثاني","n":40,"q":"وفقاً لنموذج (نافذة جوهاري)، فإن تزويد المعلم بتغذية راجعة عن نواحي القوة والضعف في أدائه يؤدي إلى:","o":["خفض المنطقة العمياء وزيادة المنطقة العامة","زيادة المنطقة المخفية وخفض المنطقة العمياء","زيادة المنطقة العمياء وخفض المنطقة المخفية","خفض المنطقة العامة وزيادة منطقة الأنشطة غير المعلومة"],"a":0,"f":"التغذية الراجعة تكشف للمعلم ما يجهله عن نفسه فتتقلص المنطقة العمياء وتتسع المنطقة العامة (المفتوحة)."},{"s":"أسئلة المعيار الثالث","n":1,"q":"يشير هذا الدور لسلوك واتجاهات القائد، بحيث يشعر القائد بأنه جزء أكبر وأهم، وأن دوره ليس ليقود، بل ليقدم خدمة للتنظيم للوصول به لوضع أفضل:","o":["القائد كموجه","القائد كمصمم","القائد كمعلم","القائد كمرشد نفسي"],"a":0,"f":"القائد كموجه يرى نفسه جزءاً من التنظيم وخادماً له لا مجرد قائد، فيقدم التوجيه والخدمة للوصول بالتنظيم لوضع أفضل."},{"s":"أسئلة المعيار الثالث","n":2,"q":"من العوامل التي تُسهم في تكوين أرضية مشتركة بين زملاء العمل كل مما يلي، عدا:","o":["الإنصات والاستماع لكل الأخبار بشكل دقيق","الانتباه للإشارات غير المنطوقة من الناس","التحدث عن الأهداف المشتركة في الاجتماعات الرسمية وغير الرسمية","عدم التعامل مع الزملاء المختلفين فكرياً"],"a":3,"f":"الإنصات والانتباه للإشارات والتحدث عن الأهداف المشتركة تبني أرضية مشتركة، أما رفض التعامل مع المختلفين فكرياً فيعطلها."},{"s":"أسئلة المعيار الثالث","n":3,"q":"أي العبارات الآتية توضح نشاط المعلم في المناسبات والفعاليات والأنشطة الاجتماعية التي تنفذ داخل وخارج المدرسة:","o":["ينحصر دوره في الإشراف على الطلبة","أنه نشاط تنفيذي مرسوم من الإدارة","يستثمر هذه المناسبات لتزويد الطلاب بالخبرات ولدعم تعلمهم","مشاركته في الاختيار لأنها ليست من صميم عمله"],"a":2,"f":"المعلم يستثمر المناسبات والفعاليات المدرسية والمجتمعية لتزويد الطلاب بالخبرات ودعم تعلمهم، وليس مجرد مشرف أو منفذ."},{"s":"أسئلة المعيار الثالث","n":4,"q":"ما هي مجتمعات التعلم المهنية؟","o":["مجموعة من الأفراد يتعلمون سوياً في بيئة عمل معينة","مجموعة من الأفراد يتعلمون سوياً في بيئة تعليمية معينة","مجموعة من الأفراد يتعلمون بشكل فردي في بيئة عمل معينة","مجموعة من الأفراد يتعلمون بشكل فردي في بيئة تعليمية معينة"],"a":1,"f":"مجتمعات التعلم المهنية مجموعات تتعلم معاً تعاونياً لا فردياً؛ والخيار المحدد هنا يشير للبيئة التعليمية، مع أن الأدق بيئة العمل."},{"s":"أسئلة المعيار الثالث","n":5,"q":"مفهوم مجتمعات التعلم المهنية هو:","o":["مجموعة من الأفراد يتعلمون بشكل فردي في بيئة عمل معينة","مجموعة من الأفراد يتعلمون سوياً وبشكل مستمر في بيئة عمل معينة","مجموعة من الأفراد يتعلمون سوياً في بيئة تعليمية معينة","مجموعة من الأفراد يتعلمون بشكل فردي في بيئة تعليمية معينة"],"a":1,"f":"المفهوم يقوم على أفراد يتعلمون معاً وباستمرار في بيئة عملهم، فالتعلم جماعي ومستمر لا فردي."},{"s":"أسئلة المعيار الثالث","n":6,"q":"طبيعة مجتمعات التعلم المهنية تعتمد على:","o":["التعليم النظري والدراسات الأكاديمية","التطبيق العملي والتعلم من الخبرات والممارسات الحالية","الأنشطة الترفيهية","الغموض والعزلة"],"a":1,"f":"طبيعة مجتمعات التعلم المهنية عملية، تعتمد على التطبيق والتعلم من الخبرات والممارسات الحالية، لا النظرية المجردة أو العزلة."},{"s":"أسئلة المعيار الثالث","n":7,"q":"ما هي العناصر الأساسية لمجتمعات التعلم المهنية؟","o":["الأفراد، الموارد، الأهداف، الخطط","الأفراد، الأهداف، الخطط، الممارسات","الأفراد، الممارسات، الأهداف، الارتباطات","الأفراد، الموارد، الأهداف، الارتباطات"],"a":1,"f":"العناصر الأساسية لمجتمعات التعلم المهنية في الإجابة المعتمدة هي الأفراد والأهداف والخطط والممارسات."},{"s":"أسئلة المعيار الثالث","n":8,"q":"أهمية مجتمعات التعلم المهنية:","o":["تعزيز التعلم المستمر وتحسين الأداء المهني للأفراد والمؤسسات","زيادة الوعي بالمسائل الاجتماعية والسياسية","تحسين الصحة العقلية والجسدية للأفراد","جميع ما ذكر"],"a":0,"f":"أهمية مجتمعات التعلم المهنية في تعزيز التعلم المستمر وتحسين الأداء المهني للأفراد والمؤسسة، أما الخيارات الأخرى فخارج غايتها."},{"s":"أسئلة المعيار الثالث","n":9,"q":"من التحديات التي تواجه مجتمعات التعلم المهنية:","o":["قلة الاهتمام والمشاركة من الأفراد","صعوبة التواصل وتبادل المعلومات بين الأعضاء","الصعوبات المالية ونقص التمويل","جميع ما ذكر"],"a":3,"f":"تواجه المجتمعات المهنية تحديات متعددة هي قلة المشاركة وصعوبة التواصل ونقص التمويل، لذا تشملها جميعاً."},{"s":"أسئلة المعيار الثالث","n":10,"q":"أهم الأساليب الفعالة لتشجيع المشاركة في مجتمعات التعلم المهنية:","o":["توفير الحوافز المالية","إنشاء بيئة تعليمية مريحة ومحفزة","تقديم الجوائز والتكريم للمشاركين الفاعلين","جميع ما ذكر"],"a":1,"f":"أفضل ما يشجع المشاركة بيئة تعلم مريحة ومحفزة تعزز الدافعية الداخلية، وهي أبقى من الحوافز المالية والجوائز."},{"s":"أسئلة المعيار الثالث","n":11,"q":"من الخطوات الضرورية لتأسيس مجتمع تعليم مهني ناجح:","o":["تحديد الأهداف والخطط وموارد التمويل","تحديد الأفراد المشاركين وتحديد الممارسات المهنية","تحديد الأهداف والممارسات المهنية وتحديد الأفراد المشاركين","جميع ما ذكر"],"a":2,"f":"تأسيس المجتمع الناجح يبدأ بتحديد الأهداف والممارسات المهنية ثم الأفراد المشاركين، وليس التمويل ضمن الخطوات الضرورية."},{"s":"أسئلة المعيار الثالث","n":12,"q":"أفضل الطرق لتبادل المعرفة والخبرات في مجتمعات التعلم المهنية:","o":["الندوات وورش العمل والدورات التدريبية","الندوات العلمية والمؤتمرات الدولية","الندوات الترفيهية والأنشطة الاجتماعية","جميع ما ذكر"],"a":0,"f":"الندوات وورش العمل والدورات التدريبية أفضل وسائل تبادل المعرفة والخبرات المهنية لأنها تفاعلية وتطبيقية."},{"s":"أسئلة المعيار الثالث","n":13,"q":"التعامل مع أولياء الأمور:","o":["يتطلب مهارات اجتماعية فعالة","لا يؤثر على الأداء التعليمي للطلاب","غير ضروري لنجاح الطلاب في الدراسة","يُترك للإدارة المدرسية"],"a":0,"f":"التعامل مع أولياء الأمور يتطلب مهارات اجتماعية وتواصلية فعالة، وهو ضروري ومؤثر في نجاح الطلاب ولا يُترك للإدارة وحدها."},{"s":"أسئلة المعيار الثالث","n":14,"q":"أهمية التعامل مع أولياء الأمور:","o":["يساعد على تحسين العلاقات المدرسية بين الطلاب والمعلمين","يساعد على تقليل عدد الطلاب في الفصول الدراسية","يزيد من وقت المعلم المخصص للتحضير للدروس","يساعد في تقليل عدد الأسئلة التي يطرحها الطلاب"],"a":0,"f":"التعامل الجيد مع أولياء الأمور يقوي العلاقات المدرسية بين الطلاب والمعلمين ويدعم نجاح الطلاب."},{"s":"أسئلة المعيار الثالث","n":15,"q":"دور المعلم في إشراك أولياء الأمور في العملية التعليمية:","o":["توفير بيئة تعليمية مناسبة للطلاب","توفير المواد التعليمية المناسبة للطلاب","توفير فرص لأولياء الأمور للمشاركة في قرارات المدرسة","توفير النشاطات المناسبة لتعزيز الصحة العقلية والجسدية للطلاب"],"a":2,"f":"إشراك أولياء الأمور يكون بتوفير فرص لمشاركتهم في قرارات المدرسة، ما يجعلهم شركاء حقيقيين في العملية التعليمية."},{"s":"أسئلة المعيار الثالث","n":16,"q":"خطوات بناء علاقة إيجابية مع أولياء الأمور:","o":["الاستماع بانتباه وتفهم للآراء والمخاوف والاقتراحات","عدم الاهتمام بآراء الآباء والأمهات","تجاهل المشاكل والقضايا التي يطرحها الآباء والأمهات","عدم الرد على المكالمات الهاتفية والبريد الإلكتروني"],"a":0,"f":"بناء العلاقة الإيجابية يبدأ بالاستماع باهتمام وتفهم لآراء أولياء الأمور ومخاوفهم واقتراحاتهم، وليس بتجاهلهم."},{"s":"أسئلة المعيار الثالث","n":17,"q":"الشراكة بين المدرسة وأولياء الأمور:","o":["تساعد على تحسين تجربة التعلم للطلاب","تؤدي إلى زيادة عدد الطلاب في الفصول الدراسية","لا تؤدي إلى تحسين العلاقات بين الطلاب والمعلمين","تؤدي إلى خفض جودة التعليم المقدم للطلاب"],"a":0,"f":"الشراكة بين المدرسة وأولياء الأمور تدعم الطلاب وتحسن تجربتهم التعليمية وعلاقاتهم، ولا تخفض جودة التعليم."},{"s":"أسئلة المعيار الثالث","n":18,"q":"مقترحات تطوير التواصل مع أولياء الأمور:","o":["توفير مواقع إلكترونية للتفاعل مع أولياء الأمور","عدم توفير أي مصادر للتواصل مع أولياء الأمور","تقليل عدد الاجتماعات مع أولياء الأمور","تجاهل أي استفسارات أو مخاوف من قبل أولياء الأمور"],"a":0,"f":"تطوير التواصل مع أولياء الأمور يقوم على توسيع قنوات الاتصال، ومنها المواقع الإلكترونية التفاعلية؛ أما تقليل الاجتماعات أو تجاهل الاستفسارات فيُضعف الشراكة."},{"s":"أسئلة المعيار الثالث","n":19,"q":"الهدف الأساسي للتواصل مع أولياء الأمور هو:","o":["توفير معلومات عن تقدم الطلاب في الدراسة","المشاركة في صنع القرارات المدرسية","تحسين التواصل بين المعلمين وأولياء الأمور","تسهيل عملية التسجيل في المدرسة"],"a":2,"f":"الإجابة المعتمدة أن الغاية الأساسية هي تحسين التواصل بين المعلم وولي الأمر لبناء شراكة تخدم الطالب؛ وتقديم المعلومات والمشاركة في القرار وسائل ضمن هذه الغاية."},{"s":"أسئلة المعيار الثالث","n":20,"q":"الطريقة الأكثر فعالية للتواصل مع أولياء الأمور هي:","o":["إرسال رسائل نصية","الاجتماعات الشخصية","البريد الإلكتروني","الاتصال الهاتفي"],"a":1,"f":"الاجتماعات الشخصية أكثر فعالية لأنها حوار مباشر يتيح الاستماع وقراءة تعبيرات الوجه وبناء الثقة، بخلاف الرسائل النصية والبريد التي تغيب فيها هذه العناصر."},{"s":"أسئلة المعيار الثالث","n":21,"q":"الخطوة الأولى لبناء علاقة تعاونية مع أولياء الأمور هي:","o":["تحديد الأهداف المشتركة","توفير المعلومات المتعلقة بالطلاب","الاستماع بانتباه وتفهم لآراء ومخاوف أولياء الأمور","تقديم النصائح والإرشادات اللازمة"],"a":2,"f":"بناء العلاقة التعاونية يبدأ بالإصغاء الواعي لآراء ومخاوف ولي الأمر، فيشعر بالاحترام والثقة، ثم تأتي الأهداف المشتركة وتقديم المعلومات والنصائح."},{"s":"أسئلة المعيار الثالث","n":22,"q":"أشكال الشراكة مع المجتمع:","o":["العمل المشترك في المشاريع الخيرية","توفير فرص التدريب والعمل للطلاب","العمل المشترك في مشاريع البحث والتطوير","جميع ما ذكر"],"a":3,"f":"الشراكة المجتمعية تتخذ صوراً متعددة: مشاريع خيرية، وفرص تدريب وعمل للطلاب، ومشاريع بحث وتطوير؛ لذا تكون «جميع ما ذكر» هي الصحيحة."},{"s":"أسئلة المعيار الثالث","n":23,"q":"أهداف الشراكة المجتمعية:","o":["تحسين جودة التعليم المقدم للطلاب","تحسين العلاقات بين المعلمين والطلاب","تعزيز الشفافية والمساءلة في تعليم الطلاب","جميع ما ذكر"],"a":0,"f":"الهدف الرئيس للشراكة المجتمعية هو رفع جودة التعليم المقدم للطلاب بتوظيف موارد المجتمع وخبراته، وبقية الخيارات نتائج جانبية لا الهدف الأول."},{"s":"أسئلة المعيار الثالث","n":24,"q":"ما هي أهمية الشراكة مع المجتمع؟","o":["تحسين جودة التعليم المقدم للطلاب","تحسين العلاقات بين المعلمين والطلاب","زيادة عدد الطلاب في المدرسة","تحسين الأمن والسلامة داخل المدرسة"],"a":0,"f":"أهم ما تحققه الشراكة مع المجتمع هو تحسين جودة التعليم عبر دعم الموارد والخبرات؛ أما زيادة أعداد الطلاب فليست من غاياتها."},{"s":"أسئلة المعيار الثالث","n":25,"q":"من الموارد المتاحة لتعزيز الشراكة مع المجتمع:","o":["التكنولوجيا الحديثة","الاجتماعات وورش العمل","وسائل التواصل الاجتماعي","جميع ما ذكر"],"a":3,"f":"تعتمد الشراكة على موارد متنوعة مجتمعة: التقنية الحديثة، والاجتماعات وورش العمل، ووسائل التواصل الاجتماعي؛ فالإجابة «جميع ما ذكر»."},{"s":"أسئلة المعيار الثالث","n":26,"q":"العوائق التي يمكن أن تواجه الشراكة مع المجتمع:","o":["عدم وجود الإرادة السياسية","عدم وجود الوقت","عدم توافر الموارد","جميع ما ذكر"],"a":3,"f":"قد تعوق الشراكة المجتمعية غياب الإرادة السياسية وضيق الوقت ونقص الموارد معاً، لذا فالإجابة «جميع ما ذكر»."},{"s":"أسئلة المعيار الثالث","n":27,"q":"من الخطوات الأساسية لتطوير شراكة مجتمعية ناجحة:","o":["تحديد الأهداف وتخطيط العملية","توفير الموارد اللازمة","تحديد الأدوار والمسؤوليات","جميع ما ذكر"],"a":3,"f":"نجاح الشراكة المجتمعية يتطلب تحديد الأهداف والتخطيط، وتوفير الموارد، وتحديد الأدوار والمسؤوليات معاً؛ فكل خطوة مكملة للأخرى."},{"s":"أسئلة المعيار الثالث","n":28,"q":"أي البرامج الآتية يفيد في التواصل مع أولياء الأمور:","o":["School Circle","Remind","Noisy","Class Dojo"],"a":1,"f":"Remind تطبيق مخصص لإرسال الرسائل والتذكيرات لأولياء الأمور والطلاب، وهو الخيار المعتمد في هذا السؤال بين الخيارات المطروحة."},{"s":"أسئلة المعيار الثالث","n":29,"q":"الدراسة المنظمة التي يقوم بها المعلمون لحل المشكلات المهنية تتم عن طريق البحوث:","o":["الوصفية","الإجرائية","التجريبية","الأساسية"],"a":1,"f":"البحوث الإجرائية يجريها المعلمون أنفسهم داخل الصف والمدرسة لدراسة مشكلة مهنية محددة وحلها، بخلاف الوصفية والتجريبية والأساسية التي تهدف للمعرفة العامة."},{"s":"أسئلة المعيار الثالث","n":30,"q":"أراد المعلم (خالد) تدريس الطلاب الدائرة الكهربائية في مادة العلوم، وكان أحد أولياء الأمور مهندساً كهربائياً يتواصل معه المعلم دائماً. أي الممارسات الآتية يفضّل أن يقوم بها المعلم؟","o":["استضافة المهندس في إحدى الحصص بالتنسيق مع الإدارة لتقديم خبراته","يجتهد المعلم في تدريس الموضوع دون استضافة المهندس","تكليف ابن المهندس بنقل خبرات والده إلى غرفة الصف","الطلب من المهندس كتابة تقرير حول خبراته"],"a":0,"f":"استضافة ولي الأمر المهندس بالتنسيق مع الإدارة توظّف خبرة مجتمعية حقيقية في الدرس وفق القنوات النظامية، وهذا أفضل من تكليف الابن أو الاكتفاء بتقرير."},{"s":"أسئلة المعيار الثالث","n":31,"q":"ما التصرف المناسب للمعلم عندما يواجه أي إساءة من قبل ولي أمر الطالب أمام الطلاب؟","o":["الانسحاب من الموقف وتجاهل ولي الأمر","استدعاء الزملاء المعلمين ليشهدوا على الموقف","الرد مباشرة ومقاومة الإساءة؛ كي يحفظ هيبته","عدم الرد وضبط النفس والتعامل مع الموقف وفق الأنظمة"],"a":3,"f":"المعلم يضبط انفعاله ولا يرد بالمثل، ويتعامل مع الإساءة وفق الأنظمة واللوائح عبر الإدارة؛ فالانسحاب أو الرد المباشر يضر بصورته المهنية."},{"s":"أسئلة المعيار الثالث","n":32,"q":"من صور التفاعل الإيجابي الذي يقوم به المعلم مع أولياء الأمور استخدام تقنيات التواصل لإطلاعهم على:","o":["أهداف المقررات الدراسية","أهدافه المعرفية ذات الأولوية","خططه التدريسية وتعلم الطلاب","تنظيم العمل التعليمي والإرشادي"],"a":2,"f":"من التفاعل الإيجابي أن يستخدم المعلم التقنية لإطلاع الأولياء على خططه التدريسية ومستوى تعلم الطلاب، فيتابعون أبناءهم ويشاركون في دعمهم."},{"s":"أسئلة المعيار الثالث","n":33,"q":"لاحظ المعلم (مشاري) الذي يُدرس مادة الرياضيات للصف الأول الثانوي أن ظاهرة التفحيط تزداد لدى المراهقين، ويتوجب على المدرسة أن تقوم بإجراءات وقائية وتوعوية لطلابها المراهقين. دور المعلم في هذه الحالة هو أن:","o":["يتواصل مع أولياء الأمور لحل المشكلة","يتواصل مع إدارة المرور لحل هذه المشكلة","يناقش الموضوع باختصار في حصته مع طلابه","يترك الموضوع لمعلمي المواد الاجتماعية والدينية"],"a":2,"f":"دور المعلم هنا توعوي ضمن حصته، فيناقش الظاهرة باختصار مع طلابه ويوجههم؛ أما معالجتها مع المرور أو الأسر فمن اختصاص جهات أخرى."},{"s":"أسئلة المعيار الثالث","n":34,"q":"يتعاون المعلمون في المدرسة بشكل تبادلي من أجل تطوير أدائهم والتنمية المستدامة من خلال:","o":["مراجعة المادة الدراسية","مجتمعات التعلم المهنية","التعاون مع مدير المدرسة","التخطيط المستمر والفعال"],"a":1,"f":"مجتمعات التعلم المهنية هي الإطار الذي يتعاون فيه المعلمون تبادلياً لتطوير أدائهم وتحقيق تنمية مهنية مستدامة داخل المدرسة."},{"s":"أسئلة المعيار الثالث","n":35,"q":"يرغب مدير المدرسة بترشيح أحد المعلمين لنيل جائزة التفاعل المتميز مع مجتمعات التعلم. إن أهم المعايير التي يعتمد عليها المدير في ترشيحه هو أن:","o":["يُطبق التقويم الذاتي ويتأمل ممارسته المهنية","يستخدم عمليات متنوعة لتطوير أدائه المهني","يدعم مبادرات زملائه الهادفة إلى تحسين الممارسات المهنية","يحضر المؤتمرات التربوية وورش العمل الخاصة بمهنة التدريس"],"a":2,"f":"التفاعل المتميز مع مجتمعات التعلم يظهر في دعم مبادرات الزملاء لتحسين الممارسة المهنية، فهذا جوهر العمل الجماعي التعاوني فيها."},{"s":"أسئلة المعيار الثالث","n":36,"q":"هل من مسؤوليات المعلم المهنية مناقشة القضايا الاجتماعية والأحداث التي تحدث خارج المدرسة مع الطلاب؟","o":["لا؛ لأنه قد يعرض المعلم للمساءلة القانونية","لا؛ لأن المعلم مسؤول أساساً عن المنهج الذي يدرسه","نعم؛ يمكن للمعلم مناقشة تلك القضايا إذا كانت في المنهج","نعم؛ يمكن استثمار الفعاليات الاجتماعية في تنمية خبراتهم"],"a":2,"f":"يناقش المعلم القضايا الاجتماعية والأحداث الخارجية مع طلابه ما دامت ضمن المنهج، فمسؤوليته المهنية مرتبطة بالمنهج المقرر وأهدافه."},{"s":"أسئلة المعيار الثالث","n":37,"q":"تنظم المدارس اجتماعات ولقاءات دورية مع أولياء الأمور، واحدة مما يأتي لا تعد من أهداف هذه الاجتماعات:","o":["إشراك أولياء أمور الطلاب في تقويم المعلمين وتوضيح أوجه القصور في أدائهم","المشاركة بين المعلم وولي الأمر في وضع خطة لتحسين تعلم الطالب ومتابعة نموه","إتاحة فرصة لأولياء الأمور بتعريف المعلمين بالأنشطة التي يقوم بها أبناؤهم خارج المدرسة","التغلب على أي سوء فهم لدى أولياء الأمور عن التقدم الدراسي لأبنائهم وتوقعاتهم المستقبلية"],"a":0,"f":"اجتماعات أولياء الأمور تهدف للشراكة في تحسين تعلم الطالب وتصحيح المفاهيم، وليس منها إشراكهم في تقويم المعلمين وبيان قصورهم، فهذا له جهات تقويم مختصة."},{"s":"أسئلة المعيار الثالث","n":38,"q":"تلقى أحد معلمي الصف الأول الثانوي مكالمة هاتفية من والد أحد طلابه، وقد كان منزعجاً من حادثة حدثت لابنه في فصل هذا المعلم، ويرى أن ابنه عوقب بشكل غير عادل، فاستجاب المعلم وطلب موعداً لمقابلة الأب لمناقشة المشكلة، وهو يرغب في اتخاذ خطوات تضمن التواصل الفعال مع الأب والوصول إلى مقابلة مجدية. يستطيع المعلم أن يحقق هدفه من المقابلة إذا بدأها بما يلي:","o":["يطلب من الأب اقتراح العقوبة التي يرى أنها الأنسب للتعامل مع الموقف","يتيح الفرصة للأب للتعبير عن رأيه ومشاعره ووصف فهمه لما حصل","يراجع مع الأب قوانين المدرسة التي قام ابنه بمخالفتها في ذلك الموقف","يصف المعلم وجهة نظره فيما يتعلق بالحادثة وأسباب ردة الفعل للأب بالتفصيل"],"a":1,"f":"لتحقيق تواصل فعال يبدأ المعلم بالاستماع للأب وإتاحة الفرصة له للتعبير عن مشاعره وفهمه للحدث، فيهدأ الانفعال ويتهيأ الحوار البنّاء."},{"s":"أسئلة المعيار الثالث","n":39,"q":"قام معلم بعمل ندوة لأولياء الأمور لمناقشة كيفية الوقاية من الإصابة بمرض منتشر؛ فهو بذلك يؤدي خدمة:","o":["أخلاقية","تربوية","صحية","مجتمعية"],"a":3,"f":"ندوة الوقاية من مرض منتشر موجهة لأولياء الأمور خارج الصف، فهي خدمة مجتمعية يقدمها المعلم للمجتمع المحيط بالمدرسة."},{"s":"أسئلة المعيار الثالث","n":40,"q":"أي مما يلي من الواجبات اللازمة للمعلم تجاه المدرسة:","o":["تعديل المنهج الدراسي","توفير خدمة صحية للطلاب","توجيه الطلاب وإرشادهم","توفير بدائل تمويلية للمدرسة"],"a":2,"f":"توجيه الطلاب وإرشادهم من صميم واجبات المعلم تجاه المدرسة، أما تعديل المنهج والخدمة الصحية والتمويل فمسؤوليات جهات أخرى."},{"s":"أسئلة المعيار الثالث","n":41,"q":"المفهوم الخاطئ حول مجتمعات التعلم المهنية الحديثة هو أنها:","o":["تؤدي إلى تقدم في مستوى تحصيل الطلاب","توفر فرص التنمية المهنية داخل المدرسة","تشجع الإبداع والمشاركة في المعرفة","تعنى بالجوانب النظرية للتعلم"],"a":3,"f":"مجتمعات التعلم المهنية عملية وتطبيقية ترتبط بالممارسة الصفية وتحسين التحصيل، فاعتبارها تعنى بالجوانب النظرية فقط مفهوم خاطئ."},{"s":"أسئلة المعيار الثالث","n":42,"q":"يسعى البحث الإجرائي إلى تحسين الممارسات التربوية وحل المشكلات التعليمية، ومن أهم خصائصه أنه:","o":["أساسي","وصفي","محدد","كمي"],"a":2,"f":"من خصائص البحث الإجرائي أنه محدد، أي يعالج مشكلة معينة في سياق صفي أو مدرسي معين، وليس بحثاً أساسياً يعمم نتائجه."},{"s":"أسئلة المعيار الثالث","n":43,"q":"أساس العلاقة بين المعلم وزملائه ومجتمع المدرسة تقوم على:","o":["اعتزازه بمهنة التعليم","إكسابه المهارات العلمية لطلابه","احترامه لقواعد السلوك الوظيفي","تشاوره المستمر مع إدارة المدرسة"],"a":2,"f":"تقوم علاقة المعلم بزملائه ومجتمع المدرسة على احترام قواعد السلوك الوظيفي وأخلاقيات المهنة التي تنظم التعامل وتحدد الحقوق والواجبات."},{"s":"أسئلة المعيار الثالث","n":44,"q":"أراد المعلم (عبد الرحمن) عمل استبيان للأهالي لكي يعرف ميول كل طالب. ما هي أسرع وأنسب طريقة لوصول الاستبيان للأهالي؟","o":["إرساله عن طريق البريد الإلكتروني","عمل لقاء مع الأهالي","يستغل مجلس أولياء الأمور","يعطيه الطالب ليوصله لأهله"],"a":0,"f":"البريد الإلكتروني أسرع وأنسب وسيلة لإيصال استبيان إلى جميع الأهالي دفعة واحدة وجمع الردود بسهولة، بخلاف اللقاءات أو إرساله مع الطالب."},{"s":"أسئلة المعيار الثالث","n":45,"q":"يسعى المعلم (يحيى) دائماً إلى إطلاع زملائه المعلمين على نتائج تقويم طلابه للبرنامج التعليمي المقدم لهم ومناقشتهم، ومقارنتها بنتائج تقويم طلابهم في الفصول المشتركة التي يدرسونها. أي الأهداف التالية يرغب المعلم يحيى تحقيقه من ذلك؟","o":["معرفة مستوى الطلاب في أكثر من مادة","إظهار مدى تميز نتائج طلابه أمام زملائه المعلمين","معرفة أساليب التقويم التي يقوم بها زملاؤه المعلمون","إشراك زملائه والاستفادة من آرائهم في تقويم العملية التعليمية"],"a":3,"f":"مناقشة نتائج التقويم مع الزملاء ومقارنتها تهدف إلى إشراكهم والاستفادة من آرائهم في تقويم العملية التعليمية، وهذا جوهر العمل التعاوني."},{"s":"أسئلة المعيار الثالث","n":46,"q":"إحدى المدارس الثانوية عرضت على منسوبيها من المعلمين تحليلاً لنتائج طلابها في الاختبارات الوطنية للثلاث السنوات الأخيرة؛ للاستفادة منها في العملية التعليمية. ما المقترح الأنسب لتوظيف هذا التحليل في العملية التعليمية؟","o":["إطلاع أولياء الأمور على النتائج","تدريب الطلاب على الأسئلة السابقة","تعديل خطط التدريس والأنشطة في ضوء النتائج","عرض نتائج الاختبارات في رسوم بيانية للطلاب"],"a":2,"f":"الاستفادة الحقيقية من تحليل نتائج الاختبارات الوطنية تكون بتعديل خطط التدريس والأنشطة لمعالجة جوانب الضعف، لا بعرض النتائج أو التدريب على الأسئلة."},{"s":"أسئلة المعيار الثالث","n":47,"q":"المجتمع التعليمي القادر على التنبؤ بالمشكلات التي ستواجهه ويستطيع استثمار الإمكانيات المتوفرة خارجه هو المجتمع:","o":["الاجتماعي","الاقتصادي","التعليمي","المهني"],"a":3,"f":"المجتمع المهني هو القادر على استشراف المشكلات واستثمار الإمكانات المتاحة خارجه، فيطور نفسه ذاتياً ويتعاون مع محيطه."},{"s":"أسئلة المعيار الثالث","n":48,"q":"هل من الممكن أن يساعد أولياء الأمور في مساعدة عملية التعلم؟","o":["نعم؛ لأن هنالك بعض أولياء الأمور خبرتهم أكثر من المعلمين","لا؛ لأن العملية التعليمية تحتاج معلمين تربويين مؤهلين","لا؛ لأن البيئة التعليمية تنحصر على منسوبي التعليم","نعم؛ عن طريق الدعم المادي"],"a":0,"f":"يمكن لأولياء الأمور دعم التعلم بخبراتهم ومهاراتهم، فبعضهم يملك تخصصات تفيد الطلاب، وليس الدعم مقصوراً على المادي أو على المعلمين."},{"s":"أسئلة المعيار الثالث","n":49,"q":"مفهوم المدرسة الفعّالة يزيد ويفعل من دور:","o":["المشاركة المجتمعية","الأنشطة المدرسية","المناهج الدراسية","البرامج النوعية"],"a":0,"f":"المدرسة الفعالة تعزز دور المشاركة المجتمعية، فتفتح أبوابها للأسر والمجتمع شركاء في العملية التعليمية وتحسين مخرجاتها."},{"s":"أسئلة المعيار الثالث","n":50,"q":"إذا استعنت بأولياء أمور يُفعلون العملية التعليمية، فإنك تمنحهم عضوية:","o":["توجيه وإرشاد","تميز وجودة","مجلس المدرسة","مشاركة مجتمعية"],"a":2,"f":"الاستعانة بأولياء الأمور لتفعيل العملية التعليمية تكون من خلال عضويتهم في مجلس المدرسة الذي يتيح لهم المشاركة الرسمية في القرارات والخطط."},{"s":"أسئلة المعيار الثالث","n":51,"q":"ما تضعه بوصفك معلماً في حسبانك حينما تكتب تقريراً لولي الأمر هو:","o":["كيف يمكن توصيل المعلومات الجديدة لولي الأمر؟","ماذا يعرف ولي الأمر سابقاً عن موضوع التقرير؟","كيف يمكن لولي الأمر استخدام التقرير؟","ماذا تريد من ولي الأمر أن يعرف؟"],"a":3,"f":"عند كتابة التقرير يبدأ المعلم بتحديد الرسالة، أي ماذا يريد أن يعرفه ولي الأمر، ثم يبني عليها طريقة العرض والصياغة."},{"s":"أسئلة المعيار الثالث","n":52,"q":"يهدف تحسين تعلم الطلاب إلى تبني أحد مجتمعات التعلم المهنية في إحدى المدارس طريقة تعتمد على تحليل نتائج اختبار إحدى المواد. جميع الأسئلة الآتية تساعد في تحقيق هذا الهدف؛ ما عدا:","o":["كيف اختلفت إجابات الطلاب بين الفصول المتعددة؟","من هم الطلاب الذين حصلوا على أعلى الدرجات؟","ما أكثر الأسئلة التي أجاب عنها الطلاب جيداً؟","ما أكثر الأسئلة التي أجاب عنها الطلاب خطأ؟"],"a":1,"f":"تحليل النتائج لتحسين التعلم يركز على الأسئلة وأنماط الإجابة ومواطن القوة والضعف، لا على تحديد أعلى الطلاب درجات، فهذا لا يخدم التحسين."},{"s":"أسئلة المعيار الثالث","n":53,"q":"إذا استشارك مدير المدرسة في كيفية تشكيل مجتمعات التعلم في المدرسة، فإنك تنصحه بتنظيمهم حسب:","o":["سنوات خبرتهم في التعليم","الصفوف التي يدرسونها","فئات أعمارهم الحقيقية","متوسط أعداد الطلاب"],"a":1,"f":"الأفضل تنظيم مجتمعات التعلم حسب الصفوف التي يدرسها المعلمون، لتشابه المحتوى والطلاب وتحدياتهم فيسهل تبادل الخبرات والتخطيط المشترك."},{"s":"أسئلة المعيار الثالث","n":54,"q":"في مساء أحد الأيام صادفك أحد أولياء الأمور، وعبر عن استيائه من تعرض ابنه للتنمر المتكرر من قبل بعض زملائه بالفصل. كيف يمكنك الاستجابة بأفضل أسلوب لهذا الموقف؟","o":["أوضح له أن المدرسة لا تمتلك الصلاحيات، وأنصحه بالاتصال بمركز العنف","أستمع له جيداً، ثم أخبره بمتابعة ذلك مع الموجه الطلابي في المدرسة","أهون الأمر ببساطة، وأخبره بأن هذه هي سلوكيات الطلاب في المدرسة","أخبره بضرورة مراجعة الإدارة؛ لأن هذا الأمر ليس من طبيعة عملي"],"a":1,"f":"الاستجابة المهنية تبدأ بالإصغاء لولي الأمر ثم توجيهه إلى الموجه الطلابي المختص بمعالجة التنمر؛ أما التهوين أو التنصل فيخالف المسؤولية."},{"s":"أسئلة المعيار الثالث","n":55,"q":"(راكان) طالب في الصف الخامس الابتدائي؛ حصل في اختبار مادة الرياضيات على الدرجة التالية 40، انزعج والد راكان من الدرجة فحضر لمقابلة معلم المادة ومناقشته في ذلك. أي من الإجراءات التالية ينبغي على المعلم الابتعاد عنها عند مقابلة والد راكان؟","o":["يستمع أولاً لولي الأمر ثم يناقشه","الحرص على توفر وثائق توضح أداء راكان في الاختبار","التحدث أمام راكان ووالده بنقاط ضعفه لمعرفتها والعمل على علاجها","الإكثار من عبارات التحفيز لوالد راكان فيما يتعلق بضعف ابنه، وأنه مستعد لمساعدتهم"],"a":2,"f":"ينبغي تجنب مناقشة ضعف الطالب أمامه مع والده لما فيه من إحراج وأثر نفسي سلبي؛ تُناقش نقاط الضعف مع ولي الأمر على انفراد."},{"s":"أسئلة المعيار الرابع","n":1,"q":"العدد الذي يقبل القسمة على 5 من الأعداد التالية هو:","o":["4372","5463","5725","8001"],"a":2,"f":"العدد يقبل القسمة على 5 إذا انتهى برقم 0 أو 5، و5725 ينتهي بـ5."},{"s":"أسئلة المعيار الرابع","n":2,"q":"العدد الذي يقبل القسمة على 6 من الأعداد التالية هو:","o":["3042","7658","8734","9201"],"a":0,"f":"يقبل العدد القسمة على 6 إذا كان زوجياً ومجموع أرقامه يقبل القسمة على 3؛ 3042 زوجي ومجموع أرقامه ٩."},{"s":"أسئلة المعيار الرابع","n":3,"q":"القاسم المشترك الأكبر للعددين 56، 21 هو:","o":["56","21","14","7"],"a":3,"f":"٥٦ = ٧ × ٨ و٢١ = ٧ × ٣، فالعامل المشترك الأكبر هو ٧."},{"s":"أسئلة المعيار الرابع","n":4,"q":"العوامل الأولية للعدد 48 هي:","o":["2 × 2 × 2 × 2 × 3","6 × 8","3 × 16","4 × 12"],"a":0,"f":"العوامل الأولية يجب أن تكون كلها أعداداً أولية، و٤٨ = ٢ × ٢ × ٢ × ٢ × ٣؛ أما ٦ × ٨ وغيرها فتحوي أعداداً غير أولية."},{"s":"أسئلة المعيار الرابع","n":5,"q":"مجموع الكسرين (2/3) + (4/5) =","o":["9/5","22/15","6/8","2/3"],"a":1,"f":"نوحّد المقامات: ٢/٣ = ١٠/١٥ و٤/٥ = ١٢/١٥، والمجموع ٢٢/١٥."},{"s":"أسئلة المعيار الرابع","n":6,"q":"العدد 27.531 مقرباً لأقرب عشرة هو:","o":["27.5","28","27.6","30"],"a":1,"f":"⚠ التقريب لأقرب عشرة يعطي ٣٠ لأن رقم الآحاد ٧ (أكبر من ٥) فيُرفع رقم العشرات؛ و٢٨ تقريب لأقرب وحدة، فالخيار الأدق هو ٣٠."},{"s":"أسئلة المعيار الرابع","n":7,"q":"العدد 27.531 مقرباً لأقرب وحدة هو:","o":["30","27","28","20"],"a":2,"f":"رقم الجزء من عشرة ٥ فيُرفع رقم الآحاد، فيصبح ٢٧٫٥٣١ ≈ ٢٨ لأقرب وحدة."},{"s":"أسئلة المعيار الرابع","n":8,"q":"العدد 27.531 مقرباً لأقرب جزء من عشرة هو:","o":["27.5","28","27.3","27"],"a":0,"f":"الرقم بعد خانة الأعشار هو ٣ (أقل من ٥) فيبقى ٥ كما هو، فيصبح ٢٧٫٥٣١ ≈ ٢٧٫٥."},{"s":"أسئلة المعيار الرابع","n":9,"q":"العدد 155.40319 مقرباً لأقرب جزء من ألف هو:","o":["155.40","155.41","155.403","155.404"],"a":2,"f":"لأقرب جزء من ألف نبقي ثلاث خانات عشرية، والرقم التالي ١ (أقل من ٥) فلا نرفع، فيصبح ١٥٥٫٤٠٣."},{"s":"أسئلة المعيار الرابع","n":10,"q":"ناتج ضرب العددين العشريين 7.5 × 1.25 هو:","o":["93.75","9.375","937.5","0.9375"],"a":1,"f":"٧٫٥ × ١٫٢٥ = ٩٫٣٧٥ (٧٥ × ١٢٥ = ٩٣٧٥ ثم نضع الفاصلة بثلاث خانات عشرية)."},{"s":"أسئلة المعيار الرابع","n":11,"q":"مجموع العددين العشريين 13.453 + 5.25 هو:","o":["18.478","63.703","18.703","63.478"],"a":2,"f":"نرتب الفواصل العشرية ونجمع: ١٣٫٤٥٣ + ٥٫٢٥٠ = ١٨٫٧٠٣."},{"s":"أسئلة المعيار احتمال أن تكون صفراء اللون؟","o":["30%","25%","20%","50%"],"a":1,"f":"عدد الكرات الصفراء = ٢٠ − (٨ + ٧) = ٥، والاحتمال = ٥ ÷ ٢٠ = ٠٫٢٥ أي ٢٥٪."},{"s":"أسئلة المعيار الرابع","n":60,"q":"صندوق يحتوي على 15 مصباحاً منها 8 مصابيح سليمة. إذا تم سحب أحد المصابيح من الصندوق عشوائياً، ما احتمال أن يكون تالفاً؟","o":["7/8","7/8","7/15","8/15"],"a":2,"f":"عدد المصابيح التالفة = ١٥ − ٨ = ٧، فالاحتمال = عدد التالف ÷ الكل = ٧/١٥. أما ٨/١٥ فهو احتمال السليم."},{"s":"أسئلة المعيار الرابع","n":61,"q":"الشكل المقابل يمثل نتائج أحد الطلبة خلال 5 سنوات متتالية. أقل نتيجة حصل عليها كانت بالعام:","o":["الأول","الثاني","الثالث","الرابع"],"a":3,"f":"في التمثيل البياني تُقرأ أقل نتيجة من أدنى عمود أو نقطة، وهي هنا في العام الرابع، فهو الأقصر ارتفاعاً بين الأعوام الخمسة."},{"s":"أسئلة المعيار الرابع","n":62,"q":"الشكل المقابل يمثل المواد الدراسية المفضلة لدى مجموعة من الطلبة. المادة الدراسية التي كانت أكثر تفضيلاً هي:","o":["اللغة الإنجليزية","الرياضيات","العلوم","التاريخ"],"a":1,"f":"المادة الأكثر تفضيلاً هي التي يقابلها أعلى عمود أو أكبر قطاع في الشكل، وهي هنا الرياضيات."},{"s":"أسئلة المعيار الرابع","n":63,"q":"الشكل المقابل يمثل النسب المئوية لتقديرات طلاب في اختبار إحدى المواد الدراسية. التقدير الأكثر شيوعاً لدى الطلبة هو:","o":["ضعيف","جيد","جيد جداً","ممتاز"],"a":1,"f":"التقدير الأكثر شيوعاً (المنوال) هو صاحب أكبر نسبة مئوية في الشكل، وهو هنا «جيد»."},{"s":"أسئلة المعيار الرابع","n":64,"q":"الشكل المقابل يمثل درجات عدد من الطلبة بامتحان اللغة العربية. المركز الثاني بهذا الامتحان من نصيب:","o":["يارا","فادي","سارة","سيف"],"a":1,"f":"عند ترتيب الدرجات تنازلياً يأتي صاحب ثاني أعلى درجة في المركز الثاني، وهو هنا فادي."},{"s":"أسئلة المعيار الرابع","n":65,"q":"الشكل المقابل يمثل كمية الزيت التي يستهلكها أحد المطاعم خلال أيام أحد الأسابيع. مجموع الاستهلاك ليومي الأحد، والأربعاء هو:","o":["1200","1500","1600","1900"],"a":2,"f":"يُقرأ استهلاك يومي الأحد والأربعاء من الشكل ثم يُجمعان، فيكون الناتج ١٦٠٠."},{"s":"أسئلة المعيار الرابع","n":1,"q":"إن الحياة عندما تكون عملية يكون الحاضر فيها يخدم عة تُكتب مع الفعل الذي بعدها ألف فارقة، أما «نرجو» فواو أصلية في آخر الفعل المضارع للمتكلمين فلا تُزاد ألف."},{"s":"أسئلة المعيار الرابع","n":9,"q":"منذ أن خلق الله الإنسان، وفرض عليه أن يأكل خبزه بعرق جبينه غرس في فؤاده حب الأمل، ليتروح نسيمه ويستهدي بضيائه ويكون له نعم العزاء في ليالي الخيبة والإخفاق. العنوان المناسب للنص السابق:","o":["الرزق","الأمل","العزاء","خلق الإنسان"],"a":1,"f":"النص كله يدور حول الأمل: غرسه في الفؤاد، وتروّح نسيمه، والاستهداء بضيائه، فهو الفكرة المحورية."},{"s":"أسئلة المعيار الرابع","n":10,"q":"أخفق سعيد في الاختبار ......... لأنه مهمل، علامة الترقيم المناسبة هي:","o":["؛",":"],"a":1,"f":"⚠ الجملة الثانية تبيّن سبب الأولى، وهذا موضع الفاصلة المنقوطة (؛) في الغالب. الخيار المعلَّم (:) أقل دقة."},{"s":"أسئلة المعيار الرابع","n":11,"q":"جميع الكلمات التالية همزتها همزة وصل ما عدا:","o":["أستاذ","استفاد","استعلام","استبانة"],"a":0,"f":"همزة «أستاذ» همزة قطع لأنها أصلية في الكلمة، أما استفاد واستعلام واستبانة فهمزاتها همزة وصل لأنها من المصادر الخماسية والسداسية."},{"s":"أسئلة المعيار الرابع","n":12,"q":"عند كتابة تقارير الطلاب الخاصة بأولياء الأمور، ينبغي مراعاة أن:","o":["تستخدم المصطلحات العلمية","تكتب بلغة بسيطة وموجزة","تتضمن عبارات ثناء عامة","تكتب بلغة سطحية عامة"],"a":1,"f":"تقارير أولياء الأمور تُكتب بلغة بسيطة وموجزة تناسب مستواهم، فلا تُستعمل مصطلحات يصعب فهمها ولا عبارات عامة."},{"s":"أسئلة المعيار الرابع","n":13,"q":"(الرياضة مهمة جداً، فهل يفطن الناس لذلك؛ لكيلا تتزايد الأمراض)، ما نوع نبرة القائل في العبارة السابقة؟","o":["التمني","التحسر","التعجب","الاستهزاء"],"a":0,"f":"العبارة تحمل رغبة في أن يدرك الناس أهمية الرياضة، فنبرة القائل هي التمني، وليست تحسراً ولا تعجباً."},{"s":"أسئلة المعيار الرابع","n":14,"q":"أكتب رواياتي من الساعة 11 مساءً، حتى 4 فجراً، وأستيقظ الساعة 2 ظهراً ووقت إلهام الكتابة من الساعة 9 حتى 12، لكنني أقضي وقتي مع العائلة؛ فلكل شيء ثمن. نوع القصة:","o":["سردي","تاريخي","قصصي","تأملي"],"a":0,"f":"النص يحكي تجربة الكاتب وترتيب يومه بأسلوب القص والحكاية، فنوعه سردي."},{"s":"أسئلة المعيار الرابع","n":15,"q":"الهمزة في كلمتي (انسحاب - أفضل):","o":["قطع - وصل","قطع - قطع","وصل - قطع","وصل - وصل"],"a":2,"f":"«انسحاب» مصدر الفعل الخماسي انسحب فهمزته همزة وصل، و«أفضل» اسم تفضيل على وزن أفعل فهمزته همزة قطع."},{"s":"أسئلة المعيار الرابع","n":16,"q":"أي من الكلمات التالية لا تُعد اسماً:","o":["سباق","انفرج","منارة","يحكمان"],"a":3,"f":"«يحكمان» فعل مضارع (تدل عليه ياء المضارعة) فليس اسماً، أما سباق ومنارة فاسمان. وكذلك «انفرج» فعل ماضٍ فالسؤال فيه لبس."},{"s":"أسئلة المعيار الرابع","n":17,"q":"أحمد وبدر سُئلا عن اللغة العربية، فأجاب أحمد: هي أكثر اللغات من حيث عدد المفردات، وأجاب بدر: هي أكثر اللغات انتشاراً في العالم:","o":["كلاهما محايد","كلاهما متحيز","أحمد محايد، وبدر متحيز","أحمد متحيز وبدر محايد"],"a":2,"f":"قول أحمد وصف لغوي يمكن قياسه، أما قول بدر فيه تفضيل وانحياز ولا يُثبته دليل، فأحمد محايد وبدر متحيز."},{"s":"أسئلة المعيار الرابع","n":18,"q":"الكتابة الإبداعية تتميز عن الكتابة الوظيفية في:","o":["الاعتماد على الحقائق والبراهين","استعمال المجاز والاستعارة","الدقة في التعبير","تحديد نوع النص"],"a":1,"f":"تتميز الكتابة الإبداعية بالخيال والصور البيانية كالمجاز والاستعارة، بخلاف الوظيفية التي تعتمد الدقة والحقائق."},{"s":"أسئلة المعيار الرابع","n":19,"q":"من أنواع الكتابة الفنية:","o":["الخاطرة","التقرير","المحضر","الرسالة الإدارية"],"a":0,"f":"الخاطرة من الكتابة الفنية (الأدبية) لأنها تعبر عن الشعور والتأمل، أما التقرير والمحضر والرسالة الإدارية فكتابة وظيفية."},{"s":"أسئلة المعيار الرابع","n":20,"q":"عند كتابة التقارير يجب التركيز على:","o":["النتائج","الملخص","القرارات","التوصيات"],"a":2,"f":"يُركَّز في التقارير على القرارات والمخرجات التي تبنى عليها الإجراءات، وهذا ما يُعدّ مقصود الخيار المعلَّم."},{"s":"أسئلة المعيار الرابع","n":21,"q":"يُنصب المثنى بـ:","o":["الألف","الياء","الفتحة","الكسرة"],"a":1,"f":"المثنى يُرفع بالألف، ويُنصب ويُجر بالياء المفتوح ما قبلها، فعلامة نصبه الياء."},{"s":"أسئلة المعيار الرابع","n":22,"q":"عندما يزيد ......... عن الطلب يقل ......... :","o":["الموجود - الإنتاج","السعر - التوزيع","العرض - السعر","الإنتاج - السعر"],"a":2,"f":"وفق قانون العرض والطلب إذا زاد العرض عن الطلب قلّ السعر، والعلاقة بينهما عكسية."},{"s":"أسئلة المعيار الرابع","n":23,"q":"الضاد كتبت خطأ في كلمة:","o":["الظلم","الانظباط","النظارة","الظاهرة"],"a":1,"f":"الصواب «الانضباط» بالضاد من ضبط الأمر، أما «الانظباط» فخطأ إملائي بالظاء."},{"s":"أسئلة المعيار الرابع","n":24,"q":"الجملة التي فيها خطأ في كتابة الهمزة هي:","o":["اسمي محمد","التفاؤل محمود","هذا شيء جميل","مكتب الإستقبال مميز"],"a":3,"f":"«الاستقبال» مصدر الفعل الخماسي استقبل وهمزته همزة وصل، فتُكتب بلا همزة قطع: الاستقبال لا الإستقبال."},{"s":"أسئلة المعيار الرابع","n":25,"q":"الكتابة الصحيحة للفعل الماضي من (يدعو - يهدي) هي:","o":["دعا - هدا","دعا - هدى","دعى - هدى","دعى - هدا"],"a":1,"f":"«دعا» أصلها واو (يدعو) فتُكتب ألفاً قائمة، و«هدى» أصلها ياء (يهدي) فتُكتب مقصورة."},{"s":"أسئلة المعيار الرابع","n":26,"q":"الصراخ يكون عالياً على حسب نوعه، صراخ الطفل عند الحاجة للطعام مرتفعاً. أي من العبارات التالية مكملة لما سبق:","o":["على سبيل المثال","غير أن","على ذلك","إلا أنه"],"a":0,"f":"الجملة الثانية تقدم مثالاً على الأولى، فالرابط المناسب هو «على سبيل المثال»، أما غير أن وإلا أنه فللاستدراك."},{"s":"أسئلة المعيار الرابع","n":27,"q":"كل مما يأتي بمعنى (الجاه) ما عدا:","o":["المسؤولية","المنزلة","المكانة","القدر"],"a":0,"f":"الجاه هو المنزلة والمكانة والقدر، أما المسؤولية فتعني التبعة والتكليف."},{"s":"أسئلة المعيار الرابع","n":28,"q":"الكلمة الصحيحة إملائياً هي:","o":["أوؤلئك","أولائك","أولئك","أولائك"],"a":2,"f":"الكتابة الصحيحة هي «أولئك» بهمزة على السطر بعد اللام، أما الألف بعد الهمزة في «أولائك» فخطأ شائع."},{"s":"أسئلة المعيار الرابع","n":29,"q":"اختر الجملة الصحيحة مما يلي:","o":["استلم احمد أوراق اعتماده","استلم أحمد أوراق اعتماده","استلم أحمد أوراق إعتماده","استلم أحمد اوراق اعتماده"],"a":1,"f":"كلمة «أحمد» همزتها همزة قطع وتُكتب بالألف مع الهمزة، و«اعتماد» مصدر وصل لا تُكتب بهمزة قطع: استلم أحمد أوراق اعتماده."},{"s":"أسئلة المعيار الرابع","n":30,"q":"(هو - كتب - عن) تصنف الكلمات السابقة بالترتيب:","o":["اسم - فعل - اسم","اسم - فعل - ضمير","حرف - فعل - اسم","اسم - فعل -
