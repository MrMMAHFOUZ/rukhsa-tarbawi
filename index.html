<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#102F5D"><meta name="description" content="بنك أسئلة تفاعلي لاختبار الرخصة المهنية – القسم العام التربوي"></head><body><title>الرخصة المهنية تربوي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: study desk — top bar, question column beside a navy question-map panel (drawer on phones) */
:root{
  --navy:#102F5D; --blue:#2463EB; --bg:#F4F7FC; --ok:#16A36A; --no:#E5484D; --warn:#F59E0B;
  --card:#ffffff; --soft:#eef3fb; --ink:#14233f; --mut:#5b6b88; --bd:#d9e2f0;
  --blue-soft:#e6eefe; --blue-ink:#1d4fc4; --ok-soft:#e7f7ef; --ok-ink:#0f6b46; --no-soft:#fdeced; --no-ink:#9b2226; --warn-soft:#fff4dc; --warn-ink:#8a5300;
  --pn:#102F5D; --pn2:#163a70; --pn3:#1d4684; --pn-bd:#2c5598; --pn-ink:#ffffff; --pn-mut:#b8c8e6; --cell:#5f7193;
  --on-accent:#ffffff; --shadow:0 4px 18px rgba(16,47,93,.08); --scrim:rgba(10,22,45,.45);
  --q-bg:#e9f0ff; --q-bd:#c7d7fb; --q-ink:#0f2a55;
  --f-display:"Tajawal","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#cfe0ff; --blue:#5b8cff; --bg:#0f1727; --ok:#2fbf80; --no:#f06a6e; --warn:#f7b23b;
  --card:#162136; --soft:#1b2840; --ink:#e7edf9; --mut:#9cadc9; --bd:#2a3a58;
  --blue-soft:#1d2d52; --blue-ink:#a9c3ff; --ok-soft:#123326; --ok-ink:#9ce6c3; --no-soft:#3a1b1e; --no-ink:#ffbcbe; --warn-soft:#3a2c10; --warn-ink:#ffd58a;
  --pn:#0d1f3d; --pn2:#132a52; --pn3:#1a3566; --pn-bd:#284479; --pn-ink:#f2f6ff; --pn-mut:#9fb3d6; --cell:#43536f;
  --shadow:0 4px 18px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.55); --q-bg:#1a2b4f; --q-bd:#2c4478; --q-ink:#eef3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#cfe0ff; --blue:#5b8cff; --bg:#0f1727; --ok:#2fbf80; --no:#f06a6e; --warn:#f7b23b;
  --card:#162136; --soft:#1b2840; --ink:#e7edf9; --mut:#9cadc9; --bd:#2a3a58;
  --blue-soft:#1d2d52; --blue-ink:#a9c3ff; --ok-soft:#123326; --ok-ink:#9ce6c3; --no-soft:#3a1b1e; --no-ink:#ffbcbe; --warn-soft:#3a2c10; --warn-ink:#ffd58a;
  --pn:#0d1f3d; --pn2:#132a52; --pn3:#1a3566; --pn-bd:#284479; --pn-ink:#f2f6ff; --pn-mut:#9fb3d6; --cell:#43536f;
  --shadow:0 4px 18px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.55); --q-bg:#1a2b4f; --q-bd:#2c4478; --q-ink:#eef3ff; color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.7;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1220px;margin:0 auto;padding-block:10px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-inline-end:auto}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.2;color:var(--navy)}
.brand p{margin:0;font-size:.78rem;color:var(--mut)}
.modes{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.modes button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem;color:var(--mut)}
.modes button.on{background:var(--card);color:var(--blue-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;background:var(--blue-soft);color:var(--blue-ink);border-radius:10px;padding:6px 12px;font-size:.92rem}
.timer.low{background:var(--no-soft);color:var(--no-ink)}
.ib{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 10px;font-size:.84rem;white-space:nowrap}
.ib:hover{border-color:var(--blue)}
.ib svg{width:18px;height:18px}
.user{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:600}
.user img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.saved{font-size:.74rem;color:var(--mut)}
@media (max-width:720px){.tb .lbl{display:none}.brand p{display:none}.user span{display:none}}

/* ---------- columns ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
body.side-off .cols{grid-template-columns:minmax(0,1fr)}
body.side-off .pn{display:none}
@media (max-width:900px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .pn{position:fixed;inset-block:0;right:0;width:min(360px,92vw);z-index:40;border-radius:0;overflow-y:auto;
      padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-right:calc(14px + env(safe-area-inset-right,0px));
      transform:translateX(105%);transition:transform .2s}
  body.side-on .pn{transform:none;display:block}
  body.side-off .pn{display:block}
  body.side-on .scrim{display:block}
  .grid{max-height:none!important}
}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:39}
body.focus .pn,body.focus .stats,body.focus .hide-focus{display:none!important}
body.focus .cols{grid-template-columns:minmax(0,1fr)}
body.focus .main{max-width:820px;margin-inline:auto;width:100%}

/* ---------- main card ---------- */
.main{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--navy);font-variant-numeric:tabular-nums}
.qno small{font-family:var(--f-body);font-weight:500;color:var(--mut);font-size:.85rem}
.prog{flex:1;min-width:140px}
.prog .pg{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;border:1px solid var(--bd)}
.prog .pg i{display:block;height:100%;background:var(--blue);border-radius:8px;transition:width .25s}
.prog .pl{display:flex;justify-content:space-between;font-size:.76rem;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums}
.score{background:var(--blue-soft);color:var(--blue-ink);border-radius:999px;padding:2px 12px;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--mut);border:1px solid var(--bd)}
.chip.src{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.chip.flag{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.qbox{margin-top:14px;background:var(--q-bg);border:1px solid var(--q-bd);border-inline-start:6px solid var(--blue);border-radius:14px;padding:14px 18px 16px}
.qbox .chips{margin-top:0}
.qt{font-size:1.2rem;font-weight:700;line-height:2;margin:10px 0 0;color:var(--q-ink)}
.hint{font-size:.84rem;color:var(--mut);margin-top:12px}
.opts{display:grid;gap:10px;margin-top:12px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--bd);border-radius:var(--r);padding:13px 14px;line-height:1.7;transition:border-color .15s,background .15s}
.op:hover:not(:disabled){border-color:var(--blue)}
.op:disabled{opacity:1}
.op .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--mut)}
.op .tx{flex:1;min-width:0}
.op .key{font-size:.7rem;color:var(--mut);border:1px solid var(--bd);border-radius:6px;padding:0 6px;flex:none}
.op.sel{border-color:var(--blue);background:var(--blue-soft)}
.op.sel .ck{border-color:var(--blue);background:var(--blue);color:var(--on-accent)}
.op.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.op.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.op.no{background:var(--no-soft);border-color:var(--no);color:var(--no-ink)}
.op.no .ck{background:var(--no);border-color:var(--no);color:var(--on-accent)}
.op .tag{font-size:.74rem;font-weight:700;flex:none}

.fb{margin-top:14px;border-radius:14px;padding:14px;border:1px solid}
.fb.g{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.fb.r{background:var(--no-soft);border-color:var(--no);color:var(--no-ink)}
.fb.i{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.fb h4{margin:0 0 4px;font-size:1rem;display:flex;gap:8px;align-items:center}
.fb p{margin:0;font-size:.93rem;line-height:1.9}
.fb .more{margin-top:10px;border-top:1px dashed currentColor;padding-top:10px}
.ai{white-space:pre-wrap;font-size:.9rem;line-height:1.9;color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--blue-ink);text-decoration:underline;font-size:.86rem}

.act{display:flex;gap:8px;margin-top:16px;background:var(--soft);border-radius:14px;padding:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 14px;font-size:.88rem;font-weight:600;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink)}
.btn.fav.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.btn.danger{background:var(--no);border-color:var(--no);color:var(--on-accent)}
.act .sp{flex:1}
.sub{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.sub .link{color:var(--mut)}
@media (max-width:560px){.act .btn{flex:1 1 calc(50% - 8px)}.act .sp{display:none}}

/* ---------- side panel ---------- */
.pn{background:var(--pn);color:var(--pn-ink);border-radius:18px;padding:14px;min-width:0}
.pn h3{margin:0;font-family:var(--f-display);font-size:1.08rem}
.pnh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pnh button{background:var(--pn3);border:1px solid var(--pn-bd);color:var(--pn-ink);border-radius:8px;padding:3px 10px;font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{background:var(--pn2);border-radius:10px;padding:6px 8px;text-align:center;font-size:.7rem;color:var(--pn-mut);line-height:1.4}
.st b{display:block;font-size:1.05rem;color:var(--pn-ink);font-variant-numeric:tabular-nums}
.srch{position:relative;margin-top:10px}
.srch input{width:100%;padding:8px 34px 8px 10px;border-radius:9px;border:1px solid var(--pn-bd);background:var(--pn2);color:var(--pn-ink)}
.srch input::placeholder{color:var(--pn-mut)}
.srch svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--pn-mut)}
.row{display:flex;gap:6px;margin-top:8px}
.row select,.row input{flex:1;min-width:0;padding:7px 9px;border-radius:9px;border:1px solid var(--pn-bd);background:var(--pn2);color:var(--pn-ink)}
.row button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:7px 12px;font-weight:700;font-size:.84rem}
.filt{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.filt button{background:var(--pn3);border:1px solid var(--pn-bd);color:var(--pn-mut);border-radius:999px;padding:2px 10px;font-size:.74rem}
.filt button b{color:var(--pn-ink);font-variant-numeric:tabular-nums;margin-inline-start:3px}
.filt button.on{background:var(--blue);border-color:#9db8ff;color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.quick button{background:var(--pn2);border:1px solid var(--pn-bd);color:var(--pn-ink);border-radius:9px;padding:6px 4px;font-size:.76rem}
.quick .imp{grid-column:1/-1;background:var(--pn3);border-style:dashed}
.sets{display:grid;gap:8px;margin-top:10px}
.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:.88rem}
.set b{flex:1;min-width:0}
.tpl{direction:rtl;white-space:pre-wrap;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:.86rem;line-height:1.9;margin:8px 0;max-height:46vh;overflow:auto;font-family:var(--f-body)}
.skip{font-size:.8rem;color:var(--mut);margin:4px 0 0;padding-inline-start:18px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px;max-height:46vh;overflow-y:auto;padding:4px}
.grid button{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:.72rem;font-weight:700;padding:5px 0 4px;border-radius:7px;border:0;color:#fff;background:var(--cell);font-variant-numeric:tabular-nums}
.grid button i{font-style:normal;font-size:.62rem;opacity:.95}
.grid .g{background:var(--ok)}.grid .r{background:var(--no)}.grid .d{background:#3f6fd8}
.grid .cur{box-shadow:0 0 0 2px var(--pn),0 0 0 4px #7fa6ff}
.grid .fl::after{content:"";position:absolute;top:0;left:0;border-top:12px solid var(--warn);border-right:12px solid transparent;border-top-left-radius:7px}
.grid .fv::before{content:"★";position:absolute;top:-4px;right:1px;font-size:.62rem;color:#ffd84d}
.grid .empty{grid-column:1/-1;color:var(--pn-mut);font-size:.84rem;text-align:center;padding:10px 0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:10px;font-size:.72rem;color:var(--pn-mut)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;color:#fff;font-size:.6rem;font-weight:800;flex:none;position:relative}

/* ---------- views ---------- */
.vh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vh h2{margin:0;font-family:var(--f-display);font-size:1.3rem;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--soft);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--mut);font-size:.78rem}
.kpi b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.sec-t{font-family:var(--f-display);font-size:1.05rem;margin:18px 0 8px;color:var(--navy)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.86rem}
.bar .tr{height:10px;background:var(--soft);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px}
.bar .v{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.8rem;text-align:left}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,1fr) 80px}.bar .tr{grid-column:1/-1;grid-row:2}}
.tips{margin:0;padding-inline-start:20px;line-height:2}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th,.tbl td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.tbl th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.big{font-family:var(--f-display);font-size:3rem;font-weight:800;color:var(--blue-ink);font-variant-numeric:tabular-nums;line-height:1.2}
.rw{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--bd);padding:9px 2px;font-size:.88rem}
.rw:hover{color:var(--blue-ink)}
.note{font-size:.8rem;color:var(--mut)}
.rep{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.88rem}
.rep b{color:var(--navy)}

/* ---------- modal & toast ---------- */
.mod{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--scrim);padding:16px}
.mod[hidden]{display:none}
.box{background:var(--card);color:var(--ink);border:1px solid var(--bd);border-radius:16px;width:min(520px,100%);max-height:88vh;overflow-y:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.box h3{margin:0 0 6px;font-family:var(--f-display);font-size:1.2rem;color:var(--navy)}
.box p{margin:6px 0}
.fld{display:grid;gap:4px;margin-top:12px;font-size:.88rem}
.fld label{font-weight:600}
.fld input,.fld select,.fld textarea{padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--card);width:100%}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 6px;font-size:.85rem;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--blue-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;margin-top:12px}
.chk input{margin-top:6px}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:9px;padding:7px 10px;font-weight:500}
.mact{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--navy);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="tb">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#102F5D"/><path d="M24 12 8 19l16 7 16-7z" fill="#fff"/><path d="M15 23v6c0 2.6 4 5 9 5s9-2.4 9-5v-6l-9 4z" fill="#2463EB"/><path d="M37 20v9" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/><circle cx="37" cy="31" r="2.2" fill="#F59E0B"/></svg>
      <div><h1>الرخصة المهنية تربوي</h1><p>مستقبلك المهني يبدأ من هنا</p></div>
    </div>
    <div class="modes hide-focus" role="tablist" aria-label="نوع الاختبار">
      <button id="mPrac" role="tab">وضع التدريب</button>
      <button id="mSim" role="tab">وضع المحاكاة</button>

":"ترى المعلمة أن رسالتها لا تقتصر على نقل المعرفة، بل تمتد إلى بناء شخصية الطالبة دينيًا وخلقيًا ووطنيًا. هذه النظرة تعكس فهمها لمهنة التعليم بوصفها:","o":["وظيفة إدارية محددة المهام","رسالة تربوية شاملة","مهنة تقنية تعتمد على المهارة فقط","عملًا تطوعيًا غير ملزم"],"a":1,"f":"ينظر ميثاق أخلاقيات مهنة التعليم إلى التعليم بوصفه رسالة تستهدف بناء الإنسان في جوانبه كلها، لا مجرد نقل معلومات."},{"s":"أسئلة أصلية – المعيار الأول","n":2,"q":"طلب ولي أمر من المعلم أن يطلعه على درجات زميل لابنه ليقارن بينهما. التصرف المهني الصحيح:","o":["يطلعه عليها ما دام الطلب لغرض تربوي","يحيله إلى زميل الابن ليسأله بنفسه","يعطيه متوسط درجات الفصل مع درجة الزميل","يعتذر لأن معلومات كل طالب سرية ولا تُعطى إلا لولي أمره"],"a":3,"f":"حفظ خصوصية الطلاب وسرية معلوماتهم من أخلاقيات المهنة، فلا تُعطى درجات طالب لغير ولي أمره."},{"s":"أسئلة أصلية – المعيار الأول","n":3,"q":"عرض أحد أولياء الأمور على المعلم هدية ثمينة قبل إعلان النتائج بأيام. الأنسب أن:","o":["يقبلها تقديرًا لمشاعر ولي الأمر","يقبلها ويوزعها على الطلاب","يعتذر عن قبولها بلطف تجنبًا لأي شبهة تمس نزاهته","يقبلها بشرط ألا تؤثر في الدرجات"],"a":2,"f":"قبول هدية ثمينة قبيل التقويم يثير الشبهة ويمس نزاهة المعلم؛ والاعتذار بلطف يحفظ العلاقة والنزاهة معًا."},{"s":"أسئلة أصلية – المعيار الأول","n":4,"q":"معلم يعطي دروسًا خصوصية بمقابل لطلاب فصله نفسه، ويلمّح لهم بأنها تساعدهم في اختباره. هذا السلوك يتعارض أساسًا مع:","o":["مبدأ عدم استغلال المعلم موقعه لتحقيق منفعة شخصية","حرية المعلم في وقته الخاص","مبدأ التنمية المهنية المستمرة","حق الطالب في التعلم الذاتي"],"a":0,"f":"استغلال سلطة التدريس والتقويم لتحقيق منفعة مادية من الطلاب أنفسهم يخالف النزاهة والعدل المطلوبين من المعلم."},{"s":"أسئلة أصلية – المعيار الأول","n":5,"q":"في درس عن التعايش سأل طالب: هل يجوز التعامل بالحسنى مع غير المسلمين؟ أفضل استجابة من المعلم:","o":["يتجنب السؤال لأنه خارج المقرر","يوضح بالأدلة الشرعية أن الإسلام يدعو إلى البر والعدل مع المسالمين","يطلب من الطالب أن يسأل أهله","يقول إن المسألة رأي شخصي لكل فرد"],"a":1,"f":"الوسطية تقتضي بيان منهج الإسلام في العدل والبر مع غير المسلمين المسالمين بالدليل، بعيدًا عن الغلو أو التمييع."},{"s":"أسئلة أصلية – المعيار الأول","n":6,"q":"أي الممارسات الآتية من صور الغلو الذي يتنافى مع الوسطية؟","o":["الحث على أداء الصلاة في وقتها","احترام آراء العلماء المعتبرين","تكفير المخالف في مسائل اجتهادية","الاعتدال في العبادة دون إفراط أو تفريط"],"a":2,"f":"الحكم على المخالف في المسائل الاجتهادية بالكفر من صور الغلو، والوسطية تقوم على الاعتدال وقبول الخلاف المعتبر."},{"s":"أسئلة أصلية – المعيار الأول","n":7,"q":"لاحظت معلمة أن إحدى طالباتها تتداول في مجموعة الفصل مقاطع تحمل أفكارًا متطرفة. الإجراء الأنسب أولًا:","o":["تحذفها من المجموعة دون نقاش","تنبهها أمام زميلاتها لتكون عبرة","تتجاهل الأمر لأنه خارج وقت الدوام","تحاورها بهدوء لفهم مصدر الأفكار، ثم تُشرك الموجهة الطلابية وفق الإجراءات"],"a":3,"f":"المعالجة التربوية تبدأ بالحوار الهادئ لفهم المشكلة، ثم إشراك الجهة المختصة في المدرسة وفق الأنظمة، حماية للطالبة وزميلاتها."},{"s":"أسئلة أصلية – المعيار الأول","n":8,"q":"من أبرز أدوار المعلم في تعزيز الأمن الفكري لدى الطلاب:","o":["تنمية التفكير الناقد ليميزوا المعلومة الموثوقة من المضللة","منعهم من استخدام الإنترنت نهائيًا","الاكتفاء بما ورد في الكتاب المدرسي","تجنب مناقشة القضايا المعاصرة في الفصل"],"a":0,"f":"الأمن الفكري يتحقق ببناء وعي الطالب وقدرته على التمحيص، لا بالمنع أو بتجاهل القضايا."},{"s":"أسئلة أصلية – المعيار الأول","n":9,"q":"أرادت معلمة تعزيز الاعتزاز بالهوية الوطنية لدى طالباتها بنشاط يترك أثرًا عمليًا. أي الأنشطة أنسب؟","o":["توزيع أعلام صغيرة في اليوم الوطني","عرض صور لمعالم المملكة على السبورة","تكليف الطالبات بمشروع بحثي عن منجز وطني في منطقتهن وعرضه في المدرسة","كتابة عبارة وطنية على غلاف الدفتر"],"a":2,"f":"النشاط الذي تشارك فيه الطالبة بالبحث والإنتاج والعرض يرسخ الانتماء أعمق من المظاهر الرمزية وحدها."},{"s":"أسئلة أصلية – المعيار الأول","n":10,"q":"من مظاهر تعزيز الهوية الوطنية في الممارسة الصفية اليومية:","o":["الإكثار من الألفاظ الأجنبية في الشرح لمواكبة العصر","ربط موضوعات الدرس بتاريخ المملكة ومنجزاتها وقيم المجتمع","تخصيص الحديث عن الثقافات الأجنبية فقط","ترك الحديث عن الوطن لمعلم الدراسات الاجتماعية"],"a":1,"f":"ربط المحتوى بتاريخ الوطن ومنجزاته وقيمه في كل المواد يجعل الهوية الوطنية حاضرة في التعلم اليومي، وهي مسؤولية جميع المعلمين."},{"s":"أسئلة أصلية – المعيار الأول","n":11,"q":"يحرص معلم العلوم على استخدام لغة عربية سليمة في شرحه وفي كتابته على السبورة. هذا السلوك يعكس:","o":["الاعتزاز باللغة العربية بوصفها مكونًا أساسيًا للهوية","التزامًا يخص معلم اللغة العربية وحده","اهتمامًا بالشكل على حساب المضمون","تقليلًا من أهمية اللغات الأخرى"],"a":0,"f":"اللغة العربية من أهم مكونات الهوية، والحرص على سلامتها مسؤولية كل معلم في كل مادة."},{"s":"أسئلة أصلية – المعيار الأول","n":12,"q":"معلم يمنح ابن زميله في العمل درجات أعلى من مستواه الحقيقي مجاملةً لزميله. هذا السلوك يخالف بالدرجة الأولى قيمة:","o":["التعاون","الإيثار","الرحمة","العدل"],"a":3,"f":"إعطاء الطالب ما لا يستحق مجاملةً ظلمٌ لزملائه وإخلال بالعدل في التقويم."},{"s":"أسئلة أصلية – المعيار الأول","n":13,"q":"نشر معلم على حسابه في وسائل التواصل صورًا لطلابه داخل الفصل دون إذن أولياء أمورهم. هذا التصرف:","o":["مقبول لأنه يبرز جهده التعليمي","مخالف لأنه يمس خصوصية الطلاب","مقبول إذا كانت الصور جماعية","مخالف فقط إذا ظهرت أسماء الطلاب"],"a":1,"f":"صور الطلاب من خصوصياتهم، ونشرها دون إذن أولياء الأمور يخالف أخلاقيات المهنة وقد يعرّض الطلاب للضرر."},{"s":"أسئلة أصلية – المعيار الأول","n":14,"q":"دخل شخص دون تصريح إلى حساب معلم في منصة تعليمية وعدّل درجات الطلاب. هذا الفعل يُصنّف وفق الأنظمة في المملكة بأنه:","o":["مخالفة إدارية بسيطة","خطأ تقني لا عقوبة عليه","جريمة معلوماتية","سلوك غير لائق فقط"],"a":2,"f":"الدخول غير المشروع إلى الحسابات والأنظمة الإلكترونية وتعديل بياناتها من الجرائم المعلوماتية التي يعاقب عليها النظام."},{"s":"أسئلة أصلية – المعيار الأول","n":15,"q":"يرى معلم أن شهادته الجامعية تكفيه طوال حياته المهنية، ولا حاجة إلى برامج التطوير. هذا الاتجاه يتعارض مع مبدأ:","o":["أن التنمية المهنية المستمرة واجب على المعلم","الولاء للمؤسسة التعليمية","الاعتزاز بالهوية الوطنية","احترام التسلسل الإداري"],"a":0,"f":"تطور المعرفة وطرق التدريس يجعل النمو المهني المستمر واجبًا أ // Answers are stored by question position. Re-map them when the built-in bank or the imported sets changed size.

  const t = {}; Object.keys(T.p.t || {}).forEach(k => { const m = map(+k); if (m !== null && m < newN) t[m] = T.p.t[k] }); T.p.t = t;

/* ---------- context helpers ---------- */
const sim = () => S.mode === "sim" && S.sim ? S.sim : null;
function ctx() {

  const list = []; for (let k = 0; k < N; k++) if (S.p.sect === "all" || Q[k].s === S.p.sect) list.push(k);
  if (!list.includes(S.p.i)) S.p.i = list[0];

}
function stateOf(c, k) {

function setCur(c, k) { sel = null; if (c.sim) S.sim.i = S.sim.qs.indexOf(k); else S.p.i = k; persist(false) }

function matches(k) {

}

        const sect = b.querySelector("#sSect").value;

        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]] }
        const qs = pool.slice(0, n);
        S.sim = { qs, A: new Array(N).fill(null), flag: [], i: 0, dur: mins * 60, el: 0, done: false, sect, at: Date.now() };
        S.mode = "sim"; sel = null; filt = "all"; view = "q"; closeModal(); persist(true); render();

}
function submitSim() {
  const s = S.sim; if (!s || s.done) return;
  s.done = true;
  let c = 0; const dom = {};
  s.qs.forEach(k => { const d = Q[k].d; dom[d] = dom[d] || [0, 0]; dom[d][1]++; if (s.A[k] === Q[k].a) { c++; dom[d][0]++ } });
  S.hist.unshift({ at: Date.now(), n: s.qs.length, c, el: Math.round(s.el), sect: s.sect, dom, ans: s.qs.filter(k => s.A[k] !== null).length });
  S.hist = S.hist.slice(0, 30);
  view = "result"; filt = "all"; persist(true); render();
}
function renderResult() {

  s.qs.forEach(k => { const d = Q[k].d; dom[d] = dom[d] || [0, 0]; dom[d][1]++; if (s.A[k] === null) un.push(k); else if (s.A[k] === Q[k].a) { ok++; dom[d][0]++ } else wr.push(k) });
  const p = pct(ok, s.qs.length);

const kpi = (l, v) => '<div class="kpi"><small>' + l + "</small><b>" + v + "</b></div>";
const lst = (t, arr, ic) => arr.length ? '<div class="sec-t">' + t + " (" + arr.length + ")</div>" + arr.slice(0, 120).map(k => '<button class="rw" data-k="' + k + '">' + ic + " " + (k + 1) + ". " + esc(Q[k].q.slice(0, 90)) + "…</button>").join("") : "";
function bars(dom) {
  const rows = Object.entries(dom).filter(([, v]) => v[1]).sort((a, b) => pct(a[1][0], a[1][1]) - pct(b[1][0], b[1][1]));
  if (!rows.length) return '<p class="note">لا توجد إجابات بعد.</p>';
  return '<div class="bars">' + rows.map(([d, [c, t]]) => { const p = pct(c, t); const col = p >= 80 ? "var(--ok)" : p >= 60 ? "var(--blue)" : p >= 40 ? "var(--warn)" : "var(--no)"; return '<div class="bar"><span>' + esc(d) + '</span><div class="tr"><i style="width:' + p + "%;background:" + col + '"></i></div><span class="v">' + p + "٪ (" + c + "/" + t + ")</span></div>" }).join("") + "</div>";
}

/* ---------- performance analysis ---------- */
$("bStats").onclick = () => { view = view === "stats" ? "q" : "stats"; render() };
function renderStats() {
  const A = S.p.A; let ok = 0, wr = 0, t = 0, tn = 0; const dom = {}, src = {}, wrongDom = {};
  for (let k = 0; k < N; k++) {
    const a = A[k]; if (S.p.t[k]) { t += S.p.t[k]; if (a !== null) tn++ }
    if (a === null) continue;
    const d = Q[k].d, s = Q[k].s; dom[d] = dom[d] || [0, 0]; src[s] = src[s] || [0, 0]; dom[d][1]++; src[s][1]++;
    if (a === Q[k].a) { ok++; dom[d][0]++; src[s][0]++ } else { wr++; wrongDom[d] = (wrongDom[d] || 0) + 1 }
  }
  const ans = ok + wr;
  const weak = Object.entries(dom).filter(([, v]) => v[1] >= 3).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).slice(0, 2);
  const strong = Object.entries(dom).filter(([, v]) => v[1] >= 3).sort((a, b) => b[1][0] / b[1][1] - a[1][0] / a[1][1]).slice(0, 2);
  const topWrong = Object.entries(wrongDom).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const tips = [];
  if (!ans) tips.push("ابدأ بالإجابة عن بعض الأسئلة في وضع التدريب لتظهر لك التوصيات.");
  weak.forEach(([d, [c, n]]) => tips.push("ركّز على «" + d + "»: نسبتك " + pct(c, n) + "٪. راجع أخطاءك فيه أولًا ثم أعد حل أسئلته."));
  if (wr) tips.push("لديك " + wr + " إجابة خاطئة. استخدم زر «راجع أخطائي» لإعادة حلها حتى تثبت.");
  const un = N - ans; if (un) tips.push("تبقّى " + un + " سؤالًا لم تحلّه في البنك.");
  if (FLAG.size) tips.push("لديك " + FLAG.size + " سؤالًا معلّمًا للمراجعة ⚑.");
  if (tn && t / tn > 90) tips.push("متوسط وقتك " + fmt(t / tn) + " للسؤال. في الاختبار الفعلي حاول ألا تتجاوز دقيقة ونصف.");
  strong.forEach(([d, [c, n]]) => { if (pct(c, n) >= 80) tips.push("أداؤك قوي في «" + d + "» (" + pct(c, n) + "٪)، فخصص له وقتًا أقل.") });
  const hist = S.hist.map(h => "<tr><td>" + new Date(h.at).toLocaleDateString("ar-SA-u-nu-latn", { day: "numeric", month: "short" }) + "</td><td>" + esc(h.sect === "all" ? "كل الأقسام" : h.sect) + "</td><td>" + h.c + " / " + h.n + "</td><td>" + pct(h.c, h.n) + "٪</td><td>" + fmt(h.el) + "</td></tr>").join("");
  $("mn").innerHTML = '<div class="vh"><h2>تحليل أدائي</h2><button class="btn" id="sBack">العودة للأسئلة</button></div>' +
    '<p class="note">يعتمد على إجاباتك في وضع التدريب، وسجل محاولات المحاكاة في الأسفل.</p>' +
    '<div class="kpis">' + kpi("نسبة الصحيحة", pct(ok, ans) + "٪") + kpi("تمت الإجابة", ans + " / " + N) + kpi("صحيحة / خاطئة", ok + " / " + wr) + kpi("وقت المذاكرة", fmt(t)) + kpi("متوسط وقت السؤال", tn ? fmt(t / tn) : "—") + "</div>" +
    '<div class="sec-t">الأداء حسب المجال التربوي</div>' + bars(dom) + '<p class="note">تصنيف المجالات تقريبي ومبني على كلمات السؤال.</p>' +
    '<div class="sec-t">الأداء حسب مصدر الأسئلة</div>' + bars(src) +
    (topWrong.length ? '<div class="sec-t">أكثر المجالات التي تتكرر فيها أخطاؤك</div><ul class="tips">' + topWrong.map(([d, n]) => "<li>" + esc(d) + ": " + n + " " + (n === 1 ? "خطأ" : "أخطاء") + "</li>").join("") + "</ul>" : "") +
    '<div class="sec-t">خطة مراجعة مقترحة</div><ul class="tips">' + tips.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>" +
    '<div class="act"><button class="btn pri" id="sWrong"' + (wr ? "" : " disabled") + '>راجع أخطائي (' + wr + ')</button><button class="btn" id="sFlag"' + (FLAG.size ? "" : " disabled") + '>الأسئلة المعلّمة ⚑</button><button class="btn" id="sSim">اختبار محاكاة</button></div>' +
    '<div class="sec-t">سجل محاولات المحاكاة</div>' + (hist ? '<div class="scroll"><table class="tbl"><thead><tr><th>التاريخ</th><th>الأسئلة من</th><th>الدرجة</th><th>النسبة</th><th>الوقت</th></tr></thead><tbody>' + hist + "</tbody></table></div>" : '<p class="note">لا توجد محاولات محاكاة بعد. جرّب «وضع المحاكاة» لتظهر هنا.</p>');
  $("sBack").onclick = () => { view = "q"; render() };
  $("sWrong").onclick = () => { const start = () => { S.mode = "prac"; S.p.sect = "all"; $("sect").value = "all"; filt = "r"; const k = S.p.A.findIndex((a, k) => a !== null && a !== Q[k].a); go(k); if (narrow()) { drawer = true; applySide() } toast("القائمة تعرض أخطاءك فقط. اضغط «إعادة المحاولة» لحل السؤال من جديد.") }; start() };
  $("sFlag").onclick = () => { S.mode = "prac"; S.p.sect = "all"; $("sect").value = "all"; filt = "fl"; go([...FLAG][0]) };
  $("sSim").onclick = () => { view = "q"; $("mSim").onclick() };
  paint();
}

/* ---------- Claude explanation ---------- */
let sample = null, aiOK = false, aiCtl = null;
async function explainAI(k) {
  const q = Q[k], out = $("aiOut"), btn = $("aiBtn");
  btn.disabled = true; out.textContent = "جارٍ التفكير…";
  aiCtl = new AbortController();
  const prompt = "أنت مدرّب لاختبار الرخصة المهنية للمعلمين في السعودية (القسم العام التربوي). اشرح باختصار وبالعربية الفصحى المبسطة:\n" +
    "١) لماذا الإجابة المعتمدة صحيحة.\n٢) لماذا كل بديل آخر خاطئ (سطر لكل بديل).\n٣) المفهوم التربوي المرتبط بالسؤال في سطرين.\nلا تستخدم Markdown ولا رموز النجمة. إن رأيت أن الإجابة المعتمدة خطأ فقل ذلك بوضوح مع السبب.\n\n" +
    "السؤال: " + q.q + "\n" + q.o.map((o, i) => L[i] + ") " + o).join("\n") + "\nالإجابة المعتمدة: " + L[q.a] + ") " + q.o[q.a] + "\nالشرح الموجود: " + q.f;
  try {
    await sample(prompt, { modelTier: "quick", signal: aiCtl.signal, cache: { gcTime: 86400000 }, onText: ({ text }) => { if ($("aiOut")) $("aiOut").textContent = text } });
    if ($("aiBtn")) $("aiBtn").hidden = true;
  } catch (e) {
    const o = $("aiOut"); if (!o) return;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { aiOK = false; o.textContent = "الشرح المفصّل غير متاح في هذا العرض."; if ($("aiBtn")) $("aiBtn").hidden = true }
    else { o.textContent = e.text || (e.code === "rate_limited" ? "تم الوصول إلى حد الاستخدام. حاول لاحقًا." : "تعذّر الحصول على الشرح. حاول مرة أخرى."); if ($("aiBtn")) $("aiBtn").disabled = false }
  }
}

const TEMPLATE = "1) ما الهدف الرئيس من التقويم التكويني؟\nأ) إصدار حكم نهائي على مستوى الطالب\nب) تحسين التعلم أثناء حدوثه\nج) ترتيب الطلاب حسب درجاتهم\nد) توزيع الدرجات في نهاية الفصل\nالإجابة: ب\nالشرح: يُستخدم التقويم التكويني أثناء التعلم لتقديم تغذية راجعة تحسّنه.\n\n2) أي مما يأتي من أدوات التقويم؟\n( أ ) الملاحظة\n( ب ) سلم التقدير\n( ج ) الحوار\n( د ) العصف الذهني\nالإجابة الصحيحة: ( ب )";
const LETTERS = { "أ": 0, "ا": 0, "إ": 0, "ب": 1, "ج": 2, "د": 3, "ه": 4, "هـ": 4, a: 0, b: 1, c: 2, d: 3, e: 4 };
const letterIdx = s => { s = String(s == null ? "" : s).trim().toLowerCase(); if (/^[1-5]$/.test(s)) return +s - 1; return s in LETTERS ? LETTERS[s] : null };
const toLatin = s => s.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
function parseQuestions(text) {
  text = text.replace(/^﻿/, "");
  let raw = [];
  if (/^\s*[\[{]/.test(text)) {
    let data; try { data = JSON.parse(text) } catch (e) { return { items: [], skipped: [{ n: "—", why: "ملف JSON غير صالح" }] } }
    if (!Array.isArray(data)) data = data.questions || [];
    raw = data.map((r, k) => ({ n: r.n || k + 1, q: r.q || r.question, o: r.o || r.options, a: typeof r.a === "number" ? r.a : letterIdx(r.a != null ? r.a : r.answer), f: r.f || r.explanation || "" }));
  } else {
    const L1 = "هـ|[أاإبجدهabcdeABCDE]";
    const reQ = new RegExp("^(?:س\\s*)?\\(?\\s*([0-9]+)\\s*[\\)\\.\\-–:]\\s*(.+)$");
    const reO = new RegExp("^(?:\\(\\s*(" + L1 + ")\\s*\\)|(" + L1 + ")\\s*[\\)\\.\\-–:])\\s*(.*)$");
    const reA = new RegExp("^(?:الإجابة الصحيحة|الاجابة الصحيحة|الإجابة|الاجابة|الجواب|الحل)\\s*[:：\\-–]?\\s*\\(?\\s*(" + L1 + "|[1-5])(?![\\u0621-\\u064A])");
    const reF = /^(?:الشرح|التعليل|التفسير|السبب)\s*[:：\-–]\s*(.+)$/;
    const rePair = /([0-9]+)\s*[\)\.\-–:=]\s*\(?\s*(هـ|[أاإبجده])\s*\)?(?![ء-ي])/g;
    const reMulti = /\(\s*(?:هـ|[أاإبجده])\s*\)/g;
    let cur = null, sec = 0, lastSec = 0, keyMode = false; const keys = [];
    const push = () => { if (cur) raw.push(cur); cur = null };
    const addOpt = s => cur.o.push(s.replace(/\s*[.،]\s*$/, "").trim());
    for (const line of text.replace(/\r/g, "").split("\n")) {
      if (/^\s*#/.test(line)) { push(); sec++; keyMode = /إجاب|اجاب|مفتاح/.test(line); continue }
      const l = line.replace(/\*\*|__/g, "").replace(/^\s*[-*•]\s+/, "").trim();
      if (!l) continue;
      const ll = toLatin(l);
      if (/^(?:مفتاح الإجابات|الإجابات|الاجابات|إجابات)/.test(l)) { push(); keyMode = true }
      const pairs = [...ll.matchAll(rePair)];
      if (pairs.length >= 2 || (keyMode && pairs.length)) { push(); pairs.forEach(m => keys.push({ sec: lastSec, n: +m[1], a: letterIdx(m[2]) })); continue }
      let m;
      if (cur && (m = l.match(reA))) { cur.a = letterIdx(m[1]); continue }
      if (cur && (m = l.match(reF))) { cur.f = m[1].trim(); continue }
      if (cur && (l.match(reMulti) || []).length >= 2) { l.split(/(?=\(\s*(?:هـ|[أاإبجده])\s*\))/).forEach(p => { const mm = p.trim().match(reO); if (mm) addOpt(mm[3]) }); continue }
      if (cur && (m = l.match(reO)) && m[3]) { addOpt(m[3]); continue }
      if ((m = ll.match(reQ))) { push(); keyMode = false; cur = { sec, n: +m[1], q: l.slice(l.length - m[2].length).trim(), o: [], a: null, f: "" }; lastSec = sec; continue }
      if (cur) { if (cur.f) cur.f += " " + l; else if (cur.o.length) cur.o[cur.o.length - 1] += " " + l; else cur.q += " " + l }
    }
    push();
    raw.forEach(r => { if (r.a === null) { const k = keys.find(k => k.sec === r.sec && k.n === r.n) || keys.find(k => k.n === r.n && !raw.some(x => x !== r && x.n === r.n)); if (k) r.a = k.a } });
  }
  const items = [], skipped = [];
  raw.forEach(r => {
    const o = (r.o || []).map(x => String(x).trim()).filter(Boolean);
    const q = String(r.q || "").replace(/\s*\.{3,}\s*/g, " ......... ").trim();
    if (!q) skipped.push({ n: r.n, why: "نص السؤال فارغ" });
    else if (o.length < 2 || o.length > 5) skipped.push({ n: r.n, why: "عدد الخيارات " + o.length + " (المطلوب من 2 إلى 5)" });
    else if (r.a === null || r.a === undefined || r.a < 0 || r.a >= o.length) skipped.push({ n: r.n, why: "لم أجد الإجابة الصحيحة" });
    else items.push({ q, o, a: r.a, f: String(r.f || "").trim() });
  });
  return { items, skipped };
}
